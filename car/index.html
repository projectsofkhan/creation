<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
<title>M5 Drive</title>
<style>
:root{--sl:max(20px,env(safe-area-inset-left));--sr:max(20px,env(safe-area-inset-right));--sb:max(14px,env(safe-area-inset-bottom));--st:max(10px,env(safe-area-inset-top));--s:clamp(54px,17vh,84px);--ws:clamp(120px,40vh,175px);--acc:#53b1fd;
--g:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 48%,rgba(255,255,255,.02) 52%,rgba(255,255,255,.14))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;position:fixed;inset:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
.g{border:1px solid rgba(255,255,255,.28);color:#fff;background:var(--g),rgba(20,26,40,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -10px 16px rgba(0,0,0,.28);font:600 11px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px;padding:0;cursor:pointer;transition:transform .08s,filter .08s}
.g.on,.g:active{transform:scale(.94);filter:brightness(1.45)}
#err{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:99;color:#ff8080;font-size:12px;max-width:90vw;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000}
/* screens */
.scr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.scr.on{display:flex}
#load{background:#000;flex-direction:column;gap:10px}
.m{width:90px;height:5px;border-radius:3px;background:linear-gradient(90deg,#81c4ff 33%,#0066b1 33% 66%,#e7222e 66%)}
h1,h2{margin:0;font-weight:200;letter-spacing:.3em}
.sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.65}
#main{justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,.86) 0,rgba(0,0,0,.55) 34%,transparent 62%)}
.col{width:min(44vw,320px);display:flex;flex-direction:column;gap:9px}
#main h1{font-size:clamp(40px,14vh,68px);line-height:1}
.mb{height:clamp(38px,11vh,46px);border-radius:23px;font-size:12px;justify-content:flex-start;padding-left:22px;width:100%}
.chips{position:fixed;right:var(--sr);bottom:var(--sb);display:flex;gap:10px}
.chips div{padding:8px 14px;border-radius:14px;background:rgba(10,14,24,.55);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;gap:3px}
.chips b{font-size:18px;font-weight:600}.chips span{font-size:8px;letter-spacing:.2em;opacity:.6;text-transform:uppercase}
.dim,#pause,#res{background:radial-gradient(ellipse at center,rgba(8,12,22,.8),rgba(0,0,0,.93))}
#gar,#set{background:linear-gradient(90deg,rgba(0,0,0,.85) 0,rgba(0,0,0,.5) 40%,transparent 66%);justify-content:flex-start}
.panel{width:min(620px,90vw);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sb{height:34px;padding:0 14px;border-radius:17px;font-size:10px}
.sb.sel{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.05) 50%),var(--acc);border-color:#fff}
.back{height:40px;border-radius:20px;padding:0 28px;align-self:center}
#cards{display:flex;gap:12px;justify-content:center}
.card{flex:1;max-width:215px;height:min(46vh,165px);border-radius:20px;border:1px solid rgba(255,255,255,.3);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:5px;padding:14px;text-align:left;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.5)}
.card b{font-size:14px;letter-spacing:.08em;text-shadow:0 1px 6px #000}.card small{font-size:10px;opacity:.9;line-height:1.3;text-shadow:0 1px 4px #000}
.card:active{transform:scale(.96)}
.sw{display:flex;gap:9px;flex-wrap:wrap}.sw i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;box-shadow:inset 0 3px 6px rgba(255,255,255,.4),0 4px 8px rgba(0,0,0,.5)}
.sw i.sel{border-color:#fff;transform:scale(1.18)}
#pause .panel{width:min(330px,80vw)}#pause .g,#res .g{height:44px;border-radius:22px}
#resL{display:flex;flex-direction:column;gap:5px;font-size:13px;text-align:left}
#resL div{display:flex;justify-content:space-between;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.07)}
#resL div.me{background:rgba(83,177,253,.3)}
/* hud */
#hud,#top,#ctl{display:none}
body.play #hud{display:block}body.play #top{display:flex}body.play #ctl{display:block}
#top{position:fixed;z-index:15;top:var(--st);right:var(--sr);gap:9px}
#top .g{height:38px;min-width:38px;border-radius:19px}#top .p{padding:0 14px}
#race{position:fixed;left:var(--sl);top:var(--st);display:flex;gap:7px}
.rr{padding:6px 11px;border-radius:12px;background:rgba(10,14,24,.55);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:3px;min-width:54px}
.rr span{font-size:8px;letter-spacing:.2em;opacity:.6}.rr b{font-size:14px;font-variant-numeric:tabular-nums}
body[data-mode=free] .pos{display:none}
#mm{position:fixed;left:var(--sl);top:calc(var(--st) + 52px);width:96px;height:96px;border-radius:16px;background:rgba(10,14,24,.5);border:1px solid rgba(255,255,255,.18)}
#spdBox{position:fixed;left:50%;bottom:var(--sb);transform:translateX(-50%);text-align:center;text-shadow:0 2px 10px #000a;pointer-events:none}
#spd{font-size:clamp(38px,12vh,58px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.u{font-size:10px;letter-spacing:.24em;opacity:.8;margin:3px 0 7px}
.rpm{width:min(200px,26vw);height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto;overflow:hidden}
.rpm i{display:block;height:100%;background:linear-gradient(90deg,#5ad1ff 0,#fff 60%,#ff3b3b 85%);clip-path:inset(0 100% 0 0)}
#cd{position:fixed;top:24%;left:0;right:0;text-align:center;font-size:clamp(60px,22vh,120px);font-weight:800;text-shadow:0 4px 18px #000;pointer-events:none;z-index:14}
#toast{position:fixed;top:20%;left:0;right:0;text-align:center;font-size:17px;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 8px #000;z-index:14}
#toast.show{opacity:1}
/* controls */
#arr{position:fixed;left:var(--sl);bottom:var(--sb);display:flex;gap:14px;z-index:5}
#arr .g{width:calc(var(--s)*1.15);height:calc(var(--s)*1.15);border-radius:50%}
#wheel{position:fixed;left:var(--sl);bottom:var(--sb);width:var(--ws);height:var(--ws);z-index:5}
#wheel svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.65));pointer-events:none}
body[data-ctl=btn] #wheel{display:none}body[data-ctl=wheel] #arr{display:none}
.ped{position:fixed;z-index:5;border-radius:26px;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(0,0,0,.28) 7px 10px),var(--g),rgba(30,36,52,.55)}
#gasB{right:var(--sr);bottom:var(--sb);width:calc(var(--s)*1.05);height:calc(var(--s)*1.75);background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(0,0,0,.25) 7px 10px),var(--g),rgba(40,190,110,.5)}
#brkB{right:calc(var(--sr) + var(--s)*1.05 + 12px);bottom:var(--sb);width:var(--s);height:calc(var(--s)*1.2);background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(0,0,0,.25) 7px 10px),var(--g),rgba(235,60,70,.5)}
#hbB{right:calc(var(--sr) + var(--s)*1.05 + 12px);bottom:calc(var(--sb) + var(--s)*1.2 + 10px);width:var(--s);height:calc(var(--s)*.5);border-radius:99px}
#rot{display:none;position:fixed;inset:0;z-index:50;background:#000;align-items:center;justify-content:center;font-size:15px;letter-spacing:.12em;text-align:center;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<div id="err"></div>
<div id="hud">
 <div id="race"><div class="rr"><span>LAP</span><b id="lap">1/3</b></div><div class="rr pos"><span>POS</span><b id="pos">1/5</b></div><div class="rr"><span>TIME</span><b id="tm">0:00.0</b></div><div class="rr"><span>BEST</span><b id="bst">--</b></div></div>
 <canvas id="mm" width="96" height="96"></canvas>
 <div id="spdBox"><div id="spd">0</div><div class="u">KM/H &nbsp;·&nbsp; GEAR <b id="gear">N</b></div><div class="rpm"><i id="rpmF"></i></div></div>
 <div id="cd"></div><div id="toast"></div>
</div>
<div id="top"><button class="g" id="pz" type="button"></button><button class="g p" id="dn" type="button"></button><button class="g" id="cm" type="button"></button></div>
<div id="ctl">
 <div id="arr"><button class="g" data-c="L" id="bl" type="button"></button><button class="g" data-c="R" id="br" type="button"></button></div>
 <div id="wheel" data-c="wheel"></div>
 <button class="g ped" id="hbB" data-c="hb" type="button">Drift</button>
 <button class="g ped" id="brkB" data-c="brk" type="button">Brake</button>
 <button class="g ped" id="gasB" data-c="gas" type="button">Gas</button>
</div>

<div class="scr on" id="load"><div class="m"></div><h1 style="font-size:30px">M5 DRIVE</h1><div class="sub" id="lt">Loading…</div></div>

<div class="scr" id="main"><div class="col"><div class="m"></div><h1>M5</h1><div class="sub" style="margin-bottom:8px">Competition · V8 twin-turbo</div>
 <button class="g mb" id="bDrive" type="button">Free drive</button><button class="g mb" id="bRace" type="button">Race vs bots</button>
 <button class="g mb" id="bGar" type="button">Garage</button><button class="g mb" id="bSet" type="button">Settings</button></div>
 <div class="chips"><div><b>625</b><span>HP</span></div><div><b>750</b><span>Nm</span></div><div><b>3.3</b><span>0–100 s</span></div></div></div>

<div class="scr dim" id="sel"><div class="panel"><h2 id="selT" style="font-size:16px"></h2><div id="selRows"></div><div id="cards"></div><button class="g back" data-to="main" type="button">Back</button></div></div>

<div class="scr" id="gar"><div class="col"><div class="m"></div><h2 style="font-size:20px">GARAGE</h2>
 <div class="sub">Paint</div><div class="sw" id="paints"></div><div class="sub" style="margin-top:6px">Wheels</div><div class="sw" id="rims"></div>
 <button class="g back" data-to="main" type="button" style="align-self:flex-start;margin-top:10px">Back</button></div></div>

<div class="scr dim" id="set"><div class="panel" style="margin:auto"><h2 style="font-size:16px">SETTINGS</h2><div id="setRows"></div><button class="g back" id="setBack" type="button">Back</button></div></div>

<div class="scr" id="pause"><div class="panel"><h2 style="font-size:18px">PAUSED</h2>
 <button class="g" id="bRes" type="button">Resume</button><button class="g" id="bRst" type="button">Restart</button><button class="g" id="bRoad" type="button">Reset to road</button>
 <button class="g" id="bPSet" type="button">Settings</button><button class="g" id="bQuit" type="button">Main menu</button></div></div>

<div class="scr" id="res"><div class="panel"><h2 id="resT" style="font-size:22px"></h2><div id="resL"></div>
 <div style="display:flex;gap:10px;justify-content:center"><button class="g" id="bAgain" type="button" style="padding:0 22px">Race again</button><button class="g" id="bMenu" type="button" style="padding:0 22px">Menu</button></div></div></div>
<div id="rot">ROTATE YOUR PHONE<br>TO LANDSCAPE</div>

<script>
// ===================== DATA + UI (runs before 3D) =====================
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],R=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CFG={ctl:'wheel',gfx:'high',snd:1,car:0,rim:0,laps:3,diff:'normal'};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('m5mega')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('m5mega',JSON.stringify(CFG))}catch(e){}};
const G={},ST={mode:'menu',paused:false,pending:'drive',from:'main'};let night=0;
const PAINTS=[['Portimão Blue',0x1f4fc0],['Black Sapphire',0x0d0d10],['Brooklyn Grey',0x8f949e],['Toronto Red',0xc10f20],['Alpine White',0xf2f2f2],['Frozen Green',0x1f7a4a]];
const RIMS=[['Gunmetal',0x3a3d44],['Silver',0xc9ccd2],['Black',0x0c0c0e]];
const MAPS=[
{n:'Alpine Pass',d:'Pine forests, fast sweepers, snow peaks',css:'linear-gradient(160deg,#2f6fd0,#8ec5ff 55%,#2d5a2a)',k:12,r0:270,a1:70,f1:1.7,p1:0,a2:28,f2:2.9,p2:0,elev:12,ph:.5,hill:26,edge:520,terr:0,
 sky:[0x3f86f0,0xcfe6ff],fogC:0xbcd8f0,fog:[140,900],ground:[[.2,.38,.16],[.3,.36,.2],[.45,.45,.42],[.92,.94,.98]],shoulder:[.45,.42,.36],prop:'pine',pc:0x1f4a25,pc2:0x2c6a35,dust:[.62,.58,.5],sun:[60,90,35],sunC:0xfff0d0,sunI:1.2},
{n:'Dust Canyon',d:'Desert mesas, red dust, hot and wild',css:'linear-gradient(160deg,#c8683a,#f2c79a 55%,#7a3a22)',k:16,r0:230,a1:55,f1:2.1,p1:1,a2:30,f2:3.3,p2:2,elev:9,ph:2,hill:34,edge:480,terr:1,
 sky:[0x4a84c8,0xf3c89c],fogC:0xe6b98c,fog:[90,650],ground:[[.62,.36,.2],[.7,.42,.24],[.58,.3,.18],[.8,.55,.35]],shoulder:[.7,.55,.38],prop:'rock',pc:0x9a4f2b,pc2:0xb8683a,dust:[.78,.55,.34],sun:[-70,55,40],sunC:0xffd2a0,sunI:1.25},
{n:'Misty Highlands',d:'Autumn woods, fog, wet curves',css:'linear-gradient(160deg,#58707e,#b4c2c9 55%,#6a4a22)',k:13,r0:300,a1:65,f1:1.3,p1:2,a2:30,f2:3.1,p2:1,elev:16,ph:4,hill:30,edge:560,terr:0,
 sky:[0x7d92a2,0xc7d2d8],fogC:0xaebbc2,fog:[50,420],ground:[[.22,.3,.14],[.34,.32,.16],[.4,.36,.28],[.7,.72,.72]],shoulder:[.38,.36,.3],prop:'round',pc:0xb5561f,pc2:0xd08a2a,dust:[.55,.55,.5],sun:[40,60,-50],sunC:0xe8eef4,sunI:.8}];
const hex=h=>'#'+h.toString(16).padStart(6,'0');
const sv=(p,x=18)=>`<svg viewBox="0 0 24 24" width="${x}" height="${x}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={pause:sv('<path d="M8 5v14M16 5v14" stroke-width="3"/>'),sun:sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>'),
 moon:sv('<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'),cam:sv('<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.2"/>'),l:sv('<path d="M15 5l-7 7 7 7"/>',32),r:sv('<path d="M9 5l7 7-7 7"/>',32)};
const WHEEL=`<svg viewBox="0 0 200 200"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454852"/><stop offset="1" stop-color="#101116"/></linearGradient></defs>
<circle cx="100" cy="100" r="86" fill="none" stroke="url(#wg)" stroke-width="22"/><circle cx="100" cy="100" r="96.5" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/><circle cx="100" cy="100" r="75.5" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
<path d="M16 106 Q100 126 184 106 L184 122 Q100 142 16 122Z" fill="#1b1d24" stroke="rgba(255,255,255,.12)"/><rect x="91" y="122" width="18" height="60" fill="#1b1d24"/>
<circle cx="100" cy="114" r="29" fill="#262932" stroke="rgba(255,255,255,.22)"/>
<rect x="89.5" y="8" width="7" height="24" fill="#81c4ff"/><rect x="96.5" y="8" width="7" height="24" fill="#0066b1"/><rect x="103.5" y="8" width="7" height="24" fill="#e7222e"/>
<text x="100" y="124" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" font-family="sans-serif">M</text></svg>`;
$('#pz').innerHTML=IC.pause;$('#cm').innerHTML=IC.cam;$('#bl').innerHTML=IC.l;$('#br').innerHTML=IC.r;$('#wheel').innerHTML=WHEEL;
function dayLabel(){$('#dn').innerHTML=(night?IC.moon:IC.sun)+'<span>'+(night?'Night':'Day')+'</span>'}dayLabel();
function showErr(m){$('#err').textContent='⚠ '+m}
addEventListener('error',e=>showErr(e.message||'Error'));addEventListener('unhandledrejection',e=>showErr(String(e.reason)));
addEventListener('contextmenu',e=>e.preventDefault());
function show(id){$$('.scr').forEach(e=>e.classList.toggle('on',e.id===id))}
// settings / selects
const SEG={ctl:[['btn','Buttons'],['wheel','Steering wheel']],gfx:[['low','Low'],['med','Medium'],['high','High']],snd:[[1,'On'],[0,'Off']],laps:[[2,'2'],[3,'3'],[5,'5']],diff:[['easy','Easy'],['normal','Normal'],['hard','Hard']]};
const rowH=(k,l)=>`<div class="row"><span>${l}</span><div class="seg">${SEG[k].map(([v,t])=>`<button class="g sb" type="button" data-s="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
$('#setRows').innerHTML=rowH('ctl','Controls')+rowH('gfx','Graphics')+rowH('snd','Sound')+'<div class="row"><span>Display</span><button class="g sb" id="fsB" type="button">Fullscreen</button></div>';
$('#selRows').innerHTML=rowH('laps','Laps')+rowH('diff','Rivals');
$('#cards').innerHTML=MAPS.map((m,i)=>`<button class="card" type="button" data-m="${i}" style="background:${m.css}"><b>${m.n}</b><small>${m.d}</small></button>`).join('');
$('#paints').innerHTML=PAINTS.map((p,i)=>`<i data-p="${i}" title="${p[0]}" style="background:${hex(p[1])}"></i>`).join('');
$('#rims').innerHTML=RIMS.map((p,i)=>`<i data-r="${i}" title="${p[0]}" style="background:${hex(p[1])}"></i>`).join('');
function refresh(){$$('.sb[data-s]').forEach(b=>b.classList.toggle('sel',String(CFG[b.dataset.s])===b.dataset.v));document.body.dataset.ctl=CFG.ctl;
 $$('#paints i').forEach(e=>e.classList.toggle('sel',+e.dataset.p===CFG.car));$$('#rims i').forEach(e=>e.classList.toggle('sel',+e.dataset.r===CFG.rim))}
document.addEventListener('click',e=>{const b=e.target.closest('.sb[data-s]');if(b){const k=b.dataset.s;let v=b.dataset.v;if(!isNaN(+v))v=+v;CFG[k]=v;save();refresh();if(k=='gfx'&&G.applyQ)G.applyQ();return}
 const p=e.target.closest('#paints i');if(p){CFG.car=+p.dataset.p;save();refresh();G.paint&&G.paint();return}
 const r=e.target.closest('#rims i');if(r){CFG.rim=+r.dataset.r;save();refresh();G.paint&&G.paint()}});
refresh();
function goFull(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;try{const p=f&&f.call(d);if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}}
$('#fsB').onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else goFull()};
$('#bDrive').onclick=()=>{ST.pending='drive';$('#selT').textContent='Free drive · choose a map';$('#selRows').style.display='none';show('sel')};
$('#bRace').onclick=()=>{ST.pending='race';$('#selT').textContent='Race · choose a map';$('#selRows').style.display='';show('sel')};
$('#bGar').onclick=()=>show('gar');$('#bSet').onclick=()=>{ST.from='main';show('set')};
$$('.back[data-to]').forEach(b=>b.onclick=()=>show(b.dataset.to));$('#setBack').onclick=()=>show(ST.from);
$('#cards').onclick=e=>{const c=e.target.closest('.card');if(!c)return;if(!G.start){showErr('3D engine not ready');return}initAudio();goFull();show(null);G.start(ST.pending,+c.dataset.m)};
$('#pz').onclick=()=>G.pause&&G.pause(true);$('#bRes').onclick=()=>G.pause(false);$('#bRst').onclick=()=>{G.restart();G.pause(false)};

    const t=new T.Mesh(boxG(.44,.1,.06),tlM);t.position.set(s*.48,.86,-2.42);g.add(t);lights.push(t)}
  for(const s of[-1,1])for(let o=0;o<2;o++){const e=new T.Mesh(cylZ(.05,.14),M_.chrome);e.position.set(s*(.28+o*.15),.36,-2.4);g.add(e)}

}

let world=null,worldIdx=-1,SAMP=480,CP=[],CT=[],CN=[],trackLen=0,halfW=6.4,targetSpeed=[],miniPts=[],miniB=null;
let carG=null,CAR=null,nightAmt=0,topDay=new T.Color(),topNight=new T.Color(0x02040a),botDay=new T.Color(),botNight=new T.Color(0x0b1526);
const PL={pos:new T.Vector3(),yaw:0,vx:0,vz:0,vL:0,vT:0,steer:0,spd:0,gear:1,rpm:900,lap:1,t:0,best:null,idx:0,s:0,off:0,spin:0};
let bots=[],racing=false,countdown=0,camI=0,last=performance.now(),fpsT=0;
const DRIVERS=['You','K. Müller','A. Rossi','J. Lee','T. Vega','S. Novak'];

function H_(x,z,M){return M.hill*(Math.sin(x*.0115+M.ph)*Math.cos(z*.0131+M.ph*.7)+.45*Math.sin(x*.0231+z*.0171+M.ph*1.9))}

function buildWorld(idx){
  if(world){scene.remove(world)}
  world=new T.Group();scene.add(world);
  const M=MAPS[idx];
  CP=[];CT=[];CN=[];SAMP=480;trackLen=0;
  for(let i=0;i<SAMP;i++){
    const a=i/SAMP*6.2831853;
    const r=M.r0+M.a1*Math.sin(M.f1*a+M.p1)+M.a2*Math.sin(M.f2*a+M.p2);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    CP.push(new T.Vector3(x,H_(x,z,M)+.45,z));
  }
  for(let i=0;i<SAMP;i++){
    const p=CP[(i-1+SAMP)%SAMP],n=CP[(i+1)%SAMP];
    const t=new T.Vector3(n.x-p.x,0,n.z-p.z).normalize();
    CT.push(t);CN.push(new T.Vector3(t.z,0,-t.x));
    trackLen+=Math.hypot(CP[(i+1)%SAMP].x-p.x,CP[(i+1)%SAMP].z-p.z);
  }
  const segLen=trackLen/SAMP;
  targetSpeed=[];
  for(let i=0;i<SAMP;i++){
    const a=CT[(i-3+SAMP)%SAMP],b=CT[(i+3)%SAMP];
    const ang=Math.acos(clamp(a.x*b.x+a.z*b.z,-1,1));
    const kap=Math.max(ang/(6*segLen),1e-4);
    targetSpeed.push(clamp(Math.sqrt(11.5/kap),16,58));
  }
  for(let p=0;p<3;p++)for(let i=SAMP-1;i>=0;i--)targetSpeed[i]=Math.min(targetSpeed[i],targetSpeed[(i+1)%SAMP]+2.2);

  // --- road ---
  const cols=[-halfW,-halfW*.5,0,halfW*.5,halfW];
  const rp=[],ru=[],ri=[];let dist=0;
  for(let i=0;i<=SAMP;i++){
    const k=i%SAMP,p=CP[k],n=CN[k];
    if(i>0)dist+=Math.hypot(CP[(i-1)%SAMP].x-p.x,CP[(i-1)%SAMP].z-p.z);
    for(let c=0;c<cols.length;c++){
      const o=cols[c];
      rp.push(p.x+n.x*o,p.y-Math.abs(o)*.008,p.z+n.z*o);
      ru.push((o+halfW)/(2*halfW),dist/14);
    }
  }
  for(let i=0;i<SAMP;i++)for(let c=0;c<cols.length-1;c++){
    const a=i*cols.length+c,b=a+1,cc=a+cols.length,d=cc+1;
    ri.push(a,cc,b,b,cc,d);
  }
  const rg=new T.BufferGeometry();
  rg.setAttribute('position',new T.Float32BufferAttribute(rp,3));
  rg.setAttribute('uv',new T.Float32BufferAttribute(ru,2));
  rg.setIndex(ri);rg.computeVertexNormals();
  const rc=document.createElement('canvas');rc.width=256;rc.height=256;
  const rx=rc.getContext('2d');
  rx.fillStyle='#2b2d31';rx.fillRect(0,0,256,256);
  for(let i=0;i<3000;i++){const g2=38+R()*46;rx.fillStyle='rgba('+g2+','+g2+','+(g2+5)+',.32)';rx.fillRect(R()*256,R()*256,2,2)}
  rx.fillStyle='#d9d9cf';rx.fillRect(13,0,7,256);rx.fillRect(236,0,7,256);
  rx.fillStyle='#eaeadc';rx.fillRect(125,16,6,118);
  const rtex=new T.CanvasTexture(rc);rtex.wrapS=rtex.wrapT=T.RepeatWrapping;rtex.anisotropy=4;
  const road=new T.Mesh(rg,new T.MeshStandardMaterial({map:rtex,roughness:.94,metalness:.02,side:T.DoubleSide}));
  road.receiveShadow=true;world.add(road);

  // --- shoulders ---
  function shoulder(sign){
    const o1=sign*halfW,o2=sign*(halfW+6.5);
    const p2=[],i2=[],u2=[];
    for(let i=0;i<=SAMP;i++){
      const k=i%SAMP,p=CP[k],n=CN[k];
      const x1=p.x+n.x*o1,z1=p.z+n.z*o1;
      const x2=p.x+n.x*o2,z2=p.z+n.z*o2;
      p2.push(x1,p.y-.03,z1,x2,H_(x2,z2,M)+.02,z2);
      u2.push(0,i*.5,1,i*.5);
    }
    for(let i=0;i<SAMP;i++){const a=i*2,b=a+1,c=a+2,d=a+3;i2.push(a,c,b,b,c,d)}
    const gg=new T.BufferGeometry();
    gg.setAttribute('position',new T.Float32BufferAttribute(p2,3));
    gg.setAttribute('uv',new T.Float32BufferAttribute(u2,2));
    gg.setIndex(i2);gg.computeVertexNormals();
    const m=new T.Mesh(gg,new T.MeshStandardMaterial({color:new T.Color().fromArray(M.shoulder),roughness:1,metalness:0,side:T.DoubleSide}));
    m.receiveShadow=true;world.add(m);
  }
  shoulder(1);shoulder(-1);

  // --- terrain ---
  const tg=new T.PlaneGeometry(M.edge*2,M.edge*2,120,120);tg.rotateX(-Math.PI/2);
  const tp=tg.attributes.position,hs=[];
  let mn=1e9,mx=-1e9;
  for(let i=0;i<tp.count;i++){const x=tp.getX(i),z=tp.getZ(i),h=H_(x,z,M);hs.push(h);if(h<mn)mn=h;if(h>mx)mx=h}
  const cA=M.ground.map(a=>new T.Color().fromArray(a)),colArr=[];
  for(let i=0;i<tp.count;i++){
    tp.setY(i,hs[i]);
    const t=clamp((hs[i]-mn)/((mx-mn)||1),0,1);
    let c;
    if(t<.5)c=cA[0].clone().lerp(cA[1],t*2);else c=cA[1].clone().lerp(cA[2],(t-.5)*2);
    if(t>.84)c.lerp(cA[3],(t-.84)/.16*.55);
    colArr.push(c.r,c.g,c.b);
  }
  tg.setAttribute('color',new T.Float32BufferAttribute(colArr,3));
  tg.computeVertexNormals();
  const terrain=new T.Mesh(tg,new T.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0}));
  terrain.receiveShadow=true;world.add(terrain);

  // --- props ---
  const N=CFG.gfx==='low'?110:CFG.gfx==='med'?190:260;
  const trunkG=new T.CylinderGeometry(.22,.34,2,6),trunkM=new T.MeshStandardMaterial({color:0x4a3524,roughness:1});
  let crownG,crownM;
  if(M.prop==='rock'){crownG=new T.DodecahedronGeometry(1,0);crownM=new T.MeshStandardMaterial({color:M.pc,roughness:1,flatShading:true})}
  else if(M.prop==='round'){crownG=new T.IcosahedronGeometry(1,0);crownM=new T.MeshStandardMaterial({color:M.pc2,roughness:1,flatShading:true})}
  else{crownG=new T.ConeGeometry(1,2,7);crownM=new T.MeshStandardMaterial({color:M.pc,roughness:1,flatShading:true})}
  const iTrunk=new T.InstancedMesh(trunkG,trunkM,N),iCrown=new T.InstancedMesh(crownG,crownM,N);
  iTrunk.castShadow=iCrown.castShadow=CFG.gfx!=='low';
  const dm=new T.Object3D();let placed=0;
  for(let tries=0;tries<N*6&&placed<N;tries++){
    const k=Math.floor(R()*SAMP),p=CP[k],n=CN[k],side=R()<.5?-1:1;
    const off=side*(halfW+9+(side<0?R()*45:R()*95));
    const x=p.x+n.x*off,z=p.z+n.z*off,y=H_(x,z,M);
    if(M.prop==='rock'){
      const sc=2+R()*6;dm.position.set(x,y+sc*.4,z);dm.rotation.set(R()*3,R()*3,R()*3);dm.scale.set(sc,sc*.75,sc);
      dm.updateMatrix();iCrown.setMatrixAt(placed,dm.matrix);
      dm.scale.set(.001,.001,.001);dm.updateMatrix();iTrunk.setMatrixAt(placed,dm.matrix);
    }else{
      const sc=4+R()*8;
      dm.position.set(x,y+sc*.12,z);dm.rotation.set(0,R()*6.28,0);dm.scale.set(sc*.09,sc*.12,sc*.09);
      dm.updateMatrix();iTrunk.setMatrixAt(placed,dm.matrix);
      dm.position.set(x,y+sc*.12+sc*.55,z);dm.rotation.set(0,R()*6.28,0);
      dm.scale.set(sc*.32,sc*.42,sc*.32);dm.updateMatrix();iCrown.setMatrixAt(placed,dm.matrix);
    }
    placed++;
  }
  iTrunk.count=placed;iCrown.count=placed;
  iTrunk.instanceMatrix.needsUpdate=iCrown.instanceMatrix.needsUpdate=true;
  world.add(iTrunk,iCrown);

  // --- distant peaks ---
  for(let i=0;i<14;i++){
    const a=i/14*6.283+R()*.2,r=M.edge*(.9+R()*.35),h=90+R()*220;
    const g2=new T.ConeGeometry(120+R()*120,h,5);
    const m2=new T.Mesh(g2,new T.MeshStandardMaterial({color:new T.Color(M.fogC).multiplyScalar(.72),roughness:1,flatShading:true}));
    m2.position.set(Math.cos(a)*r,h*.42,Math.sin(a)*r);m2.rotation.y=R()*3;
    world.add(m2);
  }

  // --- atmosphere ---
  topDay.set(M.sky[0]);botDay.set(M.sky[1]);
  skyU.top.value.copy(topDay);skyU.bot.value.copy(botDay);
  scene.fog.color.set(M.fogC);scene.fog.near=M.fog[0];scene.fog.far=M.fog[1];
  sun.position.set(M.sun[0],M.sun[1],M.sun[2]);sun.color.set(M.sunC);sun.intensity=M.sunI;
  hemi.color.set(M.sky[1]);hemi.groundColor.set(new T.Color().fromArray(M.ground[1]));

  // --- minimap ---
  miniB={x0:1e9,x1:-1e9,z0:1e9,z1:-1e9};
  CP.forEach(p=>{miniB.x0=Math.min(miniB.x0,p.x);miniB.x1=Math.max(miniB.x1,p.x);miniB.z0=Math.min(miniB.z0,p.z);miniB.z1=Math.max(miniB.z1,p.z)});
  const pad=8,sc=Math.min((96-pad*2)/(miniB.x1-miniB.x0),(96-pad*2)/(miniB.z1-miniB.z0));
  miniB.sc=sc;miniB.pad=pad;
  miniPts=CP.map(p=>({x:pad+(p.x-miniB.x0)*sc,y:pad+(p.z-miniB.z0)*sc}));
}

// ===================== CAR STATE =====================
function resetCar(){
  const i=0,p=CP[i],t=CT[i],n=CN[i];
  PL.pos.set(p.x+n.x*2.2,p.y,p.z+n.z*2.2);
  PL.yaw=Math.atan2(t.x,t.z);
  PL.vx=PL.vz=PL.vL=PL.vT=0;PL.steer=0;PL.spd=0;PL.gear=1;PL.rpm=900;
  PL.idx=i;PL.s=0;PL.off=2.2;PL.lap=1;PL.t=0;PL.spin=0;
  if(carG){carG.position.copy(PL.pos);carG.rotation.set(0,PL.yaw,0)}
  PL.best=+(localStorage.getItem('m5best')||0)||null;
}
function resetToRoad(){
  const i=PL.idx,p=CP[i],t=CT[i];
  PL.pos.set(p.x,p.y,p.z);PL.yaw=Math.atan2(t.x,t.z);
  PL.vx=PL.vz=PL.vL=PL.vT=0;PL.steer=0;
}

// ===================== BOTS =====================
function setupBots(){
  bots.forEach(b=>scene.remove(b.car.g));bots=[];
  if(!racing)return;
  const cols=[0x9b1c2e,0x1c2f6b,0x8f949e,0x2b2b30];
  const skill={easy:.78,normal:.9,hard:1.0}[CFG.diff]||.9;
  for(let i=0;i<4;i++){
    const c=makeCar(cols[i],false);
    c.g.scale.set(.98,.98,.98);
    scene.add(c.g);
    bots.push({car:c,s:(i+1)*.006,lane:(i%2?1:-1)*(1.6+i*.55),v:0,lap:1,skill:skill*(1+(R()-.5)*.05),name:DRIVERS[i+1]});
  }
}

// ===================== INPUT SNAPSHOT =====================
function inputs(){
  const thr=(tc.gas||kb.gas)?1:0,brk=(tc.brk||kb.brk)?1:0,hb=(tc.hb||kb.hb)?1:0;
  let st=((tc.R?1:0)-(tc.L?1:0))+((kb.R?1:0)-(kb.L?1:0));
  if(CFG.ctl==='wheel')st=clamp(wheelRot/LOCK+st,-1,1);else st=clamp(st,-1,1);
  return {thr,brk,hb,st};
}

// ===================== PHYSICS STEP =====================
function step(dt){
  const I=inputs();
  if(countdown>0){
    countdown-=dt;
    const v=countdown>.6?String(Math.min(3,Math.ceil(countdown-.6))):'GO!';
    if($('#cd').textContent!==v){$('#cd').textContent=v;if(v!=='GO!')beep(440,.12,.18);else beep(880,.25,.22)}
    PL.t=0;
    updateCam(dt,true);
    return;
  }
  if($('#cd').textContent){$('#cd').textContent=''}
  PL.t+=dt;
  const fx=Math.sin(PL.yaw),fz=Math.cos(PL.yaw),rx=Math.cos(PL.yaw),rz=-Math.sin(PL.yaw);
  let vL=PL.vx*fx+PL.vz*fz,vT=PL.vx*rx+PL.vz*rz;
  const sp=Math.abs(vL);
  const onRoad=PL.off<halfW+1.2;
  // steering
  const maxSteer=.55-.42*clamp(sp/55,0,1);
  PL.steer+=(I.st*maxSteer-PL.steer)*Math.min(1,dt*9);
  // engine / brakes
  let a=0;
  if(I.thr)a+=12.2*I.thr*Math.max(0,1-Math.pow(Math.max(vL,0)/73,3));
  if(I.brk){if(vL>.6)a-=23*I.brk;else a-=6.5*I.brk}
  if(I.hb)a-=Math.sign(vL)*7;
  if(Math.abs(vL)>.15)a-=Math.sign(vL)*(.4+.0022*vL*vL);
  if(!onRoad)a-=Math.sign(vL)*1.4;
  vL=clamp(vL+a*dt,-11,78);
  // yaw
  let yr=(vL/2.9)*Math.tan(PL.steer)*(onRoad?1:.72)*(I.hb?1.35:1);
  const maxYr=Math.max(.4,(I.hb?17:13)/Math.max(Math.abs(vL),3));
  yr=clamp(yr,-maxYr,maxYr);
  PL.yaw+=yr*dt;
  // lateral grip
  const grip=(onRoad?8.6:4.6)*(I.hb?.34:1);
  vT*=Math.exp(-grip*dt);
  PL.vL=vL;PL.vT=vT;
  const nfx=Math.sin(PL.yaw),nfz=Math.cos(PL.yaw),nrx=Math.cos(PL.yaw),nrz=-Math.sin(PL.yaw);
  PL.vx=nfx*vL+nrx*vT;PL.vz=nfz*vL+nrz*vT;
  PL.pos.x+=PL.vx*dt;PL.pos.z+=PL.vz*dt;
  PL.spd=Math.hypot(PL.vx,PL.vz);

  // track projection
  let best=PL.idx,bd=1e9;
  for(let k=-28;k<=28;k++){
    const i=(PL.idx+k+SAMP)%SAMP;
    const d=(CP[i].x-PL.pos.x)**2+(CP[i].z-PL.pos.z)**2;
    if(d<bd){bd=d;best=i}
  }
  const prevIdx=PL.idx;PL.idx=best;
  const P0=CP[best],N0=CN[best];
  PL.s=best/SAMP;
  PL.off=Math.abs((PL.pos.x-P0.x)*N0.x+(PL.pos.z-P0.z)*N0.z);
  PL.pos.y+= (P0.y-PL.pos.y)*Math.min(1,dt*12);

  // lap crossing
  if(prevIdx>SAMP*.75&&best<SAMP*.25&&racing){
    PL.lap++;
    if(PL.best===null||PL.t<PL.best){PL.best=PL.t;localStorage.setItem('m5best',PL.best)}
    if(PL.lap>CFG.laps){finishRace();return}
    toast('LAP '+PL.lap+' / '+CFG.laps);
    beep(660,.14,.2);
    PL.t=0;
  }
  if(prevIdx<SAMP*.25&&best>SAMP*.75&&!racing){/* backward, ignore */}

  // bots
  for(const b of bots){
    const tgt=targetSpeed[Math.floor(b.s*SAMP)%SAMP]*b.skill;
    b.v+=clamp(tgt-b.v,-14*dt,8*dt);
    b.s+=b.v*dt/trackLen;
    if(b.s>=1){b.s-=1;b.lap++}
    const i=Math.floor(b.s*SAMP)%SAMP,p=CP[i],n=CN[i],t=CT[i];
    b.car.g.position.set(p.x+n.x*b.lane,p.y,p.z+n.z*b.lane);
    b.car.g.rotation.y=Math.atan2(t.x,t.z);
    b.car.wheels.forEach(w=>{w.spin.rotation.x+=b.v*dt/.348});
    // simple collision with player
    const dx=b.car.g.position.x-PL.pos.x,dz=b.car.g.position.z-PL.pos.z;
    const d2=Math.hypot(dx,dz);
    if(d2<2.6&&d2>.001){
      const push=(2.6-d2)/2.6;
      PL.pos.x-=dx/d2*push*.9;PL.pos.z-=dz/d2*push*.9;
      PL.vx*=.985;PL.vz*=.985;
      if(push>.35&&Math.random()<.12)burst(220,.12,.15);
    }
  }

  // visuals
  carG.position.copy(PL.pos);
  carG.rotation.y=PL.yaw;
  carG.rotation.x=clamp(-a*.006,-.05,.05);
  carG.rotation.z=clamp(vT*.012,-.07,.07);
  const spin=vL*dt/.348;
  PL.spin+=spin;
  CAR.wheels.forEach(w=>{w.spin.rotation.x=PL.spin;if(w.front)w.piv.rotation.y=PL.steer});

  // gearbox
  const G7=[0,13,23,34,46,59,73];
  let g=1;while(g<7&&PL.spd>G7[g])g++;
  PL.gear=g;
  const lo=G7[g-1],hi=G7[g];
  const frac=clamp((PL.spd-lo)/((hi-lo)||1),0,1);
  const trpm=950+6900*frac+I.thr*250;
  PL.rpm+=(trpm-PL.rpm)*Math.min(1,dt*7);

  audioUpdate(PL.rpm,I.thr,Math.min(1,Math.abs(vT)/9),onRoad?0:.6,PL.spd);
  updateCam(dt,false);
}

// ===================== CAMERA =====================
const camPos=new T.Vector3(),camLook=new T.Vector3();
function updateCam(dt,still){
  const f=new T.Vector3(Math.sin(PL.yaw),0,Math.cos(PL.yaw));
  let wantP,wantL,lerpK;
  if(camI===0){wantP=PL.pos.clone().addScaledVector(f,-7.6).add(new T.Vector3(0,3.1,0));wantL=PL.pos.clone().addScaledVector(f,7).add(new T.Vector3(0,1.2,0));lerpK=6}
  else if(camI===1){wantP=PL.pos.clone().addScaledVector(f,-13).add(new T.Vector3(0,5.6,0));wantL=PL.pos.clone().addScaledVector(f,9).add(new T.Vector3(0,1,0));lerpK=5}
  else if(camI===2){wantP=PL.pos.clone().addScaledVector(f,.55).add(new T.Vector3(0,1.55,0));wantL=PL.pos.clone().addScaledVector(f,30).add(new T.Vector3(0,1.4,0));lerpK=18}
  else{const a=performance.now()*.00035;wantP=PL.pos.clone().add(new T.Vector3(Math.cos(a)*11,3.4,Math.sin(a)*11));wantL=PL.pos.clone().add(new T.Vector3(0,1,0));lerpK=3}
  const k=still?1:(1-Math.pow(.0015,dt));
  camPos.lerp(wantP,k);camLook.lerp(wantL,k);
  cam.position.copy(camPos);cam.lookAt(camLook);
  // shadow follow
  sun.target.position.set(PL.pos.x,PL.pos.y,PL.pos.z);
  sun.position.set(PL.pos.x+MAPS[worldIdx].sun[0],PL.pos.y+MAPS[worldIdx].sun[1],PL.pos.z+MAPS[worldIdx].sun[2]);
}

// ===================== HUD =====================
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)};
let hudT=0;
function updateHUD(dt){
  hudT+=dt;if(hudT<.06)return;hudT=0;
  $('#spd').textContent=Math.round(PL.spd*3.6);
  $('#gear').textContent=PL.spd<.4&&!inputs().thr?'N':PL.gear;
  $('#rpmF').style.clipPath='inset(0 '+(100-clamp(PL.rpm/8000,0,1)*100)+'% 0 0)';
  $('#lap').textContent=Math.min(PL.lap,CFG.laps)+'/'+CFG.laps;
  $('#tm').textContent=fmt(PL.t);
  $('#bst').textContent=PL.best?fmt(PL.best):'--';
  if(racing){
    let r=1;const me=(PL.lap-1)+PL.s;
    for(const b of bots)if((b.lap-1)+b.s>me)r++;
    $('#pos').textContent=r+'/'+(bots.length+1);
  }
  drawMini();
}
function drawMini(){
  const c=$('#mm'),g=c.getContext('2d');
  g.clearRect(0,0,96,96);
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=3;g.lineJoin='round';g.lineCap='round';
  g.beginPath();
  for(let i=0;i<=SAMP;i+=4){const p=miniPts[i%SAMP];i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}
  g.closePath();g.stroke();
  g.strokeStyle='rgba(83,177,253,.85)';g.lineWidth=1.6;g.stroke();
  const pp=miniPts[PL.idx];
  g.fillStyle='#53b1fd';g.beginPath();g.arc(pp.x,pp.y,3.2,0,7);g.fill();
  g.strokeStyle='#fff';g.lineWidth=1.2;g.stroke();
  for(const b of bots){
    const q=miniPts[Math.floor(b.s*SAMP)%SAMP];
    g.fillStyle='rgba(255,90,90,.9)';g.beginPath();g.arc(q.x,q.y,2.3,0,7);g.fill();
  }
}
let toastT=0;
function toast(m){$('#toast').textContent=m;$('#toast').classList.add('show');toastT=1.6}

// ===================== RACE FLOW =====================
function finishRace(){
  racing=false;ST.mode='result';ST.paused=false;
  document.body.classList.remove('play');
  const rows=[{name:DRIVERS[0],me:true,prog:(PL.lap-1)+PL.s},...bots.map(b=>({name:b.name,prog:(b.lap-1)+b.s}))];
  rows.sort((a,b)=>b.prog-a.prog);
  const meIdx=rows.findIndex(r=>r.me);
  $('#resT').textContent=meIdx===0?'🏆 VICTORY':meIdx<3?'PODIUM · P'+(meIdx+1):'FINISHED · P'+(meIdx+1);
  $('#resL').innerHTML=rows.map((r,i)=>'<div class="'+(r.me?'me':'')+'"><span>'+(i+1)+'. '+r.name+'</span><span>'+(r.me?fmt(PL.t):'')+'</span></div>').join('');
  show('res');
  burst(700,.5,.25);beep(880,.3,.2);
}

// ===================== PUBLIC API =====================
G.start=(mode,idx)=>{
  if(idx!==worldIdx){buildWorld(idx);worldIdx=idx}
  ST.curMode=mode;ST.curMap=idx;
  resetCar();
  racing=(mode==='race');
  setupBots();
  ST.mode='play';ST.paused=false;
  document.body.classList.add('play');
  camI=0;camPos.copy(PL.pos).add(new T.Vector3(0,4,-9));camLook.copy(PL.pos);
  countdown=racing?3.6:0;
  if(!racing)$('#cd').textContent='';
  show(null);
  last=performance.now();
};
G.pause=v=>{
  if(ST.mode!=='play')return;
  ST.paused=!!v;
  if(v){show('pause');audioMute()}else{show(null);last=performance.now()}
};
G.restart=()=>{if(ST.curMode)G.start(ST.curMode,ST.curMap)};
G.reset=()=>{resetToRoad();toast('Back on track')};
G.menu=()=>{
  ST.mode='menu';ST.paused=false;racing=false;
  document.body.classList.remove('play');
  bots.forEach(b=>scene.remove(b.car.g));bots=[];
  show('main');
};
G.cam=()=>{camI=(camI+1)%4;toast(['Chase','Wide','Hood','Orbit'][camI])};
G.paint=()=>{
  if(CAR)CAR.paint.color.set(PAINTS[CFG.car][1]);
  rimM.color.set(RIMS[CFG.rim][1]);
};
G.applyQ=()=>{
  const q=CFG.gfx;
  rd.setPixelRatio(Math.min(devicePixelRatio,q==='high'?2:q==='med'?1.5:1));
  sun.castShadow=(q!=='low');
  if(worldIdx>=0&&q!=='high'){/* props stay, shadows off */ }
};
G.paint&&G.paint();

// ===================== BOOT WORLD =====================
buildWorld(0);worldIdx=0;
CAR=makeCar(PAINTS[CFG.car][1],true);carG=CAR.g;scene.add(carG);
resetCar();
G.applyQ();
camPos.set(PL.pos.x+8,PL.pos.y+4,PL.pos.z+8);camLook.copy(PL.pos);
cam.position.copy(camPos);cam.lookAt(camLook);
rd.setPixelRatio(Math.min(devicePixelRatio,CFG.gfx==='high'?2:CFG.gfx==='med'?1.5:1));

// ===================== MAIN LOOP =====================
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;

  // day / night blend
  const tgt=night?1:0;
  nightAmt+=(tgt-nightAmt)*Math.min(1,dt*3);
  if(worldIdx>=0){
    const M=MAPS[worldIdx];
    skyU.top.value.copy(topDay).lerp(topNight,nightAmt);
    skyU.bot.value.copy(botDay).lerp(botNight,nightAmt);
    sun.intensity=M.sunI*(1-nightAmt*.93);
    hemi.intensity=.9*(1-nightAmt*.82);
    stars.material.opacity=nightAmt*.95;
    clouds.visible=nightAmt<.55;
    if(CAR)CAR.beams.forEach(b=>b.intensity=nightAmt*3.2);
  }

  if(ST.mode==='play'&&!ST.paused){
    step(dt);
    updateHUD(dt);
  }else if(ST.mode==='menu'){
    const a=now*.00016;
    cam.position.set(PL.pos.x+Math.cos(a)*12,PL.pos.y+3.4,PL.pos.z+Math.sin(a)*12);
    cam.lookAt(PL.pos.x,PL.pos.y+1,PL.pos.z);
    if(CAR)CAR.wheels.forEach(w=>{});
  }

  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').classList.remove('show')}

  rd.render(scene,cam);
}
requestAnimationFrame(loop);

// expose for the loader
G.ready=true;
}
</script>
