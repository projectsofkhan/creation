<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Apex Drive</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }

  /* PORTRAIT BLOCKER */
  #rotate { position:fixed; inset:0; background:#07070b; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:24px; z-index:9999; }
  #rotate.show { display:flex; }
  #rotate svg { width:56px; height:56px; opacity:.5; }
  #rotate p { font-size:12px; letter-spacing:5px; opacity:.5; }

  /* LOADER */
  #loader { position:fixed; inset:0; background:#07070b; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:20px;
    z-index:9000; transition:opacity .4s; }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .t { font-size:10px; letter-spacing:10px; opacity:.4; }
  #loader .b { width:160px; height:1px; background:rgba(255,255,255,.1); }
  #loader .f { height:100%; width:0%; background:#fff; transition:width .3s; }

  /* SELECT */
  #select { position:fixed; inset:0; z-index:8000;
    background:linear-gradient(180deg,#07070b,#0e0e16);
    display:flex; flex-direction:column;
    padding:calc(20px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right))
            calc(20px + env(safe-area-inset-bottom)) calc(28px + env(safe-area-inset-left));
    transition:opacity .4s, transform .4s; }
  #select.hide { opacity:0; pointer-events:none; transform:scale(1.03); }
  #select .hd { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; }
  #select .hd .lbl { font-size:9px; letter-spacing:7px; opacity:.35; }
  #select .hd .ttl { font-size:26px; font-weight:200; margin-top:6px; letter-spacing:.5px; }
  #select .hd .tag { font-size:9px; letter-spacing:3px; opacity:.3; }

  .grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
    border-radius:16px; padding:14px; display:flex; flex-direction:column;
    justify-content:space-between; cursor:pointer; transition:all .2s; }
  .card:active { transform:scale(.97); }
  .card.on { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.3); }
  .card .sil { height:56px; display:flex; align-items:center; justify-content:center; }
  .card .sil svg { width:100%; height:100%; max-width:140px; }
  .card .sil svg path, .card .sil svg circle {
    stroke:rgba(255,255,255,.3); fill:none; stroke-width:1.3; transition:stroke .2s; }
  .card.on .sil svg path, .card.on .sil svg circle { stroke:rgba(255,255,255,.95); }
  .card .nm { font-size:11px; font-weight:600; margin-bottom:8px; letter-spacing:.3px; }
  .card .sp { display:flex; justify-content:space-between; font-size:8px;
    letter-spacing:.5px; opacity:.4; margin-top:3px; }
  .card .sp b { font-weight:600; opacity:.9; }

  #go { margin-top:14px; padding:15px; border-radius:14px; background:#fff;
    color:#000; font-size:11px; letter-spacing:5px; font-weight:700;
    text-align:center; cursor:pointer; }
  #go:active { transform:scale(.98); opacity:.9; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:100;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    opacity:0; transition:opacity .4s; }
  #hud.on { opacity:1; }
  #hud > * { pointer-events:auto; }

  /* SPEEDO */
  #spd { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%); width:180px; height:100px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  #spd svg { position:absolute; bottom:0; width:180px; height:100px; overflow:visible; }
  #spd .v { font-size:28px; font-weight:200; font-variant-numeric:tabular-nums;
    line-height:1; text-shadow:0 2px 20px rgba(0,0,0,.6); }
  #spd .u { font-size:8px; letter-spacing:4px; opacity:.4; margin-top:2px; }
  #spd .g { position:absolute; right:0; top:6px; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:5px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15); }

  /* STEER */
  #steer { position:absolute; bottom:calc(28px + env(safe-area-inset-bottom));
    left:calc(22px + env(safe-area-inset-left)); display:flex; gap:14px; }
  .sb { width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.06); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    transition:background .1s, transform .1s; }
  .sb.on { background:rgba(255,255,255,.2); transform:scale(.94); }
  .sb svg { width:24px; height:24px; fill:none; stroke:#fff;
    stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

  /* PEDALS */
  #ped { position:absolute; bottom:calc(28px + env(safe-area-inset-bottom));
    right:calc(22px + env(safe-area-inset-right)); display:flex;
    gap:14px; align-items:flex-end; }
  .pb { width:66px; height:66px; border-radius:50%;
    background:rgba(255,255,255,.06); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    transition:background .1s, transform .1s; }
  .pb.g { width:80px; height:80px; }
  .pb.on { background:rgba(255,255,255,.2); transform:scale(.94); }
  .pb svg { width:26px; height:26px; fill:none; stroke:#fff;
    stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .pb.g svg { width:30px; height:30px; }

  /* GEAR BUTTONS TOP */
  #gears { position:absolute; top:calc(14px + env(safe-area-inset-top));
    left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  .gb { height:40px; padding:0 16px; border-radius:20px;
    background:rgba(255,255,255,.06); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    transition:background .1s, transform .1s; font-size:16px; font-weight:300; }
  .gb.on { background:rgba(255,255,255,.2); transform:scale(.95); }
  .gb span { font-size:10px; letter-spacing:2px; margin-left:6px; opacity:.6; font-weight:600; }

  /* TOP RIGHT */
  #tr { position:absolute; top:calc(14px + env(safe-area-inset-top));
    right:calc(20px + env(safe-area-inset-right)); text-align:right; }
  #tr .n { font-size:10px; letter-spacing:3px; opacity:.5; }
  #tr .m { font-size:8px; letter-spacing:2px; opacity:.3; margin-top:3px; }

  /* BACK */
  #bk { position:absolute; top:calc(14px + env(safe-area-inset-top));
    left:calc(20px + env(safe-area-inset-left)); width:36px; height:36px;
    border-radius:50%; background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; }
  #bk:active { background:rgba(255,255,255,.2); }
  #bk svg { width:16px; height:16px; fill:none; stroke:#fff;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div id="app"></div>

<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
  </svg>
  <p>ROTATE DEVICE</p>
</div>

<div id="loader">
  <div class="t">APEX DRIVE</div>
  <div class="b"><div class="f" id="lf"></div></div>
</div>

<div id="select">
  <div class="hd">
    <div>
      <div class="lbl">APEX DRIVE</div>
      <div class="ttl">Select Vehicle</div>
    </div>
    <div class="tag">REAL PHYSICS</div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="go">START ENGINE</div>
</div>

<div id="hud">
  <div id="bk"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
  <div id="tr">
    <div class="n" id="cn">BMW M5</div>
    <div class="m" id="tm">AUTOMATIC</div>
  </div>
  <div id="gears">
    <div class="gb" id="gdown"><span>DOWN</span></div>
    <div class="gb" id="gup"><span>UP</span></div>
  </div>
  <div id="spd">
    <div class="v" id="kmh">0</div>
    <div class="u">KM/H</div>
    <div class="g" id="gr">1</div>
    <svg viewBox="0 0 180 100">
      <defs>
        <linearGradient id="gg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#3ee07a"/>
          <stop offset="55%" stop-color="#ffcc33"/>
          <stop offset="100%" stop-color="#ff3355"/>
        </linearGradient>
      </defs>
      <path d="M 12 92 A 78 78 0 0 1 168 92" fill="none"
        stroke="rgba(255,255,255,.08)" stroke-width="5" stroke-linecap="round"/>
      <path id="arc" d="M 12 92 A 78 78 0 0 1 168 92" fill="none"
        stroke="url(#gg)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 250"/>
    </svg>
  </div>
  <div id="steer">
    <div class="sb" id="sL"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="sb" id="sR"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div>
  <div id="ped">
    <div class="pb" id="brk"><svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/></svg></div>
    <div class="pb g" id="gas"><svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
