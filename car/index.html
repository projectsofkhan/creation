<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Apex Drive | Ultimate Racing</title>

<!-- ============================================================ -->
<!-- CORE STYLES                                                  -->
<!-- ============================================================ -->
<style>
  /* Reset & Base Variables */
  :root {
    --bg-color: #050508;
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.5);
    --glass-bg: rgba(20, 20, 30, 0.45);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.25);
    --accent: #ff3366;
    --accent-glow: rgba(255, 51, 102, 0.4);
    --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-main);
    overscroll-behavior: none;
  }

  /* App Container */
  #app {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Force Landscape Container */
  #game-root {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    transition: transform 0.3s ease;
    background: #000;
  }

  /* Canvas */
  #render-canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }

  /* ============================================================ */
  /* PORTRAIT BLOCKER / ROTATE OVERLAY                            */
  /* ============================================================ */
  #rotate-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-color);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 99999;
  }

  #rotate-overlay.active {
    display: flex;
  }

  #rotate-overlay svg {
    width: 64px;
    height: 64px;
    stroke: var(--text-muted);
    stroke-width: 1.5;
    fill: none;
    animation: rotatePhone 3s ease-in-out infinite;
  }

  #rotate-overlay p {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  @keyframes rotatePhone {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  /* ============================================================ */
  /* LOADING SCREEN                                               */
  /* ============================================================ */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: #050508;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader-brand {
    font-size: 12px;
    letter-spacing: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
    animation: pulseBrand 2s infinite;
  }

  .loader-bar-container {
    width: 240px;
    height: 2px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .loader-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #fff, var(--accent));
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .loader-text {
    margin-top: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.3);
  }

  @keyframes pulseBrand {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* ============================================================ */
  /* CAR SELECTION SCREEN                                         */
  /* ============================================================ */
  #select-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #050508 0%, #0a0a12 100%);
    z-index: 9000;
    display: flex;
    flex-direction: column;
    padding: 30px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  #select-screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.05);
  }

  .select-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .select-title-group h1 {
    font-size: 24px;
    font-weight: 200;
    letter-spacing: 2px;
  }

  .select-title-group span {
    font-size: 10px;
    letter-spacing: 8px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .select-tag {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid var(--accent-glow);
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255, 51, 102, 0.05);
  }

  .car-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 15px;
  }

  .car-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }

  .car-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--glass-highlight), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .car-card.active {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--glass-highlight);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .car-card.active::before {
    opacity: 1;
  }

  .car-card:active {
    transform: scale(0.98);
  }

  .car-svg-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    z-index: 1;
  }

  .car-svg-container svg {
    width: 100%;
    max-width: 160px;
    height: auto;
    stroke: rgba(255, 255, 255, 0.2);
    stroke-width: 1.5;
    fill: none;
    transition: stroke 0.3s ease;
  }

  .car-card.active .car-svg-container svg {
    stroke: #fff;
  }

  .car-details {
    z-index: 1;
  }

  .car-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .car-specs {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .car-spec-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .car-spec-row span:last-child {
    color: #fff;
    font-weight: 600;
  }

  .start-btn-container {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }

  #start-btn {
    width: 100%;
    max-width: 400px;
    padding: 20px;
    background: #fff;
    color: #000;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
  }

  #start-btn:active {
    transform: scale(0.96);
    background: #ddd;
  }

  /* ============================================================ */
  /* IN-GAME HUD                                                  */
  /* ============================================================ */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.5s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #hud.active {
    opacity: 1;
  }

  #hud > * {
    pointer-events: auto;
  }

  /* Top Bar Info */
  .hud-top-info {
    position: absolute;
    top: 20px;
    right: 20px;
    text-align: right;
  }

  .hud-car-name {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  }

  .hud-trans-mode {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Back Button */
  .hud-back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .hud-back-btn:active {
    background: var(--glass-highlight);
  }

  .hud-back-btn svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Paddle Shifters */
  .paddle-container {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
  }

  .paddle-btn {
    height: 48px;
    padding: 0 24px;
    border-radius: 24px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.1s ease;
  }

  .paddle-btn:active, .paddle-btn.pressed {
    background: var(--glass-highlight);
    transform: scale(0.95);
  }

  .paddle-btn svg {
    width: 18px;
    height: 18px;
    stroke: #fff;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .paddle-btn span {
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 700;
    color: var(--text-muted);
  }

  /* Speedometer */
  .speedo-container {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .speedo-svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .speedo-value {
    font-size: 38px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    z-index: 2;
    margin-bottom: 5px;
  }

  .speedo-unit {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--text-muted);
    z-index: 2;
    margin-bottom: 15px;
  }

  .speedo-gear {
    position: absolute;
    top: 10px;
    right: 0;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    z-index: 2;
  }

  /* Steering Controls */
  .steer-container {
    position: absolute;
    bottom: 30px;
    left: 30px;
    display: flex;
    gap: 20px;
  }

  .steer-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
  }

  .steer-btn:active, .steer-btn.pressed {
    background: var(--glass-highlight);
    transform: scale(0.92);
  }

  .steer-btn svg {
    width: 32px;
    height: 32px;
    stroke: #fff;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Pedal Controls */
  .pedal-container {
    position: absolute;
    bottom: 30px;
    right: 30px;
    display: flex;
    gap: 20px;
    align-items: flex-end;
  }

  .pedal-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
  }

  .pedal-btn.gas {
    width: 96px;
    height: 96px;
  }

  .pedal-btn:active, .pedal-btn.pressed {
    background: var(--glass-highlight);
    transform: scale(0.92);
  }

  .pedal-btn svg {
    width: 32px;
    height: 32px;
    stroke: #fff;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .pedal-btn.gas svg {
    width: 40px;
    height: 40px;
  }

  /* ============================================================ */
  /* RESPONSIVE OVERRIDES & LANDSCAPE FORCING                     */
  /* ============================================================ */
  @media (orientation: portrait) {
    #game-root {
      width: 100vh;
      height: 100vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      position: fixed;
    }
  }
  
  /* Utility Classes */
  .hidden { display: none !important; }
  .invisible { opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- HTML STRUCTURE START                                         -->
<!-- ============================================================ -->

<div id="app">
  
  <!-- PORTRAIT ROTATE OVERLAY -->
  <div id="rotate-overlay">
    <svg viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <p>Rotate Device</p>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="loader-brand">Apex Drive</div>
    <div class="loader-bar-container">
      <div class="loader-bar-fill" id="loader-fill"></div>
    </div>
    <div class="loader-text" id="loader-text">Initializing Engine...</div>
  </div>

  <!-- MAIN GAME ROOT -->
  <div id="game-root">
    <canvas id="render-canvas"></canvas>
  </div>

  <!-- CAR SELECTION SCREEN -->
  <div id="select-screen" class="hidden">
    <div class="select-header">
      <div class="select-title-group">
        <span>Choose Your Machine</span>
        <h1>Select Vehicle</h1>
      </div>
      <div class="select-tag">Live Physics</div>
    </div>
    
    <div class="car-grid" id="car-grid">
      <!-- Cards injected by JS -->
    </div>
    
    <div class="start-btn-container">
      <button id="start-btn">Start Engine</button>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud" class="hidden">
    
    <!-- Back Button -->
    <div class="hud-back-btn" id="btn-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>

    <!-- Top Right Info -->
    <div class="hud-top-info">
      <div class="hud-car-name" id="hud-car-name">BMW M5</div>
      <div class="hud-trans-mode" id="hud-trans-mode">AUTOMATIC</div>
    </div>

    <!-- Paddle Shifters -->
    <div class="paddle-container">
      <div class="paddle-btn" id="btn-pad-down">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span>DOWN</span>
      </div>
      <div class="paddle-btn" id="btn-pad-up">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        <span>UP</span>
      </div>
    </div>

    <!-- Speedometer -->
    <div class="speedo-container">
      <div class="speedo-gear" id="speedo-gear">1</div>
      <div class="speedo-value" id="speedo-value">0</div>
      <div class="speedo-unit">KM/H</div>
      <svg class="speedo-svg" viewBox="0 0 200 120">
        <defs>
          <linearGradient id="speed-grad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#00ff88"/>
            <stop offset="50%" stop-color="#ffdd00"/>
            <stop offset="100%" stop-color="#ff0044"/>
          </linearGradient>
        </defs>
        <path d="M 15 100 A 85 85 0 0 1 185 100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
        <path id="speedo-arc" d="M 15 100 A 85 85 0 0 1 185 100" fill="none" stroke="url(#speed-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 267"/>
      </svg>
    </div>

    <!-- Steering -->
    <div class="steer-container">
      <div class="steer-btn" id="btn-left">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="steer-btn" id="btn-right">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>

    <!-- Pedals -->
    <div class="pedal-container">
      <div class="pedal-btn" id="btn-brake">
        <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </div>
      <div class="pedal-btn gas" id="btn-gas">
        <svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </div>
    </div>

  </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INJECTION                                             -->
<!-- ============================================================ -->
<script type="module" src="./game.js"></script>

</body>
</html>
