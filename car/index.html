<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>Ultimate Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none; touch-action: none;
  }
  #canvas { display: block; width: 100%; height: 100%; }

  /* ---------- LANDSCAPE WARNING ---------- */
  #rotate-overlay {
    position: fixed; inset: 0; background: #050505; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center; transition: opacity 0.3s;
  }
  #rotate-overlay svg { width: 60px; height: 60px; margin-bottom: 20px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
  @media (orientation: landscape) { #rotate-overlay { opacity: 0; pointer-events: none; } }

  /* ---------- LOADER ---------- */
  #loader {
    position: fixed; inset: 0; background: #050505;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.8s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 4px; margin-top: 16px; text-transform: uppercase; }

  /* ---------- HUD (Bottom Center) ---------- */
  #hud-container {
    position: fixed; bottom: calc(16px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; z-index: 10; pointer-events: none;
  }
  #speedometer { width: 220px; height: 110px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
  #speed-val { font-size: 36px; font-weight: 800; fill: #fff; letter-spacing: -1px; }
  #gear-val { font-size: 12px; font-weight: 700; fill: #4ade80; letter-spacing: 2px; }

  /* ---------- CONTROLS (Left/Right Bottom) ---------- */
  .control-group {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; gap: 12px; z-index: 20;
  }
  #left-controls { left: calc(20px + env(safe-area-inset-left)); }
  #right-controls { right: calc(20px + env(safe-area-inset-right)); }

  .btn {
    width: 64px; height: 64px; border-radius: 20px;
    background: rgba(20, 20, 25, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s, background 0.1s; cursor: pointer;
  }
  .btn:active, .btn.active { background: rgba(255,255,255,0.9); color: #000; transform: scale(0.92); }
  .btn svg { width: 28px; height: 28px; }
  
  /* Paddle Shifters */
  #paddles {
    position: fixed; top: calc(20px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 30px; z-index: 20;
  }
  .paddle {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 20px; border-radius: 8px; color: #fff;
    font-size: 12px; font-weight: 800; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .paddle:active { background: rgba(255,255,255,0.8); color: #000; }
  .paddle svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---------- CAR SELECTOR (Top Right) ---------- */
  #carBar {
    position: fixed; top: calc(16px + env(safe-area-inset-top));
    right: calc(16px + env(safe-area-inset-right));
    display: flex; flex-direction: column; gap: 8px; z-index: 20;
  }
  .car-btn {
    width: 120px; height: 40px; background: rgba(15,15,20,0.6); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    display: flex; align-items: center; padding: 0 12px; gap: 10px;
    color: rgba(255,255,255,0.5); transition: all 0.2s; cursor: pointer;
  }
  .car-btn svg { width: 40px; height: 16px; fill: currentColor; }
  .car-btn .label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; line-height: 1.2; }
  .car-btn.active {
    background: rgba(255,255,255,0.95); border-color: #fff; color: #000;
    box-shadow: 0 0 20px rgba(255,255,255,0.2); transform: translateX(-8px);
  }
</style>
</head>
<body>

<div id="rotate-overlay">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
    <line x1="12" y1="18" x2="12.01" y2="18"></line>
  </svg>
  <p>Please rotate your device<br><span style="font-size:12px;opacity:0.5">Landscape required for racing</span></p>
</div>

<canvas id="canvas"></canvas>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">IGNITION</div>
</div>

<!-- Speedometer HUD -->
<div id="hud-container">
  <svg id="speedometer" viewBox="0 0 200 100">
    <defs>
      <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="60%" stop-color="#facc15"/>
        <stop offset="100%" stop-color="#ef4444"/>
      </linearGradient>
    </defs>
    <!-- Arc Background -->
    <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-linecap="round"/>
    <!-- Arc Progress -->
    <path id="arcProgress" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="url(#arcGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 999"/>
    
    <!-- Text -->
    <text id="speed-val" x="100" y="70" text-anchor="middle">0</text>
    <text x="100" y="86" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="8" font-weight="700" letter-spacing="2">KM/H</text>
    <text id="gear-val" x="100" y="24" text-anchor="middle">N</text>
  </svg>
</div>

<!-- Steering Controls (Left) -->
<div id="left-controls" class="control-group">
  <div class="btn" data-steer="left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </div>
  <div class="btn" data-steer="right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
</div>

<!-- Pedal Controls (Right) -->
<div id="right-controls" class="control-group">
  <div class="btn" data-pedal="brake">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
  </div>
  <div class="btn" data-pedal="gas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>
</div>

<!-- Paddle Shifters (Top Center) -->
<div id="paddles">
  <div class="paddle" id="paddle-down">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> DOWNSHIFT
  </div>
  <div class="paddle" id="paddle-up">
    UPSHIFT <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </div>
</div>

<!-- Car Selector (Top Right) -->
<div id="carBar"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as CANNON from 'cannon-es';

/* ============================================================
   1. REAL CAR SPECS
   ============================================================ */
const CARS = {
  bmw: { name: 'BMW M5', power: 727, weight: 2370, topSpeed: 305, color: 0x0a0a12, gearRatios: [3.5, 2.3, 1.7, 1.3, 1.0, 0.8], finalDrive: 3.2 },
  mustang: { name: 'Ford Mustang 69', power: 375, weight: 1610, topSpeed: 190, color: 0xb01515, gearRatios: [3.2, 2.1, 1.5, 1.0], finalDrive: 3.5 },
  porsche: { name: 'Porsche 911', power: 394, weight: 1520, topSpeed: 294, color: 0xf0f0f0, gearRatios: [3.8, 2.4, 1.8, 1.4, 1.1, 0.9], finalDrive: 3.4 },
  ferrari: { name: 'LaFerrari', power: 950, weight: 1255, topSpeed: 351, color: 0xd91a1a, gearRatios: [3.6, 2.5, 1.9, 1.5, 1.2, 1.0, 0.8], finalDrive: 3.1 }
};

/* ============================================================
   2. RENDERER & POST-PROCESSING
   ============================================================ */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb8cce0, 0.0025);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);

// Post-Processing (Bloom for headlights/neon)
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85);
composer.addPass(bloomPass);
const outputPass = new OutputPass();
composer.addPass(outputPass);

/* ============================================================
   3. ENVIRONMENT
   ============================================================ */
const sky = new Sky();
sky.scale.setScalar(600000);
scene.add(sky);
const sun = new THREE.Vector3(150, 100, -80);
sky.material.uniforms['sunPosition'].value.copy(sun);
sky.material.uniforms['turbidity'].value = 3;
sky.material.uniforms['rayleigh'].value = 1.2;
sky.material.uniforms['mieCoefficient'].value = 0.005;
sky.material.uniforms['mieDirectionalG'].value = 0.8;

const sunLight = new THREE.DirectionalLight(0xfff5e6, 3.5);
sunLight.position.copy(sun);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 300;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);
scene.add(sunLight.target);
scene.add(new THREE.HemisphereLight(0xa0c0e0, 0x3a4030, 0.6));

const pmrem = new THREE.PMREMGenerator(renderer);
new RGBELoader().setPath('https://threejs.org/examples/textures/equirectangular/')
  .load('venice_sunset_1k.hdr', (tex) => {
    scene.environment = pmrem.fromEquirectangular(tex).texture;
    tex.dispose();
  });

/* ============================================================
   4. TRACK & SCENERY
   ============================================================ */
// Ground
const grassMat = new THREE.MeshStandardMaterial({ color: 0x2d4a2d, roughness: 1.0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), grassMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Asphalt
const texCanvas = document.createElement('canvas');
texCanvas.width = texCanvas.height = 256;
const ctx = texCanvas.getContext('2d');
ctx.fillStyle = '#222226'; ctx.fillRect(0, 0, 256, 256);
for(let i=0; i<8000; i++) {
  const v = 40 + Math.random() * 30;
  ctx.fillStyle = `rgba(${v},${v},${v},0.4)`;
  ctx.fillRect(Math.random()*256, Math.random()*256, 1.5, 1.5);
}
const asphaltTex = new THREE.CanvasTexture(texCanvas);
asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;
asphaltTex.repeat.set(8, 100);
asphaltTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const roadMat = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.8, metalness: 0.1 });
const road = new THREE.Mesh(new THREE.PlaneGeometry(18, 800), roadMat);
road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true;
scene.add(road);

// Road Lines
const lineMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0x332200, roughness: 0.4 });
for(let z=-380; z<400; z+=12) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 4), lineMat);
  dash.rotation.x = -Math.PI / 2; dash.position.set(0, 0.02, z);
  scene.add(dash);
}
// Edge Lines
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
for(const x of [-8.8, 8.8]) {
  const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 800), edgeMat);
  edge.rotation.x = -Math.PI / 2; edge.position.set(x, 0.02, 0);
  scene.add(edge);
}

// Trees
const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 6, 6);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2515, roughness: 1 });
const leavesGeo = new THREE.ConeGeometry(3, 8, 8);
const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1e441e, roughness: 0.9 });

const NUM_TREES = 400;
const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, NUM_TREES);
const leaves = new THREE.InstancedMesh(leavesGeo, leavesMat, NUM_TREES);
const dummy = new THREE.Object3D();

let placed = 0;
while(placed < NUM_TREES) {
  const x = (Math.random() - 0.5) * 600;
  const z = (Math.random() - 0.5) * 800;
  if (Math.abs(x) < 15) continue; // Keep off road
  const s = 0.8 + Math.random() * 0.6;
  
  dummy.position.set(x, 3*s, z); dummy.scale.setScalar(s); dummy.rotation.y = Math.random()*Math.PI; dummy.updateMatrix();
  trunks.setMatrixAt(placed, dummy.matrix);
  
  dummy.position.set(x, 9*s, z); dummy.updateMatrix();
  leaves.setMatrixAt(placed, dummy.matrix);
  placed++;
}
trunks.castShadow = leaves.castShadow = true;
trunks.receiveShadow = leaves.receiveShadow = true;
scene.add(trunks, leaves);

/* ============================================================
   5. HIGH-QUALITY CAR MESH (Smooth, Curved Geometry)
   ============================================================ */
function buildSmoothCar(color) {
  const group = new THREE.Group();

  // PBR Materials
  const paint = new THREE.MeshPhysicalMaterial({ color, metalness: 0.8, roughness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 1.5 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.05, transmission: 0.5, transparent: true, envMapIntensity: 2.0 });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.1 });
  const head = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 5.0 }); // For bloom
  const tail = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3.0 });

  // Main Body (Lathe Geometry for smooth curves)
  const points = [];
  for (let i = 0; i < 20; i++) {
    const x = (i / 19) * 2.0 - 1.0; // -1 to 1
    const y = Math.cos(x * Math.PI / 2) * 0.4; // Curved top
    points.push(new THREE.Vector2(x * 1.0, y + 0.5));
  }
  const bodyGeo = new THREE.LatheGeometry(points, 32);
  bodyGeo.scale(1, 1, 2.5); // Stretch into car shape
  bodyGeo.rotateX(Math.PI / 2);
  const body = new THREE.Mesh(bodyGeo, paint);
  body.castShadow = true;
  group.add(body);

  // Cabin/Glass
  const cabinGeo = new THREE.SphereGeometry(0.8, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  cabinGeo.scale(1.1, 0.8, 2.0);
  const cabin = new THREE.Mesh(cabinGeo, glass);
  cabin.position.set(0, 0.7, -0.2);
  cabin.castShadow = true;
  group.add(cabin);

  // Wheels (Smooth Cylinders)
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 32);
  wheelGeo.rotateZ(Math.PI / 2);
  const rimGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.36, 16);
  rimGeo.rotateZ(Math.PI / 2);
  const wheels = [];
  
  const wPositions = [[-1.0, 0.45, 1.4], [1.0, 0.45, 1.4], [-1.0, 0.45, -1.4], [1.0, 0.45, -1.4]];
  wPositions.forEach(([x, y, z]) => {
    const w = new THREE.Mesh(wheelGeo, rubber);
    w.position.set(x, y, z); w.castShadow = true;
    group.add(w); wheels.push(w);

    const r = new THREE.Mesh(rimGeo, chrome);
    r.position.set(x, y, z);
    group.add(r);
  });

  // Lights
  for(const x of [-0.6, 0.6]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.1), head);
    hl.position.set(x, 0.6, 2.2); group.add(hl);

    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), tail);
    tl.position.set(x, 0.7, -2.2); group.add(tl);
  }

  group.userData.wheels = wheels;
  return group;
}

/* ============================================================
   6. PHYSICS & VEHICLE CONTROLLER
   ============================================================ */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.defaultContactMaterial.friction = 0.4;
world.allowSleep = false;

const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

class Vehicle {
  constructor(specs, pos) {
    this.specs = specs;
    this.currentGear = 1;
    this.rpm = 900;
    this.speed = 0;
    this.isManual = false;

    const chassisShape = new CANNON.Box(new CANNON.Vec3(1.0, 0.4, 2.2));
    this.body = new CANNON.Body({ mass: specs.weight });
    this.body.addShape(chassisShape);
    this.body.position.set(pos.x, pos.y, pos.z);
    this.body.angularDamping = 0.5;
    world.addBody(this.body);

    this.ray = new CANNON.RaycastVehicle({ chassisBody: this.body, indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2 });
    const opts = {
      radius: 0.45, directionLocal: new CANNON.Vec3(0, -1, 0), axleLocal: new CANNON.Vec3(-1, 0, 0),
      suspensionStiffness: 40, suspensionRestLength: 0.35, frictionSlip: 3.5,
      dampingRelaxation: 2.3, dampingCompression: 4.4, maxSuspensionForce: 100000,
      rollInfluence: 0.01, maxSuspensionTravel: 0.3
    };
    [[-1.0, 0, 1.4], [1.0, 0, 1.4], [-1.0, 0, -1.4], [1.0, 0, -1.4]].forEach(p => {
      this.ray.addWheel({ ...opts, chassisConnectionPointLocal: new CANNON.Vec3(...p) });
    });
    this.ray.addToWorld(world);

    this.mesh = buildSmoothCar(specs.color);
    scene.add(this.mesh);
  }

  update(dt, controls) {
    const kmh = Math.abs(this.ray.currentVehicleSpeed * 3.6) || 0;
    this.speed = kmh;

    // Automatic Gearbox (if not manual)
    if (!this.isManual) {
      if (kmh < 1) this.currentGear = 1;
      else if (kmh < 30 && this.currentGear > 1) this.currentGear--;
      else if (kmh > 50 && this.currentGear < 2) this.currentGear = 2;
      else if (kmh > 90 && this.currentGear < 3) this.currentGear = 3;
      else if (kmh > 140 && this.currentGear < 4) this.currentGear = 4;
      else if (kmh > 200 && this.currentGear < 5) this.currentGear = 5;
      else if (kmh > 260 && this.currentGear < 6) this.currentGear = 6;
    }

    // RPM Calculation
    const ratio = this.specs.gearRatios[this.currentGear - 1] || 1;
    const wheelRpm = (this.ray.currentVehicleSpeed / (2 * Math.PI * 0.45)) * 60;
    const targetRpm = Math.max(900, wheelRpm * ratio * this.specs.finalDrive);
    this.rpm = THREE.MathUtils.lerp(this.rpm, Math.min(8000, targetRpm), 0.15);

    // Apply Forces
    const engineForce = (controls.throttle * this.specs.power * 100) / ratio;
    for (let i = 0; i < 4; i++) this.ray.applyEngineForce(-engineForce, i);

    this.ray.setSteeringValue(controls.steer * 0.5, 0);
    this.ray.setSteeringValue(controls.steer * 0.5, 1);

    for (let i = 0; i < 4; i++) this.ray.setBrake(controls.brake * 300, i);

    // Sync Mesh
    this.mesh.position.copy(this.body.position);
    this.mesh.quaternion.copy(this.body.quaternion);

    // Spin Wheels
    const spin = (this.ray.currentVehicleSpeed / 0.45) * dt;
    this.mesh.userData.wheels.forEach(w => w.rotation.x += spin);
  }
}

/* ============================================================
   7. SOUND SYNTHESIS
   ============================================================ */
class EngineSound {
  constructor() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);

    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.filter.frequency.value = 600;
    this.filter.connect(this.master);

    this.oscs = [];
    [1, 2, 3, 4.5].forEach((h, i) => {
      const o = this.ctx.createOscillator();
      o.type = i < 2 ? 'sawtooth' : 'square';
      o.frequency.value = 40 * h;
      const g = this.ctx.createGain();
      g.gain.value = 0.15 / (i + 1);
      o.connect(g).connect(this.filter);
      o.start();
      this.oscs.push({ o, g, h });
    });
  }
  start() { this.ctx.resume(); this.master.gain.setTargetAtTime(0.3, this.ctx.currentTime, 0.2); }
  update(rpm, throttle) {
    if (!isFinite(rpm)) return;
    const base = Math.max(20, rpm / 60);
    this.oscs.forEach(({ o, g, h }) => {
      o.frequency.setTargetAtTime(base * h, this.ctx.currentTime, 0.05);
      g.gain.setTargetAtTime((0.1 + throttle * 0.2) / h, this.ctx.currentTime, 0.05);
    });
    this.filter.frequency.setTargetAtTime(400 + rpm * 0.4, this.ctx.currentTime, 0.05);
  }
}

/* ============================================================
   8. GAME STATE & UI
   ============================================================ */
let vehicle = null;
let engine = null;
let activeCar = 'bmw';
const input = { throttle: 0, brake: 0, steer: 0 };

// Car UI Setup
const carBar = document.getElementById('carBar');
const svgs = {
  bmw: '<svg viewBox="0 0 50 20"><path d="M5,15 L10,8 L35,8 L45,15 Z"/><rect x="8" y="15" width="34" height="4"/></svg>',
  mustang: '<svg viewBox="0 0 50 20"><path d="M5,15 L10,8 L30,8 L45,12 L45,15 Z"/><rect x="8" y="15" width="34" height="4"/></svg>',
  porsche: '<svg viewBox="0 0 50 20"><path d="M5,15 L15,8 L30,6 L45,10 L45,15 Z"/><rect x="8" y="15" width="34" height="4"/></svg>',
  ferrari: '<svg viewBox="0 0 50 20"><path d="M5,15 L12,9 L25,5 L45,8 L45,15 Z"/><rect x="8" y="15" width="34" height="4"/></svg>'
};

Object.keys(CARS).forEach((key, idx) => {
  const btn = document.createElement('div');
  btn.className = 'car-btn';
  btn.dataset.car = key;
  btn.innerHTML = `${svgs[key]}<span class="label">${CARS[key].name}</span>`;
  if (idx === 0) btn.classList.add('active');
  btn.addEventListener('click', () => spawn(key));
  carBar.appendChild(btn);
});

function spawn(key) {
  if (vehicle) { scene.remove(vehicle.mesh); world.removeBody(vehicle.body); }
  activeCar = key;
  vehicle = new Vehicle(CARS[key], { x: 0, y: 1.5, z: 0 });
  if (!engine) engine = new EngineSound();
  engine.start();
  document.querySelectorAll('.car-btn').forEach(b => b.classList.toggle('active', b.dataset.car === key));
}

// Touch Inputs
const setInput = (type, active) => {
  if (type === 'left') input.steer = active ? 1 : (input.steer === 1 ? 0 : input.steer);
  if (type === 'right') input.steer = active ? -1 : (input.steer === -1 ? 0 : input.steer);
  if (type === 'gas') input.throttle = active ? 1 : 0;
  if (type === 'brake') input.brake = active ? 1 : 0;
};

document.querySelectorAll('[data-steer], [data-pedal]').forEach(el => {
  const type = el.dataset.steer || el.dataset.pedal;
  const start = (e) => { e.preventDefault(); el.classList.add('active'); setInput(type, true); };
  const end = (e) => { e.preventDefault(); el.classList.remove('active'); setInput(type, false); };
  el.addEventListener('touchstart', start, {passive: false});
  el.addEventListener('touchend', end);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
});

// Paddles
document.getElementById('paddle-up').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if(vehicle) { vehicle.isManual = true; vehicle.currentGear = Math.min(6, vehicle.currentGear + 1); }
});
document.getElementById('paddle-down').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if(vehicle) { vehicle.isManual = true; vehicle.currentGear = Math.max(1, vehicle.currentGear - 1); }
});

// Keyboard support for desktop
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

/* ============================================================
   9. HUD UPDATE
   ============================================================ */
const arcProgress = document.getElementById('arcProgress');
const speedVal = document.getElementById('speed-val');
const gearVal = document.getElementById('gear-val');
const ARC_LENGTH = Math.PI * 80;

function updateHUD(speed, gear) {
  const t = Math.min(speed / 350, 1);
  arcProgress.setAttribute('stroke-dasharray', `${ARC_LENGTH * t} 999`);
  speedVal.textContent = Math.round(speed);
  gearVal.textContent = gear;
}

/* ============================================================
   10. CAMERA & LOOP
   ============================================================ */
const camTarget = new THREE.Vector3();
const camOffset = new THREE.Vector3(0, 5, -12);
const camQ = new THREE.Quaternion();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, 0.016);

  if (vehicle) {
    // Combine touch & keyboard
    if (keys['KeyW'] || keys['ArrowUp']) input.throttle = 1;
    if (keys['KeyS'] || keys['ArrowDown']) input.brake = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) input.steer = 1;
    if (keys['KeyD'] || keys['ArrowRight']) input.steer = -1;

    world.step(1/60, dt, 3);
    vehicle.update(dt, input);
    updateHUD(vehicle.speed, vehicle.currentGear);
    if (engine) engine.update(vehicle.rpm, input.throttle);

    // Chase Camera
    const p = vehicle.body.position;
    const q = vehicle.body.quaternion;
    camQ.set(q.x, q.y, q.z, q.w);
    
    const offset = camOffset.clone().applyQuaternion(camQ);
    camTarget.set(p.x + offset.x, p.y + offset.y, p.z + offset.z);
    camera.position.lerp(camTarget, 1 - Math.pow(0.005, dt));
    camera.lookAt(p.x, p.y + 1, p.z);

    // Shadow follows car
    sunLight.position.set(p.x + 80, 100, p.z - 50);
    sunLight.target.position.set(p.x, 0, p.z);

    // Reset inputs for keyboard
    input.throttle = 0; input.brake = 0; input.steer = 0;
  }

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

spawn('bmw');
animate();
setTimeout(() => document.getElementById('loader').classList.add('hidden'), 800);
</script>
