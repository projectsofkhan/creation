<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VÉRTIGO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
.mono{font-family:'SF Mono',ui-monospace,'Cascadia Code',Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- ORIENTATION ---------- */
#rotate{position:fixed;inset:0;background:#000;display:none;z-index:9999;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:30px}
#rotate.on{display:flex}
#rotate svg{width:64px;height:64px;color:#4ee1c1;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
#rotate .t{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#4ee1c1}

/* ---------- LOADING ---------- */
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:100;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
#loading .s{width:32px;height:32px;border:2px solid rgba(78,225,193,.2);
  border-top-color:#4ee1c1;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .txt{font-size:10px;letter-spacing:.5em;color:#4ee1c1;text-transform:uppercase}

/* ---------- SCREENS ---------- */
.screen{position:fixed;inset:0;display:none;z-index:20}
.screen.active{display:block}
.screen.solid{background:#000}
.screen.overlay{pointer-events:none;background:transparent}
.screen.overlay *{pointer-events:none}
.screen.overlay button,.screen.overlay .interactive{pointer-events:auto}

/* ---------- BUTTONS ---------- */
.btn{
  border-radius:0;background:#000;border:1px solid rgba(255,255,255,.18);
  color:#fff;padding:9px 16px;font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  transition:all .15s ease;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#4ee1c1;color:#4ee1c1;background:#050505}
.btn:active{transform:scale(.97)}
.btn.primary{border-color:#4ee1c1;color:#4ee1c1}
.btn.primary:hover{background:rgba(78,225,193,.1)}
.btn:disabled{opacity:.35;cursor:not-allowed;border-color:rgba(255,255,255,.1);color:#666}

/* ---------- FULLSCREEN BTN ---------- */
#btn-fs{position:absolute;top:20px;left:20px;width:36px;height:36px;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;z-index:26;
  background:#000;border:1px solid rgba(255,255,255,.18);color:#fff;cursor:pointer;
  transition:all .15s;line-height:1}
#btn-fs:hover{border-color:#4ee1c1;color:#4ee1c1}
#btn-fs svg{width:16px;height:16px;pointer-events:none}
#btn-fs.exit{color:#4ee1c1;border-color:#4ee1c1}

/* ---------- MAIN MENU ---------- */
#menu .title-wrap{position:absolute;top:6%;left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none}
#menu .title{
  font-size:clamp(56px,10vw,110px);font-weight:900;letter-spacing:.12em;
  background:linear-gradient(180deg,#fff 0%,#4ee1c1 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;padding-left:.12em;
  filter:drop-shadow(0 8px 30px rgba(78,225,193,.25))}
#menu .subtitle{font-size:9px;letter-spacing:.7em;color:rgba(255,255,255,.4);
  text-transform:uppercase;margin-top:6px;padding-left:.7em}
#menu .car-name{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.35em;color:rgba(255,255,255,.55);
  text-transform:uppercase;pointer-events:none;text-align:center}
#menu .car-name b{color:#4ee1c1;font-weight:700}
#menu .btns{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:25}
#menu .btns .btn{min-width:96px;padding:10px 14px;font-size:10px}

.coins{position:absolute;top:20px;right:20px;padding:8px 14px;
  background:#000;border:1px solid rgba(255,255,255,.18);
  color:#4ee1c1;font-size:11px;font-weight:700;letter-spacing:.14em;z-index:25}

/* ---------- GARAGE ---------- */
#garage{background:#000}
.garage-head{display:flex;justify-content:space-between;align-items:center;
  padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.garage-head .t{font-size:15px;font-weight:800;letter-spacing:.3em}
.garage-body{position:absolute;top:60px;bottom:0;left:0;right:0;
  display:grid;grid-template-columns:230px 1fr 260px;gap:14px;padding:14px 22px}
.car-list{overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:6px}
.car-item{padding:10px 12px;background:#0a0a0a;border:1px solid rgba(255,255,255,.08);
  cursor:pointer;transition:all .15s}
.car-item:hover{background:#101010;border-color:rgba(255,255,255,.18)}
.car-item.sel{border-color:#4ee1c1;background:rgba(78,225,193,.06)}
.car-item .n{font-size:11px;font-weight:700;margin-bottom:3px;letter-spacing:.04em}
.car-item .s{font-size:9px;color:rgba(255,255,255,.4);margin-bottom:4px}
.car-item .p{font-size:10px;color:#4ee1c1;font-weight:700;letter-spacing:.1em}
.car-item .p.locked{color:#ffd166}

.showcase{position:relative;background:#050505;border:1px solid rgba(255,255,255,.08);
  overflow:hidden;min-height:0}
.showcase canvas{width:100%!important;height:100%!important;display:block}
.showcase .info{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;
  background:linear-gradient(transparent,rgba(0,0,0,.95))}
.showcase .info .n{font-size:15px;font-weight:800;letter-spacing:.05em;margin-bottom:6px}
.showcase .info .st{display:flex;gap:16px;font-size:9px;color:rgba(255,255,255,.5);
  letter-spacing:.15em;text-transform:uppercase}
.showcase .info .st b{color:#4ee1c1;display:block;font-size:13px;margin-bottom:1px;letter-spacing:.02em}
.showcase .actions{position:absolute;top:14px;right:14px;display:flex;gap:6px}

.upgrades{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:6px}
.upg{padding:10px 12px;background:#0a0a0a;border:1px solid rgba(255,255,255,.08)}
.upg .r{display:flex;justify-content:space-between;margin-bottom:5px;align-items:center}
.upg .l{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.upg .lv{font-size:9px;color:#4ee1c1;letter-spacing:.1em;font-weight:700}
.upg .pips{display:flex;gap:3px;margin-bottom:6px}
.upg .pip{flex:1;height:2px;background:rgba(255,255,255,.1)}
.upg .pip.on{background:#4ee1c1}
.upg .buy{width:100%;padding:6px;background:#000;border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;font-family:inherit;font-weight:600;transition:all .12s}
.upg .buy:hover:not(:disabled){border-color:#4ee1c1;color:#4ee1c1}
.upg .buy:disabled{opacity:.3;cursor:not-allowed}

/* ---------- MULTIPLAYER ---------- */
#mp{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#mp .t{font-size:32px;font-weight:900;letter-spacing:.2em;margin-bottom:20px}
#mp .status{font-size:11px;letter-spacing:.25em;color:rgba(255,255,255,.55);
  text-transform:uppercase;margin-bottom:22px;min-height:16px;text-align:center;max-width:400px}
#mp .code{font-family:'SF Mono',monospace;font-size:36px;letter-spacing:.15em;
  color:#4ee1c1;font-weight:800;padding:14px 28px;background:#0a0a0a;
  border:1px solid rgba(78,225,193,.4);margin:14px 0;cursor:pointer;display:none}
#mp .code.on{display:block}
#mp .code:hover{background:rgba(78,225,193,.08)}
#mp .code-l{font-size:9px;letter-spacing:.4em;color:rgba(255,255,255,.4);
  text-transform:uppercase;display:none}
#mp .code-l.on{display:block}
#mp .in{padding:10px 16px;background:#0a0a0a;border:1px solid rgba(255,255,255,.2);
  color:#fff;font-family:'SF Mono',monospace;font-size:20px;letter-spacing:.3em;
  width:200px;text-align:center;margin:10px 0;display:none}
#mp .in.on{display:block}
#mp .in:focus{outline:none;border-color:#4ee1c1}
#mp .actions{display:flex;flex-direction:column;gap:6px;margin-top:10px;align-items:center}
#mp .actions .btn{min-width:180px;padding:11px 16px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.on{display:block}
.hud-tl{position:absolute;top:16px;left:16px}
.hud-tl .lap{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.5);
  text-transform:uppercase;line-height:1.4}
.hud-tl .lap b{color:#fff;font-size:13px;font-weight:700}
.hud-tl .pos{font-size:10px;letter-spacing:.2em;color:#4ee1c1;
  text-transform:uppercase;margin-top:2px;font-weight:700}
.hud-tr{position:absolute;top:16px;right:16px;text-align:right}
.hud-tr .time{font-family:'SF Mono',monospace;font-size:15px;font-weight:600;
  letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#fff}
.hud-tr .best{font-family:'SF Mono',monospace;font-size:9px;letter-spacing:.14em;
  color:rgba(255,255,255,.4);margin-top:3px}
.hud-speed{position:absolute;bottom:16px;right:22px;text-align:right}
.hud-speed .num{font-size:56px;font-weight:900;line-height:.85;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 40px rgba(78,225,193,.4)}
.hud-speed .unit{font-size:9px;letter-spacing:.35em;color:rgba(255,255,255,.45);
  text-transform:uppercase;margin-top:2px;padding-right:.35em}
.hud-gear{position:absolute;bottom:20px;left:22px;font-size:11px;letter-spacing:.25em;
  color:rgba(255,255,255,.35);text-transform:uppercase}
.hud-gear b{color:#4ee1c1;font-size:20px;font-weight:800;letter-spacing:0;display:block;margin-top:2px}
#hud-center{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);
  font-size:96px;font-weight:900;color:#fff;letter-spacing:.05em;
  text-shadow:0 0 60px rgba(78,225,193,.7),0 8px 30px rgba(0,0,0,.6);
  opacity:0;pointer-events:none}
#hud-center.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(.95)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* ---------- COUNTDOWN LIGHTS ---------- */
#lights{position:fixed;top:14%;left:50%;transform:translateX(-50%);
  display:none;gap:10px;z-index:11;padding:10px 14px;
  background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.12)}
#lights.on{display:flex}
.light{width:26px;height:26px;background:#111;border:1px solid rgba(255,255,255,.1);
  transition:all .15s}
.light.red.on{background:#ff2a2a;box-shadow:0 0 20px #ff2a2a}
.light.yel.on{background:#ffcc00;box-shadow:0 0 20px #ffcc00}
.light.grn.on{background:#00ff77;box-shadow:0 0 20px #00ff77}

/* ---------- RESULTS ---------- */
#results{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#results .pos{font-size:100px;font-weight:900;letter-spacing:-.02em;line-height:1;
  background:linear-gradient(180deg,#fff,#4ee1c1);-webkit-background-clip:text;
  background-clip:text;color:transparent}
#results .lbl{font-size:10px;letter-spacing:.5em;color:rgba(255,255,255,.4);
  text-transform:uppercase;margin:6px 0 24px;padding-left:.5em}
#results .stats{display:flex;gap:36px;margin-bottom:18px}
#results .stat{text-align:center}
#results .stat .k{font-size:9px;letter-spacing:.25em;color:rgba(255,255,255,.4);
  text-transform:uppercase;margin-bottom:5px}
#results .stat .v{font-family:'SF Mono',monospace;font-size:18px;font-weight:600}
#results .coins-earn{font-size:14px;color:#4ee1c1;font-weight:700;letter-spacing:.15em;
  margin-bottom:22px}
#results .btns{display:flex;gap:6px}

/* ---------- TOUCH ---------- */
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:15}
#touch.on{display:block}
.tgroup{position:absolute;bottom:14px;display:flex;gap:5px;pointer-events:auto}
.tgroup.left{left:14px}
.tgroup.right{right:14px}
.tbtn{width:52px;height:52px;background:rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.2);border-radius:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
  cursor:pointer;touch-action:none;transition:background .1s;padding:0}
.tbtn.act{background:rgba(78,225,193,.28);border-color:#4ee1c1}
.tbtn svg{width:22px;height:22px;pointer-events:none;color:currentColor}
.tbtn.pedal svg{width:18px;height:26px}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);
  padding:10px 20px;background:#000;border:1px solid rgba(78,225,193,.4);
  color:#4ee1c1;font-size:11px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;z-index:30;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}

/* ---------- LANDSCAPE ENFORCEMENT ---------- */
@media (orientation:portrait){
  #rotate{display:none}
}
@media (orientation:portrait) and (max-width:900px){
  #rotate{display:flex}
  body>*:not(#rotate):not(#loading){display:none!important}
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="loading"><div class="s"></div><div class="txt">Loading</div></div>

<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="4" y="2" width="16" height="20" rx="2"/>
    <circle cx="12" cy="18" r="1" fill="currentColor"/>
  </svg>
  <div class="t">Rotate your device</div>
</div>

<!-- ========== MENU ========== -->
<div id="menu" class="screen overlay active">
  <button id="btn-fs" class="interactive" title="Toggle fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9V5a2 2 0 0 1 2-2h4"/>
      <path d="M15 3h4a2 2 0 0 1 2 2v4"/>
      <path d="M21 15v4a2 2 0 0 1-2 2h-4"/>
      <path d="M9 21H5a2 2 0 0 1-2-2v-4"/>
    </svg>
  </button>
  <div class="coins interactive" id="menu-coins">0</div>
  <div class="title-wrap">
    <div class="title">VÉRTIGO</div>
    <div class="subtitle">speed · precision · flow</div>
  </div>
  <div class="car-name" id="menu-car-name">Toyota Supra MK4</div>
  <div class="btns">
    <button class="btn primary" id="btn-race">RACE</button>
    <button class="btn" id="btn-free">FREE</button>
    <button class="btn" id="btn-mp">MULTI</button>
    <button class="btn" id="btn-garage">GARAGE</button>
  </div>
</div>

<!-- ========== GARAGE ========== -->
<div id="garage" class="screen solid">
  <div class="garage-head">
    <button class="btn" id="btn-garage-back">← BACK</button>
    <div class="t">GARAGE</div>
    <div class="coins" style="position:static" id="garage-coins">0</div>
  </div>
  <div class="garage-body">
    <div class="car-list" id="car-list"></div>
    <div class="showcase" id="showcase"></div>
    <div class="upgrades" id="upgrades"></div>
  </div>
</div>

<!-- ========== MULTIPLAYER ========== -->
<div id="mp" class="screen solid">
  <div class="t">MULTIPLAYER</div>
  <div class="status" id="mp-status">Choose an option</div>
  <div class="code-l" id="mp-code-l">ROOM CODE</div>
  <div class="code" id="mp-code" title="Click to copy"></div>
  <input class="in" id="mp-in" type="text" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
  <div class="actions" id="mp-actions">
    <button class="btn primary" id="btn-mp-host">HOST RACE</button>
    <button class="btn" id="btn-mp-join">JOIN RACE</button>
    <button class="btn" id="btn-mp-back">← BACK</button>
  </div>
</div>

<!-- ========== HUD ========== -->
<div id="hud">
  <div class="hud-tl">
    <div class="lap">LAP <b id="hud-lap">1</b>/<span id="hud-laptot">2</span></div>
    <div class="pos" id="hud-pos">P1</div>
  </div>
  <div class="hud-tr">
    <div class="time" id="hud-time">0:00.00</div>
    <div class="best" id="hud-best">BEST —</div>
  </div>
  <div class="hud-speed">
    <div class="num" id="hud-kmh">0</div>
    <div class="unit">KM/H</div>
  </div>
  <div class="hud-gear">GEAR <b id="hud-gear">N</b></div>
  <div id="hud-center"></div>
</div>

<div id="lights">
  <div class="light red" id="l-red"></div>
  <div class="light yel" id="l-yel"></div>
  <div class="light grn" id="l-grn"></div>
</div>

<!-- ========== RESULTS ========== -->
<div id="results" class="screen solid">
  <div class="pos" id="res-pos">1st</div>
  <div class="lbl">FINAL POSITION</div>
  <div class="stats">
    <div class="stat"><div class="k">TIME</div><div class="v" id="res-time">—</div></div>
    <div class="stat"><div class="k">BEST</div><div class="v" id="res-best">—</div></div>
    <div class="stat"><div class="k">TOP</div><div class="v" id="res-speed">—</div></div>
  </div>
  <div class="coins-earn" id="res-coins">+0</div>
  <div class="btns">
    <button class="btn primary" id="btn-res-again">AGAIN</button>
    <button class="btn" id="btn-res-menu">MENU</button>
  </div>
</div>

<!-- ========== TOUCH ========== -->
<div id="touch">
  <div class="tgroup left">
    <button class="tbtn" id="t-left" aria-label="left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
    </button>
    <button class="tbtn" id="t-right" aria-label="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5 L16 12 L9 19"/>
      </svg>
    </button>
  </div>
  <div class="tgroup right">
    <button class="tbtn pedal" id="t-brake" aria-label="brake">
      <svg viewBox="0 0 24 32" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="5" y="3" width="14" height="26" rx="3"/>
        <line x1="9" y1="11" x2="15" y2="17" stroke-width="1.6"/>
        <line x1="15" y1="11" x2="9" y2="17" stroke-width="1.6"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="tbtn pedal" id="t-gas" aria-label="gas">
      <svg viewBox="0 0 24 32" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="5" y="3" width="14" height="26" rx="3"/>
        <line x1="8" y1="11" x2="16" y2="11" stroke-width="1.6"/>
        <line x1="8" y1="17" x2="16" y2="17" stroke-width="1.6"/>
        <line x1="8" y1="23" x2="16" y2="23" stroke-width="1.6"/>
      </svg>
    </button>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

</script>
<script type="module">
import * as THREE from 'three';

/* ================================================================
   UTILS
   ================================================================ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const damp = (a,b,k,dt) => lerp(a,b,1-Math.exp(-k*dt));
const rnd = (a,b) => a+Math.random()*(b-a);
const fmt = s => {
  if(!isFinite(s)||s<0) return '—';
  const m=Math.floor(s/60), sec=Math.floor(s%60), cs=Math.floor((s%1)*100);
  return `${m}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
};
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ================================================================
   FULLSCREEN
   ================================================================ */
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function requestFullscreen() {
  if (isFullscreen()) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { req.call(el).catch(()=>{}); } catch(e){} }
}
function exitFullscreen() {

const CTRL = 18;
const ctrlPts = [];
for (let i=0; i<CTRL; i++) {
  const a = (i/CTRL) * Math.PI * 2;
  const r = 165 + 48*Math.sin(3*a+0.7) + 24*Math.cos(2*a+1.1);
  ctrlPts.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
}
const curve = new THREE.CatmullRomCurve3(ctrlPts, true, 'catmullrom', 0.5);
const SEG = 800;
const ROAD_HW = 9.6;
const CURB_W = 1.9;

const samples = [];
for (let i=0; i<SEG; i++) {
  const t = i/SEG;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t); tan.y=0; tan.normalize();
  const nrm = new THREE.Vector3(-tan.z, 0, tan.x);
  samples.push({ p, tan, nrm, t, dist:0, curv:0 });
}
let accum = 0;
for (let i=0; i<SEG; i++) {
  samples[i].dist = accum;
  accum += samples[i].p.distanceTo(samples[(i+1)%SEG].p);
}
const TRACK_LEN = accum;

{
  let maxC = 1e-5;
  for (let i=0; i<SEG; i++) {
    const a = samples[(i-11+SEG)%SEG].tan;
    const b = samples[(i+11)%SEG].tan;
    const c = 1 - clamp(a.dot(b), -1, 1);
    samples[i].curv = c; if (c > maxC) maxC = c;
  }
  for (let i=0; i<SEG; i++) samples[i].curv /= maxC;
  const sm = new Float32Array(SEG);
  for (let i=0; i<SEG; i++) {
    let s=0; for (let k=-6; k<=6; k++) s += samples[(i+k+SEG)%SEG].curv;
    sm[i] = s/13;
  }
  for (let i=0; i<SEG; i++) samples[i].curv = sm[i];
}

{

function buildCurb(side) {
  const pos=[], col=[], idx=[];
  const c1 = new THREE.Color(0xe02020), c2 = new THREE.Color(0xf5f5f5);
  for (let i=0; i<=SEG; i++) {
    const s = samples[i%SEG];
    const inner = s.p.clone().addScaledVector(s.nrm, side*ROAD_HW);
    const outer = s.p.clone().addScaledVector(s.nrm, side*(ROAD_HW+CURB_W));
    pos.push(inner.x,0.055,inner.z, outer.x,0.055,outer.z);
    const c = (Math.floor(i/5)%2) ? c1 : c2;
    col.push(c.r,c.g,c.b, c.r,c.g,c.b);
  }
  for (let i=0; i<SEG; i++) {
    const a=i*2, b=i*2+1, c=i*2+2, d=i*2+3;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.7, metalness:0.05, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m); mesh.receiveShadow = true;
  return mesh;
}

/* Trees */
function distToTrack(x, z){
  let best = Infinity;
  for (let i=0; i<SEG; i+=6) {
    const dx = samples[i].p.x - x, dz = samples[i].p.z - z;
    const d = dx*dx + dz*dz; if (d < best) best = d;
  }
  return Math.sqrt(best);
}
{

  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, COUNT);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, COUNT);
  trunks.castShadow = leaves.castShadow = true;
  const dummy = new THREE.Object3D(); const col = new THREE.Color();
  let n=0, tries=0;
  while(n<COUNT && tries<COUNT*40) {
    tries++;
    const a = Math.random()*Math.PI*2, r = rnd(70, 720);
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if (distToTrack(x,z) < 32) continue;
    const sc = rnd(0.8, 1.7);
    dummy.position.set(x, 0, z); dummy.rotation.y = Math.random()*Math.PI*2;
    dummy.scale.set(sc, sc*rnd(0.9,1.3), sc); dummy.updateMatrix();

    leaves.setColorAt(n, col); n++;
  }
  trunks.count = leaves.count = n; leaves.instanceColor.needsUpdate = true;
  scene.add(trunks, leaves);
}

function buildCarVisual(spec, ghost=false) {
  const group = new THREE.Group();
  const bodyGroup = new THREE.Group(); group.add(bodyGroup);
  const L = 4.6, W = 2.0, H = 1.35;

  const paintMat = new THREE.MeshStandardMaterial({ color: spec.color, metalness:0.75, roughness:0.25 });
  const darkMat  = new THREE.MeshStandardMaterial({ color:0x0a0d12, metalness:0.5, roughness:0.65 });
  const glassMat = new THREE.MeshStandardMaterial({ color:0x061018, metalness:0.95, roughness:0.05 });
  const chromeMat= new THREE.MeshStandardMaterial({ color:0xdddddd, metalness:1.0, roughness:0.15 });
  const headMat  = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xfff0c0, emissiveIntensity:3.0 });
  const tailMat  = new THREE.MeshStandardMaterial({ color:0xff2222, emissive:0xff1a1a, emissiveIntensity:2.5 });
  const accentMat= new THREE.MeshStandardMaterial({ color: spec.accent, metalness:0.95, roughness:0.18 });
  if (ghost) {
    [paintMat,darkMat,glassMat,headMat,tailMat,accentMat].forEach(m => {
      m.transparent = true; m.opacity = 0.5; m.emissiveIntensity = 0;
    });
  }

  const add = (geo, mat, x, y, z, rot) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (rot) m.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0);
    m.castShadow = !ghost; m.receiveShadow = !ghost;
    bodyGroup.add(m); return m;
  };

  add(new THREE.BoxGeometry(W, 0.5, L), paintMat, 0, 0.62, 0);
  add(new THREE.BoxGeometry(W*0.94, 0.35, L*0.98), paintMat, 0, 0.95, 0);

  if (spec.style === 'super') {
    add(new THREE.BoxGeometry(W*0.85, 0.35, L*0.68), paintMat, 0, 1.22, -0.1);
    add(new THREE.BoxGeometry(W*0.82, 0.3, L*0.32), glassMat, 0, 1.32, 0.15);
    add(new THREE.BoxGeometry(W*0.9, 0.08, L*0.92), darkMat, 0, 0.38, 0);
    add(new THREE.BoxGeometry(W*0.94, 0.05, 0.5), darkMat, 0, 0.36, L*0.46);
    add(new THREE.BoxGeometry(W*0.9, 0.14, 0.5), darkMat, 0, 0.42, -L*0.48);
    add(new THREE.BoxGeometry(W*0.85, 0.06, 0.5), accentMat, 0, 1.55, -L*0.42);
    add(new THREE.BoxGeometry(0.08, 0.3, 0.08), darkMat, W*0.34, 1.4, -L*0.42);
    add(new THREE.BoxGeometry(0.08, 0.3, 0.08), darkMat, -W*0.34, 1.4, -L*0.42);
  } else if (spec.style === 'sedan') {
    add(new THREE.BoxGeometry(W*0.94, 0.42, L*0.5), paintMat, 0, 1.23, -0.15);
    add(new THREE.BoxGeometry(W*0.87, 0.3, L*0.4), glassMat, 0, 1.28, -0.1);
    add(new THREE.BoxGeometry(W*0.9, 0.06, L*0.94), accentMat, 0, 0.36, 0);
    add(new THREE.BoxGeometry(W*0.85, 0.04, 0.4), darkMat, 0, 1.45, -L*0.36);
  } else {
    add(new THREE.BoxGeometry(W*0.92, 0.38, L*0.55), paintMat, 0, 1.2, -0.1);
    add(new THREE.BoxGeometry(W*0.85, 0.28, L*0.44), glassMat, 0, 1.26, -0.05);
    add(new THREE.BoxGeometry(W*0.85, 0.05, L*0.85), accentMat, 0, 0.36, 0);
    add(new THREE.BoxGeometry(W*0.86, 0.06, 0.45), darkMat, 0, 1.4, -L*0.36);
  }

  add(new THREE.BoxGeometry(0.5, 0.16, 0.12), headMat, W*0.32, 0.78, L*0.5);
  add(new THREE.BoxGeometry(0.5, 0.16, 0.12), headMat, -W*0.32, 0.78, L*0.5);
  add(new THREE.BoxGeometry(0.55, 0.14, 0.12), tailMat, W*0.30, 0.82, -L*0.5);
  add(new THREE.BoxGeometry(0.55, 0.14, 0.12), tailMat, -W*0.30, 0.82, -L*0.5);

  const exG = new THREE.CylinderGeometry(0.1, 0.1, 0.28, 12); exG.rotateX(Math.PI/2);
  add(exG, chromeMat, 0.5, 0.32, -L*0.5);
  add(exG, chromeMat, -0.5, 0.32, -L*0.5);

  const wheelR = 0.45;
  const wb = L*0.31;
  const halfW = W/2 + 0.02;
  const tyreMat = new THREE.MeshStandardMaterial({ color:0x101214, roughness:0.95, metalness:0.02 });
  const wheelGeo = new THREE.CylinderGeometry(wheelR, wheelR, 0.32, 20); wheelGeo.rotateZ(Math.PI/2);
  const rimGeo = new THREE.CylinderGeometry(wheelR*0.62, wheelR*0.62, 0.34, 12); rimGeo.rotateZ(Math.PI/2);
  const spokeGeo = new THREE.BoxGeometry(0.02, wheelR*1.1, 0.05);
  const wheels = [], frontPivots = [];
  for (const wd of [
    {x:halfW, z:wb, f:true}, {x:-halfW, z:wb, f:true},
    {x:halfW, z:-wb, f:false}, {x:-halfW, z:-wb, f:false}
  ]) {
    const pivot = new THREE.Group();
    pivot.position.set(wd.x, wheelR, wd.z);
    const wheel = new THREE.Mesh(wheelGeo, tyreMat);
    wheel.castShadow = !ghost;
    const rim = new THREE.Mesh(rimGeo, accentMat);
    wheel.add(rim);
    for (let k = 0; k < 5; k++) {
      const sp = new THREE.Mesh(spokeGeo, accentMat);
      sp.rotation.x = (k/5) * Math.PI;
      wheel.add(sp);
    }
    pivot.add(wheel); group.add(pivot);
    wheels.push(wheel); if (wd.f) frontPivots.push(pivot);
  }

  group.scale.setScalar(1.35);
  return { group, bodyGroup, wheels, frontPivots };
}

/* ================================================================
   AUDIO
   ================================================================ */
class AudioEngine {
  constructor(){ this.ready = false; this.gear = 1; }
  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain();
    this.master.gain.setValueAtTime(0, ctx.currentTime);
    this.master.gain.setTargetAtTime(0.9, ctx.currentTime + 0.1, 0.5);
    this.master.connect(ctx.destination);

    const nlen = Math.floor(ctx.sampleRate * 2);
    const nbuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
    const nd = nbuf.getChannelData(0);
    for (let i=0; i<nlen; i++) nd[i] = Math.random()*2-1;
    this.noiseBuf = nbuf;

    this.engGain = ctx.createGain(); this.engGain.gain.value = 0;
    this.engFilter = ctx.createBiquadFilter();
    this.engFilter.type = 'lowpass';
    this.engFilter.frequency.value = 900;
    this.engFilter.Q.value = 2.2;
    this.engFilter.connect(this.engGain);
    this.engGain.connect(this.master);

    this.turboGain = ctx.createGain(); this.turboGain.gain.value = 0;
    const turboFilter = ctx.createBiquadFilter();
    turboFilter.type = 'bandpass'; turboFilter.frequency.value = 4200; turboFilter.Q.value = 6;
    turboFilter.connect(this.turboGain);
    this.turboGain.connect(this.master);

    this.rumbleGain = ctx.createGain(); this.rumbleGain.gain.value = 0;
    const rumbleF = ctx.createBiquadFilter();
    rumbleF.type = 'lowpass'; rumbleF.frequency.value = 160;
    rumbleF.connect(this.rumbleGain);
    this.rumbleGain.connect(this.master);

    this.oscs = [];
    const defs = [
      { t:'sawtooth', m:1.0, gain:0.42, chain:'eng' },
      { t:'square',   m:2.02, gain:0.16, chain:'eng' },
      { t:'sine',     m:0.5, gain:0.38, chain:'eng' },
      { t:'sawtooth', m:3.01, gain:0.07, chain:'eng' },
      { t:'sine',     m:8.0, gain:0.06, chain:'turbo' },
      { t:'triangle', m:0.25, gain:0.25, chain:'rumble' }
    ];
    for (const d of defs) {
      const o = ctx.createOscillator();
      o.type = d.t;
      o.frequency.value = 60 * d.m;
      const g = ctx.createGain();
      g.gain.value = d.gain;
      o.connect(g);
      if (d.chain === 'eng') g.connect(this.engFilter);
      else if (d.chain === 'turbo') g.connect(turboFilter);
      else g.connect(rumbleF);
      o.start();
      this.oscs.push({ o, m: d.m, g });
    }

    this.screechGain = ctx.createGain(); this.screechGain.gain.value = 0;
    const sbp = ctx.createBiquadFilter(); sbp.type='bandpass'; sbp.frequency.value=2200; sbp.Q.value=3.2;
    const shp = ctx.createBiquadFilter(); shp.type='highpass'; shp.frequency.value=950;
    const ssrc = ctx.createBufferSource(); ssrc.buffer=nbuf; ssrc.loop=true;
    ssrc.connect(sbp); sbp.connect(shp); shp.connect(this.screechGain);
    this.screechGain.connect(this.master); ssrc.start();

    this.windGain = ctx.createGain(); this.windGain.gain.value = 0;
    const wlp = ctx.createBiquadFilter(); wlp.type='lowpass'; wlp.frequency.value=850;
    const wsrc = ctx.createBufferSource(); wsrc.buffer=nbuf; wsrc.loop=true;
    wsrc.connect(wlp); wlp.connect(this.windGain); this.windGain.connect(this.master); wsrc.start();

    this.offRoadGain = ctx.createGain(); this.offRoadGain.gain.value = 0;
    const orlp = ctx.createBiquadFilter(); orlp.type='lowpass'; orlp.frequency.value=210;
    const orsrc = ctx.createBufferSource(); orsrc.buffer=nbuf; orsrc.loop=true;
    orsrc.connect(orlp); orlp.connect(this.offRoadGain); this.offRoadGain.connect(this.master); orsrc.start();

    this.ready = true;
  }
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
  update(speedRatio, throttle, slip, offroad, active, gear) {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const rev = clamp(speedRatio*0.85 + throttle*0.35, 0, 1.2);
    const base = 52 + rev*260;

    for (const { o, m } of this.oscs) {
      o.frequency.setTargetAtTime(base * m, t, 0.04);
    }
    this.engFilter.frequency.setTargetAtTime(700 + rev*2800, t, 0.06);
    this.engGain.gain.setTargetAtTime(active ? 0.10 + rev*0.14 : 0, t, 0.08);
    this.turboGain.gain.setTargetAtTime(active ? Math.max(0, rev-0.35)*0.12 : 0, t, 0.08);
    this.rumbleGain.gain.setTargetAtTime(active ? rev*0.10 : 0, t, 0.1);
    this.screechGain.gain.setTargetAtTime(active ? clamp(slip,0,1)*0.22 : 0, t, 0.05);
    this.windGain.gain.setTargetAtTime(active ? speedRatio*speedRatio*0.09 : 0, t, 0.15);
    this.offRoadGain.gain.setTargetAtTime(active && offroad ? 0.11 + speedRatio*0.15 : 0, t, 0.08);

    if (gear !== undefined && gear !== this.gear) {
      this.gear = gear;
      this._shift();
    }
  }
  _shift() {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 800; f.Q.value = 3;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.1);
  }
  beep(freq, dur, vol, type='sine') {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  thud(v=1) {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 380;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(clamp(v,0,1)*0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.35);
  }
  engineStart() {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(80, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.3);
    o.frequency.exponentialRampToValueAtTime(100, t + 0.85);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1200;
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 1.05);
  }
}
const audio = new AudioEngine();

   DUST
   ================================================================ */
const MAXP = 220;
const pPos = new Float32Array(MAXP*3);
const pAlpha = new Float32Array(MAXP);
const pSize = new Float32Array(MAXP);
const pVel = new Float32Array(MAXP*3);
const pLife = new Float32Array(MAXP);
const pMax = new Float32Array(MAXP);
let pHead = 0;
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
dustGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1).setUsage(THREE.DynamicDrawUsage));
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const dustMat = new THREE.ShaderMaterial({
  uniforms:{ uTex:{ value: texDust() } },
  vertexShader:`attribute float aAlpha; attribute float aSize; varying float vA;
    void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=aSize*(400./max(-mv.z,1.)); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D uTex; varying float vA;
    void main(){ vec4 t=texture2D(uTex,gl_PointCoord);
    if(t.a*vA<0.004) discard;
    gl_FragColor=vec4(0.9,0.83,0.7,t.a*vA); }`,
  transparent:true, depthWrite:false
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
dustPoints.frustumCulled = false;
scene.add(dustPoints);

function spawnDust(x,y,z,spread,strength) {
  const i = pHead; pHead = (pHead+1)%MAXP;
  pPos[i*3]=x+rnd(-spread,spread);
  pPos[i*3+1]=y+rnd(0,0.4);
  pPos[i*3+2]=z+rnd(-spread,spread);
  pVel[i*3]=rnd(-1.6,1.6); pVel[i*3+1]=rnd(1,3.2); pVel[i*3+2]=rnd(-1.6,1.6);
  pLife[i]=pMax[i]=rnd(0.55,1.25);
  pSize[i]=rnd(0.7,1.9)*strength; pAlpha[i]=0.75;
}
function updateDust(dt) {
  for (let i=0; i<MAXP; i++) {
    if (pLife[i] <= 0) { pAlpha[i] = 0; continue; }
    pLife[i] -= dt;
    pPos[i*3]+=pVel[i*3]*dt; pPos[i*3+1]+=pVel[i*3+1]*dt; pPos[i*3+2]+=pVel[i*3+2]*dt;
    pVel[i*3]*=0.96; pVel[i*3+2]*=0.96; pVel[i*3+1]-=1.4*dt;
    const t = clamp(pLife[i]/pMax[i],0,1);
    pAlpha[i] = t*t*0.72; pSize[i] += dt*2.2;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.aAlpha.needsUpdate = true;
  dustGeo.attributes.aSize.needsUpdate = true;
}

const keys = {};
const touch = { left:false, right:false, gas:false, brake:false };

addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR' && gameState.mode !== 'menu' && gameState.mode !== 'garage') resetPlayerToTrack();
  audio.resume();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function readInput() {
  const thr = (keys.KeyW || keys.ArrowUp || touch.gas) ? 1 : 0;
  const brk = (keys.KeyS || keys.ArrowDown || touch.brake) ? 1 : 0;
  const steer = ((keys.KeyA || keys.ArrowLeft || touch.left) ? 1 : 0)
              - ((keys.KeyD || keys.ArrowRight || touch.right) ? 1 : 0);
  return { throttle: thr, brake: brk, steer, handbrake: !!keys.Space };
}

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  $('touch').classList.add('on');
  const bind = (id, key) => {
    const el = $(id);
    if (!el) return;
    const on = e => { e.preventDefault(); touch[key] = true; el.classList.add('act'); audio.resume(); };
    const off = e => { e.preventDefault(); touch[key] = false; el.classList.remove('act'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  };
  bind('t-left', 'left'); bind('t-right', 'right');
  bind('t-gas', 'gas'); bind('t-brake', 'brake');
}

function makePlayerCar() {

  return {

    pos: new THREE.Vector3(), vel: new THREE.Vector3(),
    heading: 0, vF: 0, steer: 0, wheelSpin: 0, trackIdx: 0,
    offroad: false, slip: 0, topSpeed: 0, gear: 1
  };

function resetPlayerToTrack() {
  const p = gameState.player;
  if (!p) return;
  const s = samples[p.trackIdx];
  p.pos.copy(s.p);
  p.heading = Math.atan2(s.tan.x, s.tan.z);
  p.vF = 0; p.vel.set(0,0,0);
  p.obj.position.copy(p.pos); p.obj.rotation.y = p.heading;
  p.bodyGroup.rotation.set(0,0,0);
}

function updateTrackIndex(car) {
  let best = car.trackIdx, bestD = Infinity;
  for (let k = -34; k <= 34; k++) {
    const i = (car.trackIdx + k + SEG) % SEG;
    const dx = samples[i].p.x - car.pos.x;
    const dz = samples[i].p.z - car.pos.z;
    const d = dx*dx + dz*dz;
    if (d < bestD) { bestD = d; best = i; }
  }
  car.trackIdx = best;
  car.offroad = Math.sqrt(bestD) > ROAD_HW + 0.35;
}

/* ================================================================
   PHYSICS
   ================================================================ */
function updatePlayerPhysics(p, dt) {
  const inp = readInput();
  const isRaceMode = gameState.mode === 'race' || gameState.mode === 'mp';
  const active = gameState.mode === 'free' || gameState.race.started;

  let thr = active ? inp.throttle : 0;
  let brk = active ? inp.brake : 0;
  let st = active ? inp.steer : 0;
  const hb = inp.handbrake && active;
  if (gameState.race.finished) { thr = 0; brk = 1; st = 0; }

  p.steer = damp(p.steer, st, 16, dt);

  const spd = Math.abs(p.vF);
  const speedRatio = clamp(spd / p.stats.topSpeed, 0, 1);

  const turnRate = 2.6 * clamp(spd/12, 0, 1) * (1 - 0.42 * speedRatio);
  p.heading += p.steer * turnRate * dt * Math.sign(p.vF || 1);

  if (thr > 0) {
    const t = clamp(1 - Math.abs(p.vF) / p.stats.topSpeed, 0, 1);
    p.vF += p.stats.accelRate * thr * t * dt;
  }
  if (brk > 0) {
    if (p.vF > 0.6) p.vF -= 68 * brk * dt;
    else p.vF = Math.max(p.vF - 22 * brk * dt, -18);
  }
  if (thr === 0 && brk === 0) p.vF *= Math.exp(-0.55 * dt);
  if (p.offroad) p.vF *= Math.exp(-1.1 * dt);
  if (hb) p.vF *= Math.exp(-1.6 * dt);

  p.vF = clamp(p.vF, -18, p.stats.topSpeed);

  const fwd = new THREE.Vector3(Math.sin(p.heading), 0, Math.cos(p.heading));
  const targetVel = fwd.clone().multiplyScalar(p.vF);
  const gripK = hb ? 2.8 : (p.offroad ? 4.5 : 10.5);
  const prevVel = p.vel.clone();
  p.vel.lerp(targetVel, 1 - Math.exp(-gripK * dt));
  p.slip = clamp((prevVel.distanceTo(p.vel) / Math.max(dt, 0.001)) * 0.005, 0, 1);

  p.pos.addScaledVector(p.vel, dt);

  if (isRaceMode && !gameState.race.finished) {
    const s = samples[p.trackIdx];
    const dx = p.pos.x - s.p.x, dz = p.pos.z - s.p.z;
    const lat = dx * s.nrm.x + dz * s.nrm.z;
    const maxOff = ROAD_HW + 0.6;
    if (Math.abs(lat) > maxOff) {
      const excess = Math.abs(lat) - maxOff;
      const sign = Math.sign(lat);
      p.pos.x -= s.nrm.x * sign * excess;
      p.pos.z -= s.nrm.z * sign * excess;
      p.vel.multiplyScalar(0.75);
      p.vF *= 0.75;
    }
  }

  p.obj.position.copy(p.pos);
  p.obj.rotation.y = p.heading;

  const rollT = -p.steer * speedRatio * 0.12;
  const pitchT = clamp(-p.vF * 0.001, -0.06, 0.06) + (brk * 0.04);
  p.bodyGroup.rotation.z = damp(p.bodyGroup.rotation.z, rollT, 10, dt);
  p.bodyGroup.rotation.x = damp(p.bodyGroup.rotation.x, pitchT, 8, dt);

  p.wheelSpin += (p.vF * dt) / 0.45;
  for (const w of p.wheels) w.rotation.x = p.wheelSpin;
  for (const fw of p.frontPivots) fw.rotation.y = p.steer * 0.48;

  if (Math.abs(p.vF) > p.topSpeed) p.topSpeed = Math.abs(p.vF);

  const gRatio = clamp(Math.abs(p.vF) / p.stats.topSpeed, 0, 1);
  p.gear = p.vF < -0.5 ? 0 : (gRatio < 0.02 ? 1 : Math.min(6, 1 + Math.floor(gRatio * 5.9)));

  if (p.offroad && spd > 8) {
    const back = p.pos.clone().addScaledVector(fwd, -1.6);
    spawnDust(back.x, 0.15, back.z, 0.9, clamp(spd/40, 0.4, 1.4));
  }
  if (p.slip > 0.35 && spd > 20 && Math.random() < 0.6) {
    spawnDust(p.pos.x, 0.12, p.pos.z, 0.5, 0.7);
  }
}

/* ================================================================
   AI
   ================================================================ */
function createAIs(count, excludeId) {
  const pool = CARS.filter(c => c.id !== excludeId);
  for (let i = 0; i < count; i++) {
    const car = pool[Math.floor(Math.random() * pool.length)];
    const stats = getStats(car.id);
    const diff = 0.85 + Math.random() * 0.2;
    stats.topSpeed *= diff;
    stats.accelRate *= diff;
    const v = buildCarVisual(car);
    scene.add(v.group);
    gameState.aiCars.push({
      spec: car, stats,
      obj: v.group, bodyGroup: v.bodyGroup, wheels: v.wheels, frontPivots: v.frontPivots,
      dist: 8 + i * 8, phase: Math.random()*10, lap: 0, progress: 0,
      aiSpeed: stats.topSpeed * (0.72 + Math.random() * 0.18),
      vF: 0, wheelSpin: 0, pos: new THREE.Vector3(), heading: 0
    });
  }
}

function updateAI(ai, dt) {
  if (!gameState.race.started) { ai.vF *= 0.9; return; }

  const t = ((ai.dist / TRACK_LEN) % 1 + 1) % 1;
  const si = Math.floor(t * SEG) % SEG;
  const curv = samples[si].curv;
  const target = ai.aiSpeed * (1 - curv * 0.5);
  ai.vF += (target - ai.vF) * Math.min(1, dt * 2.4);
  ai.dist += ai.vF * dt;

  const tt = ((ai.dist / TRACK_LEN) % 1 + 1) % 1;
  const fi = (tt * SEG) % SEG;
  const i0 = Math.floor(fi);
  const i1 = (i0 + 1) % SEG;
  const f = fi - i0;
  const p = samples[i0].p.clone().lerp(samples[i1].p, f);
  const tan = samples[i0].tan.clone().lerp(samples[i1].tan, f).normalize();
  const nrm = new THREE.Vector3(-tan.z, 0, tan.x);
  const lat = Math.sin(ai.dist * 0.011 + ai.phase) * 2.7;
  p.addScaledVector(nrm, lat);

  ai.pos.copy(p);
  ai.obj.position.copy(p);
  ai.heading = Math.atan2(tan.x, tan.z);
  ai.obj.rotation.y = ai.heading;

  ai.wheelSpin += (ai.vF * dt) / 0.45;
  for (const w of ai.wheels) w.rotation.x = ai.wheelSpin;
  const turn = Math.sin(ai.dist * 0.011 + ai.phase + 1.5) * 0.35;
  for (const fw of ai.frontPivots) fw.rotation.y = turn;
  ai.bodyGroup.rotation.z = damp(ai.bodyGroup.rotation.z, -turn * 0.15, 6, dt);

  ai.lap = Math.floor(ai.dist / TRACK_LEN);
  ai.progress = ai.lap + tt;
}

function resolveCollisions() {
  const p = gameState.player;
  if (!p) return;
  const minD = 5.0;
  for (const ai of gameState.aiCars) {
    if (!ai.pos) continue;
    const dx = p.pos.x - ai.pos.x;
    const dz = p.pos.z - ai.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist < minD && dist > 0.0001) {
      const nx = dx/dist, nz = dz/dist;
      const push = (minD - dist) * 0.5;
      p.pos.x += nx * push; p.pos.z += nz * push;
      p.vF *= 0.85;
      p.vel.multiplyScalar(0.85);
      if (!p._collCd || performance.now() - p._collCd > 220) {
        p._collCd = performance.now();
        audio.thud(clamp(Math.abs(p.vF) / 50, 0.15, 1));
      }
    }
  }
}

/* ================================================================
   MULTIPLAYER (PeerJS, 4-digit code)
   ================================================================ */
const mp = gameState.mp;

function generateCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function setMPStatus(txt) { $('mp-status').textContent = txt; }
function showRoomCode(code) {
  $('mp-code-l').classList.add('on');
  const c = $('mp-code');
  c.classList.add('on');
  c.textContent = code;
  c.onclick = () => {
    navigator.clipboard.writeText(code).catch(()=>{});
    toast('Code copied');
  };
}
function hideRoomCode() {
  $('mp-code-l').classList.remove('on');
  $('mp-code').classList.remove('on');
  $('mp-in').classList.remove('on');
}

function resetMP() {
  hideRoomCode();
  if (mp.peer) { try { mp.peer.destroy(); } catch(e){} mp.peer = null; }
  mp.conn = null;
  mp.isHost = false;
  mp.roomCode = null;
  mp.connected = false;
  mp.oppCarId = null;
  mp.oppReady = false;
}

function hostMP() {
  resetMP();
  setMPStatus('Creating room...');
  if (typeof Peer === 'undefined') { setMPStatus('PeerJS not loaded'); return; }

  let attempts = 0;
  const tryHost = () => {
    attempts++;
    if (attempts > 4) { setMPStatus('Could not create room. Try again.'); return; }
    const code = generateCode();
    const peer = new Peer('VRTG-' + code, { debug: 0 });
    let failed = false;
    peer.on('open', () => {
      if (failed) return;
      mp.peer = peer;
      mp.isHost = true;
      mp.roomCode = code;
      setMPStatus('Room ready. Share this code:');
      showRoomCode(code);
      $('btn-mp-host').disabled = true;
      $('btn-mp-join').disabled = true;
    });
    peer.on('error', err => {
      failed = true;
      try { peer.destroy(); } catch(e){}
      if (err.type === 'unavailable-id') {
        setTimeout(tryHost, 150);
      } else {
        setMPStatus('Error: ' + err.type);
      }
    });
    peer.on('connection', conn => {
      if (mp.conn) { conn.close(); return; }
      mp.conn = conn;
      conn.on('open', () => { onConnected(); });
      conn.on('data', handleMPData);
      conn.on('close', () => { toast('Opponent left'); mp.connected = false; });
      conn.on('error', () => { setMPStatus('Connection error'); });
    });
  };
  tryHost();
}

function joinMP() {
  const code = $('mp-in').value.trim();
  if (!/^\d{4}$/.test(code)) { setMPStatus('Enter 4-digit code'); return; }
  resetMP();
  setMPStatus('Connecting...');
  if (typeof Peer === 'undefined') { setMPStatus('PeerJS not loaded'); return; }

  const peer = new Peer({ debug: 0 });
  peer.on('open', () => {
    mp.peer = peer;
    mp.isHost = false;
    mp.roomCode = code;
    const conn = peer.connect('VRTG-' + code, { reliable: false });
    mp.conn = conn;
    conn.on('open', () => { onConnected(); });
    conn.on('data', handleMPData);
    conn.on('close', () => { toast('Disconnected'); mp.connected = false; });
    conn.on('error', () => { setMPStatus('Connection failed'); });
    setTimeout(() => {
      if (!mp.connected) setMPStatus('Could not connect. Check code.');
    }, 8000);
  });
  peer.on('error', err => { setMPStatus('Error: ' + err.type); });
}

function onConnected() {
  mp.connected = true;
  setMPStatus('Connected!');
  try {
    mp.conn.send({ t:'hello', carId: save.selected });
  } catch(e){}
  if (mp.isHost) {
    setTimeout(() => {
      try { mp.conn.send({ t:'start' }); } catch(e){}
      startRace('mp');
    }, 600);
  }
}

function handleMPData(data) {
  if (!data || !data.t) return;
  if (data.t === 'hello') {
    mp.oppCarId = data.carId;
    mp.oppReady = true;
  } else if (data.t === 'start') {
    if (!mp.isHost) startRace('mp');
  } else if (data.t === 's') {
    if (gameState.remoteCar) {
      gameState.remoteCar.targetPos.set(data.x, 0.05, data.z);
      gameState.remoteCar.targetHeading = data.h;
      gameState.remoteCar.targetSpeed = data.v;
    }
  } else if (data.t === 'fin') {
    toast('Opponent finished!');
  }
}

function sendMPState() {
  if (!mp.conn || !mp.conn.open) return;
  const p = gameState.player;
  if (!p) return;
  const now = performance.now();
  if (now - mp.lastSend < 50) return;
  mp.lastSend = now;
  try {
    mp.conn.send({ t:'s', x: p.pos.x, z: p.pos.z, h: p.heading, v: p.vF });
  } catch(e){}
}

function spawnRemoteCar() {
  const carId = mp.oppCarId || 'gtr';
  const spec = getCar(carId);
  const v = buildCarVisual({...spec, color:0x4ee1c1, accent:0xffffff}, true);
  scene.add(v.group);
  gameState.remoteCar = {
    obj: v.group, wheels: v.wheels, frontPivots: v.frontPivots, bodyGroup: v.bodyGroup,
    targetPos: new THREE.Vector3(0, 0, 0), targetHeading: 0, targetSpeed: 0
  };
}

function updateRemoteCar(dt) {
  const r = gameState.remoteCar;
  if (!r) return;
  r.obj.position.lerp(r.targetPos, 1 - Math.exp(-14 * dt));
  let dh = r.targetHeading - r.obj.rotation.y;
  while (dh > Math.PI) dh -= Math.PI*2;
  while (dh < -Math.PI) dh += Math.PI*2;
  r.obj.rotation.y += dh * (1 - Math.exp(-12 * dt));
  const spin = r.targetSpeed * dt / 0.45;
  for (const w of r.wheels) w.rotation.x += spin;
}

/* ================================================================
   RACE FLOW
   ================================================================ */
function clearCars() {
  if (gameState.player) { scene.remove(gameState.player.obj); gameState.player = null; }
  for (const ai of gameState.aiCars) scene.remove(ai.obj);
  gameState.aiCars = [];
  if (gameState.remoteCar) { scene.remove(gameState.remoteCar.obj); gameState.remoteCar = null; }
}

function startRace(mode) {
  audio.init(); audio.resume(); audio.engineStart();
  lockLandscape();
  clearCars();
  if (menuCar) { scene.remove(menuCar.group); menuCar = null; }
  showroom.visible = false;

  raceDecor.visible = mode === 'race' || mode === 'mp';
  gameState.mode = mode;

  const p = gameState.player = makePlayerCar();
  const startOffset = samples[0].nrm.clone().multiplyScalar(3.2);
  p.pos.copy(samples[0].p).add(startOffset);
  p.heading = Math.atan2(samples[0].tan.x, samples[0].tan.z);
  p.obj.position.copy(p.pos); p.obj.rotation.y = p.heading;
  updateTrackIndex(p);

  if (mode === 'race') {
    createAIs(5, save.selected);
  } else if (mode === 'mp') {
    spawnRemoteCar();
  }

  gameState.race = {
    started: false, countdown: 4, time: 0, laps: 2,
    lapStart: 0, bestLap: Infinity, lapTimes: [], playerLap: 0,
    finished: false
  };

  document.querySelectorAll('.light').forEach(l => l.classList.remove('on'));
  if (mode === 'race' || mode === 'mp') $('lights').classList.add('on');
  else $('lights').classList.remove('on');

  $('hud').classList.add('on');
  $('hud-center').style.opacity = '0';
  routeScreen(null);

  camera.position.set(
    p.pos.x - Math.sin(p.heading)*10,
    5,
    p.pos.z - Math.cos(p.heading)*10
  );
  gameState.camLook.copy(p.pos);
}

function startFree() {
  audio.init(); audio.resume(); audio.engineStart();
  lockLandscape();
  clearCars();
  if (menuCar) { scene.remove(menuCar.group); menuCar = null; }
  showroom.visible = false;
  raceDecor.visible = false;
  gameState.mode = 'free';

  const p = gameState.player = makePlayerCar();
  const startOffset = samples[0].nrm.clone().multiplyScalar(3.2);
  p.pos.copy(samples[0].p).add(startOffset);
  p.heading = Math.atan2(samples[0].tan.x, samples[0].tan.z);
  p.obj.position.copy(p.pos); p.obj.rotation.y = p.heading;
  updateTrackIndex(p);

  gameState.race = {
    started: true, countdown: 0, time: 0, laps: 0,
    lapStart: 0, bestLap: Infinity, lapTimes: [], playerLap: 0, finished: false
  };

  $('lights').classList.remove('on');
  $('hud').classList.add('on');
  $('hud-center').style.opacity = '0';
  routeScreen(null);

  camera.position.set(
    p.pos.x - Math.sin(p.heading)*10,
    5,
    p.pos.z - Math.cos(p.heading)*10
  );
  gameState.camLook.copy(p.pos);
}

function onLap() {
  const race = gameState.race;
  gameState.race.playerLap++;

  if (gameState.mode === 'free') {
    save.coins += 25;
    persist(); updateCoins();
    toast('+25 coins');
    showCenter(`LAP ${gameState.race.playerLap}`);
    audio.beep(880, 0.2, 0.14, 'sine');
    return;
  }

  const lapTime = race.time - race.lapStart;
  race.lapTimes.push(lapTime);
  race.lapStart = race.time;
  if (lapTime < race.bestLap) {
    race.bestLap = lapTime;
    audio.beep(1200, 0.22, 0.16, 'sine');
  }
  if (gameState.race.playerLap >= race.laps) {
    finishRace();
  } else {
    showCenter(`LAP ${gameState.race.playerLap + 1}`);
    audio.beep(680, 0.2, 0.14, 'square');
  }
}

function finishRace() {
  if (gameState.race.finished) return;
  gameState.race.finished = true;

  const player = gameState.player;
  const all = [{ p: gameState.race.playerLap + player.trackIdx/SEG, isPlayer:true }];
  for (const ai of gameState.aiCars) all.push({ p: ai.progress || 0 });
  if (gameState.remoteCar) all.push({ p: gameState.race.playerLap + 0.001 });
  all.sort((a,b) => b.p - a.p);
  const pos = all.findIndex(x => x.isPlayer) + 1;

  const payouts = [800, 500, 300, 200, 150, 100, 50];
  const payout = payouts[pos-1] || 50;
  save.coins += payout;
  persist(); updateCoins();

  try {
    if (mp.conn && mp.conn.open) mp.conn.send({ t:'fin' });
  } catch(e){}

  const sfx = ['1st','2nd','3rd','4th','5th','6th','7th'];
  $('res-pos').textContent = sfx[pos-1] || `${pos}th`;
  $('res-time').textContent = fmt(gameState.race.time);
  $('res-best').textContent = gameState.race.bestLap < Infinity ? fmt(gameState.race.bestLap) : '—';
  $('res-speed').textContent = Math.round(player.topSpeed * 3.85) + ' km/h';
  $('res-coins').textContent = `+${payout} 🪙`;

  setTimeout(() => {
    $('hud').classList.remove('on');
    $('lights').classList.remove('on');
    routeScreen('results');
    audio.beep(660, 0.3, 0.18, 'sine');
    setTimeout(() => audio.beep(990, 0.5, 0.18, 'sine'), 180);
  }, 1200);
}

let centerTO;
function showCenter(txt, dur=800) {
  const el = $('hud-center');
  el.textContent = txt;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  clearTimeout(centerTO);
  centerTO = setTimeout(() => { el.style.opacity = '0'; el.classList.remove('pop'); }, dur);

/* ================================================================
   HUD
   ================================================================ */
function updateHUD() {
  const p = gameState.player;
  if (!p || gameState.mode === 'menu' || gameState.mode === 'garage') return;

  const kph = Math.round(Math.abs(p.vF) * 3.85);
  $('hud-kmh').textContent = kph;
  $('hud-gear').textContent = p.gear === 0 ? 'R' : String(p.gear);

  if (gameState.mode === 'free') {
    $('hud-lap').textContent = (gameState.race.playerLap + 1);
    $('hud-laptot').textContent = '—';
    $('hud-time').textContent = fmt(gameState.race.time);
    $('hud-best').textContent = 'FREE DRIVE';
    $('hud-pos').textContent = '';
    return;
  }

  $('hud-lap').textContent = Math.min(gameState.race.playerLap + 1, gameState.race.laps);
  $('hud-laptot').textContent = gameState.race.laps;
  $('hud-time').textContent = fmt(gameState.race.time);
  $('hud-best').textContent = 'BEST ' + (gameState.race.bestLap < Infinity ? fmt(gameState.race.bestLap) : '—');

  const all = [{ p: gameState.race.playerLap + p.trackIdx/SEG, isPlayer:true }];
  for (const ai of gameState.aiCars) all.push({ p: ai.progress || 0 });
  all.sort((a,b) => b.p - a.p);
  const pos = all.findIndex(x => x.isPlayer) + 1;
  $('hud-pos').textContent = 'P' + pos + ' / ' + all.length;
}

/* ================================================================
   COUNTDOWN
   ================================================================ */
function updateCountdown(dt) {
  if (!gameState.player) return;
  if (gameState.mode !== 'race' && gameState.mode !== 'mp') return;
  const race = gameState.race;
  if (race.started) return;

  race.countdown -= dt;
  const n = Math.ceil(race.countdown);

  tl.red.emissiveIntensity = 0;
  tl.yel.emissiveIntensity = 0;
  tl.grn.emissiveIntensity = 0;
  document.querySelectorAll('.light').forEach(l => l.classList.remove('on'));

  if (race.countdown > 2) {
    $('l-red').classList.add('on');
    tl.red.emissiveIntensity = 1.5;
    if (n < (race._last || 99) && n > 0) {
      race._last = n;
      showCenter(String(n), 700);
      audio.beep(440, 0.16, 0.16, 'square');
    }
  } else if (race.countdown > 1) {
    $('l-yel').classList.add('on');
    tl.yel.emissiveIntensity = 1.5;
  } else if (race.countdown > 0) {
    $('l-grn').classList.add('on');
    tl.grn.emissiveIntensity = 1.5;
  } else {
    $('l-grn').classList.add('on');
    tl.grn.emissiveIntensity = 2;
    race.started = true;
    audio.beep(880, 0.45, 0.2, 'square');
    showCenter('GO!', 800);
    setTimeout(() => $('lights').classList.remove('on'), 900);
  }
}

/* ================================================================
   CAMERA
   ================================================================ */
function updateCamera(dt) {
  if (gameState.mode === 'menu') {
    if (menuCar) {
      menuAngle += dt * 0.5;
      const r = 8.5;
      camera.position.set(
        Math.cos(menuAngle * 0.6) * r,
        2.5 + Math.sin(menuAngle * 0.4) * 0.4,
        Math.sin(menuAngle * 0.6) * r
      );
      camera.lookAt(0, 1.3, 0);
      menuCar.group.rotation.y = menuAngle * 0.35;
      if (camera.fov !== 50) { camera.fov = 50; camera.updateProjectionMatrix(); }
    }
    return;
  }

  const p = gameState.player;
  if (!p) return;

  const fwd = new THREE.Vector3(Math.sin(p.heading), 0, Math.cos(p.heading));
  const sr = clamp(Math.abs(p.vF) / p.stats.topSpeed, 0, 1);

  const back = 9.5 + sr * 4;
  const height = 4.0 + sr * 1.0;

  const desired = p.pos.clone().addScaledVector(fwd, -back).add(new THREE.Vector3(0, height, 0));
  camera.position.lerp(desired, 1 - Math.exp(-7.5 * dt));

  const lookTarget = p.pos.clone().addScaledVector(fwd, 10).add(new THREE.Vector3(0, 1.8, 0));
  gameState.camLook.lerp(lookTarget, 1 - Math.exp(-10 * dt));
  camera.lookAt(gameState.camLook);

  const targetFov = 63 + sr * 12;
  camera.fov = damp(camera.fov, targetFov, 5, dt);
  camera.updateProjectionMatrix();

  const shake = sr*sr * 0.05 + (p.offroad ? 0.07 : 0);
  if (shake > 0.001) {
    camera.position.x += (Math.random()-0.5) * shake;
    camera.position.y += (Math.random()-0.5) * shake;
  }
  if (camera.position.y < 1.6) camera.position.y = 1.6;
}

function routeScreen(name) {
  const map = { menu: 'menu', garage: 'garage', mp: 'mp', results: 'results' };
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (name && map[name]) $(map[name]).classList.add('active');
}

function initGarageRenderer() {
  if (garageRenderer) return;
  const container = $('showcase');
  garageRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  garageRenderer.setSize(container.clientWidth, container.clientHeight);

  garageCamera.position.set(7, 4.5, 8.5);
  garageCamera.lookAt(0, 1, 0);

  garageScene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(6, 9, 7); garageScene.add(key);
  const rim = new THREE.DirectionalLight(0x88bbff, 1.5);
  rim.position.set(-6, 5, -5); garageScene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(22, 48),
    new THREE.MeshStandardMaterial({ color:0x0a0f16, roughness:0.9, metalness:0.15 })
  );
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.4; garageScene.add(ground);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(5.5, 5.8, 64),
    new THREE.MeshBasicMaterial({ color:0x4ee1c1, transparent:true, opacity:0.4, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2; ring.position.y = -0.38; garageScene.add(ring);

  garageActive = true;
  (function loop() {
    if (!garageActive) return;
    requestAnimationFrame(loop);
    if (!garageRenderer || !garageScene) return;
    garageAngle += 0.01;
    if (garageCarGroup) garageCarGroup.rotation.y = garageAngle;
    garageRenderer.render(garageScene, garageCamera);
  })();
}

function showCarInGarage(carId) {
  initGarageRenderer();
  if (garageCarGroup) garageScene.remove(garageCarGroup);
  const car = getCar(carId);
  const built = buildCarVisual(car);
  built.group.scale.setScalar(1.9);
  garageCarGroup = built.group;
  garageScene.add(garageCarGroup);
  garageAngle = 0;
}

function renderGarage() {
  updateCoins();
  if (!garageSelected) garageSelected = save.selected;

  const list = $('car-list');
  list.innerHTML = '';
  for (const car of CARS) {
    const owned = save.owned.includes(car.id);
    const sel = garageSelected === car.id;
    const item = document.createElement('div');
    item.className = 'car-item' + (sel ? ' sel' : '');
    item.innerHTML = `
      <div class="n">${car.name}</div>
      <div class="s">${car.power} HP · ${car.weight} kg</div>
      <div class="p ${owned ? '' : 'locked'}">${owned ? '✓ OWNED' : '🪙 ' + car.price.toLocaleString()}</div>
    `;
    item.onclick = () => { garageSelected = car.id; renderGarage(); };
    list.appendChild(item);
  }

  showCarInGarage(garageSelected);

  const container = $('showcase');
  container.querySelectorAll('.info, .actions').forEach(el => el.remove());
  const car = getCar(garageSelected);
  const stats = getStats(garageSelected);
  const owned = save.owned.includes(garageSelected);

  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = `
    <div class="n">${car.name}</div>
    <div class="st">
      <div><b>${Math.round(stats.power)}</b>HP</div>
      <div><b>${Math.round(stats.topKph)}</b>KM/H</div>
      <div><b>${Math.round(stats.weight)}</b>KG</div>
      <div><b>${stats.grip.toFixed(2)}</b>GRIP</div>
    </div>
  `;
  container.appendChild(info);

  const actions = document.createElement('div');
  actions.className = 'actions';
  if (!owned) {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'BUY — 🪙 ' + car.price.toLocaleString();
    btn.disabled = save.coins < car.price;
    btn.onclick = () => {
      if (save.coins >= car.price) {
        save.coins -= car.price;
        save.owned.push(car.id);
        save.selected = car.id;
        persist();
        toast('Purchased!');
        renderGarage();
      }
    };
    actions.appendChild(btn);
  } else if (save.selected !== garageSelected) {
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = 'SELECT';
    btn.onclick = () => {
      save.selected = garageSelected;
      persist();
      toast('Selected');
      refreshMenuCar();
      renderGarage();
    };
    actions.appendChild(btn);
  } else {
    const tag = document.createElement('div');
    tag.className = 'btn primary';
    tag.style.cursor = 'default';
    tag.textContent = 'SELECTED';
    actions.appendChild(tag);
  }
  container.appendChild(actions);

  const panel = $('upgrades');
  panel.innerHTML = '';
  const UPGRADES = [
    { key:'engine', label:'Engine', desc:'+15% power, +5% top speed', costs:[500,1200,2500] },
    { key:'tires',  label:'Tires',  desc:'+10% grip', costs:[400,900,1800] },
    { key:'weight', label:'Weight', desc:'-8% weight', costs:[450,1000,2200] }
  ];
  const upg = getUpg(garageSelected);
  for (const ug of UPGRADES) {
    const lv = upg[ug.key] || 0;
    const maxed = lv >= 3;
    const nextCost = maxed ? 0 : ug.costs[lv];
    const canBuy = owned && !maxed && save.coins >= nextCost;

    const item = document.createElement('div');
    item.className = 'upg';
    item.innerHTML = `
      <div class="r">
        <div class="l">${ug.label}</div>
        <div class="lv">Lv ${lv}/3</div>
      </div>
      <div class="pips">${[0,1,2].map(i => `<div class="pip ${i < lv ? 'on' : ''}"></div>`).join('')}</div>
    `;
    const btn = document.createElement('button');
    btn.className = 'buy';
    btn.textContent = !owned ? 'OWN CAR FIRST' : maxed ? 'MAXED' : 'UPGRADE — 🪙 ' + nextCost.toLocaleString();
    btn.disabled = !canBuy;
    btn.onclick = () => {
      if (canBuy) {
        save.coins -= nextCost;
        if (!save.upgrades[garageSelected]) save.upgrades[garageSelected] = { engine:0, tires:0, weight:0 };
        save.upgrades[garageSelected][ug.key] = lv + 1;
        persist();
        toast(ug.label + ' Lv ' + (lv+1));
        renderGarage();
      }
    };
    item.appendChild(btn);
    panel.appendChild(item);
  }
}

function destroyGarage() {
  garageActive = false;
  if (garageRenderer) {
    try { garageRenderer.dispose(); } catch(e){}
    garageRenderer = null;
  }
  garageScene = null; garageCarGroup = null;
  $('showcase').innerHTML = '';
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameState.mode === 'menu') {
    updateCamera(dt);
    renderer.render(scene, camera);
    return;
  }
  if (gameState.mode === 'garage') return;

  if (gameState.mode === 'race' || gameState.mode === 'mp' || gameState.mode === 'free') {
    updateCountdown(dt);
    if (gameState.race.started) gameState.race.time += dt;

    const p = gameState.player;
    if (p) {
      updatePlayerPhysics(p, dt);
      const prevIdx = p.trackIdx;
      updateTrackIndex(p);
      if (prevIdx > SEG*0.78 && p.trackIdx < SEG*0.22) onLap();
      if (prevIdx < SEG*0.22 && p.trackIdx > SEG*0.78) gameState.race.playerLap = Math.max(0, gameState.race.playerLap - 1);

      audio.update(
        clamp(Math.abs(p.vF) / p.stats.topSpeed, 0, 1),
        readInput().throttle, p.slip, p.offroad, true, p.gear
      );
    }

    for (const ai of gameState.aiCars) updateAI(ai, dt);
    if (gameState.aiCars.length) resolveCollisions();

    updateRemoteCar(dt);
    sendMPState();

    if (p) {
      sun.position.set(p.pos.x + 180, 240, p.pos.z + 100);
      sun.target.position.copy(p.pos);
      sun.target.updateMatrixWorld();
    }

    updateDust(dt);
    updateCamera(dt);
    updateHUD();
    renderer.render(scene, camera);
    return;
  }
}

/* ================================================================
   EVENT WIRING
   ================================================================ */
$('btn-race').onclick = () => {
  requestFullscreen();
  audio.init(); audio.resume();
  lockLandscape();
  gameState.mp.connected = false;
  startRace('race');
};
$('btn-free').onclick = () => {
  requestFullscreen();
  audio.init(); audio.resume();
  lockLandscape();
  startFree();
};
$('btn-garage').onclick = () => {
  requestFullscreen();
  audio.init();
  gameState.mode = 'garage';
  if (menuCar) { scene.remove(menuCar.group); menuCar = null; }
  showroom.visible = false;
  routeScreen('garage');
  setTimeout(renderGarage, 30);
};

$('btn-garage-back').onclick = () => {
  destroyGarage();
  gameState.mode = 'menu';
  showroom.visible = true;
  refreshMenuCar();
  routeScreen('menu');
};

$('btn-mp').onclick = () => {
  requestFullscreen();
  audio.init();
  gameState.mode = 'mp-menu';
  if (menuCar) { scene.remove(menuCar.group); menuCar = null; }
  showroom.visible = false;
  routeScreen('mp');
  resetMP();
  setMPStatus('Host a race or join with a code');
  $('btn-mp-host').disabled = false;
  $('btn-mp-join').disabled = false;
  $('btn-mp-join').textContent = 'JOIN RACE';
  hideRoomCode();
  $('mp-in').value = '';
};

$('btn-mp-host').onclick = () => { audio.init(); hostMP(); };
$('btn-mp-join').onclick = () => {
  audio.init();
  const inp = $('mp-in');
  if (!inp.classList.contains('on')) {
    inp.classList.add('on');
    inp.focus();
    setMPStatus('Enter the 4-digit code');
    return;
  }
  const code = inp.value.trim();
  if (code.length === 4) joinMP();
};

$('btn-mp-back').onclick = () => {
  resetMP();
  gameState.mode = 'menu';
  showroom.visible = true;
  refreshMenuCar();
  routeScreen('menu');
};

$('btn-res-again').onclick = () => {
  requestFullscreen();
  if (gameState.mp.connected) startRace('mp');
  else if (gameState.mode === 'free') startFree();
  else startRace('race');
};
$('btn-res-menu').onclick = () => {
  gameState.mode = 'menu';
  clearCars();
  raceDecor.visible = false;
  showroom.visible = true;
  resetMP();
  refreshMenuCar();
  routeScreen('menu');
};

$('mp-in').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
});

/* ================================================================
   BOOT
   ================================================================ */
updateCoins();
updateFsBtn();
refreshMenuCar();
showroom.visible = true;
routeScreen('menu');

setTimeout(() => {
  $('loading').classList.add('hide');
  setTimeout(() => { const l = $('loading'); if (l) l.remove(); }, 500);
}, 400);

animate();
</script>
</body>
</html>
