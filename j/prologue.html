<script type="module">

/* ---------- renderer ---------- */

const camera=new THREE.PerspectiveCamera(46,16/9,.05,4000);
const LB=0.87;

let started=false;

/* ---------- materials ---------- */
const toonGrad=(()=>{const t=new THREE.DataTexture(new Uint8Array([70,140,210,255]),4,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();

/* ---------- sky ---------- */

/* ---------- water ---------- */

function makeGround(color1,color2,rough=1){

/* ---------- person factory (from Forest Man) ---------- */
const eyeMat=toon(0x0b0806);
function makePerson(o){

  for(const sx of[-1,1])add(new THREE.SphereGeometry(.016,8,6),eyeMat,head,sx*.048,.02,.125);
  if(o.robe){add(new THREE.CylinderGeometry(.25,.4,1.2,12),toon(o.robe),root,0,.6,0)}
  if(o.cape){const cp=add(new THREE.PlaneGeometry(.5,1.1),toon(o.cape,{side:THREE.DoubleSide}),upper,0,-.1,-.22);cp.rotation.x=.1}

  courtLight.intensity=0;

  updateParticles(snow,dt,showSnow,cp);
  ash.material.color.set(showAsh&&T<4?0x888888:0xbbaa99);

  /* ---- S1: 0–4 BLACK ASH ---- */

  }
  else if(T<10){ /* ---- S2: ESTATE GOLDEN ---- */

  }

    fireMat.uniforms.time.value=T;fireMat.uniforms.alpha.value=sstep(10,11.5,T);

    VILLAGERS.forEach((P,i)=>{const ph=(T-10)*.6+i*1.3;vilS[i]={vis:true,x:-60+Math.cos(ph)*12+i*2,z:-40+Math.sin(ph)*8,ry:ph+PI,walk:1,dist:ph*10}});

    KING.g.visible=true;kingS.vis=true;put(kingS,200,-2,PI);kingS.aL=-.6;kingS.aR=-.6;kingS.hx=.1;

  /* ---- overlays ---- */
  let f=1-sstep(.2,2.5,T);
  f=Math.max(f,1-sstep(0,.35,Math.abs(T-10)));
  f=Math.max(f,1-sstep(0,.35,Math.abs(T-16)));
  f=Math.max(f,1-sstep(0,.35,Math.abs(T-22)));
  f=Math.max(f,1-sstep(0,.35,Math.abs(T-30)));
  f=Math.max(f,1-sstep(0,.35,Math.abs(T-38)));
  f=Math.max(f,sstep(46,48.5,T));
  $('#fade').style.opacity=f;

  /* ---- end title ---- */
  const endOn=T>=47.2;
  $('#end').style.opacity=endOn?1:0;
  $('#titlecard').classList.toggle('on',T>=47.6);
  $('#tagline').classList.toggle('on',T>=48.8);

  /* ---- subtitles + voice ---- */
  while(cueI<CUES.length&&T>=CUES[cueI][0]){const c=CUES[cueI++];$('#sub').textContent=c[1];subEnd=T+c[1].split(' ').length/2.4+.6;say(c[1])}
  const subEl=$('#sub');
  subEl.style.opacity=T<subEnd&&T>0?1:0;subEl.classList.toggle('on',T<subEnd);
}

/* ---------- control ---------- */
function resetState(){T=0;lastShot=-1;cueI=0;subEnd=0;lastStep=-1;lastBar=-1;sunLock=-1;
for(const s of S){s.x=s.z=s.y=s.ry=s.dist=s.walk=0}
$('#sub').style.opacity=0;$('#end').style.opacity=0;
document.querySelectorAll('#end>*').forEach(e=>e.classList.remove('on'));
whisperEl.style.opacity=0;whisperEl.textContent='';
// restore village materials
villageHouses.forEach(v=>{v.h.material.color.set(0xd8c8a0);v.r.material.color.set(0x6a4a2a)});
cp.set(0,420,260);cl.set(0,0,0)}
function start(){started=true;
try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{});
const o=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');o&&o.catch&&o.catch(()=>{})}catch(e){}
layout();if(needPortrait())return;
stage.style.visibility='visible';
audioInit();if(AC&&AC.state==='suspended')AC.resume();
const m=$('#menu');m.style.opacity=0;setTimeout(()=>{if(started)m.style.display='none'},1000);
$('#hud').classList.add('show');resetState();playing=true;last=performance.now()}
function stop(){playing=false;started=false;window.speechSynthesis&&speechSynthesis.cancel();
if(AC){try{AC.close()}catch(e){}AC=null}
stage.style.visibility='hidden';$('#hud').classList.remove('show');
const m=$('#menu');m.style.display='flex';requestAnimationFrame(()=>m.style.opacity=1);
if(document.fullscreenElement){const r=document.exitFullscreen();r&&r.catch&&r.catch(()=>{})}
layout()}
$('#watch').onclick=start;
$('#exit').onclick=stop;
$('#snd').onclick=()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'🔊':'🔇';if(!soundOn){window.speechSynthesis&&speechSynthesis.cancel();if(mg)mg.gain.value=0}else if(mg)mg.gain.value=.8};
function frame(now){requestAnimationFrame(frame);if(!playing)return;
dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
if(T>=TOTAL){T=TOTAL-.01;playing=false;setTimeout(stop,4000)}
update();audio();renderer.render(scene,camera)}
layout();requestAnimationFrame(frame);
</script>
</body>
