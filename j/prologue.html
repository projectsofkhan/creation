<script type="module">
import * as THREE from 'three';
const $=s=>document.querySelector(s);
const canvas=$('#c'),stage=$('#stage');
const touch=matchMedia('(pointer:coarse)').matches;
const TOTAL=50;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const E=u=>u*u*(3-2*u);
const C=h=>new THREE.Color(h);
let _s=1337;const rnd=()=>((_s=(_s*16807)%2147483647)-1)/2147483646;
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v};
const gY=(x,z)=>.4*Math.sin(x*.15)*Math.cos(z*.13)-.25;

/* ========== renderer ========== */
const renderer=new THREE.WebGLRenderer({canvas,antialias:!touch,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,touch?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xd8c9a0,.0011);
const camera=new THREE.PerspectiveCamera(46,16/9,.05,4000);
const LB=0.87;

let started=false;
function needPortrait(){return started&&touch&&innerHeight>innerWidth}
function layout(){
  const W=innerWidth,H=innerHeight;
  $('#rot').classList.toggle('show',needPortrait());
  const portrait=H>W;
  const w=portrait?H:W,h=portrait?W:H;
  if(portrait&&touch){stage.style.width=w+'px';stage.style.height=h+'px';stage.style.transform=`translate(${W}px,0) rotate(90deg)`}
  else{stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform='none'}
  renderer.setSize(w,h,false);
  camera.aspect=w/(h*LB);camera.updateProjectionMatrix();
  camera.setViewOffset(w,h*LB,0,h*(1-LB)*.5,w,h*LB);
}
addEventListener('resize',layout);

/* ========== materials ========== */
const toonGrad=(()=>{const t=new THREE.DataTexture(new Uint8Array([70,140,210,255]),4,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const toon=(c,o={})=>new THREE.MeshToonMaterial({color:c,gradientMap:toonGrad,...o});
const spriteTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

/* ========== sky ========== */
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:C(0x3d84c8)},hor:{value:C(0xf2dfb4)},sunDir:{value:new THREE.Vector3(0,1,0)},sunCol:{value:C(0xffffff)},cloudCol:{value:C(0xffffff)},time:{value:0},cloud:{value:.3}},
  vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vD;uniform vec3 top,hor,sunDir,sunCol,cloudCol;uniform float time,cloud;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p*=2.02;a*=.5;}return s;}
void main(){vec3 d=normalize(vD);float y=max(d.y,0.);vec3 col=mix(hor,top,pow(y,.55));
float sd=max(dot(d,sunDir),0.);col+=sunCol*(pow(sd,600.)*4.+pow(sd,14.)*.4+pow(sd,3.)*.12);
if(d.y>0.){vec2 uv=d.xz/(max(d.y,0.05)+.12)*1.2+vec2(time*.01,time*.004);float c=fb(uv*1.3);float cov=smoothstep(1.-cloud,1.-cloud+.28,c)*smoothstep(0.,.12,d.y);vec3 cc=cloudCol*(.75+.5*pow(sd,2.));col=mix(col,cc,cov*.9);}
else col=mix(hor,hor*.7,clamp(-d.y*3.,0.,1.));
gl_FragColor=vec4(col,1.);
#include <tonemapping_fragment>
#include <colorspace_fragment>
}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),skyMat);sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);

/* ========== water ========== */
function makeWater(alpha){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:{time:{value:0},alpha:{value:alpha},fogD:{value:.001},sunDir:{value:new THREE.Vector3()},sunCol:{value:new THREE.Color()},hor:{value:new THREE.Color()},top:{value:new THREE.Color()},fogCol:{value:new THREE.Color()},deepCol:{value:C(0x2c3a3a)},shallowCol:{value:C(0x5a7a6a)}},
  vertexShader:`varying vec3 wp;void main(){vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform float time,alpha,fogD;uniform vec3 sunDir,sunCol,hor,top,fogCol,deepCol,shallowCol;varying vec3 wp;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
void main(){vec2 p=wp.xz;vec2 fp=p+vec2(time*.55,time*.12);
float n1=fb(fp*.35),n2=fb(fp*1.1+vec2(3.,7.));float e=.08;
float dx=(fb(fp*.35+vec2(e,0.))-n1)/e,dz=(fb(fp*.35+vec2(0.,e))-n1)/e;
vec3 nrm=normalize(vec3(-dx*.08,1.,-dz*.08));

vec3 skyc=mix(hor,top,clamp(reflect(-V,nrm).y,0.,1.)*.8);
float sl=clamp(.5+.5*n2,0.,1.);

vec3 col=mix(body,skyc,clamp(.1+fr*.82,0.,1.));
vec3 R=reflect(-sunDir,nrm);col+=sunCol*pow(max(dot(R,V),0.),180.)*2.4;

#include <tonemapping_fragment>
#include <colorspace_fragment>
}`})}
const waterMat=makeWater(1);
const waterGeo=new THREE.PlaneGeometry(4000,4000);waterGeo.rotateX(-Math.PI/2);
const water=new THREE.Mesh(waterGeo,waterMat);water.renderOrder=1;scene.add(water);

/* ========== grounds ========== */
function makeGround(c1,c2){
  const g=new THREE.PlaneGeometry(400,200,80,40);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=.4*Math.sin(x*.15)*Math.cos(z*.13)-.25;p.setY(i,h);
    const n=vn(x*.2,z*.2);col.set([lerp(c1[0],c2[0],n),lerp(c1[1],c2[1],n),lerp(c1[2],c2[2],n)],i*3)}

  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}))}
const SOUTH=[.62,.55,.36],SOUTH2=[.78,.7,.5];
const NORTH=[.55,.6,.62],NORTH2=[.72,.76,.78];
const BURNT=[.14,.12,.11],BURNT2=[.28,.24,.22];
const groundS=makeGround(SOUTH,SOUTH2);groundS.receiveShadow=true;scene.add(groundS);
const groundN=makeGround(NORTH,NORTH2);groundN.receiveShadow=true;groundN.visible=false;scene.add(groundN);
const groundB=makeGround(BURNT,BURNT2);groundB.receiveShadow=true;groundB.visible=false;scene.add(groundB);

/* ========== lights ========== */
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x8a7550,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,3);sun.castShadow=true;
sun.shadow.mapSize.set(touch?1024:2048,touch?1024:2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:400});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.3;scene.add(sun,sun.target);

/* ========== mood system ========== */
const M=(t,el,az,si,sc,top,hor,fog,fd,hi,ex,cl,cc,rain)=>({t,el,az,si,sc:C(sc),top:C(top),hor:C(hor),fog:C(fog),fd,hi,ex,cl,cc:C(cc),rain});
const MK=[
M(0,30,240,.8,0x806040,0x1a1a20,0x2a2420,0x1a1814,.006,.2,.75,1,0x2a2420,0),
M(3.5,35,220,3.4,0xffd8a0,0x4a88c4,0xf0d0a0,0xe0c898,.0012,.9,1.05,.3,0xffe8d0,0),
M(11,25,240,1.2,0xff8850,0x2a3a5a,0xc86040,0x7a3a28,.0028,.4,.95,.9,0xffa060,0),
M(15,20,240,.6,0xff6030,0x101828,0x8a3020,0x3a1810,.0045,.2,.8,1,0x402020,0),
M(17,35,240,1.6,0xb8c8d8,0x2a3440,0x5a6470,0x4a545e,.0032,.35,1,1,0x3a4048,0),
M(22,30,240,1.4,0xa8b8c8,0x3a4450,0x6a7078,0x5a6068,.0045,.3,.95,1,0x505860,.4),
M(29,20,240,2.6,0xffc890,0x4a5a70,0xd89060,0xb08058,.0022,.6,1.05,.6,0xffc890,0),
M(36,15,250,1.2,0xa09080,0x2a2a30,0x5a5048,0x403830,.005,.3,.8,1,0x302820,0),
M(42,40,260,2.2,0x9aacbc,0x3a5060,0x708090,0x607080,.0035,.6,1,.7,0x8098a8,0),
M(46,60,260,2.6,0xd0d8e0,0x30506a,0x6090b0,0x507888,.0025,.7,1.05,.4,0x90b0c0,0)];
const mood={sc:new THREE.Color(),top:new THREE.Color(),hor:new THREE.Color(),fog:new THREE.Color(),cc:new THREE.Color()};
const sunDir=new THREE.Vector3();
const _sd=new THREE.Vector3(),_sdl=new THREE.Vector3();let sunLock=-1;
function applyMood(T){
  let i=0;while(i<MK.length-2&&T>=MK[i+1].t)i++;
  const a=MK[i],b=MK[i+1],u=sstep(a.t,b.t,T);
  for(const k of['el','az','si','fd','hi','ex','cl','rain'])mood[k]=lerp(a[k],b[k],u);
  for(const k of['sc','top','hor','fog','cc'])mood[k].copy(a[k]).lerp(b[k],u);
  const el=mood.el*Math.PI/180,az=mood.az*Math.PI/180;
  _sd.set(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));
  if(i!==sunLock){sunLock=i;_sdl.copy(_sd)}
  sunDir.copy(_sdl).lerp(_sd,.02);
  sun.color.copy(mood.sc);sun.intensity=mood.si;
  hemi.color.copy(mood.top).lerp(new THREE.Color(1,1,1),.35);hemi.intensity=mood.hi;
  scene.fog.color.copy(mood.fog);scene.fog.density=mood.fd;
  renderer.toneMappingExposure=mood.ex;
  const su=skyMat.uniforms;su.top.value.copy(mood.top);su.hor.value.copy(mood.hor);su.sunDir.value.copy(sunDir);su.sunCol.value.copy(mood.sc);su.cloudCol.value.copy(mood.cc);su.cloud.value=mood.cl;su.time.value=T;
  const w=waterMat.uniforms;w.time.value=T;w.fogD.value=mood.fd;w.sunDir.value.copy(sunDir);w.sunCol.value.copy(mood.sc);w.hor.value.copy(mood.hor);w.top.value.copy(mood.top);w.fogCol.value.copy(mood.fog);
}

/* ========== character ========== */
const eyeMat=toon(0x0b0806);
function makePerson(o){
  const P={seed:rnd()*6,o};const g=new THREE.Group();P.g=g;
  const root=new THREE.Group();g.add(root);P.root=root;
  const upper=new THREE.Group();upper.position.y=.78;root.add(upper);P.upper=upper;
  const skin=toon(o.skin),shirt=toon(o.shirt),pants=toon(o.pants),hair=toon(o.hair);
  const add=(geo,mat,par,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;par.add(m);return m};
  const torso=add(new THREE.CapsuleGeometry(.19,.36,4,12),shirt,upper,0,.34,0);torso.scale.set(1.12,1,.78);
  add(new THREE.CylinderGeometry(.055,.065,.14,8),skin,upper,0,.76,0);
  const head=new THREE.Group();head.position.y=.9;upper.add(head);P.head=head;
  const hm=add(new THREE.SphereGeometry(.135,20,16),skin,head);hm.scale.set(.92,1.1,1);
  const hr=add(new THREE.SphereGeometry(.142,20,12,0,Math.PI*2,0,Math.PI*.58),hair,head,0,.018,-.01);hr.rotation.x=-.28;
  for(const sx of[-1,1])add(new THREE.SphereGeometry(.016,8,6),eyeMat,head,sx*.048,.02,.125);
  add(new THREE.SphereGeometry(.02,8,6),skin,head,0,-.01,.135);
  if(o.robe){add(new THREE.CylinderGeometry(.28,.46,1.25,14),toon(o.robe),root,0,.6,0)}
  if(o.cape){const cp=add(new THREE.PlaneGeometry(.55,1.15),toon(o.cape,{side:THREE.DoubleSide}),upper,0,-.15,-.24);cp.rotation.x=.08}
  const limb=(par,x,y,len,r,mat)=>{const pv=new THREE.Group();pv.position.set(x,y,0);par.add(pv);add(new THREE.CapsuleGeometry(r,len,4,8),mat,pv,0,-(len/2+r*.8),0);return pv};
  P.legL=limb(root,-.1,.78,.62,.085,pants);P.legR=limb(root,.1,.78,.62,.085,pants);
  P.armL=limb(upper,-.27,.62,.44,.055,shirt);P.armR=limb(upper,.27,.62,.44,.055,shirt);
  for(const a of[P.armL,P.armR])add(new THREE.SphereGeometry(.05,10,8),skin,a,0,-.55,0);
  for(const l of[P.legL,P.legR])add(new THREE.BoxGeometry(.1,.05,.22),skin,l,0,-.75,.05);
  g.scale.setScalar(o.scale||1);P.stoop=o.stoop||0;scene.add(g);return P}
function pose(P,s,T){
  P.g.visible=!!s.vis;if(!s.vis)return;
  const k=s.kneel||0,ph=(s.dist||0)*3.6,swA=Math.sin(ph)*.75;
  P.g.position.set(s.x,s.y,s.z);P.g.rotation.y=s.ry;
  P.legL.rotation.x=k>0?lerp(swA,-1.05,k):swA;P.legR.rotation.x=k>0?lerp(-swA,1.55,k):-swA;
  P.root.position.y=Math.abs(Math.cos(ph))*.025-.35*k+Math.sin(T*1.4+P.seed)*.008;
  P.upper.rotation.x=k*.42+P.stoop+Math.sin(T*1.1+P.seed)*.008;
  P.armL.rotation.x=(s.aL!==undefined?s.aL:-swA*.8)+Math.sin(T*.9+P.seed)*.05;
  P.armR.rotation.x=(s.aR!==undefined?s.aR:swA*.8)-Math.sin(T*.9+P.seed)*.05;
  P.armL.rotation.z=-.08;P.armR.rotation.z=.08;
  P.head.rotation.x=(s.hx||0)+Math.sin(T*.7+P.seed)*.02;
  P.head.rotation.y=(s.hy||0)+Math.sin(T*.55+P.seed*1.3)*.05}

const PI=Math.PI;
const FERIS=makePerson({skin:0x9a6a46,shirt:0x8a7a6a,pants:0x5a4a3a,hair:0x1a1210,scale:.9});

  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({map:spriteTex,color,size,transparent:true,opacity:.8,depthWrite:false});
  const p=new THREE.Points(g,m);p.userData={count,vy,wind};p.frustumCulled=false;return p}

function updateParticles(p,dt,active,center){

  for(let i=0;i<v.count;i++){a[i*3]+=Math.sin(T+i)*.01*v.wind+dt*.1;

let voiceReady=false,voice=null;
function pickVoice(){
  if(!window.speechSynthesis)return;
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return;
  voice=vs.find(v=>/en[-_]IN/i.test(v.lang)&&/female/i.test(v.name))
    ||vs.find(v=>/en[-_]IN/i.test(v.lang))
    ||vs.find(v=>/en[-_]GB/i.test(v.lang))
    ||vs.find(v=>/^en/i.test(v.lang))
    ||vs[0];
  voiceReady=true;
}
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged=pickVoice;
  pickVoice();
}
const said=new Set();
function speakOnce(i){
  if(said.has(i))return;
  said.add(i);
  const line=NARR[i];
  $('#sub').textContent=line.text;
  $('#sub').classList.add('on');
  subEnd=line.end;
  if(!soundOn||!window.speechSynthesis)return;
  try{
    const u=new SpeechSynthesisUtterance(line.text);
    u.rate=.92;u.pitch=.8;u.volume=1;
    if(voice)u.voice=voice;
    u.onerror=()=>{};
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ========== audio bed ========== */
let AC=null,mg,windG,fireA,padG,padF,pads=[],lastStep=-1,lastBar=-1;
const CH=[[50,53,57],[48,52,55],[45,48,52],[50,53,57]];
const mf=n=>440*Math.pow(2,(n-69)/12);
function audioInit(){
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.gain.value=.75;mg.connect(AC.destination);
    const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const mkN=(f,q,type)=>{const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(mg);s.start();return g};
    windG=mkN(280,.4,'lowpass');fireA=mkN(900,.5,'bandpass');
    padF=AC.createBiquadFilter();padF.type='lowpass';padF.frequency.value=600;
    padG=AC.createGain();padG.gain.value=0;padF.connect(padG);padG.connect(mg);
    pads=[];
    for(let i=0;i<4;i++){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=200;o.detune.value=(i-1.5)*6;o.connect(padF);o.start();pads.push(o)}
  }catch(e){AC=null}
}
function tone(f,v,d){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function audio(){
  if(!AC||!soundOn)return;
  const t=AC.currentTime;
  const intensity=sstep(0,20,T)*.6+sstep(30,50,T)*.4;
  mg.gain.setTargetAtTime(.75*(1-sstep(48,50,T)),t,.3);
  windG.gain.setTargetAtTime(T<11?.06:T<17?.02:T<29?.04:.05,t,.5);
  fireA.gain.setTargetAtTime(T>11&&T<17?.16:T>36&&T<42?.1:0,t,.3);
  padG.gain.setTargetAtTime(.012+.05*intensity,t,.8);
  padF.frequency.setTargetAtTime(400+1200*intensity,t,.5);
  const bar=Math.floor(T/3.5)%4,step=Math.floor(T/1.75);
  if(bar!==lastBar){lastBar=bar;pads.forEach((o,i)=>o.frequency.setTargetAtTime(mf(CH[bar][i%3]-12+(i===3?12:0)),t,.5))}
  if(step!==lastStep){lastStep=step;if(T>2&&T<46)tone(mf(CH[bar][step%3]+12),.05+.03*intensity,1.8)}
}

  for(const s of [ferS,joeS,kingS,mercS,dauS,...solS,...vilS]){s.vis=false;s.aL=s.aR=s.hx=s.hy=s.kneel=undefined}

  fireLight.intensity=0;courtLight.intensity=0;
  const showAsh=T<3.5||(T>=42&&T<46),showEmbers=T>=11&&T<17,showSnow=T>=17&&T<29;
  updateParticles(ash,dt,showAsh,cp);

    if(T>46.8){$('#whisper').textContent='just like a whisper';$('#whisper').style.opacity=sstep(46.8,47.8,T);$('#whisper').style.color='#efe0c8'}
  }

  pose(FERIS,ferS,T);pose(JOIE,joeS,T);pose(KING,kingS,T);pose(MERCHANT,mercS,T);pose(DAUGHTER,dauS,T);
  SOLDIERS.forEach((P,i)=>pose(P,solS[i],T));VILLAGERS.forEach((P,i)=>pose(P,vilS[i],T));

  sun.target.position.set(cl.x,0,cl.z);sun.position.set(cl.x,0,cl.z).addScaledVector(sunDir,200);
  camera.position.copy(cp);camera.lookAt(cl);

  /* overlays */
  let f=1-sstep(.1,2,T);
  for(const b of[11,17,22,29,36,42])f=Math.max(f,1-sstep(0,.35,Math.abs(T-b)));
  f=Math.max(f,sstep(46,48,T));
  $('#fade').style.opacity=f;

  const endOn=T>=47.2;
  $('#end').style.opacity=endOn?1:0;
  $('#titlecard').classList.toggle('on',T>=47.6);
  $('#tagline').classList.toggle('on',T>=48.8);

  /* narration trigger */
  for(let i=0;i<NARR.length;i++){
    if(T>=NARR[i].t&&T<=NARR[i].end+0.05&&!said.has(i))speakOnce(i);
  }
  const showSub=T<subEnd&&T>0.5;
  $('#sub').style.opacity=showSub?1:0;
  $('#sub').classList.toggle('on',showSub);
}

/* ========== control ========== */
function resetState(){
  T=0;lastShot=-1;subEnd=0;lastStep=-1;lastBar=-1;sunLock=-1;
  said.clear();
  try{speechSynthesis.cancel()}catch(e){}
  for(const s of [ferS,joeS,kingS,mercS,dauS,...solS,...vilS]){s.x=s.z=s.y=s.ry=s.dist=s.walk=0}
  $('#sub').style.opacity=0;$('#end').style.opacity=0;
  document.querySelectorAll('#end>*').forEach(e=>e.classList.remove('on'));
  $('#whisper').style.opacity=0;$('#whisper').textContent='';
  villageHouses.forEach(v=>{v.h.material.color.set(0xd8c8a0);v.r.material.color.set(0x6a4a2a)});
  cp.set(0,420,260);cl.set(0,0,0);
}
function start(){
  started=true;
  try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{})}catch(e){}
  try{const o=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');o&&o.catch&&o.catch(()=>{})}catch(e){}
  layout();
  if(needPortrait())return;
  stage.style.visibility='visible';
  if(!AC)audioInit();
  if(AC&&AC.state==='suspended')AC.resume();
  try{pickVoice()}catch(e){}
  const m=$('#menu');m.style.opacity=0;setTimeout(()=>{if(started)m.style.display='none'},1000);
  $('#hud').classList.add('show');
  resetState();playing=true;last=performance.now();
}
function stop(){
  playing=false;started=false;
  try{speechSynthesis.cancel()}catch(e){}
  if(AC){try{AC.close()}catch(e){}AC=null}
  stage.style.visibility='hidden';$('#hud').classList.remove('show');
  const m=$('#menu');m.style.display='flex';requestAnimationFrame(()=>m.style.opacity=1);
  if(document.fullscreenElement){const r=document.exitFullscreen();r&&r.catch&&r.catch(()=>{})}
  layout();
}
$('#watch').onclick=start;
$('#exit').onclick=stop;
$('#snd').onclick=()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'🔊':'🔇';if(!soundOn){try{speechSynthesis.cancel()}catch(e){}if(mg)mg.gain.value=0}else{if(mg)mg.gain.value=.75;if(AC&&AC.resume)AC.resume()}};

function frame(now){
  requestAnimationFrame(frame);
  if(!playing)return;
  dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(T>=TOTAL){T=TOTAL-.01;playing=false;setTimeout(stop,3500)}
  update();audio();renderer.render(scene,camera);
}
layout();requestAnimationFrame(frame);
</script>
