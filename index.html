<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Verdant Vale — Realistic Farm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2a1a; font-family: 'Georgia', serif; color: #f0f0e8; }
    canvas { display: block; }

    /* Loader */
    #loader {
      position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #3a5a3a 0%, #1a2a1a 70%, #0a1a0a 100%);
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    #loader.hide { opacity: 0; visibility: hidden; }
    #loader .icon { font-size: 64px; margin-bottom: 24px; animation: pulse 2.5s ease-in-out infinite; filter: drop-shadow(0 0 24px rgba(180, 255, 160, 0.5)); }
    @keyframes pulse { 0%,100%{transform:scale(1) rotate(-5deg)} 50%{transform:scale(1.12) rotate(5deg)} }
    #loader .title { font-size: 26px; letter-spacing: 12px; color: #c8e8b0; margin-bottom: 36px; text-shadow: 0 0 30px rgba(180,255,160,0.4); }
    #loader .bar { width: min(300px, 72vw); height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
    #loader .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #5a9a5a, #a8e08c, #d8ffb8); transition: width 0.4s ease; box-shadow: 0 0 20px rgba(180,255,160,0.6); }
    #loader .status { font-size: 10px; letter-spacing: 4px; opacity: 0.55; text-transform: uppercase; }

    /* Main Menu */
    #menu {
      position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #4a7a4a 0%, #2a4a2a 50%, #0a1a0a 100%);
      transition: opacity 1s ease, visibility 1s; padding: 20px;
    }
    #menu.hide { opacity: 0; visibility: hidden; }
    #menu .sun { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,240,180,0.6) 0%, transparent 70%); top: -80px; right: -80px; filter: blur(20px); }
    #menu .glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 45%, transparent 30%, rgba(10,20,10,0.7) 90%); }
    #menu h1 {
      position: relative; font-size: clamp(44px, 11vw, 92px); letter-spacing: clamp(8px, 2.5vw, 20px);
      color: #f0f0e0; text-shadow: 0 4px 40px rgba(0,0,0,0.8), 0 0 80px rgba(180,255,160,0.3);
      margin-bottom: 8px; line-height: 1; font-weight: 400;
    }
    #menu .sub { font-size: clamp(11px, 2.4vw, 15px); letter-spacing: clamp(4px, 1.2vw, 8px); color: #b8d8a0; font-style: italic; margin-bottom: 50px; opacity: 0.85; }

    #playBtn {
      position: relative; padding: clamp(18px, 4vw, 24px) clamp(60px, 16vw, 100px);
      font-size: clamp(18px, 4vw, 26px); letter-spacing: clamp(6px, 2vw, 12px);
      font-family: 'Georgia', serif; text-transform: uppercase; font-weight: bold;
      background: linear-gradient(180deg, #d4f0b8 0%, #7ac86c 40%, #4a9a4a 100%);
      color: #0a2410; border: none; border-radius: 80px; cursor: pointer;
      box-shadow: 0 10px 0 #2a5a2a, 0 20px 50px rgba(0,0,0,0.6), 0 0 80px rgba(180,255,160,0.4),
                  inset 0 3px 8px rgba(255,255,255,0.8), inset 0 -5px 12px rgba(0,0,0,0.25);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s ease;
      overflow: hidden; will-change: transform; z-index: 2;
    }
    #playBtn:hover { transform: scale(1.06) translateY(-3px); }
    #playBtn:active { transform: scale(0.94) translateY(8px); box-shadow: 0 2px 0 #2a5a2a, 0 8px 20px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.7); }
    #playBtn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
      transform: translateX(-100%); animation: shine 3.5s ease-in-out infinite;
    }
    @keyframes shine { 0%{transform:translateX(-100%)} 60%,100%{transform:translateX(100%)} }

    /* HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 1s ease 0.3s; }
    #hud.show { opacity: 1; }
    #hud .top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
    .pill {
      background: rgba(10, 30, 18, 0.7); border: 1px solid rgba(180, 255, 160, 0.25);
      border-radius: 20px; padding: 6px 14px; font-size: 13px; letter-spacing: 0.5px;
      backdrop-filter: blur(10px); display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .pill .ico { font-size: 15px; }
    .pill b { color: #d0ffb0; font-weight: normal; }

    /* Hotbar */
    #hotbar { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
    .slot {
      width: clamp(50px, 12vw, 62px); height: clamp(50px, 12vw, 62px);
      background: rgba(10, 30, 18, 0.7); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: clamp(18px, 4vw, 24px); cursor: pointer; position: relative;
      transition: all 0.15s ease; backdrop-filter: blur(10px); user-select: none;
    }
    .slot:active { transform: scale(0.9); }
    .slot.active { background: rgba(120, 220, 120, 0.55); border-color: #d8ffb0; box-shadow: 0 0 24px rgba(200,255,160,0.9), inset 0 0 10px rgba(255,255,255,0.3); transform: translateY(-4px); }
    .slot .lbl { position: absolute; bottom: 2px; font-size: 8px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; }
    .slot .cnt { position: absolute; top: 2px; right: 6px; font-size: 10px; font-weight: bold; color: #ffe27a; }

    /* Toast */
    #toast {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 70px); left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(10, 30, 18, 0.92); border: 1px solid rgba(200, 255, 160, 0.5);
      color: #e8ffd0; padding: 10px 24px; border-radius: 22px; font-size: 13px;
      letter-spacing: 1px; opacity: 0; transition: all 0.3s ease; pointer-events: none;
      white-space: nowrap; box-shadow: 0 6px 30px rgba(0,0,0,0.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Shop */
    #shop {
      position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); right: 16px;
      width: 220px; pointer-events: auto; background: rgba(10, 30, 18, 0.85);
      border: 1px solid rgba(255, 226, 122, 0.4); border-radius: 14px;
      padding: 14px 16px; backdrop-filter: blur(14px); font-size: 12px; display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #shop.open { display: block; }
    #shop h3 { color: #ffe27a; letter-spacing: 2px; font-size: 11px; margin-bottom: 10px; text-transform: uppercase; font-weight: normal; }
    .shop-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 4px; cursor: pointer; border-radius: 6px; }
    .shop-item:active { background: rgba(200, 255, 180, 0.15); }
    .shop-item .price { color: #ffe27a; }

    /* Orientation hint */
    #rotate {
      position: fixed; inset: 0; z-index: 2500; background: rgba(10, 20, 10, 0.98);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px; color: #f0f0e0;
    }
    #rotate.show { display: flex; }
    #rotate .ico { font-size: 64px; margin-bottom: 20px; animation: rotateIcon 2s ease-in-out infinite; }
    @keyframes rotateIcon { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)} }
    #rotate p { font-size: 14px; letter-spacing: 2px; opacity: 0.9; max-width: 280px; line-height: 1.6; }

    /* Vignette */
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 50; background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%); mix-blend-mode: multiply; }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="icon">🌿</div>
    <div class="title">VERDANT VALE</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="status" id="loadStatus">initializing…</div>
  </div>

  <!-- Main Menu -->
  <div id="menu" style="display:none">
    <div class="sun"></div>
    <div class="glow"></div>
    <h1>VERDANT VALE</h1>
    <div class="sub">a realistic farming experience</div>
    <button id="playBtn">Play</button>
  </div>

  <!-- Rotate hint -->
  <div id="rotate">
    <div class="ico">📱</div>
    <p>Please rotate your device to portrait for the best experience</p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="top">
      <div class="pill"><span class="ico">🪙</span><b id="coins">0</b></div>
      <div class="pill"><span class="ico">🌾</span><b id="crops">0</b></div>
      <div class="pill"><span class="ico">💧</span><b id="water">10</b></div>
    </div>
    <div id="hotbar"></div>
    <div id="toast"></div>
    <div id="shop">
      <h3>🌱 Market</h3>
      <div class="shop-item" data-buy="seed">🍅 Tomato Seed <span class="price">5🪙</span></div>
      <div class="shop-item" data-buy="water">💧 Water Refill <span class="price">3🪙</span></div>
    </div>
  </div>

  <div id="vignette"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/": "https://esm.sh/three@0.160.0/"
    }
  }
  </script>

  <script type="module" src="./script.js"></script>
</body>
</html>
