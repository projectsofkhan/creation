<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
  <title>Bleach 3D: Getsuga Tensho</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial Black', 'Impact', sans-serif;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #ffaa00;
      text-shadow: 0 0 20px #ff5500, 0 0 40px #aa0000;
      font-size: 24px;
      letter-spacing: 4px;
      pointer-events: none;
      z-index: 100;
      transform: skewX(-10deg);
    }
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 10px;
      pointer-events: none;
      z-index: 200;
    }
    .btn {
      width: 80px;
      height: 80px;
      background: rgba(10, 10, 20, 0.8);
      border: 2px solid #ff5500;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 0 20px #ff5500, inset 0 0 20px #ff5500;
      transition: all 0.1s ease;
      cursor: pointer;
      color: white;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 10px #ff5500;
    }
    .btn:active {
      transform: scale(0.9);
      box-shadow: 0 0 40px #ffaa00, inset 0 0 30px #ffaa00;
    }
    .btn svg {
      width: 40px;
      height: 40px;
      fill: #ffaa00;
      filter: drop-shadow(0 0 10px #ff5500);
    }
    #toggle-cam {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: rgba(20, 0, 0, 0.9);
      border: 2px solid #ff0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 300;
      box-shadow: 0 0 30px #ff0000;
      cursor: pointer;
    }
    #toggle-cam svg {
      width: 35px;
      height: 35px;
      fill: #ff4444;
    }
    #health-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 20px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #ff0000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px #ff0000;
      z-index: 150;
    }
    #health-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ffaa00);
      transition: width 0.2s;
    }
    #enemy-health {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 15px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #aa00ff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px #aa00ff;
      z-index: 150;
    }
    #enemy-health-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #aa00ff, #ff00aa);
      transition: width 0.2s;
    }
    .char-name {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffaa00;
      font-size: 14px;
      text-shadow: 0 0 20px #ff0000;
      letter-spacing: 2px;
      z-index: 150;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="info">BLEACH 3D</div>
  <div id="health-bar"><div id="health-fill"></div></div>
  <div id="enemy-health"><div id="enemy-health-fill"></div></div>
  <div class="char-name" id="char-name-display">ICHIGO KUROSAKI</div>

  <div id="toggle-cam">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
  </div>

  <div id="ui-container">
    <div class="btn" id="btn-slash">
      <svg viewBox="0 0 24 24">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
      </svg>
      SLASH
    </div>
    <div class="btn" id="btn-power-slash">
      <svg viewBox="0 0 24 24">
        <path d="M14.06 9.02l.92.92L5.92 19H5v-.92l9.06-9.06M17.66 3c-.25 0-.51.1-.7.29l-1.83 1.83 3.75 3.75 1.83-1.83c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.2-.2-.45-.29-.71-.29zm-3.6 3.19L3 17.25V21h3.75L17.81 9.94l-3.75-3.75z"/>
      </svg>
      PWR SLASH
    </div>
    <div class="btn" id="btn-getsuga">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        <path d="M12 6l-2 4h4z" fill="#ffaa00"/>
      </svg>
      GETSUGA
    </div>
    <div class="btn" id="btn-bankai">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      BANKAI
    </div>
    <div class="btn" id="btn-hollow">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
      </svg>
      HOLLOW
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    // --- INITIALIZATION ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.002);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 8, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // --- POST PROCESSING (BLOOM) ---
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.1;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(10, 20, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0x4466ff, 0.5);
    fillLight.position.set(-5, 5, 10);
    scene.add(fillLight);

    // Dynamic lights for effects
    const getsugaLight = new THREE.PointLight(0xff2200, 0, 50);
    scene.add(getsugaLight);
    const bankaiLight = new THREE.PointLight(0xaa00ff, 0, 30);
    scene.add(bankaiLight);
    const hollowLight = new THREE.PointLight(0xff0000, 0, 30);
    scene.add(hollowLight);

    // --- WORLD CREATION ---
    // Ground with texture-like material
    const groundGeometry = new THREE.CircleGeometry(200, 64);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1a2e,
      roughness: 0.8,
      metalness: 0.2,
      emissive: new THREE.Color(0x0a0a1a)
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Create a grid-like energy field effect
    const gridHelper = new THREE.GridHelper(200, 40, 0xff5500, 0x440000);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // Floating particles
    const particleCount = 2000;
    const particles = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 200;
      particlePositions[i+1] = Math.random() * 40;
      particlePositions[i+2] = (Math.random() - 0.5) * 200;
    }
    particles.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMaterial = new THREE.PointsMaterial({
      color: 0xffaa00,
      size: 0.15,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(particles, particleMaterial);
    scene.add(particleSystem);

    // Distant mountains / structures
    for (let i = 0; i < 20; i++) {
      const height = 5 + Math.random() * 15;
      const geom = new THREE.ConeGeometry(3 + Math.random() * 5, height, 5);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x1a1a3a,
        emissive: new THREE.Color(0x0a0a2a),
        roughness: 0.9,
        metalness: 0.1
      });
      const mountain = new THREE.Mesh(geom, mat);
      const angle = (i / 20) * Math.PI * 2;
      const radius = 80 + Math.random() * 40;
      mountain.position.set(Math.cos(angle) * radius, height / 2, Math.sin(angle) * radius);
      mountain.receiveShadow = true;
      mountain.castShadow = true;
      scene.add(mountain);
    }

    // --- CHARACTER CREATION ---
    // Since we can't load external models reliably, we'll build stylized characters with primitives

    // ICHIGO (Hero)
    const ichigoGroup = new THREE.Group();

    // Body (Shihakusho)
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.1 });
    const bodyGeom = new THREE.CylinderGeometry(0.8, 1.0, 2.2, 8);
    const body = new THREE.Mesh(bodyGeom, bodyMat);
    body.position.y = 1.1;
    body.castShadow = true;
    body.receiveShadow = true;
    ichigoGroup.add(body);

    // Head
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.4 });
    const headGeom = new THREE.SphereGeometry(0.55, 16, 16);
    const head = new THREE.Mesh(headGeom, headMat);
    head.position.y = 2.6;
    head.castShadow = true;
    ichigoGroup.add(head);

    // Hair (Orange)
    const hairMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: new THREE.Color(0x331100), roughness: 0.7 });
    const hairGeom = new THREE.SphereGeometry(0.6, 8, 8);
    const hair = new THREE.Mesh(hairGeom, hairMat);
    hair.position.y = 2.75;
    hair.scale.set(1.1, 0.7, 1.1);
    hair.castShadow = true;
    ichigoGroup.add(hair);
    // Hair spikes
    for (let i = 0; i < 8; i++) {
      const spikeGeom = new THREE.ConeGeometry(0.15, 0.5, 4);
      const spike = new THREE.Mesh(spikeGeom, hairMat);
      const angle = (i / 8) * Math.PI * 2;
      spike.position.set(Math.cos(angle) * 0.5, 2.95 + Math.random() * 0.2, Math.sin(angle) * 0.5);
      spike.rotation.z = Math.cos(angle) * 0.5;
      spike.rotation.x = Math.sin(angle) * 0.5;
      spike.castShadow = true;
      ichigoGroup.add(spike);
    }

    // Arms
    const armMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 6), armMat);
    leftArm.position.set(-0.9, 1.8, 0);
    leftArm.rotation.z = 0.3;
    leftArm.castShadow = true;
    ichigoGroup.add(leftArm);
    const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 6), armMat);
    rightArm.position.set(0.9, 1.8, 0);
    rightArm.rotation.z = -0.3;
    rightArm.castShadow = true;
    ichigoGroup.add(rightArm);

    // Zanpakuto (Sword) - Zangetsu
    const swordGroup = new THREE.Group();
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, emissive: new THREE.Color(0x220000), metalness: 0.9, roughness: 0.1 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.05), bladeMat);
    blade.position.y = 1.25;
    blade.castShadow = true;
    swordGroup.add(blade);
    // Edge glow
    const edgeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: new THREE.Color(0xff0000), transparent: true, opacity: 0.7 });
    const edge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.5, 0.06), edgeMat);
    edge.position.set(0.1, 1.25, 0);
    swordGroup.add(edge);
    // Hilt
    const hiltMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 6), hiltMat);
    hilt.position.y = -0.3;
    swordGroup.add(hilt);
    // Guard
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), hiltMat);
    guard.position.y = 0;
    swordGroup.add(guard);

    swordGroup.position.set(1.2, 1.8, 0.2);
    swordGroup.rotation.z = -0.3;
    swordGroup.rotation.x = 0.2;
    ichigoGroup.add(swordGroup);

    // Position Ichigo
    ichigoGroup.position.set(0, 0, 0);
    ichigoGroup.rotation.y = 0;
    scene.add(ichigoGroup);

    // --- BYAKUYA KUCHIKI (Enemy) ---
    const byakuyaGroup = new THREE.Group();

    // Body
    const bBodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const bBody = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.0, 2.2, 8), bBodyMat);
    bBody.position.y = 1.1;
    bBody.castShadow = true;
    bBody.receiveShadow = true;
    byakuyaGroup.add(bBody);

    // Head
    const bHeadMat = new THREE.MeshStandardMaterial({ color: 0xffddbb });
    const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), bHeadMat);
    bHead.position.y = 2.6;
    bHead.castShadow = true;
    byakuyaGroup.add(bHead);

    // Hair (Black)
    const bHairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const bHair = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), bHairMat);
    bHair.position.y = 2.75;
    bHair.scale.set(1.1, 0.8, 1.1);
    bHair.castShadow = true;
    byakuyaGroup.add(bHair);

    // Kenseikan (Hair accessories)
    const kenseikanMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0x444444) });
    for (let i = 0; i < 3; i++) {
      const kenseikan = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), kenseikanMat);
      kenseikan.position.set(-0.3 + i * 0.3, 2.95, 0.4);
      kenseikan.rotation.x = 0.3;
      byakuyaGroup.add(kenseikan);
    }

    // Scarf (White)
    const scarfMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0x333333) });
    const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.15, 8, 20), scarfMat);
    scarf.position.y = 2.1;
    scarf.rotation.x = Math.PI / 2;
    scarf.castShadow = true;
    byakuyaGroup.add(scarf);

    // Arms
    const bArmMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const bLeftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 6), bArmMat);
    bLeftArm.position.set(-0.9, 1.8, 0);
    bLeftArm.rotation.z = 0.3;
    bLeftArm.castShadow = true;
    byakuyaGroup.add(bLeftArm);
    const bRightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 6), bArmMat);
    bRightArm.position.set(0.9, 1.8, 0);
    bRightArm.rotation.z = -0.3;
    bRightArm.castShadow = true;
    byakuyaGroup.add(bRightArm);

    // Senbonzakura (Sword)
    const bSwordGroup = new THREE.Group();
    const bBladeMat = new THREE.MeshStandardMaterial({ color: 0xccddff, emissive: new THREE.Color(0x002244), metalness: 0.9, roughness: 0.1 });
    const bBlade = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.05), bBladeMat);
    bBlade.position.y = 1.25;
    bBlade.castShadow = true;
    bSwordGroup.add(bBlade);
    // Petal-like glow
    const bEdgeMat = new THREE.MeshStandardMaterial({ color: 0xaaccff, emissive: new THREE.Color(0x2244aa), transparent: true, opacity: 0.6 });
    const bEdge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.5, 0.06), bEdgeMat);
    bEdge.position.set(0.1, 1.25, 0);
    bSwordGroup.add(bEdge);
    const bHilt = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 6), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    bHilt.position.y = -0.3;
    bSwordGroup.add(bHilt);
    const bGuard = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    bGuard.position.y = 0;
    bSwordGroup.add(bGuard);

    bSwordGroup.position.set(1.2, 1.8, 0.2);
    bSwordGroup.rotation.z = -0.3;
    bSwordGroup.rotation.x = 0.2;
    byakuyaGroup.add(bSwordGroup);

    // Position Byakuya
    byakuyaGroup.position.set(0, 0, -8);
    byakuyaGroup.rotation.y = Math.PI;
    scene.add(byakuyaGroup);

    // --- EFFECTS SYSTEM ---
    const effects = [];

    function createSlashEffect(position, color, size = 1) {
      const geom = new THREE.RingGeometry(0.5 * size, 1.5 * size, 16);
      const mat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      const ring = new THREE.Mesh(geom, mat);
      ring.position.copy(position);
      ring.rotation.x = Math.random() * Math.PI;
      ring.rotation.y = Math.random() * Math.PI;
      scene.add(ring);
      effects.push({
        mesh: ring,
        life: 0.3,
        maxLife: 0.3,
        type: 'ring',
        scaleSpeed: 5
      });
    }

    function createGetsugaEffect(position, direction, color1, color2) {
      // Main crescent wave
      const geom = new THREE.TorusGeometry(2, 0.4, 8, 32, Math.PI);
      const mat = new THREE.MeshStandardMaterial({
        color: color1,
        emissive: new THREE.Color(color1),
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      const wave = new THREE.Mesh(geom, mat);
      wave.position.copy(position);
      wave.rotation.y = Math.atan2(direction.x, direction.z);
      wave.rotation.x = Math.PI / 2;
      scene.add(wave);
      effects.push({
        mesh: wave,
        life: 0.8,
        maxLife: 0.8,
        type: 'getsuga',
        direction: direction.clone().normalize(),
        speed: 25,
        startPos: position.clone()
      });

      // Secondary smaller waves
      for (let i = 0; i < 3; i++) {
        const g2 = new THREE.TorusGeometry(1.2 + i * 0.5, 0.2, 8, 24, Math.PI);
        const m2 = new THREE.MeshStandardMaterial({
          color: color2,
          emissive: new THREE.Color(color2),
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        });
        const w2 = new THREE.Mesh(g2, m2);
        w2.position.copy(position).add(new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 2, (Math.random() - 0.5) * 3));
        w2.rotation.copy(wave.rotation);
        scene.add(w2);
        effects.push({
          mesh: w2,
          life: 0.6 + Math.random() * 0.4,
          maxLife: 0.6 + Math.random() * 0.4,
          type: 'getsuga',
          direction: direction.clone().normalize(),
          speed: 15 + Math.random() * 10,
          startPos: position.clone()
        });
      }

      // Particles
      const pCount = 80;
      const pGeom = new THREE.BufferGeometry();
      const pPositions = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount * 3; i += 3) {
        pPositions[i] = position.x + (Math.random() - 0.5) * 4;
        pPositions[i+1] = position.y + (Math.random() - 0.5) * 4;
        pPositions[i+2] = position.z + (Math.random() - 0.5) * 4;
      }
      pGeom.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      const pMat = new THREE.PointsMaterial({
        color: color1,
        size: 0.4,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });
      const pMesh = new THREE.Points(pGeom, pMat);
      scene.add(pMesh);
      effects.push({
        mesh: pMesh,
        life: 0.8,
        maxLife: 0.8,
        type: 'particles',
        velocity: direction.clone().normalize().multiplyScalar(20)
      });
    }

    // --- PLAYER STATE ---
    const state = {
      health: 100,
      enemyHealth: 100,
      isBankai: false,
      isHollow: false,
      cameraMode: 'third', // 'third' or 'first'
      keys: {},
      moveSpeed: 12,
      velocity: new THREE.Vector3(),
      direction: new THREE.Vector3(0, 0, -1),
      canAttack: true,
      attackCooldown: 0
    };

    // --- UI REFERENCES ---
    const healthFill = document.getElementById('health-fill');
    const enemyHealthFill = document.getElementById('enemy-health-fill');
    const toggleCamBtn = document.getElementById('toggle-cam');
    const charNameDisplay = document.getElementById('char-name-display');

    // --- BUTTON HANDLERS ---
    document.getElementById('btn-slash').addEventListener('click', () => {
      if (state.canAttack) {
        performSlash(1.0, 0xff2200);
      }
    });

    document.getElementById('btn-power-slash').addEventListener('click', () => {
      if (state.canAttack) {
        performSlash(2.5, 0xff0000);
        createSlashEffect(ichigoGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff4400, 2);
      }
    });

    document.getElementById('btn-getsuga').addEventListener('click', () => {
      if (state.canAttack) {
        performGetsuga();
      }
    });

    document.getElementById('btn-bankai').addEventListener('click', () => {
      toggleBankai();
    });

    document.getElementById('btn-hollow').addEventListener('click', () => {
      toggleHollow();
    });

    toggleCamBtn.addEventListener('click', () => {
      state.cameraMode = state.cameraMode === 'third' ? 'first' : 'third';
      // Update icon
      if (state.cameraMode === 'first') {
        toggleCamBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
      } else {
        toggleCamBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>`;
      }
    });

    // --- ATTACK FUNCTIONS ---
    function performSlash(power, color) {
      state.canAttack = false;
      state.attackCooldown = 0.3;

      // Animate sword swing
      const startRot = swordGroup.rotation.z;
      const startRotX = swordGroup.rotation.x;
      let t = 0;
      const duration = 0.2;
      const swingInterval = setInterval(() => {
        t += 0.02;
        if (t >= 1) {
          clearInterval(swingInterval);
          swordGroup.rotation.z = -0.3;
          swordGroup.rotation.x = 0.2;
          return;
        }
        const progress = t;
        swordGroup.rotation.z = -0.3 - Math.sin(progress * Math.PI) * 1.5 * power;
        swordGroup.rotation.x = 0.2 + Math.sin(progress * Math.PI) * 0.5;
      }, 16);

      // Create effect at enemy position if in range
      const dist = ichigoGroup.position.distanceTo(byakuyaGroup.position);
      if (dist < 6) {
        const effectPos = byakuyaGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
        for (let i = 0; i < 5 * power; i++) {
          createSlashEffect(
            effectPos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2)),
            color,
            1 + Math.random() * power
          );
        }
        // Damage enemy
        state.enemyHealth = Math.max(0, state.enemyHealth - 5 * power);
        updateHealthBars();
      }

      setTimeout(() => { state.canAttack = true; }, 300);
    }

    function performGetsuga() {
      state.canAttack = false;

      const dir = new THREE.Vector3(0, 0, -1);
      // Get direction towards enemy
      const toEnemy = byakuyaGroup.position.clone().sub(ichigoGroup.position).normalize();

      const startPos = ichigoGroup.position.clone().add(new THREE.Vector3(0, 2, 0));

      // Black and velvet red getsuga
      createGetsugaEffect(startPos, toEnemy, 0xff0000, 0x660000);

      // Light flash
      getsugaLight.position.copy(startPos);
      getsugaLight.intensity = 5;
      setTimeout(() => { getsugaLight.intensity = 0; }, 300);

      // Damage enemy
      const dist = ichigoGroup.position.distanceTo(byakuyaGroup.position);
      if (dist < 15) {
        state.enemyHealth = Math.max(0, state.enemyHealth - 20);
        updateHealthBars();
      }

      setTimeout(() => { state.canAttack = true; }, 800);
    }

    function toggleBankai() {
      state.isBankai = !state.isBankai;

      if (state.isBankai) {
        // Bankai visual changes
        bodyMat.color.setHex(0x000000);
        bodyMat.emissive = new THREE.Color(0x220044);
        hairMat.color.setHex(0x440000);
        hairMat.emissive = new THREE.Color(0x220000);

        // Tensa Zangetsu - black blade with red edge
        bladeMat.color.setHex(0x111111);
        bladeMat.emissive = new THREE.Color(0x440000);
        edgeMat.color.setHex(0xff0000);
        edgeMat.emissive = new THREE.Color(0xff0000);

        // Add bankai aura
        const auraGeom = new THREE.SphereGeometry(2, 16, 16);
        const auraMat = new THREE.MeshBasicMaterial({
          color: 0xaa00ff,
          transparent: true,
          opacity: 0.15,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide
        });
        const aura = new THREE.Mesh(auraGeom, auraMat);
        aura.position.y = 1.5;
        aura.name = 'bankaiAura';
        ichigoGroup.add(aura);

        bankaiLight.position.copy(ichigoGroup.position).add(new THREE.Vector3(0, 2, 0));
        bankaiLight.intensity = 3;

        // Dramatic effect
        for (let i = 0; i < 20; i++) {
          createSlashEffect(
            ichigoGroup.position.clone().add(new THREE.Vector3((Math.random() - 0.5) * 6, Math.random() * 5, (Math.random() - 0.5) * 6)),
            0xaa00ff,
            1 + Math.random() * 2
          );
        }
      } else {
        // Revert
        bodyMat.color.setHex(0x111111);
        bodyMat.emissive = new THREE.Color(0x000000);
        hairMat.color.setHex(0xff6600);
        hairMat.emissive = new THREE.Color(0x331100);

        bladeMat.color.setHex(0xcccccc);
        bladeMat.emissive = new THREE.Color(0x220000);
        edgeMat.color.setHex(0xff0000);

        const aura = ichigoGroup.getObjectByName('bankaiAura');
        if (aura) ichigoGroup.remove(aura);

        bankaiLight.intensity = 0;
      }
    }

    function toggleHollow() {
      state.isHollow = !state.isHollow;

      if (state.isHollow) {
        // Hollow mask effect
        const maskGeom = new THREE.SphereGeometry(0.7, 8, 8);
        const maskMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: new THREE.Color(0xff0000),
          transparent: true,
          opacity: 0.8
        });
        const mask = new THREE.Mesh(maskGeom, maskMat);
        mask.position.set(0, 2.6, 0.3);
        mask.scale.set(1, 1.2, 0.8);
        mask.name = 'hollowMask';
        ichigoGroup.add(mask);

        // Red markings
        const markingMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: new THREE.Color(0xff0000) });
        const mark1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.05), markingMat);
        mark1.position.set(-0.3, 2.7, 0.5);
        mark1.rotation.z = 0.3;
        ichigoGroup.add(mark1);
        const mark2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.05), markingMat);
        mark2.position.set(0.3, 2.7, 0.5);
        mark2.rotation.z = -0.3;
        ichigoGroup.add(mark2);

        hollowLight.position.copy(ichigoGroup.position).add(new THREE.Vector3(0, 2.5, 0));
        hollowLight.intensity = 3;

        // Speed boost
        state.moveSpeed = 18;

        // Dark aura
        const hAuraGeom = new THREE.SphereGeometry(1.8, 16, 16);
        const hAuraMat = new THREE.MeshBasicMaterial({
          color: 0xff0000,
          transparent: true,
          opacity: 0.2,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide
        });
        const hAura = new THREE.Mesh(hAuraGeom, hAuraMat);
        hAura.position.y = 1.5;
        hAura.name = 'hollowAura';
        ichigoGroup.add(hAura);
      } else {
        const mask = ichigoGroup.getObjectByName('hollowMask');
        if (mask) ichigoGroup.remove(mask);
        const mark1 = ichigoGroup.getObjectByName('mark1');
        const mark2 = ichigoGroup.getObjectByName('mark2');
        if (mark1) ichigoGroup.remove(mark1);
        if (mark2) ichigoGroup.remove(mark2);

        const aura = ichigoGroup.getObjectByName('hollowAura');
        if (aura) ichigoGroup.remove(aura);

        hollowLight.intensity = 0;
        state.moveSpeed = 12;
      }
    }

    function updateHealthBars() {
      healthFill.style.width = Math.max(0, state.health) + '%';
      enemyHealthFill.style.width = Math.max(0, state.enemyHealth) + '%';
    }

    // --- ENEMY AI ---
    let enemyAttackTimer = 0;

    function updateEnemy(delta) {
      if (state.enemyHealth <= 0) {
        // Enemy defeated
        byakuyaGroup.rotation.z = Math.PI / 2;
        byakuyaGroup.position.y = 0;
        return;
      }

      // Move towards player
      const toPlayer = ichigoGroup.position.clone().sub(byakuyaGroup.position);
      const dist = toPlayer.length();

      if (dist > 4) {
        toPlayer.normalize();
        byakuyaGroup.position.add(toPlayer.multiplyScalar(2 * delta * 20));
        byakuyaGroup.lookAt(ichigoGroup.position.x, 0, ichigoGroup.position.z);
      }

      // Attack player
      enemyAttackTimer += delta;
      if (enemyAttackTimer > 2.5 && dist < 5) {
        enemyAttackTimer = 0;
        // Enemy slash
        state.health = Math.max(0, state.health - 8);
        updateHealthBars();

        // Visual effect
        for (let i = 0; i < 10; i++) {
          createSlashEffect(
            ichigoGroup.position.clone().add(new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 3, (Math.random() - 0.5) * 3)),
            0xaa44ff,
            1 + Math.random()
          );
        }

        // Camera shake
        camera.position.x += (Math.random() - 0.5) * 0.5;
        camera.position.y += (Math.random() - 0.5) * 0.5;
      }
    }

    // --- CAMERA CONTROL ---
    let cameraOrbitAngle = 0;
    let cameraHeight = 8;
    let cameraDistance = 18;

    function updateCamera(delta) {
      if (state.cameraMode === 'third') {
        // Smooth follow camera
        const targetPos = ichigoGroup.position.clone().add(new THREE.Vector3(0, 3, 0));

        // Orbit around player
        cameraOrbitAngle += delta * 0.5;

        const offset = new THREE.Vector3(
          Math.sin(cameraOrbitAngle) * cameraDistance,
          cameraHeight,
          Math.cos(cameraOrbitAngle) * cameraDistance
        );

        const desiredPos = targetPos.clone().add(offset);

        // Smooth lerp
        camera.position.lerp(desiredPos, 0.05);
        camera.lookAt(targetPos);

        // Update character orientation based on movement
        if (state.velocity.length() > 0.1) {
          const angle = Math.atan2(state.velocity.x, state.velocity.z);
          ichigoGroup.rotation.y = angle;
        }
      } else {
        // First person
        const headPos = ichigoGroup.position.clone().add(new THREE.Vector3(0, 2.6, 0));
        camera.position.copy(headPos);
        camera.rotation.y = ichigoGroup.rotation.y;
        camera.rotation.x = 0;
      }
    }

    // --- INPUT HANDLING ---
    window.addEventListener('keydown', (e) => {
      state.keys[e.key.toLowerCase()] = true;

      // Keyboard shortcuts
      if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-getsuga').click(); }
      if (e.key === 'q') document.getElementById('btn-bankai').click();
      if (e.key === 'e') document.getElementById('btn-hollow').click();
      if (e.key === 'f') toggleCamBtn.click();
    });

    window.addEventListener('keyup', (e) => {
      state.keys[e.key.toLowerCase()] = false;
    });

    // Touch controls for movement (virtual joystick concept)
    let touchStartX = 0;
    let touchStartY = 0;
    let isTouching = false;

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.btn') || e.target.closest('#toggle-cam')) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isTouching = true;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      const deltaX = e.touches[0].clientX - touchStartX;
      const deltaY = e.touches[0].clientY - touchStartY;

      // Convert to movement
      const moveX = (deltaX / window.innerWidth) * 2;
      const moveZ = (deltaY / window.innerHeight) * 2;

      state.velocity.x = Math.max(-1, Math.min(1, moveX)) * state.moveSpeed * 0.1;
      state.velocity.z = Math.max(-1, Math.min(1, moveZ)) * state.moveSpeed * 0.1;
    });

    window.addEventListener('touchend', () => {
      isTouching = false;
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = performance.now() * 0.001;

      // Player movement (keyboard)
      const moveVec = new THREE.Vector3(0, 0, 0);
      if (state.keys['w'] || state.keys['arrowup']) moveVec.z -= 1;
      if (state.keys['s'] || state.keys['arrowdown']) moveVec.z += 1;
      if (state.keys['a'] || state.keys['arrowleft']) moveVec.x -= 1;
      if (state.keys['d'] || state.keys['arrowright']) moveVec.x += 1;

      if (moveVec.length() > 0) {
        moveVec.normalize();
        // Move relative to camera direction
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        camDir.y = 0;
        camDir.normalize();

        const rightDir = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();

        const forward = camDir.clone().multiplyScalar(-moveVec.z);
        const right = rightDir.clone().multiplyScalar(moveVec.x);

        const finalMove = forward.add(right).normalize();
        ichigoGroup.position.add(finalMove.multiplyScalar(state.moveSpeed * delta * 20));
        state.velocity.copy(finalMove);
      }

      // Constrain player to world
      const limit = 80;
      ichigoGroup.position.x = Math.max(-limit, Math.min(limit, ichigoGroup.position.x));
      ichigoGroup.position.z = Math.max(-limit, Math.min(limit, ichigoGroup.position.z));

      // Idle animation
      if (ichigoGroup) {
        ichigoGroup.position.y = Math.sin(time * 2) * 0.1;

        // Sword idle
        swordGroup.rotation.z = -0.3 + Math.sin(time * 2) * 0.05;
      }

      // Update enemy
      updateEnemy(delta);

      // Update effects
      for (let i = effects.length - 1; i >= 0; i--) {
        const effect = effects[i];
        effect.life -= delta;

        if (effect.type === 'ring') {
          effect.mesh.scale.addScalar(effect.scaleSpeed * delta);
          effect.mesh.material.opacity = effect.life / effect.maxLife;
        } else if (effect.type === 'getsuga') {
          effect.mesh.position.add(effect.direction.clone().multiplyScalar(effect.speed * delta));
          effect.mesh.material.opacity = effect.life / effect.maxLife;
          effect.mesh.scale.addScalar(delta * 0.5);
        } else if (effect.type === 'particles') {
          const positions = effect.mesh.geometry.attributes.position.array;
          for (let j = 0; j < positions.length; j += 3) {
            positions[j] += effect.velocity.x * delta;
            positions[j+1] += effect.velocity.y * delta;
            positions[j+2] += effect.velocity.z * delta;
          }
          effect.mesh.geometry.attributes.position.needsUpdate = true;
          effect.mesh.material.opacity = effect.life / effect.maxLife;
        }

        if (effect.life <= 0) {
          scene.remove(effect.mesh);
          effects.splice(i, 1);
        }
      }

      // Update camera
      updateCamera(delta);

      // Update lights
      getsugaLight.position.copy(ichigoGroup.position).add(new THREE.Vector3(0, 2, 0));
      bankaiLight.position.copy(ichigoGroup.position).add(new THREE.Vector3(0, 2, 0));
      hollowLight.position.copy(ichigoGroup.position).add(new THREE.Vector3(0, 2, 0));

      // Rotate Byakuya towards player
      if (state.enemyHealth > 0) {
        byakuyaGroup.lookAt(ichigoGroup.position.x, 0, ichigoGroup.position.z);
      }

      // Attack cooldown
      if (state.attackCooldown > 0) {
        state.attackCooldown -= delta;
      }

      // Check win/lose
      if (state.health <= 0) {
        charNameDisplay.textContent = "DEFEATED...";
        charNameDisplay.style.color = "#ff0000";
      } else if (state.enemyHealth <= 0) {
        charNameDisplay.textContent = "VICTORY!";
        charNameDisplay.style.color = "#00ff00";
      }

      // Render with composer for bloom
      composer.render();
      requestAnimationFrame(animate);
    }

    // --- RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- START ---
    animate();
  </script>
</body>
</html>
