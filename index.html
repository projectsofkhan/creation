<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1a0a">
<title>Attack on Titan · Wings of Freedom</title>
<style>
:root{--u:4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff}
#wrap{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#0a0a0a}
#wrap canvas{position:absolute;left:0;top:0;display:block;z-index:0}
#log{position:fixed;left:0;top:0;right:0;max-height:35vh;overflow:auto;background:rgba(0,0,0,.85);color:#6f6;font-family:monospace;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;pointer-events:none;display:none;border-bottom:1px solid #4a4}
#log.on{display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);z-index:2}
#hud{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .7s}
body.cine #hud{opacity:0}
.nm{position:absolute;font-size:calc(var(--u)*2.2);letter-spacing:.15em;font-weight:700;text-shadow:0 0 10px #000,0 0 20px #000}
.bar{position:absolute;height:calc(var(--u)*2.8);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:calc(var(--u)*1.4);overflow:hidden;transform:skewX(-12deg);box-shadow:0 0 15px rgba(0,0,0,.5)}
.bar i{position:absolute;inset:0;transform-origin:left;display:block;transition:transform .1s}
.thin{height:calc(var(--u)*1.6)}
#hpH i{background:linear-gradient(90deg,#8a0f25,#ff2d55,#ff6a85)}
#enH i{background:linear-gradient(90deg,#14507a,#44d0ff,#88e0ff)}
#gasH i{background:linear-gradient(90deg,#7a5a10,#ffcc44,#ffee88)}
#badges{position:absolute;left:50%;top:calc(var(--u)*1.8);transform:translateX(-50%);display:flex;gap:calc(var(--u)*1.2)}
#badges span{font-size:calc(var(--u)*2.1);padding:calc(var(--u)*.25) calc(var(--u)*1.2);border-radius:calc(var(--u)*1);background:rgba(120,0,25,.6);border:1px solid #ff3b62;display:none;box-shadow:0 0 15px rgba(255,50,90,.4)}
#combo{position:absolute;right:calc(var(--u)*5);top:calc(var(--u)*18);font-size:calc(var(--u)*5.5);font-weight:900;color:#ff3b62;text-shadow:0 0 15px #ff0030,0 2px 0 #000;opacity:0;transition:opacity .15s;font-style:italic;letter-spacing:.05em}
#knobBase{position:absolute;width:calc(var(--u)*19);height:calc(var(--u)*19);border-radius:50%;border:2px solid rgba(255,120,60,.5);background:rgba(255,80,20,.06);left:calc(var(--u)*7);bottom:calc(var(--u)*7);opacity:.4;transition:opacity .2s}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--u)*8.5);height:calc(var(--u)*8.5);margin:calc(var(--u)*-4.25) 0 0 calc(var(--u)*-4.25);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a4a,#8a2a0a);box-shadow:0 0 18px rgba(255,80,20,.9)}
#zone{position:absolute;left:0;bottom:0;width:40%;height:75%;z-index:6}
#look{position:absolute;inset:0;z-index:1;background:transparent}
.btn{position:absolute;width:calc(var(--u)*var(--s));height:calc(var(--u)*var(--s));border-radius:50%;border:calc(var(--u)*.4) solid #c46212;background:radial-gradient(circle at 35% 30%,#3a2010,#0a0508 75%);box-shadow:0 0 calc(var(--u)*2) rgba(255,120,40,.5),inset 0 0 calc(var(--u)*1.8) rgba(255,80,20,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:7;pointer-events:auto;transition:transform .08s}
.btn svg{width:58%;height:58%;pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,120,40,.9));margin-bottom:calc(var(--u)*.9)}
.btn b{position:absolute;bottom:calc(var(--u)*.6);font-size:calc(var(--u)*1.4);letter-spacing:.05em;color:#ffd9c3;text-shadow:0 0 4px #000;pointer-events:none}
.btn .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;transform:scaleY(0);pointer-events:none;border-radius:50%}
.btn.press{transform:scale(.9);border-color:#ff9a65}
.btn.low{filter:saturate(.2) brightness(.5)}
.btn.on{border-color:#fff;box-shadow:0 0 calc(var(--u)*3.5) #ff6a20,inset 0 0 calc(var(--u)*2) rgba(255,80,20,.6)}
#bSkip{position:absolute;right:calc(var(--u)*4);top:calc(var(--u)*12);z-index:14;display:none;font-size:calc(var(--u)*2.4);letter-spacing:.15em;padding:calc(var(--u)*.8) calc(var(--u)*2);border:1px solid #fff8;border-radius:calc(var(--u)*1);background:#000a}
body.cine #bSkip{display:block}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;z-index:12;pointer-events:none;opacity:0}
#banner .bg{font-size:calc(var(--u)*12);font-weight:900;letter-spacing:.1em;text-shadow:0 0 calc(var(--u)*3) #ff6a20,0 0 calc(var(--u)*8) #8a2a0a,0 calc(var(--u)*.5) 0 #000}
#banner .bs{font-size:calc(var(--u)*3);letter-spacing:.35em;color:#ffd9c3;margin-top:calc(var(--u)*1);text-shadow:0 0 10px #000}
#banner.show{animation:bn var(--d,2s) ease both}
@keyframes bn{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#sub{position:absolute;left:8%;right:8%;bottom:calc(var(--u)*11);text-align:center;font-size:calc(var(--u)*3.6);z-index:12;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s;pointer-events:none;font-style:italic}
#sub b{display:block;font-style:normal;font-size:calc(var(--u)*2.2);letter-spacing:.25em;color:#ff9a65;margin-bottom:calc(var(--u)*.5)}
.lb{position:absolute;left:0;right:0;height:calc(var(--u)*10);background:#000;z-index:9;transition:transform .7s;pointer-events:none}
#lbT{top:0;transform:translateY(-100%)}#lbB{bottom:0;transform:translateY(100%)}
body.cine .lb{transform:none}
#flash{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;background:#fff}
.dmg{position:absolute;z-index:10;pointer-events:none;font-weight:900;font-size:calc(var(--u)*4.5);color:#fff;text-shadow:0 0 10px #ff6a20,0 2px 0 #000;transform:translate(-50%,-50%);animation:fl .85s ease-out forwards}
.dmg.big{font-size:calc(var(--u)*7);color:#ffd9c3}
.dmg.hurt{color:#9fd8ff}
@keyframes fl{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:calc(var(--u)*-8)}}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(40,20,0,.55),rgba(0,0,0,.92))}
.ov h1{font-size:calc(var(--u)*14);margin:0;letter-spacing:.12em;text-shadow:0 0 calc(var(--u)*4) #ff6a20}
.ov h2{font-size:calc(var(--u)*3.2);margin:calc(var(--u)*1) 0 calc(var(--u)*6);letter-spacing:.4em;color:#ffd9c3;font-weight:400}
.ov button{font-size:calc(var(--u)*4.5);padding:calc(var(--u)*1.8) calc(var(--u)*7);color:#fff;background:linear-gradient(#b34a12,#5a1e06);border:2px solid #ff9a65;border-radius:calc(var(--u)*5);box-shadow:0 0 calc(var(--u)*4) #ff6a20;letter-spacing:.15em;font-weight:700;cursor:pointer}
.ov button:active{transform:scale(.95)}
.ov p{font-size:calc(var(--u)*2.4);color:#caa;margin-top:calc(var(--u)*3)}
#end{display:none;z-index:18}
#respawnMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;font-size:calc(var(--u)*8);font-weight:900;color:#ff3b62;text-shadow:0 0 20px #ff0000,0 0 40px #8a0000;letter-spacing:.2em;opacity:0;transition:opacity .3s;pointer-events:none}
</style>

<body>
<div id="log"></div>
<div id="wrap">
 <div id="look"></div>
 <div id="vig"></div>
 <div id="flash"></div>
 <div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
 <div id="banner"></div><div id="sub"></div>
 <div id="bSkip">SKIP ▶</div>
 <div id="respawnMsg">RESPAWN</div>

 <div id="hud">
  <div class="nm" style="left:calc(var(--u)*3);top:calc(var(--u)*1.2)">EREN YEAGER</div>
  <div class="bar" id="hpH" style="left:calc(var(--u)*3);top:calc(var(--u)*4.5);width:calc(var(--u)*40)"><i></i></div>
  <div class="bar thin" id="enH" style="left:calc(var(--u)*3);top:calc(var(--u)*8.5);width:calc(var(--u)*30)"><i></i></div>
  <div class="bar thin" id="gasH" style="left:calc(var(--u)*3);top:calc(var(--u)*11);width:calc(var(--u)*26)"><i></i></div>
  <div id="badges"><span id="bTitan">TITAN FORM</span><span id="bODM">ODM GEAR</span></div>
  <div id="combo"></div>
  <div id="knobBase"><div id="knob"></div></div>

  <div class="btn" id="bSlash" style="--s:15;right:calc(var(--u)*4.5);bottom:calc(var(--u)*4.5)">
   <svg viewBox="0 0 64 64"><path d="M12 52 L50 8 L54 12 L18 56Z" fill="#ffe3d0"/><path d="M8 38 Q30 34 56 48" stroke="#ff6a20" stroke-width="4" fill="none" stroke-linecap="round"/></svg><b>SLASH</b><div class="cd"></div></div>

  <div class="btn" id="bPower" style="--s:13;right:calc(var(--u)*21);bottom:calc(var(--u)*3.5)">
   <svg viewBox="0 0 64 64"><path d="M10 54 L54 6 L58 10 L16 58Z" fill="#fff"/><path d="M4 32 Q32 18 60 44" stroke="#ff4000" stroke-width="5" fill="none" stroke-linecap="round"/></svg><b>POWER</b><div class="cd"></div></div>

  <div class="btn" id="bHookL" style="--s:13;right:calc(var(--u)*19);bottom:calc(var(--u)*18)">
   <svg viewBox="0 0 64 64"><path d="M8 56 L8 20 Q8 8 20 8 Q32 8 32 20 L32 40" stroke="#ffd9c3" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="32" cy="40" r="6" fill="#ff6a20"/></svg><b>HOOK L</b><div class="cd"></div></div>

  <div class="btn" id="bHookR" style="--s:13;right:calc(var(--u)*33);bottom:calc(var(--u)*13)">
   <svg viewBox="0 0 64 64"><path d="M56 56 L56 20 Q56 8 44 8 Q32 8 32 20 L32 40" stroke="#ffd9c3" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="32" cy="40" r="6" fill="#ff6a20"/></svg><b>HOOK R</b><div class="cd"></div></div>

  <!-- FIXED: Renamed ID to bTitanBtn to avoid conflict with badge -->
  <div class="btn" id="bTitanBtn" style="--s:12;right:calc(var(--u)*5);bottom:calc(var(--u)*22)">
   <svg viewBox="0 0 64 64"><path d="M32 8 C17 8 11 21 13 34 C15 48 25 58 32 58 C39 58 49 48 51 34 C53 21 47 8 32 8Z" fill="#14090d" stroke="#ff4000" stroke-width="3"/><path d="M18 28 Q24 22 30 31 Q24 35 18 28Z M46 28 Q40 22 34 31 Q40 35 46 28Z" fill="#ff4000"/></svg><b>TITAN</b><div class="cd"></div></div>

  <div class="btn" id="bDash" style="--s:11;right:calc(var(--u)*36);bottom:calc(var(--u)*4.5)">
   <svg viewBox="0 0 64 64"><path d="M8 14 L28 32 L8 50 M30 14 L50 32 L30 50" stroke="#ffd9c3" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><b>DASH</b><div class="cd"></div></div>

  <div class="btn" id="bCam" style="--s:9.5;right:calc(var(--u)*3);top:calc(var(--u)*10)">
   <svg viewBox="0 0 64 64"><path d="M4 32 Q32 6 60 32 Q32 58 4 32Z" fill="none" stroke="#ffd9c3" stroke-width="4"/><circle cx="32" cy="32" r="10" fill="#ff6a20"/></svg><b id="camLbl">3RD</b></div>
 </div>
 <div id="zone"></div>

 <div class="ov" id="start"><div><h1>WINGS OF FREEDOM</h1><h2>ATTACK ON TITAN</h2><button id="go">TAP TO BEGIN</button><p>Landscape · Sound On · Drag right to look</p></div></div>
 <div class="ov" id="end"><div><h1 id="endT">VICTORY</h1><h2 id="endS"></h2><button id="again">PLAY AGAIN</button></div></div>
</div>

<script>
/* ============ VISIBLE LOG + ERROR CATCHER ============ */
const logEl=document.getElementById('log');
function LOG_LINE(msg,isErr){
  if(!logEl)return;
  logEl.classList.add('on');
  const d=document.createElement('div');
  d.textContent=(isErr?'❌ ':'✓ ')+msg;
  if(isErr)d.style.color='#f66';
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}
window.LOG_LINE=LOG_LINE;
window.addEventListener('error',e=>{LOG_LINE('ERROR: '+(e.message||e.reason||'unknown')+(e.filename?' @'+e.filename+':'+(e.lineno||'?'):''),true)},true);
window.addEventListener('unhandledrejection',e=>{LOG_LINE('PROMISE REJECT: '+((e.reason&&e.reason.message)||e.reason||'unknown'),true)});

if(typeof THREE==='undefined'){
  LOG_LINE('THREE.js FAILED TO LOAD.',true);
  throw new Error('THREE missing');
}
LOG_LINE('THREE.js loaded, revision '+THREE.REVISION);

/* ================= helpers ================= */
const V3=THREE.Vector3,PI=Math.PI,ADD=THREE.AdditiveBlending;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),ease=k=>k*k*(3-2*k);
const $=id=>document.getElementById(id);
const wrap=$('wrap');
const fwd=y=>new V3(Math.sin(y),0,Math.cos(y));
const rightOf=y=>new V3(-Math.cos(y),0,Math.sin(y));
const dXZ=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const angDiff=(a,b)=>{let d=b-a;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d};
const randDir=()=>{const u=rnd(-1,1),a=rnd(0,2*PI),s=Math.sqrt(1-u*u);return new V3(s*Math.cos(a),u,s*Math.sin(a))};
const ARENA=55;
let W=800,H=400,rot=false;

/* ================= renderer ================= */
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  wrap.insertBefore(renderer.domElement,wrap.firstChild);
  LOG_LINE('WebGL renderer created');
}catch(e){
  LOG_LINE('WebGL renderer FAILED: '+e.message,true);
  throw e;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ab8d8);
scene.fog=new THREE.FogExp2(0xa8b8c8,0.012);
const camera=new THREE.PerspectiveCamera(65,2,.08,900);

function layout(){
  const w=innerWidth,h=innerHeight;rot=h>w;W=rot?h:w;H=rot?w:h;
  wrap.style.width=W+'px';wrap.style.height=H+'px';
  wrap.style.transform=rot?`translate(${w}px,0) rotate(90deg)`:'none';
  wrap.style.setProperty('--u',(H/100)+'px');
  renderer.setSize(W,H);
  camera.aspect=W/H;camera.updateProjectionMatrix();
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
layout();

/* ================= textures ================= */
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const stoneTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#8a7a6a';g.fillRect(0,0,256,256);
 for(let i=0;i<400;i++){const l=rnd(90,160);g.fillStyle=`rgba(${l},${l-15},${l-35},${rnd(.04,.12)})`;g.fillRect(rnd(0,256),rnd(0,256),rnd(2,16),rnd(2,16))}
 g.strokeStyle='rgba(30,20,10,.3)';g.lineWidth=1.5;g.strokeRect(0,0,256,256);g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.moveTo(0,128);g.lineTo(256,128);g.stroke();
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,10);return t})();

/* ================= world ================= */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500,16,10),new THREE.MeshBasicMaterial({color:0x9ab8d8,side:THREE.BackSide,fog:false,depthWrite:false})));

const sunPos=new V3(100,140,60);
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffeedd,blending:ADD,depthWrite:false,fog:false,transparent:true,opacity:.85}));
sunGlow.scale.set(220,220,1);sunGlow.position.copy(sunPos);scene.add(sunGlow);

scene.add(new THREE.HemisphereLight(0xd0e0ff,0x8a7a60,1.2));
const sunLight=new THREE.DirectionalLight(0xfff4e0,1.8);
sunLight.position.copy(sunPos).normalize().multiplyScalar(80);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(1024,1024);
sunLight.shadow.camera.left=-35;sunLight.shadow.camera.right=35;
sunLight.shadow.camera.top=35;sunLight.shadow.camera.bottom=-35;
sunLight.shadow.camera.near=1;sunLight.shadow.camera.far=200;
sunLight.shadow.camera.updateProjectionMatrix();
sunLight.shadow.bias=-.0003;
scene.add(sunLight);
const flashL=new THREE.PointLight(0xff6030,0,80,2);scene.add(flashL);let flashI=0;

const floor=new THREE.Mesh(new THREE.CircleGeometry(70,48),new THREE.MeshStandardMaterial({map:stoneTex,color:0xb0a898,roughness:.88,metalness:.04}));
floor.rotation.x=-PI/2;floor.receiveShadow=true;scene.add(floor);
const dirt=new THREE.Mesh(new THREE.RingGeometry(70,130,48),new THREE.MeshStandardMaterial({color:0x7a5a3a,roughness:1}));
dirt.rotation.x=-PI/2;dirt.position.y=-.02;scene.add(dirt);

[8,16,24,32,42,54].forEach((r,i)=>{const m=new THREE.Mesh(new THREE.RingGeometry(r-.08,r+.08,48),new THREE.MeshBasicMaterial({color:0x8a7a60,transparent:true,opacity:.4-i*.05,depthWrite:false}));m.rotation.x=-PI/2;m.position.y=.03;scene.add(m)});

const bldgMats=[];
for(let i=0;i<4;i++){bldgMats.push(new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.08+rnd(-.03,.03),.35+rnd(-.1,.1),.35+rnd(-.1,.1)),roughness:.9,metalness:.05}))}
const roofMat=new THREE.MeshStandardMaterial({color:0x8a4a2a,roughness:.85});
function addBuilding(x,z,w,d,h,rotY){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotY||rnd(0,PI*2);
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bldgMats[Math.floor(rnd(0,bldgMats.length))]);
  body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.4,.6,d+.4),roofMat);roof.position.y=h+.3;g.add(roof);
  scene.add(g);
}
for(let i=0;i<14;i++){const a=i/14*2*PI+rnd(-.1,.1),r=rnd(34,56);addBuilding(Math.cos(a)*r,Math.sin(a)*r,rnd(3,6),rnd(3,6),rnd(6,14),a+PI/2)}
for(let i=0;i<16;i++){const a=i/16*2*PI+rnd(-.1,.1),r=rnd(70,105);addBuilding(Math.cos(a)*r,Math.sin(a)*r,rnd(4,7),rnd(4,7),rnd(8,16),a+PI/2)}

const wallMat=new THREE.MeshStandardMaterial({color:0xa89880,roughness:.92});
for(let i=0;i<48;i++){const a=i/48*2*PI;const w=new THREE.Mesh(new THREE.BoxGeometry(4,40,2),wallMat);w.position.set(Math.cos(a)*125,20,Math.sin(a)*125);w.rotation.y=a+PI/2;scene.add(w)}

for(let i=0;i<12;i++){const a=rnd(0,2*PI),r=rnd(180,270);const m=new THREE.Mesh(new THREE.ConeGeometry(rnd(25,50),rnd(60,120),5),new THREE.MeshBasicMaterial({color:0x6a8a9a,transparent:true,opacity:.6}));m.position.set(Math.cos(a)*r,25,Math.sin(a)*r);scene.add(m)}

/* ================= particles ================= */
class ParticlePool{
  constructor(max,color,size,blending){
    this.max=max;this.n=0;
    this.pos=new Float32Array(max*3);
    this.vel=new Float32Array(max*3);
    this.life=new Float32Array(max);
    this.ttl=new Float32Array(max);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
    this.g=g;
    const m=new THREE.PointsMaterial({color:color,size:size,map:glowTex,transparent:true,depthWrite:false,blending:blending||ADD,opacity:1,sizeAttenuation:true});
    this.pts=new THREE.Points(g,m);this.pts.frustumCulled=false;scene.add(this.pts);
  }
  emit(x,y,z,vx,vy,vz,s,ttl){
    const i=this.n;this.n=(i+1)%this.max;
    this.pos[i*3]=x;this.pos[i*3+1]=y;this.pos[i*3+2]=z;

function evalAnim(a,t){const ks=a.keys;let i=0;while(i<ks.length-1&&t>ks[i+1].t)i++;const A=ks[i],B=ks[Math.min(i+1,ks.length-1)];
  const span=B.t-A.t,k=span>0?ease(clamp((t-A.t)/span,0,1)):1,o={};
  for(const p of PROPS){const x=A.p[p]??IDLE[p],y=B.p[p]??IDLE[p];o[p]=x+(y-x)*k}return o}

    this.knock=new V3();this.ph=0;this.spd=0;this.lean=0;this.invuln=0;this.stun=0;this.poise=0;this.t=rnd(0,9);this.lastVel=new V3();this.onEvent=null;this.size=1;this.baseHipY=1.05}
  play(n,x={}){this.anim={n,a:ANIMS[n],t:0,fired:0,...x}}
  loco(){const o=Object.assign({},IDLE),s=Math.min(1,this.spd),A=.75*s,sn=Math.sin(this.ph);
    o.hy+=Math.sin(this.t*2.1)*.012-s*.02;o.tx+=Math.sin(this.t*2.1+1)*.015;
    o.lhx+=sn*A;o.rhx-=sn*A;o.lkx+=Math.max(0,-Math.sin(this.ph+.9))*A*1.3;o.rkx+=Math.max(0,Math.sin(this.ph+.9))*A*1.3;o.rx=this.lean;return o}
  update(dt){

    this.ph+=dt*(5+this.spd*6)*(this.spd>.05?1:0);
    if(this.anim){const an=this.anim;an.t+=dt;const evs=an.a.ev;
      while(an.fired<evs.length&&an.t>=evs[an.fired].t){const e=evs[an.fired++];if(this.onEvent)this.onEvent(e,an)}
      if(this.anim===an&&an.t>=an.a.dur)this.anim=null}

    const k=Math.min(1,(this.anim?24:8)*dt),c=this.cur;for(const p of PROPS)c[p]+=(tg[p]-c[p])*k;
    const r=this.rig;
    r.root.rotation.set(c.rx,this.yaw,0);
    r.hips.position.y=this.baseHipY+c.hy;
    r.hips.rotation.y=c.ry;
    r.torso.rotation.set(c.tx,c.ty,c.tz);
    r.head.rotation.set(c.hd,c.hdy,0);

/* ================= combat ================= */
const ATKH={slash1:{d:18,r:3.6,k:'l',roll:.8,sc:2.3,lg:2.4},slash2:{d:18,r:3.6,k:'l',roll:-.8,sc:2.3,lg:2.4},slash3:{d:28,r:3.9,k:'l',roll:0,sc:2.8,lg:3.2},power:{d:60,r:5.2,k:'h',roll:.15,sc:3.8,lg:3.6}};
hero.onEvent=(ev,an)=>{
  if(ev.e==='strike'){
    const a=ATKH[an.n];if(!a)return;
    const f=fwd(hero.yaw),c=hero.pos.clone();
    const scl=state.titan?2.8:1;
    c.y+=1.25*scl;c.addScaledVector(f,.9*scl);
    slashTrail(c,hero.yaw,a.roll,a.sc*(state.titan?2.2:1),state.titan?0xff4020:0xff6a20,state.titan);
    impulse(hero,f,a.lg);
    if(an.n==='power'){shockwave(hero.pos.clone().addScaledVector(f,2.6*scl),0xff4020,7,.5);shake=Math.max(shake,.7)}
    if(phase==='play'){titans.forEach(t=>{if(t.hp>0&&dXZ(hero.pos,t.pos)<a.r+.5+(state.titan?4:0))hurtTitan(t,a.d*dm(),a.k==='h'?'heavy':'light')})}
  }
  else if(ev.e==='burst'){
    if(an.n==='titan'){state.titan=true;state.titanT=25;banner('TITAN FORM','THE ATTACK TITAN',2.5);setMode();titanBurst()}
  }
};

function titanAI(t,dt){
  if(t.hp<=0||t.stun>0||t.anim)return;
  const dist=dXZ(t.pos,hero.pos);
  faceTo(t,hero.pos,dt,4);
  if(dist>4*t.size){
    const f=new V3(hero.pos.x-t.pos.x,0,hero.pos.z-t.pos.z).normalize();
    t.pos.addScaledVector(f,2.5*t.size*dt);t.spd=.4;t.lean=.1;
  } else {
    t.spd=0;
    if(Math.random()<.02*t.size){
      t.play(Math.random()<.5?'tPunch':'tSlam');
      later(.6,()=>{if(t.hp>0&&dXZ(t.pos,hero.pos)<6*t.size){hurtHero(state.titan?30:50,t.pos,4)}});
    }
  }
}
function hurtTitan(t,d,kind){
  if(t.hp<=0||t.invuln>0)return false;
  t.hp=Math.max(0,t.hp-d);combo++;comboT=2.2;energy=Math.min(100,energy+(kind==='heavy'?12:6));
  const p=t.pos.clone();p.y=3*t.size;popup(Math.round(d),p,kind==='heavy'?'big':'');
  const c=t.pos.clone();c.y=1.5*t.size;impact(c,kind==='heavy'?1.8:1,[1,.5,.3]);hitstop(kind==='heavy'?.11:.05);
  t.play('hit');impulse(t,t.pos.clone().sub(hero.pos),kind==='heavy'?2:1);
  if(t.hp<=0)killTitan(t);
  return true;
}
function killTitan(t){
  shake=Math.max(shake,2);flashScreen('#fff',.5);
  spark(t.pos.clone().setY(3*t.size),60,15,.5,1.2);
  const rm=$('respawnMsg');rm.style.opacity=1;setTimeout(()=>rm.style.opacity=0,1500);
  later(3,()=>{if(t.hp<=0){t.hp=t.max;t.pos.set(rnd(-25,25),0,rnd(-25,25));t.root.visible=true;t.anim=null;t.cur=Object.assign({},IDLE);t.play('rise')}},false);
}
function hurtHero(d,from,kb){
  if(hero.invuln>0||hero.hp<=0||phase!=='play')return false;
  hero.hp=Math.max(0,hero.hp-d);hero.invuln=.4;hero.stun=.25;hero.play('hit');
  impulse(hero,hero.pos.clone().sub(from),kb);
  const p=hero.pos.clone();p.y=2.3;popup(Math.round(d),p,'hurt');
  const c=hero.pos.clone();c.y=1.2;impact(c,1,[1,.3,.2]);hitstop(.07);shake=Math.max(shake,.9);
  flashScreen('#a00020',.35);combo=0;
  if(hero.hp<=0)lose();
  return true;
}
function win(){phase='win';timers.length=0;hero.anim=null;hero.play('kneel');slowmo(.2,2.6);banner('VICTORY','THE TITANS ARE SLAIN',3.5);flashScreen('#fff',.6);
  setTimeout(()=>endScreen('VICTORY','Humanity prevails'),4800)}
function lose(){phase='lose';timers.length=0;hero.anim=null;hero.play('kneel');slowmo(.25,2);banner('DEFEATED','',3);
  setTimeout(()=>endScreen('DEFEATED','Rise again, soldier'),3200)}
function endScreen(t,s){$('endT').textContent=t;$('endS').textContent=s;$('again').textContent=t==='VICTORY'?'PLAY AGAIN':'TRY AGAIN';$('end').style.display='flex'}

/* ================= player actions ================= */
const stick={x:0,y:0};const keys={};
function faceTarget(){const alive=titans.filter(t=>t.hp>0);if(!alive.length)return;const t=alive.reduce((a,b)=>dXZ(hero.pos,a.pos)<dXZ(hero.pos,b.pos)?a:b);hero.yaw=Math.atan2(t.pos.x-hero.pos.x,t.pos.z-hero.pos.z)}
function tryAction(a){
  if(phase!=='play'||hero.hp<=0)return;
  if(a==='dash'){if(cd.dash>0)return;const alive=titans.filter(t=>t.hp>0);const tt=alive[0];
    const f=tt?new V3(tt.pos.x-hero.pos.x,0,tt.pos.z-hero.pos.z).normalize():new V3(0,0,1),r=new V3(-f.z,0,f.x);
    let d=f.clone().multiplyScalar(stick.y).add(r.clone().multiplyScalar(stick.x));if(d.lengthSq()<.05)d=f.clone().negate();
    hero.anim=null;hero.invuln=.34;impulse(hero,d,6);hero.play('dash');cd.dash=1;fovPunch=9;dashT=.3;return}
  if(a==='hookL'||a==='hookR'){if(cd[a]>0)return;cd[a]=2;const t=titans.find(t=>t.hp>0);if(!t)return;
    const f=new V3(t.pos.x-hero.pos.x,0,t.pos.z-hero.pos.z).normalize();
    hero.anim=null;hero.invuln=.3;impulse(hero,f,7);hero.play('dash');gas=Math.max(0,gas-8);return}
  if(hero.stun>0)return;
  if(hero.anim&&hero.anim.n!=='dash'&&hero.anim.t<hero.anim.a.dur*.6){buf={a,t:.3};return}
  if(a==='slash'){comboIdx=(T-lastSlash<.9)?(comboIdx+1)%3:0;lastSlash=T;faceTarget();hero.play('slash'+(comboIdx+1))}
  else if(a==='power'){if(energy<20||cd.power>0)return;energy-=20;cd.power=2.5;faceTarget();hero.play('power')}
  else if(a==='titan'){if(energy<70||cd.titan>0||state.titan)return;energy-=70;cd.titan=15;hero.invuln=2;hero.play('titan');say('EREN YEAGER','"I AM THE ATTACK TITAN!"',2)}
}
let dashT=0;

function updateHero(dt){
  let mx=stick.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),my=stick.y+(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0);
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
  const alive=titans.filter(t=>t.hp>0);
  if(!alive.length)return;
  const nearTitan=alive.reduce((a,b)=>dXZ(hero.pos,a.pos)<dXZ(hero.pos,b.pos)?a:b);
  const f=new V3(nearTitan.pos.x-hero.pos.x,0,nearTitan.pos.z-hero.pos.z).normalize(),r=new V3(-f.z,0,f.x);
  const sp=8*(state.titan?1.5:1);
  let fac=hero.stun>0?0:hero.anim?(hero.anim.n==='dash'?0:.2):1;
  const v=f.clone().multiplyScalar(my).add(r.clone().multiplyScalar(mx)).multiplyScalar(sp*fac);
  hero.pos.addScaledVector(v,dt);hero.lastVel.copy(v);hero.spd=Math.min(1,m)*fac;hero.lean=(my*fac)*.18;
  if(!hero.anim||hero.anim.n==='dash')faceTo(hero,nearTitan.pos,dt,14);
  if(buf.a){buf.t-=dt;if(buf.t<=0)buf.a=null;else if(!hero.anim||hero.anim.t>=hero.anim.a.dur*.6){const a=buf.a;buf.a=null;tryAction(a)}}
}
function updateState(dt){
  energy=Math.min(100,energy+3.5*dt);gas=Math.min(100,gas+2*dt);for(const k in cd)cd[k]=Math.max(0,cd[k]-dt);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  if(state.titan){state.titanT-=dt;if(state.titanT<=0){state.titan=false;setMode();banner('','TITAN FORM FADES',1.2)}}
}
function ambientFx(dt){
  if(state.titan){for(let i=0;i<4;i++){const p=hero.pos;glowFx.emit(p.x+rnd(-.6,.6),rnd(.1,3),p.z+rnd(-.6,.6),rnd(-.5,.5),rnd(1,3),rnd(-.5,.5),.4,1.2)}}
}

/* ================= camera ================= */
let shot=null,cp=new V3(),cl=new V3(),cpInit=false;const lkS=new V3(0,0,1);
function shotSet(dur,fn,fov=60){shot={t:0,dur,fn,fov};cpInit=false}
function gameplayCam(rdt){
  const alive=titans.filter(t=>t.hp>0);const t=alive.length?alive.reduce((a,b)=>dXZ(hero.pos,a.pos)<dXZ(hero.pos,b.pos)?a:b):null;
  if(!t){camera.position.set(0,10,25);camera.lookAt(0,0,0);return}
  const d=t.pos.clone().sub(hero.pos).setY(0),dist=Math.max(.01,d.length());d.divideScalar(dist);
  if(!cpInit){cp.copy(camera.position);const t2=new V3();camera.getWorldDirection(t2);cl.copy(camera.position).addScaledVector(t2,10);lkS.copy(t2);cpInit=true}
  const yaw=Math.atan2(d.x,d.z)+camYawOff,f=fwd(yaw),r=rightOf(yaw);
  if(fp){const tp=hero.pos.clone();tp.y+=1.82*(state.titan?2.8:1);tp.addScaledVector(f,.14);const tg=t.pos.clone();tg.y+=2.5*t.size;const dir=tg.sub(tp).normalize();
    const cy=Math.atan2(dir.x,dir.z)+camYawOff,pt=Math.atan2(dir.y,Math.hypot(dir.x,dir.z))+camPitchOff;
    const lk=new V3(Math.sin(cy)*Math.cos(pt),Math.sin(pt),Math.cos(cy)*Math.cos(pt));lkS.lerp(lk,1-Math.exp(-14*rdt)).normalize();
    cp.lerp(tp,1-Math.exp(-30*rdt));camera.position.copy(cp);cl.copy(cp).addScaledVector(lkS,10);camera.lookAt(cl)}
  else{const back=6.5+Math.min(dist,20)*.18+(state.titan?6:0),tp=hero.pos.clone().addScaledVector(f,-back).addScaledVector(r,1.8);tp.y=Math.max(1.5,3.5+Math.min(dist,20)*.08+camPitchOff*4+(state.titan?4:0));
    cp.lerp(tp,1-Math.exp(-5.5*rdt));const lt=hero.pos.clone().lerp(t.pos,.35);lt.y=2*t.size;lt.addScaledVector(r,1.2);cl.lerp(lt,1-Math.exp(-8*rdt));
    camera.position.copy(cp);camera.lookAt(cl)}
}
function updateCamera(rdt){
  let fovT=fp?78:65;
  if(shot){shot.t+=rdt;const k=clamp(shot.t/shot.dur,0,1);shot.fn(k);fovT=shot.fov;if(shot.t>=shot.dur){shot=null;cpInit=false}}
  else if(phase==='title'){const a=T*.12;camera.position.set(Math.sin(a)*25,8,Math.cos(a)*25);camera.lookAt(0,3,0)}
  else gameplayCam(rdt);
  fovT+=fovPunch;fovPunch*=Math.exp(-6*rdt);
  camera.fov+=(fovT-camera.fov)*Math.min(1,rdt*5);camera.updateProjectionMatrix();
  if(shake>.001){camera.position.x+=rnd(-1,1)*shake*.15;camera.position.y+=rnd(-1,1)*shake*.15;camera.position.z+=rnd(-1,1)*shake*.15;shake*=Math.exp(-7*rdt)}
}

/* ================= intro ================= */
let introT=0,introI=0,cues=[];
function buildCues(){
  const C=(t,f)=>cues.push([t,f]);
  C(0,()=>{document.body.classList.add('cine');shotSet(4.4,k=>{const a=lerp(-2.5,-.7,ease(k));camera.position.set(Math.sin(a)*22,lerp(10,3.4,ease(k)),Math.cos(a)*22);camera.lookAt(0,2.2,0)},55)});
  C(.5,()=>banner('WINGS OF FREEDOM','ATTACK ON TITAN',3.5));
  C(4.5,()=>{shotSet(3,k=>{camera.position.set(hero.pos.x+.5-k*.4,1.75,hero.pos.z+3.6-k*1.1);camera.lookAt(hero.pos.x,1.7,hero.pos.z)},36);say('EREN YEAGER','"I will destroy every last one of them."',2.8)});
  C(7.7,()=>{const t=titans[0];if(!t)return;shotSet(3,k=>{camera.position.set(t.pos.x-.6+k*.3,3.5,t.pos.z-3.4+k*1);camera.lookAt(t.pos.x,3,t.pos.z)},36)});
  C(10.9,()=>{shotSet(3.2,k=>{camera.position.set(lerp(16,13,k),5,0);camera.lookAt(0,4,0)},55);say('EREN YEAGER','"SHINZOU WO SASAGEYO!"',2.5)});
  C(14,()=>{hero.play('titan');shotSet(4,k=>{const a=lerp(.2,2.8,ease(k)),R=lerp(4,9,k);camera.position.set(hero.pos.x+Math.sin(a)*R,lerp(1.5,5,k),hero.pos.z-Math.cos(a)*R);camera.lookAt(hero.pos.x,2.5,hero.pos.z)},52)});
  C(18.5,()=>{const m=hero.pos.clone().lerp(titans[0].pos,.5);m.y=2;impact(m,3,[1.2,.4,.2]);shockwave(m.clone().setY(.05),0xffffff,18,.7);flashScreen('#fff',.85);slowmo(.25,.9)});
  C(20.5,()=>endIntro());
  cues.sort((a,b)=>a[0]-b[0]);
}
function updateIntro(rdt){introT+=rdt;while(introI<cues.length&&introT>=cues[introI][0]){cues[introI][1]();introI++}
  if(titans[0])faceTo(hero,titans[0].pos,rdt,8);if(titans[0])faceTo(titans[0],hero.pos,rdt,4)}
function endIntro(){
  if(phase!=='intro')return;phase='play';shot=null;cpInit=false;document.body.classList.remove('cine');$('sub').style.opacity=0;
  timers.length=0;
  hero.anim=null;titans.forEach(t=>{t.anim=null;t.stun=0;t.invuln=0});
  hero.stun=0;hero.invuln=0;hero.knock.set(0,0,0);
  hero.hp=Math.round(hero.max*.8);energy=100;gas=100;state.titan=false;setMode();
  faceTarget();ai.gen++;combo=0;slowT=0;
  banner('FIGHT','',1.8);
  LOG_LINE('Combat started');
}
function skipIntro(){if(phase!=='intro')return;introI=cues.length;slowT=0;timeScale=1;endIntro()}

let AC=null,master=null;
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);LOG_LINE('Audio ready')}catch(e){LOG_LINE('Audio init failed: '+e.message)}}

/* ================= main loop ================= */
let last=performance.now(),frame=0;
function loop(now){
  requestAnimationFrame(loop);
  try{
    const rdt=Math.min(.05,(now-last)/1000);last=now;
    if(slowT>0){slowT-=rdt;timeScale=slowS}else timeScale+=(1-timeScale)*Math.min(1,rdt*5);
    let dt=rdt*timeScale;if(hitstopT>0){hitstopT-=rdt;dt=0}
    T+=dt;
    for(let i=timers.length-1;i>=0;i--){const tm=timers[i];tm.t-=dt;if(tm.t<=0){timers.splice(i,1);tm.fn()}}
    if(phase==='intro')updateIntro(rdt);
    else if(phase==='play'){updateHero(dt);updateState(dt);titans.forEach(t=>titanAI(t,dt))}
    hero.update(dt);titans.forEach(t=>t.update(dt));
    for(let i=fx.length-1;i>=0;i--)if(!fx[i](dt))fx.splice(i,1);
    flashI*=Math.exp(-10*dt);flashL.intensity=flashI;
    ambientFx(dt);glowFx.update(dt);
    if(lid===null){camYawOff*=Math.exp(-1.5*rdt);camPitchOff*=Math.exp(-1.5*rdt)}
    updateCamera(rdt);updateHUD();
    renderer.render(scene,camera);
    frame++;
    if(frame===1){
      LOG_LINE('First frame rendered ✓');
      setTimeout(()=>logEl.classList.remove('on'), 3000);
    }
  }catch(e){
    LOG_LINE('LOOP CRASH: '+e.message,true);
    console.error(e);
  }
}

/* ================= start ================= */
$('go').addEventListener('click',()=>{
  $('start').style.display='none';
  initAudio();
  layout();
  try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
  setTimeout(layout,300);
  buildCues();phase='intro';introT=0;introI=0;
  let skip=false;try{skip=sessionStorage.getItem('cm_skip')==='1';sessionStorage.removeItem('cm_skip')}catch(e){}
  if(skip)skipIntro();
});

LOG_LINE('Starting loop…');
requestAnimationFrame(loop);
</script>
