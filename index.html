<script type="module">
import * as THREE from 'three';

import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================= helpers ================= */
const V3=THREE.Vector3,PI=Math.PI,ADD=THREE.AdditiveBlending;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),ease=k=>k*k*(3-2*k);
const $=id=>document.getElementById(id);
const wrap=$('wrap');
const fwd=y=>new V3(Math.sin(y),0,Math.cos(y));
const rightOf=y=>new V3(-Math.cos(y),0,Math.sin(y));
const dXZ=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const angDiff=(a,b)=>{let d=b-a;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d};
const randDir=()=>{const u=rnd(-1,1),a=rnd(0,2*PI),s=Math.sqrt(1-u*u);return new V3(s*Math.cos(a),u,s*Math.sin(a))};
const ARENA=24;
let W=800,H=400,rot=false;

/* ================= renderer ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
wrap.insertBefore(renderer.domElement,wrap.firstChild);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x140a20,0.016);
const camera=new THREE.PerspectiveCamera(60,2,.08,800);
let composer=null,bloom=null;
try{
 const rt=new THREE.WebGLRenderTarget(800,400,{type:THREE.HalfFloatType,samples:4});
 composer=new EffectComposer(renderer,rt);
 composer.addPass(new RenderPass(scene,camera));
 bloom=new UnrealBloomPass(new THREE.Vector2(800,400),.8,.55,.82);
 composer.addPass(bloom);composer.addPass(new OutputPass());
}catch(e){composer=null}

function layout(){
 const w=innerWidth,h=innerHeight;rot=h>w;W=rot?h:w;H=rot?w:h;
 wrap.style.width=W+'px';wrap.style.height=H+'px';
 wrap.style.transform=rot?`translate(${w}px,0) rotate(90deg)`:'none';
 wrap.style.setProperty('--u',(H/100)+'px');
 renderer.setSize(W,H);
 if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(W,H)}
 camera.aspect=W/H;camera.updateProjectionMatrix();
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ================= textures ================= */
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const stoneTex=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#38344a';g.fillRect(0,0,512,512);
 for(let i=0;i<900;i++){const l=rnd(30,70);g.fillStyle=`rgba(${l+20},${l+14},${l+40},${rnd(.05,.2)})`;g.fillRect(rnd(0,512),rnd(0,512),rnd(4,40),rnd(4,40))}
 g.strokeStyle='rgba(8,4,14,.7)';g.lineWidth=2;for(let i=0;i<40;i++){g.beginPath();let x=rnd(0,512),y=rnd(0,512);g.moveTo(x,y);for(let j=0;j<6;j++){x+=rnd(-40,40);y+=rnd(-40,40);g.lineTo(x,y)}g.stroke()}
 g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=3;g.strokeRect(0,0,512,512);g.beginPath();g.moveTo(256,0);g.lineTo(256,512);g.moveTo(0,256);g.lineTo(512,256);g.stroke();
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(9,9);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t})();

/* ================= world ================= */
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{top:{value:new THREE.Color(0x04020c)},mid:{value:new THREE.Color(0x1d0b30)},bot:{value:new THREE.Color(0x4a1030)}},
 vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top,mid,bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.?mix(mid,top,smoothstep(0.,.75,h)):mix(mid,bot,smoothstep(0.,-.25,h));gl_FragColor=vec4(c,1.);}'}));
scene.add(sky);
{const n=1400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const d=randDir();d.y=Math.abs(d.y)*.9+.05;d.normalize().multiplyScalar(470);p.set([d.x,d.y,d.z],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,map:glowTex,transparent:true,depthWrite:false,fog:false,color:0xffe0f0,blending:ADD})))}
const moonPos=new V3(-150,150,-300);
const moon=new THREE.Mesh(new THREE.SphereGeometry(34,40,28),new THREE.MeshBasicMaterial({color:0xffb0b8,fog:false}));moon.position.copy(moonPos);scene.add(moon);
const moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff2a50,blending:ADD,depthWrite:false,fog:false,transparent:true,opacity:.85}));moonGlow.scale.set(330,330,1);moonGlow.position.copy(moonPos);scene.add(moonGlow);

scene.add(new THREE.HemisphereLight(0x6a58a8,0x1a0a14,.7));
const moonLight=new THREE.DirectionalLight(0xd8c8ff,1.5);moonLight.position.set(-30,48,-26);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(1536,1536);Object.assign(moonLight.shadow.camera,{left:-27,right:27,top:27,bottom:-27,near:1,far:130});moonLight.shadow.bias=-.0004;scene.add(moonLight);
const rimLight=new THREE.DirectionalLight(0xff2a50,.55);rimLight.position.set(30,12,30);scene.add(rimLight);
const flashL=new THREE.PointLight(0xff3050,0,60,2);scene.add(flashL);let flashI=0;
const waveL=new THREE.PointLight(0xff1030,0,30,2);scene.add(waveL);

const floorMat=new THREE.MeshStandardMaterial({map:stoneTex,color:0x8a8298,roughness:.88,metalness:.08});
const floor=new THREE.Mesh(new THREE.CircleGeometry(38,72),floorMat);floor.rotation.x=-PI/2;floor.receiveShadow=true;scene.add(floor);
const dark=new THREE.Mesh(new THREE.CircleGeometry(400,48),new THREE.MeshBasicMaterial({color:0x07040c}));dark.rotation.x=-PI/2;dark.position.y=-.3;scene.add(dark);
[7,14,21,26].forEach((r,i)=>{const m=new THREE.Mesh(new THREE.RingGeometry(r-.07,r+.07,128),new THREE.MeshBasicMaterial({color:0xb0183a,transparent:true,opacity:.55-i*.08,blending:ADD,depthWrite:false}));m.rotation.x=-PI/2;m.position.y=.03;scene.add(m)});
{const g=new THREE.Group();for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.14,26),new THREE.MeshBasicMaterial({color:0xb0183a,transparent:true,opacity:.35,blending:ADD,depthWrite:false}));m.rotation.x=-PI/2;m.rotation.z=i*PI/4;m.position.y=.03;g.add(m)}scene.add(g)}
const stoneM=new THREE.MeshStandardMaterial({color:0x4a4458,roughness:.9,metalness:.05});
for(let i=0;i<12;i++){const a=i/12*2*PI+rnd(-.1,.1),r=31+rnd(-2,3),h=rnd(6,16);const p=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.4,h,9),stoneM);p.position.set(Math.cos(a)*r,h/2-.2,Math.sin(a)*r);p.rotation.set(rnd(-.06,.06),rnd(0,3),rnd(-.06,.06));p.castShadow=p.receiveShadow=true;scene.add(p);
 const cap=new THREE.Mesh(new THREE.TorusGeometry(1.25,.18,6,16),stoneM);cap.rotation.x=PI/2;cap.position.set(p.position.x,h-.4,p.position.z);scene.add(cap)}

 C(15.95,()=>{hero.play('hit');impulse(hero,new V3(0,0,-1),7);const c=hero.pos.clone();c.y=1.2;impact(c,1.6,[1.2,.3,.4]);hitstop(.1);flashScreen('#fff',.5);shake=1.6;sfx('hit')});
 C(16.6,()=>hero.play('kneel'));
 C(17.1,()=>{rival.play('rCast2');sfx('charge');say('LORD HARUTO SHIROGANE','"Scatter."',2);cageShards=[];
  for(let i=0;i<12;i++){const a=i/12*2*PI;cageShards.push(spawnShard('hold',new V3(hero.pos.x+Math.cos(a)*2.8,8+rnd(0,1.2),hero.pos.z+Math.sin(a)*2.8),{cine:true}))}
  telegraph(hero.pos,3.6,1.6,0x66ccff);shotSet(3,k=>{camera.position.set(hero.pos.x+1.2,lerp(12,8,k),hero.pos.z+3);camera.lookAt(hero.pos.x,.5,hero.pos.z)},50)});
 C(18.8,()=>{cageShards.forEach(s=>{s.mode='fall';s.dmg=0})});
 C(18.95,()=>{flashScreen('#fff',.95);sfx('boom');puff(hero.pos,60,8,2.8,2.6);slowmo(.3,1.8);shake=2.2});
 C(20.4,()=>{shotSet(3.2,k=>{camera.position.set(hero.pos.x+.3,lerp(1.3,1.75,k),hero.pos.z-lerp(3.4,1.5,k));camera.lookAt(hero.pos.x,1.75,hero.pos.z)},32);say('REN KUROGANE','"…Not yet."',2);hero.play('rise')});
 for(let i=0;i<14;i++)C(20.5+i*.12,()=>{const p=hero.pos.clone();p.x+=rnd(-.6,.6);p.y=rnd(.2,1.6);p.z+=rnd(-.6,.6);spark(p,4,2,.4,1.4,[1.2,.1,.2],-3)});
 C(20.7,()=>sfx('beat'));C(21.4,()=>sfx('beat'));
 C(22.7,()=>{hero.play('awaken',{mode:'awk'});sfx('charge');shotSet(3.6,k=>{const a=lerp(.2,2.8,ease(k)),R=lerp(3.2,6.5,k);camera.position.set(hero.pos.x+Math.sin(a)*R,lerp(1.2,2.6,k),hero.pos.z-Math.cos(a)*R);camera.lookAt(hero.pos.x,1.5,hero.pos.z)},52)});
 C(26.4,()=>{shotSet(2.4,k=>{const m=hero.pos.clone().lerp(rival.pos,.5);camera.position.set(14-k*3,2.8,m.z);camera.lookAt(0,1.6,m.z)},50);
  impulseTo(hero,rival.pos,Math.max(0,dXZ(hero.pos,rival.pos)/2-1.5));hero.play('power');impulseTo(rival,hero.pos,Math.max(0,dXZ(hero.pos,rival.pos)/2-1.5));rival.play('rSlash3')});
 C(27.05,()=>{const m=hero.pos.clone().lerp(rival.pos,.5);m.y=1.3;impact(m,3,[1.2,.4,.6]);shockwave(m.clone().setY(.05),0xffffff,14,.7);shockwave(m.clone().setY(.05),0xff2040,18,1);flashScreen('#fff',.85);sfx('boom');slowmo(.25,.9);spark(m,150,20,.45,1.1,[1.2,.5,.7],4);
  impulse(hero,hero.pos.clone().sub(rival.pos),4);impulse(rival,rival.pos.clone().sub(hero.pos),4)});
 C(28.6,()=>endIntro());
 cues.sort((a,b)=>a[0]-b[0]);
}
function updateIntro(rdt){introT+=rdt;while(introI<cues.length&&introT>=cues[introI][0]){cues[introI][1]();introI++}
 faceTo(hero,rival.pos,rdt,8);faceTo(rival,hero.pos,rdt,8)}
function endIntro(){
 if(phase!=='intro')return;phase='play';shot=null;cpInit=false;document.body.classList.remove('cine');$('sub').style.opacity=0;
 shards.forEach(s=>{scene.remove(s.m)});shards.length=0;timers.length=0;
 hero.anim=null;rival.anim=null;rival.root.visible=true;hero.stun=0;rival.stun=0;rival.invuln=0;hero.invuln=0;hero.knock.set(0,0,0);rival.knock.set(0,0,0);
 const m=hero.pos.clone().lerp(rival.pos,.5);const d=new V3(hero.pos.x-rival.pos.x,0,hero.pos.z-rival.pos.z);if(d.length()<4)d.set(0,0,1);d.normalize();
 hero.pos.copy(m).addScaledVector(d,3.6);rival.pos.copy(m).addScaledVector(d,-3.6);clampA(hero.pos);clampA(rival.pos);
  hero.hp=Math.round(hero.max*.8);energy=100;state.awakened=true;state.awakeT=30;state.beast=false;setMode();
 faceRivalNow();faceHero(rival);ai.mode='neutral';ai.cool=1.4;ai.phase=1;ai.gen++;combo=0;slowT=0;
 banner('FIGHT','',1.8);sfx('shing')}
function skipIntro(){if(phase!=='intro')return;introI=cues.length;slowT=0;timeScale=1;endIntro()}

/* ================= HUD ================= */
const E={hpH:$('hpH').firstElementChild,enH:$('enH').firstElementChild,hpR:$('hpR').firstElementChild,bAw:$('bAw'),bBe:$('bBe'),combo:$('combo')};
const BT={};['bSlash','bPower','bWave','bAwk','bBeast','bDash','bCam'].forEach(id=>BT[id]=$(id));
const CD={};['bPower','bWave','bDash'].forEach(id=>CD[id]=BT[id].querySelector('.cd'));
function updateHUD(){
 E.hpH.style.transform=`scaleX(${clamp(hero.hp/hero.max,0,1)})`;
 E.enH.style.transform=`scaleX(${clamp(energy/100,0,1)})`;
 E.hpR.style.transform=`scaleX(${clamp(rival.hp/rival.max,0,1)})`;
 CD.bPower.style.transform=`scaleY(${clamp(cd.power/2.5,0,1)})`;
 CD.bWave.style.transform=`scaleY(${clamp(cd.wave/3,0,1)})`;
 CD.bDash.style.transform=`scaleY(${clamp(cd.dash/1,0,1)})`;
 BT.bPower.classList.toggle('low',energy<20);
 BT.bWave.classList.toggle('low',energy<35);
 BT.bAwk.classList.toggle('on',state.awakened);BT.bAwk.classList.toggle('low',!state.awakened&&energy<60);
 BT.bBeast.classList.toggle('on',state.beast);BT.bBeast.classList.toggle('low',!state.beast&&energy<80);
 E.bAw.style.display=state.awakened?'block':'none';E.bAw.textContent='AWAKENED '+Math.ceil(state.awakeT)+'s';
 E.bBe.style.display=state.beast?'block':'none';E.bBe.textContent='BEAST '+Math.ceil(state.beastT)+'s';
 E.combo.textContent=combo+' HITS';E.combo.style.opacity=(combo>1&&comboT>0)?1:0}

/* ================= input ================= */
const zone=$('zone'),look=$('look'),kBase=$('knobBase'),knob=$('knob');
let sid=null,sx0=0,sy0=0,lid=null,lx0=0,ly0=0;
const toW=(dx,dy)=>rot?[dy,-dx]:[dx,dy];
const toWPt=(cx,cy)=>rot?[cy,innerWidth-cx]:[cx,cy];
function stickReset(){sid=null;stick.x=0;stick.y=0;knob.style.transform='none';kBase.style.left='calc(var(--u)*8)';kBase.style.top='auto';kBase.style.bottom='calc(var(--u)*8)';kBase.style.opacity=.5}
zone.addEventListener('pointerdown',e=>{if(sid!==null)return;e.preventDefault();sid=e.pointerId;sx0=e.clientX;sy0=e.clientY;try{zone.setPointerCapture(e.pointerId)}catch(_){}
 const[px,py]=toWPt(e.clientX,e.clientY),s=H/100*20;kBase.style.left=(px-s/2)+'px';kBase.style.top=(py-s/2)+'px';kBase.style.bottom='auto';kBase.style.opacity=.9});
zone.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;const[dx,dy]=toW(e.clientX-sx0,e.clientY-sy0),ru=H/100*9;
 let vx=dx/ru,vy=dy/ru;const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}stick.x=vx;stick.y=-vy;knob.style.transform=`translate(${vx*ru}px,${vy*ru}px)`});
['pointerup','pointercancel'].forEach(n=>zone.addEventListener(n,e=>{if(e.pointerId===sid)stickReset()}));
look.addEventListener('pointerdown',e=>{if(lid!==null)return;lid=e.pointerId;lx0=e.clientX;ly0=e.clientY;try{look.setPointerCapture(e.pointerId)}catch(_){}});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;const[dx,dy]=toW(e.clientX-lx0,e.clientY-ly0);lx0=e.clientX;ly0=e.clientY;
 camYawOff=clamp(camYawOff+dx*.006,-1.3,1.3);camPitchOff=clamp(camPitchOff-dy*.003,-.5,.5)});
['pointerup','pointercancel'].forEach(n=>look.addEventListener(n,e=>{if(e.pointerId===lid)lid=null}));
const bind=(id,fn)=>{const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();e.classList.add('press');fn()});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>e.classList.remove('press')))};
function toggleCam(){fp=!fp;$('camLbl').textContent=fp?'1ST':'3RD';cpInit=false;fovPunch=6;shot=(phase==='intro')?shot:null}
bind('bSlash',()=>tryAction('slash'));bind('bPower',()=>tryAction('power'));bind('bWave',()=>tryAction('wave'));
bind('bAwk',()=>tryAction('awaken'));bind('bBeast',()=>tryAction('beast'));bind('bDash',()=>tryAction('dash'));
bind('bCam',toggleCam);
$('bSkip').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();skipIntro()});
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
 if(k==='j')tryAction('slash');else if(k==='k')tryAction('power');else if(k==='l')tryAction('wave');
 else if(k==='u')tryAction('awaken');else if(k==='i')tryAction('beast');else if(k===' ')tryAction('dash');else if(k==='c')toggleCam()});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ================= audio ================= */
let AC=null,master=null,nbuf=null;
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 [55,55.7,82.4].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=i===2?'triangle':'sine';o.frequency.value=f;g.gain.value=i===2?.015:.05;o.connect(g);g.connect(master);o.start()})}catch(e){AC=null}}
function noise(type,f0,f1,dur,vol,q=1){const s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.Q.value=q;const t=AC.currentTime;
 fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.2);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05)}
function tone(type,f0,f1,dur,vol){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function sfx(n){if(!AC)return;try{switch(n){
 case'whoosh':noise('bandpass',400,2400,.28,.5,1.2);break;
 case'hit':noise('lowpass',2500,200,.18,.9);tone('sine',140,40,.22,.8);break;
 case'boom':noise('lowpass',600,40,1.4,1);tone('sine',80,22,1.4,1);break;
 case'charge':tone('sawtooth',70,520,1.1,.12);noise('highpass',500,4000,1.1,.18);break;
 case'shing':noise('highpass',4000,9000,.25,.35);tone('sine',2600,3200,.2,.07);break;
 case'wave':noise('bandpass',200,1800,.5,.7,.8);tone('sine',110,50,.5,.7);break;
 case'beat':tone('sine',60,30,.25,.9);break}}catch(e){}}

/* ================= main loop ================= */
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 if(slowT>0){slowT-=rdt;timeScale=slowS}else timeScale+=(1-timeScale)*Math.min(1,rdt*5);
 let dt=rdt*timeScale;if(hitstopT>0){hitstopT-=rdt;dt=0}
 T+=dt;
 for(let i=timers.length-1;i>=0;i--){const tm=timers[i];tm.t-=dt;if(tm.t<=0){timers.splice(i,1);tm.fn()}}
 if(phase==='intro')updateIntro(rdt);
 else if(phase==='play'){updateHero(dt);updateAI(dt);updateState(dt)}
 else if(phase==='win'||phase==='lose'){faceTo(hero,rival.pos,dt,6);faceTo(rival,hero.pos,dt,6)}
 hero.update(dt);rival.update(dt);
 updateShards(dt);updateWaves(dt);
 for(let i=fx.length-1;i>=0;i--)if(!fx[i](dt))fx.splice(i,1);
 flashI*=Math.exp(-10*dt);flashL.intensity=flashI;
 ambientFx(dt);glow.update(dt);smoke.update(dt);
 if(lid===null){camYawOff*=Math.exp(-1.5*rdt);camPitchOff*=Math.exp(-1.5*rdt)}
 updateCamera(rdt);updateHUD();
 if(composer)composer.render();else renderer.render(scene,camera)}

/* ================= start ================= */
$('go').addEventListener('click',async()=>{
 $('start').style.display='none';initAudio();
 try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}
 try{await screen.orientation.lock('landscape')}catch(e){}
 setTimeout(layout,300);
 buildCues();phase='intro';introT=0;introI=0;
 let skip=false;try{skip=sessionStorage.getItem('cm_skip')==='1';sessionStorage.removeItem('cm_skip')}catch(e){}
 if(skip)skipIntro()});

layout();setMode();requestAnimationFrame(loop);
</script>
