<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gojo vs Sukuna · The Strongest Duel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, serif; color: #fff; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  canvas { display: block; position: absolute; inset: 0; }
  .o { position: absolute; inset: 0; pointer-events: none; }
  .lb { position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 3; }
  #ban { top: 30%; text-align: center; opacity: 0; z-index: 5; text-shadow: 0 0 30px #7a2cff, 0 0 8px #000; }
  #ban b { display: block; font-size: min(9vw, 15vh); letter-spacing: .12em; }
  #ban i { font-size: min(3vw, 5vh); letter-spacing: .4em; color: #cdb8ff; font-style: normal; }
  #ban.s { animation: bn var(--d, 2s) ease both; }
  @keyframes bn { 0% { opacity: 0; transform: scale(1.5); } 12% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  #sub { bottom: 13%; top: auto; text-align: center; font-size: min(3.4vw, 6vh); font-style: italic; z-index: 5; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 8px #000; }
  #sub b { display: block; font-style: normal; font-size: .55em; letter-spacing: .3em; color: #9ad0ff; margin-bottom: .2em; }
  #fl { background: #fff; opacity: 0; z-index: 4; }
  #st, #en { z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle, #1a0a30, #000); pointer-events: auto; }
  #en { display: none; background: #000; opacity: 0; transition: opacity 1.2s; }
  h1 { font-size: min(8vw, 14vh); letter-spacing: .14em; margin: 0; text-shadow: 0 0 30px #7a2cff; }
  h2 { font-weight: 400; letter-spacing: .4em; color: #cdb8ff; font-size: min(2.6vw, 4.5vh); margin: .6em 0 2em; }
  button { font: inherit; font-size: min(4vw, 7vh); padding: .5em 1.8em; color: #fff; background: linear-gradient(#5a22b0, #220a50); border: 2px solid #b78cff; border-radius: 99px; box-shadow: 0 0 30px #7a2cff; letter-spacing: .15em; cursor: pointer; pointer-events: auto; }
  button:active { transform: scale(.95); }
  p { color: #a99; font-size: min(2.2vw, 4vh); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  }
}
</script>

<body>
<div id="stage">
  <div class="lb" style="top:0"></div>
  <div class="lb" style="bottom:0"></div>
  <div class="o" id="fl"></div>
  <div class="o" id="ban"></div>
  <div class="o" id="sub"></div>
  <div class="o" id="st">
    <h1>GOJO vs SUKUNA</h1>
    <h2>JUJUTSU KAISEN · THE STRONGEST DUEL</h2>
    <button id="go">▶ PLAY</button>
    <p>Sound on · Landscape · about 60 seconds</p>
  </div>
  <div class="o" id="en">
    <h1>GOJO vs SUKUNA</h1>
    <h2>THE STRONGEST</h2>
    <button id="re">REPLAY</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   HELPERS
   ============================================================ */
const V = THREE.Vector3, PI = Math.PI, AD = THREE.AdditiveBlending;
const rnd = (a, b) => a + Math.random() * (b - a);
const cl  = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const es  = k => k * k * (3 - 2 * k);
const $   = i => document.getElementById(i);
const rd  = () => { const u = rnd(-1, 1), a = rnd(0, 2*PI), s = Math.sqrt(1-u*u); return new V(s*Math.cos(a), u, s*Math.sin(a)); };

/* ============================================================
   STAGE
   ============================================================ */
const stage = $('stage');
let W = innerWidth, H = innerHeight;

function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(W, H); }
  cam.aspect = W / H;
  cam.updateProjectionMatrix();
}

/* ============================================================
   RENDERER
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, 2, .1, 800);

let composer = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, cam));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 1.1, .7, .5));
  composer.addPass(new OutputPass());
} catch (e) { composer = null; }

addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 250));
layout();

/* ============================================================
   TEXTURES
   ============================================================ */
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, '#fff'); r.addColorStop(.35, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

const winTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 124; y += 8) for (let x = 4; x < 60; x += 8)
    if (Math.random() < .35) { g.fillStyle = Math.random() < .5 ? '#ffd89a' : '#9ad0ff'; g.fillRect(x, y, 4, 5); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

/* ============================================================
   LIGHTING
   ============================================================ */
const ambient = new THREE.AmbientLight(0x8899cc, 1.8);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xaabbff, 0x221122, 2.2);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
keyLight.position.set(5, 12, 8);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xaa66ff, 2.0);
rimLight.position.set(-8, 6, -10);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xff5566, 1.5);
fillLight.position.set(10, 4, -6);
scene.add(fillLight);

const combatLight = new THREE.PointLight(0xffffff, 0, 80, 2);
scene.add(combatLight);
let combatLightI = 0;

/* ============================================================
   FLOOR
   ============================================================ */
const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a38, roughness: .7, metalness: .2 });
const floorMesh = new THREE.Mesh(new THREE.CircleGeometry(120, 48), floorMat);
floorMesh.rotation.x = -PI / 2;
scene.add(floorMesh);

/* ============================================================
   CITY SKYLINE
   ============================================================ */
const cityGroup = new THREE.Group();
scene.add(cityGroup);
const buildings = [];
for (let i = 0; i < 90; i++) {
  const a = rnd(0, 2 * PI), r = rnd(22, 85), h = rnd(8, 42), w = rnd(4, 9);
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, rnd(4, 9)),
    new THREE.MeshStandardMaterial({ color: 0x2a2c40, roughness: .9, emissive: 0xffffff, emissiveMap: winTex, emissiveIntensity: .6 })
  );
  m.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
  m.userData = { y0: h / 2, f: -1, d: Math.random() < .5 ? 1 : -1 };
  cityGroup.add(m);
  buildings.push(m);
}

const moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xbbccff, blending: AD, transparent: true, depthWrite: false, fog: false }));
moonSprite.scale.set(90, 90, 1);
moonSprite.position.set(-90, 90, -120);
scene.add(moonSprite);

const stars = new THREE.Points((() => {
  const n = 3000, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const d = new V(rnd(-1,1), rnd(-1,1), rnd(-1,1)).normalize().multiplyScalar(rnd(20, 90)); p.set([d.x, d.y, d.z], i*3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); return g;
})(), new THREE.PointsMaterial({ size: .5, map: glowTex, color: 0xcfe4ff, blending: AD, transparent: true, depthWrite: false }));
stars.visible = false;
scene.add(stars);

/* ============================================================
   SUKUNA'S THRONE + MALEVOLENT SHRINE
   ============================================================ */
const shrine = new THREE.Group();

const boneMat   = new THREE.MeshStandardMaterial({ color: 0xe8dcc8, emissive: 0x330808, emissiveIntensity: .5, roughness: .55 });
const darkBone  = new THREE.MeshStandardMaterial({ color: 0x9a8878, emissive: 0x220404, emissiveIntensity: .3, roughness: .7 });
const shrineRed = new THREE.MeshStandardMaterial({ color: 0x3a0404, emissive: 0xcc0018, emissiveIntensity: 1.4, roughness: .45, metalness: .2 });
const shrineDark= new THREE.MeshStandardMaterial({ color: 0x120202, emissive: 0x660010, emissiveIntensity: .9, roughness: .5 });
const goldMat   = new THREE.MeshStandardMaterial({ color: 0xaa8822, emissive: 0x553300, emissiveIntensity: .6, roughness: .3, metalness: .8 });

const altar = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.6, 2.4, 8), shrineDark);
altar.position.y = 1.2; shrine.add(altar);

for (let i = 0; i < 4; i++) {
  const a = (i / 4) * PI * 2 + PI / 4;
  const r = 4.2;
  const px = Math.cos(a) * r, pz = Math.sin(a) * r;
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(.35, .5, 7, 7), shrineRed);
  pillar.position.set(px, 3.5, pz);
  shrine.add(pillar);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, .4, 1.1), shrineDark);
  base.position.set(px, .2, pz); shrine.add(base);
  const sk = new THREE.Mesh(new THREE.SphereGeometry(.55, 12, 10), boneMat);
  sk.position.set(px, 7.2, pz); sk.scale.set(1, 1.15, 1); shrine.add(sk);
  const jw = new THREE.Mesh(new THREE.BoxGeometry(.7, .2, .5), darkBone);
  jw.position.set(px, 6.85, pz + .2); shrine.add(jw);
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff1030 }));
    e.position.set(px + s * .22, 7.3, pz + .35); shrine.add(e);
  }
  const arc = new THREE.Mesh(new THREE.TorusGeometry(.3, .06, 6, 12, PI), boneMat);
  arc.position.set(px * .55, 5.5, pz * .55);
  arc.lookAt(0, 6, 0);
  shrine.add(arc);
}

const giantSkull = new THREE.Mesh(new THREE.SphereGeometry(1.4, 20, 16), boneMat);
giantSkull.position.y = 5.8; giantSkull.scale.set(1, 1.2, .95); shrine.add(giantSkull);
const giantJaw = new THREE.Mesh(new THREE.BoxGeometry(1.6, .4, 1.0), darkBone);
giantJaw.position.set(0, 5.0, .5); shrine.add(giantJaw);
for (const s of [-1, 1]) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(.35, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff0018 }));
  e.position.set(s * .5, 5.9, .9); shrine.add(e);
  const br = new THREE.Mesh(new THREE.BoxGeometry(.6, .15, .2), darkBone);
  br.position.set(s * .5, 6.25, .85); br.rotation.z = s * .2; shrine.add(br);
  const horn = new THREE.Mesh(new THREE.ConeGeometry(.18, 1.6, 6), boneMat);
  horn.position.set(s * .9, 7.0, .1); horn.rotation.z = s * .5; shrine.add(horn);
}
const crownRing = new THREE.Mesh(new THREE.TorusGeometry(1.3, .06, 6, 20), goldMat);
crownRing.rotation.x = PI / 2; crownRing.position.y = 7.1; shrine.add(crownRing);

for (let i = 0; i < 6; i++) {
  const a = (i / 6) * PI * 2;
  const rib = new THREE.Mesh(new THREE.TorusGeometry(2.8, .08, 5, 16, PI), boneMat);
  rib.position.set(0, 3.2, 0);
  rib.rotation.set(PI / 2, a, 0);
  shrine.add(rib);
}

for (let i = 0; i < 12; i++) {
  const a = (i / 12) * PI * 2;
  const r = 3.5;
  const spike = new THREE.Mesh(new THREE.ConeGeometry(.2, 1.2, 5), darkBone);
  spike.position.set(Math.cos(a) * r, .4, Math.sin(a) * r);
  spike.rotation.x = PI;
  shrine.add(spike);
}

const throne = new THREE.Group();
const throneDarkMat = new THREE.MeshStandardMaterial({ color: 0x0a0202, emissive: 0xaa0018, emissiveIntensity: 1.2, roughness: .4 });
const throneBoneMat = new THREE.MeshStandardMaterial({ color: 0xe0d0b8, emissive: 0x220000, emissiveIntensity: .5, roughness: .6 });

const seat = new THREE.Mesh(new THREE.BoxGeometry(1.8, .35, 1.5), throneDarkMat);
seat.position.y = 1.0; throne.add(seat);
const back = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.2, .3), throneDarkMat);
back.position.set(0, 2.1, -.7); throne.add(back);
for (const s of [-1, 1]) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(.3, .35, 1.4), throneDarkMat);
  arm.position.set(s * 1.0, 1.35, 0); throne.add(arm);
  const s2 = new THREE.Mesh(new THREE.SphereGeometry(.25, 10, 8), throneBoneMat);
  s2.position.set(s * 1.0, 1.65, .6); throne.add(s2);
  for (let i = 0; i < 3; i++) {
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(.04, .35, 3, 5), throneBoneMat);
    b.position.set(s * 1.0, 1.15 + i * .12, -.3 + i * .2);
    b.rotation.z = s * .3;
    throne.add(b);
  }
}
for (let i = 0; i < 2; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(2.2 + i * .5, .2, 1.8 + i * .4), throneDarkMat);
  step.position.y = .1 + i * .2; step.position.z = .2 - i * .1;
  throne.add(step);
}
const throneSkull = new THREE.Mesh(new THREE.SphereGeometry(.7, 14, 12), throneBoneMat);
throneSkull.position.set(0, 3.5, -.7); throneSkull.scale.set(1, 1.1, 1); throne.add(throneSkull);
for (const s of [-1, 1]) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff2030 }));
  e.position.set(s * .22, 3.55, -.25); throne.add(e);
  const horn = new THREE.Mesh(new THREE.ConeGeometry(.12, 1.4, 5), throneBoneMat);
  horn.position.set(s * .8, 4.1, -.65);
  horn.rotation.z = s * .4;
  throne.add(horn);
}

throne.position.set(0, 0, -3.2);
throne.rotation.y = PI;
throne.visible = false;
shrine.add(throne);

shrine.position.set(0, 0, 0);
shrine.visible = false;
scene.add(shrine);

/* ============================================================
   ENVIRONMENT PRESETS
   ============================================================ */
const ENV = {
  city:   { bg: 0x1a1030, fog: 0x302050, density: .008, hemi: 0x8899cc, floor: 0x2a2a38 },
  shrine: { bg: 0x200000, fog: 0x500810, density: .014, hemi: 0xaa4444, floor: 0x400808 },
  void:   { bg: 0x000000, fog: null,    density: 0,     hemi: 0x334488, floor: 0x000000 }
};
function setEnv(name) {
  const e = ENV[name];
  scene.background = new THREE.Color(e.bg);
  scene.fog = e.density ? new THREE.FogExp2(e.fog, e.density) : null;
  hemi.color.set(e.hemi);
  floorMat.color.set(e.floor);
  cityGroup.visible = name === 'city';
  floorMesh.visible = name !== 'void';
  shrine.visible = name === 'shrine';
  stars.visible = name === 'void';
  moonSprite.visible = name === 'city';
}
setEnv('city');

/* ============================================================
   PARTICLES
   ============================================================ */
class ParticleSystem {
  constructor(max, blending) {
    this.max = max; this.n = 0;
    const A = k => new Float32Array(max * k);
    this.p = A(3); this.c = A(3); this.s = A(1); this.a = A(1);
    this.v = A(3); this.l = A(1); this.tt = A(1); this.s0 = A(1); this.gr = A(1); this.dr = A(1);
    const g = new THREE.BufferGeometry(); this.g = g;
    const at = (n, a, k) => g.setAttribute(n, new THREE.BufferAttribute(a, k).setUsage(THREE.DynamicDrawUsage));
    at('position', this.p, 3); at('pc', this.c, 3); at('ps', this.s, 1); at('pa', this.a, 1);
    this.m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending,
      uniforms: { sc: { value: 600 } },
      vertexShader: `attribute vec3 pc; attribute float ps, pa; uniform float sc; varying vec3 vC; varying float vA;
        void main(){ vC=pc; vA=pa; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=ps*sc/(-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader: `varying vec3 vC; varying float vA;
        void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.05,d)*vA; if(a<.01)discard; gl_FragColor=vec4(vC,a); }`
    });
    const pts = new THREE.Points(g, this.m);
    pts.frustumCulled = false;
    scene.add(pts);
  }
  e(x, y, z, vx, vy, vz, s, t, r, g, b, gr = 0, dr = 0) {
    const i = this.n; this.n = (i + 1) % this.max;
    this.p.set([x, y, z], i * 3); this.v.set([vx, vy, vz], i * 3); this.c.set([r, g, b], i * 3);
    this.s0[i] = this.s[i] = s; this.tt[i] = this.l[i] = t; this.gr[i] = gr; this.dr[i] = dr; this.a[i] = 1;
  }
  u(dt) {
    const v = this.v, p = this.p;
    for (let i = 0; i < this.max; i++) {
      let l = this.l[i]; if (l <= 0) continue;
      l -= dt; this.l[i] = l;
      if (l <= 0) { this.s[i] = 0; this.a[i] = 0; continue; }
      const k = l / this.tt[i], d = Math.max(0, 1 - this.dr[i] * dt);
      v[i*3] *= d; v[i*3+1] = v[i*3+1] * d - this.gr[i] * dt; v[i*3+2] *= d;
      p[i*3] += v[i*3] * dt; p[i*3+1] += v[i*3+1] * dt; p[i*3+2] += v[i*3+2] * dt;
      this.a[i] = Math.min(1, k * 1.6);
      this.s[i] = this.s0[i] * (.35 + .65 * k);
    }
    for (const n of ['position', 'pc', 'ps', 'pa']) this.g.attributes[n].needsUpdate = true;
  }
}
const glowParticles = new ParticleSystem(3500, AD);
const smokeParticles = new ParticleSystem(800, THREE.NormalBlending);

const spark = (p, n, spd, sz, t, c, g = 6) => {
  for (let i = 0; i < n; i++) {
    const v = rd().multiplyScalar(spd * rnd(.25, 1));
    glowParticles.e(p.x, p.y, p.z, v.x, v.y, v.z, sz * rnd(.5, 1.3), t * rnd(.6, 1.3), c[0], c[1], c[2], g, 1.4);
  }
};
const puff = (p, n, spd, sz, t, c = [.4, .38, .4]) => {
  for (let i = 0; i < n; i++) {
    const v = rd().multiplyScalar(spd * rnd(.2, 1)); v.y = Math.abs(v.y) * .6;
    smokeParticles.e(p.x + rnd(-.6,.6), p.y, p.z + rnd(-.6,.6), v.x, v.y, v.z, sz * rnd(.6, 1.2), t * rnd(.7, 1.2), c[0], c[1], c[2], -.4, 1.6);
  }
};

/* ============================================================
   FX
   ============================================================ */
const fxList = [];
const ringGeo = new THREE.RingGeometry(.9, 1, 64);
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
let shake = 0;
const BM = (c, ad = true) => new THREE.MeshBasicMaterial({ color: c, transparent: true, blending: ad ? AD : THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide });

function ringFX(p, c, max, dur, vert) {
  const m = new THREE.Mesh(ringGeo, BM(c));
  if (vert) m.rotation.y = PI / 2; else m.rotation.x = -PI / 2;
  m.position.copy(p); scene.add(m);
  let t = 0;
  fxList.push(dt => {
    t += dt; const k = Math.min(1, t / dur);
    m.scale.setScalar(.2 + max * (1 - Math.pow(1 - k, 3)));
    m.material.opacity = (1 - k) * .9;
    if (k >= 1) { scene.remove(m); return false; }
    return true;
  });
}
function sphereFX(p, c, max, dur, ad = true) {
  const m = new THREE.Mesh(sphereGeo, BM(c, ad));
  m.position.copy(p); scene.add(m);
  let t = 0;
  fxList.push(dt => {
    t += dt; const k = Math.min(1, t / dur);
    m.scale.setScalar(.2 + max * Math.sqrt(k));
    m.material.opacity = (1 - k) * .85;
    if (k >= 1) { scene.remove(m); return false; }
    return true;
  });
}
function boltFX(a, b, c) {
  const pts = [];
  for (let i = 0; i <= 10; i++) {
    const q = a.clone().lerp(b, i / 10);
    if (i && i < 10) q.add(rd().multiplyScalar(.5));
    pts.push(q);
  }
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: c, transparent: true, blending: AD }));
  scene.add(l);
  let t = 0;
  fxList.push(dt => {

function makeCharacter(opts) {
  const g = new THREE.Group();
  const M = (c, o = {}) => new THREE.MeshStandardMaterial({
    color: c, roughness: o.r ?? .6, metalness: o.m ?? .15,
    emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 0

  const cap = (r, l, m, y) => {
    const x = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 6, 10), m);
    x.position.y = y; x.castShadow = true; return x;
  };
  const grp = (p, x, y, z) => { const q = new THREE.Group(); q.position.set(x, y, z); p.add(q); return q; };

  // HIPS
  const hips = grp(g, 0, 1.0, 0);

  const collar = new THREE.Mesh(new THREE.CylinderGeometry(.1, .12, .08, 14), topM);
  collar.position.y = .68; torso.add(collar);

  // NECK
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.07, .08, .14, 12), skinM);

  // HEAD

  const arm = (s, p, y, slM, faM) => {

  // LEGS
  const leg = s => {
    const hp = grp(hips, s * .13, 0, 0);

  const legL = leg(1);
  const legR = leg(-1);

  const c = {
    g, hips, torso, head, armL, armR, legL, legR,
    L: armL, R: armR, lL: legL, lR: legR,
    p: g.position, cur: { ...POSE.idle }, tgt: POSE.idle,
    ret: 0, yaw: 0, pv: new V(), spd: 0, hd: 0, tilt: 0
  };
  for (const k of KEYS) if (c.cur[k] === undefined) c.cur[k] = 0;
  scene.add(g);
  return c;
}

function track(trackArr, t) {
  if (t <= trackArr[0][0]) return trackArr[0];
  for (let i = 1; i < trackArr.length; i++) {
    if (t <= trackArr[i][0]) {
      const a = trackArr[i - 1], b = trackArr[i];
      const k = es((t - a[0]) / (b[0] - a[0]));
      return [t, lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)];
    }
  }
  return trackArr[trackArr.length - 1];
}

function updateFighter(f, trackArr, other, dt, time) {
  const t = track(trackArr, time);
  f.p.set(t[1], t[3], t[2]);
  const targetYaw = Math.atan2(other.p.x - f.p.x, other.p.z - f.p.z);
  f.yaw = lerp(f.yaw, targetYaw, 1 - Math.exp(-8 * dt));
  f.g.rotation.y = f.yaw;

  const speed = f.pv.distanceTo(f.p) / Math.max(dt, .001);
  f.spd = cl(speed / 9, 0, 1.2);
  f.pv.copy(f.p);
  f.hd += dt * (6 + f.spd * 8);

  const airborne = t[3] > .3;
  const targetTilt = airborne ? cl((t[3] - .3) * .35, 0, .5) : 0;
  f.tilt = lerp(f.tilt, targetTilt, 1 - Math.exp(-6 * dt));
  f.g.rotation.x = f.tilt;

  if (f.ret > 0) { f.ret -= dt; if (f.ret <= 0) f.tgt = POSE.idle; }
  const k = Math.min(1, 18 * dt), c = f.cur;
  for (const n of KEYS) c[n] += ((f.tgt[n] || 0) - c[n]) * k;

  const sw = Math.sin(f.hd) * .7 * f.spd;
  f.hips.position.y = 1 + c.hy + Math.sin(time * 2) * .015 - f.spd * .04;
  f.torso.rotation.set(c.tx, c.ty, 0);
  f.head.rotation.x = c.hdx;
  f.L.sh.rotation.set(c.lsx, 0, c.lsz); f.L.el.rotation.x = c.lel;
  f.R.sh.rotation.set(c.rsx, 0, c.rsz); f.R.el.rotation.x = c.rel;
  f.lL.hp.rotation.x = c.lhx + sw; f.lL.kn.rotation.x = c.lkn + Math.max(0, -sw) * 1.1;
  f.lR.hp.rotation.x = c.rhx - sw; f.lR.kn.rotation.x = c.rkn + Math.max(0, sw) * 1.1;
}

/* ============================================================
   AUDIO — Real sound effects via URLs, with synthesized fallback
   ============================================================ */
let AC = null, masterGain = null, noiseBuf = null, musicStep = 0;
const audioCache = {};

// Direct MP3 URLs derived from MyInstants pages
const SOUND_URLS = {
  gojoDomain:      'https://www.myinstants.com/media/sounds/gojo-domain-expansion.mp3',
  sukunaDomain:    'https://www.myinstants.com/media/sounds/domain-expansion-sukuna.mp3',
  malevolentShrine:'https://www.myinstants.com/media/sounds/malevolent-shrine.mp3',
  hollowPurple:    'https://www.myinstants.com/media/sounds/hollow-purple.mp3',
  sukunaLaugh:     'https://www.myinstants.com/media/sounds/sukuna-laugh.mp3',
  explode:         'https://www.myinstants.com/media/sounds/exploded.mp3',
  nuke:            'https://www.myinstants.com/media/sounds/nuke-bomb.mp3'
};

function initAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = .7; masterGain.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    [55, 55.6, 82.4].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = i > 1 ? 'triangle' : 'sine';
      o.frequency.value = f;
      g.gain.value = i > 1 ? .015 : .06;
      o.connect(g); g.connect(masterGain); o.start();
    });
    // Preload all real sounds
    for (const [k, url] of Object.entries(SOUND_URLS)) {
      const a = new Audio(url);
      a.preload = 'auto';
      a.crossOrigin = 'anonymous';
      a.onerror = () => { audioCache[k] = null; };
      a.oncanplaythrough = () => { audioCache[k] = a; };
      audioCache[k] = a;
    }
  } catch (e) { AC = null; }
}

function noise(type, f0, f1, dur, vol, q = 1) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q;
  const t = AC.currentTime;
  f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * .15);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t + dur + .05);
}

function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  const t = AC.currentTime + delay;
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + .05);
}

// Play a real sound if available, else synth fallback
function playReal(key, fallback) {
  const a = audioCache[key];
  if (a && a.readyState >= 2) {
    try {
      a.currentTime = 0;
      a.volume = .9;
      a.play().catch(() => fallback && fallback());
      return true;
    } catch (e) {}
  }
  if (fallback) fallback();
  return false;
}

function sfx(n) {
  if (!AC) return;
  try {
    switch (n) {
      case 'gojoDomain':
        if (!playReal('gojoDomain', () => { tone('sawtooth', 60, 900, 2.2, .12); noise('highpass', 300, 6000, 2.2, .25); })) return;
        break;
      case 'sukunaDomain':
        if (!playReal('sukunaDomain', () => { noise('lowpass', 200, 50, 2.0, .8); tone('sine', 60, 20, 2.0, .9); })) return;
        break;
      case 'malevolentShrine':
        if (!playReal('malevolentShrine', () => { noise('lowpass', 1000, 40, 2.0, 1); tone('sine', 70, 18, 2.0, 1); })) return;
        break;
      case 'hollowPurple':
        if (!playReal('hollowPurple', () => { noise('lowpass', 200, 3000, .8, .7); tone('sawtooth', 40, 500, .9, .3); tone('sine', 70, 25, 1.5, .9); })) return;
        break;
      case 'sukunaLaugh':
        if (!playReal('sukunaLaugh', () => { noise('bandpass', 400, 900, 1.2, .4, 2); })) return;
        break;
      case 'explode':
        if (!playReal('explode', () => { noise('lowpass', 2800, 200, .18, .9); tone('sine', 150, 40, .22, .8); })) return;
        break;
      case 'nuke':
        if (!playReal('nuke', () => {
          noise('lowpass', 1200, 30, 2.0, 1.0);
          tone('sine', 90, 18, 1.8, 1.2);
          tone('triangle', 55, 22, 2.2, .8);
          tone('sine', 35, 15, 2.5, 1.0);
        })) return;
        break;
      case 'whoosh': noise('bandpass', 400, 2600, .28, .5, 1.2); break;
      case 'hit': noise('lowpass', 2800, 200, .18, .9); tone('sine', 150, 40, .22, .8); break;
      case 'boom': noise('lowpass', 700, 40, 1.4, 1); tone('sine', 85, 20, 1.5, 1); break;
      case 'heavyBoom':
        noise('lowpass', 1200, 30, 2.0, 1.0);
        tone('sine', 90, 18, 1.8, 1.2);
        tone('triangle', 55, 22, 2.2, .8);
        tone('sine', 35, 15, 2.5, 1.0);
        break;
      case 'crack':
        noise('highpass', 3000, 9000, .25, .8);
        tone('square', 900, 60, .3, .3);
        tone('sine', 60, 25, .8, .9);
        break;
      case 'slash':
        noise('highpass', 2500, 9000, .2, .5);
        noise('bandpass', 1500, 6000, .15, .4, 3);
        break;
      case 'shing':
        noise('highpass', 4000, 9000, .25, .35);
        tone('sine', 2600, 3400, .2, .07);
        break;
      case 'riser':
        tone('sawtooth', 60, 900, 2.2, .12);
        noise('highpass', 300, 6000, 2.2, .25);
        break;
      case 'charge':
        tone('sawtooth', 70, 520, 1, .1);
        noise('highpass', 500, 4000, 1, .15);
        break;
      case 'hum':
        tone('sine', 110, 220, 1.6, .4);
        tone('sawtooth', 55, 110, 1.6, .15);
        break;
      case 'beat':
        tone('sine', 60, 30, .25, .9);
        tone('sine', 60, 30, .25, .9, .35);
        break;
    }
  } catch (e) {}
}

const MUSIC_INTENSITY = [[0,.1],[5,.25],[8.5,.9],[14,.6],[19,.85],[26.4,.3],[28.4,.95],[35.4,.45],[43.5,.3],[44.5,.7],[48,.2],[54.4,.85],[56.2,0]];
const BASS_NOTES = [55,55,65.4,49,55,55,73.4,65.4];
const ARP_NOTES = [220,262,330,392,330,262];

function musicTick() {
  if (!AC || T < musicStep) return;
  musicStep = T + .25;
  const n = Math.round(T * 4);
  const intensity = (MUSIC_INTENSITY.filter(x => x[0] <= T).pop() || [0, 0])[1];
  if (intensity <= .05) return;
  const bass = BASS_NOTES[(n >> 1) % 8];
  tone('sawtooth', bass, bass * .98, .3, .1 * intensity);
  if (n % 2 === 0 && intensity > .5) tone('sine', 130, 40, .2, .5 * intensity);
  if (intensity > .6 && n % 2) noise('highpass', 6000, 9000, .06, .12 * intensity);
  if (intensity > .4 && (T < 35.4 || T > 44)) tone('triangle', ARP_NOTES[n % 6] * (intensity > .8 ? 2 : 1), ARP_NOTES[n % 6], .2, .04 * intensity);
  if (T > 36 && T < 43.5 && n % 8 === 0) [220, 277, 330].forEach(f => tone('sine', f, f, 2, .05));
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let T = 0, running = false, eventIdx = 0, last = performance.now();
let acc = 0, vacc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (running) T += dt;

  while (running && eventIdx < EVENTS.length && EVENTS[eventIdx][0] <= T) {
    EVENTS[eventIdx][1]();
    eventIdx++;
  }

  updateFighter(gojo, gojoTrack, sukuna, dt, T);
  updateFighter(sukuna, sukunaTrack, gojo, dt, T);
  musicTick();

  const gx = gojo.p.x, gy = gojo.p.y;
  infinitySphere.visible = (T > 14 && T < 19.6) || (T > 36.6 && T < 43.2);
  infinitySphere.position.set(gx, 1.2 + gy, 0);
  infinitySphere.material.opacity = Math.max(.15 + .08 * Math.sin(T * 18), infinitySphere.material.opacity - dt * 2);

  if (T >= 45 && T < 47) {
    const k = cl((T - 45) / 1, 0, 1);
    if (orbBlue.visible) orbBlue.scale.setScalar(.3 + 1.5 * k);
    if (orbRed.visible) orbRed.scale.setScalar(.3 + 1.5 * k);
    if (orbBlue.visible) {
      for (let i = 0; i < 5; i++) {
        const a = rnd(0, 2 * PI), r = rnd(2, 4);
        glowParticles.e(orbBlue.position.x + Math.cos(a) * r, orbBlue.position.y + Math.sin(a) * r * .6, rnd(-1, 1),
          -Math.cos(a) * 5, -Math.sin(a) * 5, 0, .3, .5, .3, .7, 1.6);
      }
    }
  }

  if (T >= 36.6 && T < 43.2) {
    shrine.scale.y = Math.min(1, shrine.scale.y + dt * 1.2);
    acc += dt;
    while (acc > .05) {
      acc -= .05;
      const a = new V(rnd(-7, 7), rnd(.5, 4), rnd(-4, 4));
      const b = a.clone().add(new V(rnd(-6, 6), rnd(-2, 2), rnd(-4, 4)));
      const line = new THREE.Mesh(new THREE.BoxGeometry(.05, .05, a.distanceTo(b)), BM(Math.random() < .7 ? 0xffffff : 0xff2030));
      line.position.copy(a).add(b).multiplyScalar(.5);
      line.lookAt(b);
      scene.add(line);
      let lt = 0;
      fxList.push(dt => { lt += dt; line.material.opacity = 1 - lt / .14; if (lt > .14) { scene.remove(line); return false; } return true; });
    }
    shake = Math.max(shake, .45);
  }

  if (T >= 43.2 && T < 50.4) {
    stars.rotation.y += dt * .15;
    stars.rotation.z += dt * .05;
    vacc += dt;
    if (vacc > .4) {
      vacc = 0;
      ringFX(new V(0, 1.5, 0), Math.random() < .5 ? 0xffffff : 0x66b8ff, 30, 1.6, true);
      ringFX(new V(0, 1.5, 0), 0xaaccff, 25, 1.4);
    }
    for (let i = 0; i < 8; i++) glowParticles.e(rnd(-12, 12), rnd(-3, 8), rnd(-12, 12), 0, 0, -30, rnd(.2, .5), .5, .9, 1.1, 1.6);
  }

  for (const b of buildings) {
    const u = b.userData;
    if (u.f >= 0) {
      const k = T - u.f;
      b.position.y = Math.max(-b.geometry.parameters.height, u.y0 - k * k * 6);
      b.rotation.z = u.d * Math.min(1, k * .5) * .5;
    }
  }

  combatLightI *= Math.exp(-10 * dt);
  combatLight.intensity = combatLightI;

  for (let i = fxList.length - 1; i >= 0; i--) if (!fxList[i](dt)) fxList.splice(i, 1);

  glowParticles.u(dt);
  smokeParticles.u(dt);

  let camUpdated = false;
  for (const s of CAMERA_SHOTS) {
    if (T >= s[0] && T < s[1]) {
      s[2]((T - s[0]) / (s[1] - s[0]));
      camUpdated = true;
      break;
    }
  }
  if (!camUpdated && T >= 63.1) setCam(0, 1.6, 6, 0, 1.4, 0, 40);

  if (shake > .01) {
    cam.position.x += rnd(-1, 1) * shake * .1;
    cam.position.y += rnd(-1, 1) * shake * .1;
    cam.position.z += rnd(-1, 1) * shake * .1;
    shake *= Math.exp(-6 * dt);
  }

  cam.updateProjectionMatrix();

  const sc = renderer.domElement.height / (2 * Math.tan(cam.fov * PI / 360));
  glowParticles.m.uniforms.sc.value = sc;
  smokeParticles.m.uniforms.sc.value = sc;

  if (composer) composer.render();
  else renderer.render(scene, cam);
}

/* ============================================================
   START / REPLAY
   ============================================================ */
$('go').addEventListener('click', async () => {
  $('st').style.display = 'none';
  initAudio();

  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}

  setTimeout(() => {
    layout();
    T = 0; eventIdx = 0; running = true;
    musicStep = 0; acc = 0; vacc = 0;
    shake = 0; combatLightI = 0;
    setEnv('city');
    shrine.scale.y = 1;
    shrine.visible = false;
    throne.visible = false;
    blindfold.position.y = .13;
    gojoEyes.forEach(e => e.visible = false);
    gojo.g.visible = true;
    sukuna.g.visible = true;
    sukuna.g.position.set(12, 0, 0);
    orbBlue.visible = orbRed.visible = orbPurple.visible = false;
    infinitySphere.visible = false;
    for (const f of [gojo, sukuna]) {
      f.cur = { ...POSE.idle };
      f.tgt = POSE.idle;
      f.ret = 0;
      f.spd = 0;
      f.tilt = 0;
      f.pv.copy(f.p);
    }
    for (const b of buildings) {
      b.userData.f = -1;
      b.position.y = b.userData.y0;
      b.rotation.z = 0;
    }
    for (let i = 0; i < glowParticles.max; i++) { glowParticles.l[i] = 0; glowParticles.s[i] = 0; }
    for (let i = 0; i < smokeParticles.max; i++) { smokeParticles.l[i] = 0; smokeParticles.s[i] = 0; }
  }, 350);
});

$('re').addEventListener('click', () => location.reload());

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
addEventListener('contextmenu', e => e.preventDefault());

requestAnimationFrame(frame);
</script>
