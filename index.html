<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verdant Vale — A Peaceful Farm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87c8e8; font-family: 'Georgia', serif; }
  canvas { display: block; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    color: #f7f3e6; text-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }
  #hud {
    position: absolute; top: 20px; left: 20px;
    display: flex; gap: 14px; pointer-events: auto;
  }
  .hud-pill {
    background: rgba(20, 40, 30, 0.55);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 8px 18px;
    font-size: 16px; letter-spacing: 0.5px;
    backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 8px;
  }
  .hud-pill .icon { font-size: 18px; }

  #hotbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; pointer-events: auto;
  }
  .slot {
    width: 62px; height: 62px;
    background: rgba(20, 40, 30, 0.5);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
    transition: all 0.18s ease;
    backdrop-filter: blur(4px);
    position: relative;
  }
  .slot:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.6); }
  .slot.active {
    background: rgba(120, 200, 120, 0.55);
    border-color: #d8f5b8;
    box-shadow: 0 0 24px rgba(200, 255, 160, 0.7);
    transform: translateY(-4px);
  }
  .slot .label {
    position: absolute; bottom: 3px; font-size: 9px;
    letter-spacing: 0.5px; opacity: 0.85; text-transform: uppercase;
  }
  .slot .count {
    position: absolute; top: 3px; right: 5px;
    font-size: 11px; font-weight: bold; color: #ffe27a;
  }

  #toast {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%) translateY(-30px);
    background: rgba(20, 40, 30, 0.85);
    border: 1px solid rgba(200, 255, 160, 0.5);
    color: #e8ffd0;
    padding: 12px 28px; border-radius: 30px;
    font-size: 15px; letter-spacing: 1px;
    opacity: 0; transition: all 0.4s ease;
    pointer-events: none;
    box-shadow: 0 6px 30px rgba(120, 255, 120, 0.25);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #quests {
    position: absolute; top: 20px; right: 20px;
    width: 260px; pointer-events: auto;
    background: rgba(20, 40, 30, 0.5);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    padding: 14px 18px;
    backdrop-filter: blur(6px);
    font-size: 13px; line-height: 1.6;
  }
  #quests h3 { font-size: 14px; letter-spacing: 1.5px; margin-bottom: 8px; color: #c8ffb0; text-transform: uppercase; }
  .quest { display: flex; justify-content: space-between; padding: 3px 0; }
  .quest.done { color: #a8ff88; text-decoration: line-through; opacity: 0.7; }

  #shop {
    position: absolute; bottom: 24px; right: 24px;
    pointer-events: auto;
    background: rgba(20, 40, 30, 0.55);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    padding: 14px 18px;
    backdrop-filter: blur(6px);
    font-size: 13px;
    display: none;
  }
  #shop.open { display: block; }
  #shop h3 { color: #ffe27a; letter-spacing: 1.5px; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
  .shop-item {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 6px 0; cursor: pointer; transition: color 0.2s;
  }
  .shop-item:hover { color: #c8ffb0; }
  .shop-item .price { color: #ffe27a; }

  #help {
    position: absolute; bottom: 24px; left: 24px;
    pointer-events: auto;
    background: rgba(20, 40, 30, 0.45);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 10px 16px;
    backdrop-filter: blur(6px);
    font-size: 12px; line-height: 1.7; letter-spacing: 0.3px;
    opacity: 0.85;
  }
  #help b { color: #c8ffb0; font-weight: normal; }
  #help .key {
    display: inline-block; background: rgba(255,255,255,0.15);
    border-radius: 4px; padding: 0 6px; font-family: monospace; font-size: 11px;
  }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #4a7c59 0%, #6ba368 100%);
    color: #f7f3e6; z-index: 100; transition: opacity 1s ease;
  }
  #loading h1 { font-size: 42px; letter-spacing: 8px; font-weight: normal; margin-bottom: 20px; }
  #loading p { font-size: 14px; letter-spacing: 4px; opacity: 0.7; }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="loading">
  <h1>VERDANT VALE</h1>
  <p>Waking the garden...</p>
</div>

<div id="ui">
  <div id="hud">
    <div class="hud-pill"><span class="icon">🪙</span><span id="coins">0</span></div>
    <div class="hud-pill"><span class="icon">🌾</span><span id="crops">0</span></div>
    <div class="hud-pill"><span class="icon">💧</span><span id="water">10</span></div>
  </div>

  <div id="hotbar"></div>

  <div id="toast"></div>

  <div id="quests">
    <h3>Garden Journal</h3>
    <div id="quest-list"></div>
  </div>

  <div id="shop">
    <h3>🌱 Market Stall</h3>
    <div class="shop-item" data-buy="seed">🍅 Tomato Seed <span class="price">5 🪙</span></div>
    <div class="shop-item" data-buy="water">💧 Water Refill <span class="price">3 🪙</span></div>
    <div class="shop-item" data-buy="scarecrow">🎎 Scarecrow <span class="price">40 🪙</span></div>
  </div>

  <div id="help">
    <div><span class="key">WASD</span> move · <span class="key">Mouse</span> look · <span class="key">Click</span> use tool</div>
    <div><span class="key">1-5</span> select tool · <span class="key">E</span> shop · <span class="key">Scroll</span> zoom</div>
    <div><b>Plow → Water → Seed → Wait → Harvest</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ══════════════════════════════════════════════════════════════════════
   VERDANT VALE — A PEACEFUL 3D FARMING GAME
   All animation procedural. All geometry generated at runtime.
   ══════════════════════════════════════════════════════════════════════ */

// ─────────────────────────────────────────────────────────────
//  1. WORLD CONSTANTS & GAME STATE
// ─────────────────────────────────────────────────────────────
const WORLD_SIZE = 80;
const GRID_SIZE = 20;
const CELL = 4;
const HALF_WORLD = WORLD_SIZE / 2;
const HALF_GRID = (GRID_SIZE * CELL) / 2;

const state = {
  coins: 20,
  cropsHarvested: 0,
  water: 10,
  maxWater: 10,
  currentTool: 0,          // 0=hoe, 1=water, 2=seed, 3=harvest, 4=shop
  inventory: { seed: 3, harvest: 0 },
  timeOfDay: 0.32,         // 0..1, 0.25=dawn, 0.5=noon, 0.75=dusk, 0=midnight
  dayLength: 240,          // seconds per full day
  timeSpeed: 1.0,
  paused: false,
  movement: { w: false, a: false, s: false, d: false, shift: false },
  quests: [
    { id: 'till', text: 'Plow 5 plots', target: 5, current: 0, done: false },
    { id: 'plant', text: 'Plant 3 seeds', target: 3, current: 0, done: false },
    { id: 'harvest', text: 'Harvest 2 tomatoes', target: 2, current: 0, done: false },
    { id: 'earn', text: 'Earn 50 coins', target: 50, current: 0, done: false }
  ],
  shakeTime: 0,
  hitStop: 0,
  mouseX: 0, mouseY: 0,
  mouseDown: false,
  cameraYaw: 0,
  cameraPitch: 0.55,
  cameraDist: 14,
  cameraTarget: new THREE.Vector3(0, 1, 0),
  lastActionTime: 0
};

// ─────────────────────────────────────────────────────────────
//  2. THREE.JS CORE
// ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c8e8);
scene.fog = new THREE.Fog(0xa8d8e8, 40, 120);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.6, 0.85);
composer.addPass(bloom);

// ─────────────────────────────────────────────────────────────
//  3. LIGHTS
// ─────────────────────────────────────────────────────────────
const sunLight = new THREE.DirectionalLight(0xfff2d0, 1.6);
sunLight.position.set(20, 40, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 150;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);
scene.add(sunLight.target);

const hemiLight = new THREE.HemisphereLight(0x9ec9e8, 0x4a6b3a, 1.1);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0xfff0d0, 0.25);
scene.add(ambientLight);

// ─────────────────────────────────────────────────────────────
//  4. SKY — gradient dome, sun/moon, stars, clouds
// ─────────────────────────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(200, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x5a9bd8) },
    bottomColor: { value: new THREE.Color(0xd8e8f0) },
    sunPos: { value: new THREE.Vector3() },
    sunColor: { value: new THREE.Color(0xffeecc) },
    t: { value: 0 }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform vec3 sunPos;
    uniform vec3 sunColor;
    uniform float t;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(bottomColor, topColor, pow(h, 0.85));

      // sun glow
      float sunDist = distance(dir, normalize(sunPos));
      float sunGlow = smoothstep(0.35, 0.0, sunDist) * 0.9;
      col += sunColor * sunGlow * 0.7;

      // subtle noise dithering
      float n = fract(sin(dot(dir.xy, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) * 0.015;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// Stars
const starGeo = new THREE.BufferGeometry();
const starCount = 1200;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random());
  const r = 180;
  starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = r * Math.cos(phi) + 30;
  starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Sun/Moon mesh
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(6, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffe8a0 })
);
sunMesh.position.set(0, 60, -80);
scene.add(sunMesh);

// Clouds
const clouds = [];
function createCloud(x, y, z, scale) {
  const group = new THREE.Group();
  const geo = new THREE.SphereGeometry(1, 10, 8);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 1.0, metalness: 0.0,
    transparent: true, opacity: 0.9, flatShading: true
  });
  const puffs = 4 + Math.floor(Math.random() * 4);
  for (let i = 0; i < puffs; i++) {
    const puff = new THREE.Mesh(geo, mat);
    puff.position.set(
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 1.5,
      (Math.random() - 0.5) * 5
    );
    puff.scale.setScalar(1.2 + Math.random() * 1.4);
    puff.castShadow = false;
    group.add(puff);
  }
  group.position.set(x, y, z);
  group.scale.setScalar(scale);
  group.userData = { speed: 0.3 + Math.random() * 0.4, bob: Math.random() * Math.PI * 2 };
  scene.add(group);
  clouds.push(group);
  return group;
}
for (let i = 0; i < 14; i++) {
  createCloud(
    (Math.random() - 0.5) * 160,
    40 + Math.random() * 15,
    (Math.random() - 0.5) * 160,
    2 + Math.random() * 2
  );
}

// ─────────────────────────────────────────────────────────────
//  5. TERRAIN — rolling hills
// ─────────────────────────────────────────────────────────────
function noise2D(x, z) {
  return (
    Math.sin(x * 0.08) * Math.cos(z * 0.07) * 0.6 +
    Math.sin(x * 0.19 + 1.7) * Math.cos(z * 0.21 + 3.2) * 0.3 +
    Math.sin(x * 0.4 + 5.1) * Math.cos(z * 0.37 + 1.3) * 0.1
  );
}
function terrainHeight(x, z) {
  const inGrid = Math.abs(x) < HALF_GRID + 4 && Math.abs(z) < HALF_GRID + 4;
  const falloff = inGrid ? Math.max(0, 1 - (Math.max(Math.abs(x), Math.abs(z)) - HALF_GRID) / 6) : 0;
  const base = noise2D(x, z) * 2.2;
  return base * (1 - falloff * 0.9);
}

const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, 100, 100);
terrainGeo.rotateX(-Math.PI / 2);
const tPos = terrainGeo.attributes.position;
const tColors = new Float32Array(tPos.count * 3);
for (let i = 0; i < tPos.count; i++) {
  const x = tPos.getX(i), z = tPos.getZ(i);
  const y = terrainHeight(x, z);
  tPos.setY(i, y);
  const green = 0.35 + (noise2D(x * 2.1, z * 2.1) + 1) * 0.12;
  const r = 0.28 + green * 0.3;
  const g = 0.42 + green * 0.55;
  const b = 0.18 + green * 0.15;
  tColors[i*3] = r; tColors[i*3+1] = g; tColors[i*3+2] = b;
}
terrainGeo.setAttribute('color', new THREE.BufferAttribute(tColors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.95, metalness: 0.0, flatShading: false
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// ─────────────────────────────────────────────────────────────
//  6. FARM GRID — tilled plots
// ─────────────────────────────────────────────────────────────
const farmCells = [];
const plotsGroup = new THREE.Group();
scene.add(plotsGroup);

const plotBaseGeo = new THREE.BoxGeometry(CELL * 0.92, 0.15, CELL * 0.92);
const plotBaseMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 1.0 });
const plotTilledMat = new THREE.MeshStandardMaterial({ color: 0x3d2810, roughness: 1.0 });
const plotWetMat = new THREE.MeshStandardMaterial({ color: 0x26190a, roughness: 0.85 });

for (let gx = 0; gx < GRID_SIZE; gx++) {
  for (let gz = 0; gz < GRID_SIZE; gz++) {
    const px = (gx - GRID_SIZE/2 + 0.5) * CELL;
    const pz = (gz - GRID_SIZE/2 + 0.5) * CELL;
    const base = new THREE.Mesh(plotBaseGeo, plotBaseMat);
    base.position.set(px, 0.08, pz);
    base.receiveShadow = true;
    plotsGroup.add(base);

    const cell = {
      gx, gz, x: px, z: pz,
      base, state: 'grass',   // grass, tilled, watered, planted, grown, harvestable
      crop: null, growTime: 0, waterTime: 0, mesh: null
    };
    farmCells.push(cell);
  }
}

// Fence around the farm
const fenceGroup = new THREE.Group();
scene.add(fenceGroup);
const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.9 });
const postGeo = new THREE.BoxGeometry(0.25, 1.4, 0.25);
const railGeo = new THREE.BoxGeometry(CELL, 0.12, 0.12);
for (let i = 0; i <= GRID_SIZE; i++) {
  const pos = (i - GRID_SIZE/2) * CELL;
  for (const [x, z, rot] of [
    [pos, -HALF_GRID, 0], [pos, HALF_GRID, 0],
    [-HALF_GRID, pos, Math.PI/2], [HALF_GRID, pos, Math.PI/2]
  ]) {
    const post = new THREE.Mesh(postGeo, woodMat);
    post.position.set(x, 0.7, z);
    post.castShadow = true;
    fenceGroup.add(post);
    if (i < GRID_SIZE) {
      const rail = new THREE.Mesh(railGeo, woodMat);
      const nextPos = pos + CELL / 2;
      if (rot === 0) rail.position.set(nextPos, 0.85, z);
      else { rail.position.set(x, 0.85, nextPos); rail.rotation.y = Math.PI/2; }
      rail.castShadow = true;
      fenceGroup.add(rail);
    }
  }
}

// ─────────────────────────────────────────────────────────────
//  7. VEGETATION — trees, grass, flowers, bushes
// ─────────────────────────────────────────────────────────────
const treeGroup = new THREE.Group();
scene.add(treeGroup);

const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d24, roughness: 0.95 });
const leafMats = [
  new THREE.MeshStandardMaterial({ color: 0x4a8b3a, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x5fa54a, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x3d7a2e, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x7abf5a, roughness: 0.9, flatShading: true })
];

function createTree(x, z, scale = 1) {
  const group = new THREE.Group();
  const h = (3 + Math.random() * 2) * scale;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3*scale, 0.45*scale, h, 7),
    trunkMat
  );
  trunk.position.y = h / 2;
  trunk.castShadow = true;
  group.add(trunk);

  const layers = 3 + Math.floor(Math.random() * 2);
  for (let i = 0; i < layers; i++) {
    const r = (1.5 - i * 0.25) * scale;
    const leaf = new THREE.Mesh(
      new THREE.ConeGeometry(r, r * 1.4, 7),
      leafMats[Math.floor(Math.random() * leafMats.length)]
    );
    leaf.position.y = h * 0.75 + i * 0.9 * scale;
    leaf.castShadow = true;
    leaf.rotation.y = Math.random() * Math.PI;
    group.add(leaf);
  }
  group.position.set(x, terrainHeight(x, z), z);
  group.userData = {
    baseScale: scale,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.5 + Math.random() * 0.5
  };
  treeGroup.add(group);
  return group;
}

// Trees around farm (not inside)
for (let i = 0; i < 120; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = HALF_GRID + 4 + Math.random() * 25;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  if (Math.abs(x) > HALF_WORLD - 6 || Math.abs(z) > HALF_WORLD - 6) continue;
  createTree(x, z, 0.7 + Math.random() * 0.8);
}

// Grass blades — instanced
const grassCount = 6000;
const grassGeo = new THREE.ConeGeometry(0.08, 0.7, 3);
grassGeo.translate(0, 0.35, 0);
const grassMat = new THREE.MeshStandardMaterial({ color: 0x5fa54a, roughness: 1.0, flatShading: true });
const grass = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
grass.castShadow = false;
grass.receiveShadow = false;
const grassDummy = new THREE.Object3D();
const grassAnimData = [];
for (let i = 0; i < grassCount; i++) {
  let x, z;
  do {
    x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
  } while (Math.abs(x) < HALF_GRID + 1 && Math.abs(z) < HALF_GRID + 1);
  const y = terrainHeight(x, z);
  grassDummy.position.set(x, y, z);
  grassDummy.rotation.y = Math.random() * Math.PI;
  const s = 0.7 + Math.random() * 0.9;
  grassDummy.scale.set(s, s, s);
  grassDummy.updateMatrix();
  grass.setMatrixAt(i, grassDummy.matrix);
  grassAnimData.push({ x, z, baseRot: grassDummy.rotation.y, phase: Math.random() * Math.PI * 2, s });
}
grass.instanceMatrix.needsUpdate = true;
scene.add(grass);

// Flowers
const flowerGroup = new THREE.Group();
scene.add(flowerGroup);
const flowerColors = [0xff88aa, 0xffdd66, 0xff9966, 0xdd88ff, 0xffffff, 0xff6688];
for (let i = 0; i < 240; i++) {
  let x, z;
  do {
    x = (Math.random() - 0.5) * WORLD_SIZE * 0.85;

// 10. SPRING ANIMATOR — joint springs for organic movement
// ─────────────────────────────────────────────────────────────
function makeSpring(value = 0, stiffness = 180, damping = 18) {
  return { value, target: value, velocity: 0, stiffness, damping };
}
function updateSpring(s, dt) {
  const force = (s.target - s.value) * s.stiffness;
  s.velocity += force * dt;
  s.velocity *= Math.max(0, 1 - s.damping * dt);
  s.value += s.velocity * dt;
  return s.value;
}

  leftArmSwing: makeSpring(0, 140, 14),
  rightArmSwing: makeSpring(0, 140, 14),
  leftLegSwing: makeSpring(0, 150, 14),
  rightLegSwing: makeSpring(0, 150, 14),

const particles = [];
const particleGeo = new THREE.SphereGeometry(0.06, 6, 5);

function spawnParticles(pos, opts = {}) {
  const count = opts.count || 8;
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color || 0xffe27a,
      transparent: true, opacity: 1
    });
    const p = new THREE.Mesh(particleGeo, mat);
    p.position.copy(pos);
    p.userData = {
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * (opts.spread || 2),
        Math.random() * (opts.up || 2) + 0.3,
        (Math.random() - 0.5) * (opts.spread || 2)
      ),
      life: opts.life || 1.2,
      maxLife: opts.life || 1.2,
      gravity: opts.gravity ?? -4,
      scale: opts.scale || 1
    };
    p.scale.setScalar(p.userData.scale);
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const d = p.userData;
    d.life -= dt;
    if (d.life <= 0) {
      scene.remove(p);
      p.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    d.vel.y += d.gravity * dt;
    p.position.addScaledVector(d.vel, dt);
    p.material.opacity = d.life / d.maxLife;
    p.scale.setScalar(d.scale * (0.5 + d.life / d.maxLife * 0.5));
  }
}

function createCropMesh(cell, growth) {
  const g = new THREE.Group();
  g.position.set(cell.x, 0.16, cell.z);

  if (growth < 0.3) {
    const sprout = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0x6aab4a, roughness: 0.8 })
    );
    sprout.position.y = 0.1;
    sprout.scale.set(1, 0.6, 1);
    g.add(sprout);
  } else if (growth < 0.7) {
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.06, 0.8, 6),
      new THREE.MeshStandardMaterial({ color: 0x5a9b3a })
    );
    stem.position.y = 0.4;
    g.add(stem);
    for (let i = 0; i < 3; i++) {
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 5, 4),
        new THREE.MeshStandardMaterial({ color: 0x6abb4a, roughness: 0.8 })
      );
      leaf.scale.set(1.4, 0.4, 1);
      leaf.position.set(
        Math.cos(i * 2.1) * 0.25, 0.4 + i * 0.15, Math.sin(i * 2.1) * 0.25
      );
      leaf.rotation.y = i * 2.1;
      g.add(leaf);
    }
  } else {
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.08, 1.2, 6),
      new THREE.MeshStandardMaterial({ color: 0x5a9b3a })
    );
    stem.position.y = 0.6;
    g.add(stem);
    // leaves
    for (let i = 0; i < 5; i++) {
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 5, 4),
        new THREE.MeshStandardMaterial({ color: 0x6abb4a, roughness: 0.8 })
      );
      leaf.scale.set(1.5, 0.4, 1);
      leaf.position.set(
        Math.cos(i * 1.3) * 0.35, 0.3 + i * 0.18, Math.sin(i * 1.3) * 0.35
      );
      leaf.rotation.y = i * 1.3;
      g.add(leaf);
    }
    // tomato fruits (only if harvestable)
    if (growth >= 0.95) {
      for (let i = 0; i < 4; i++) {
        const fruit = new THREE.Mesh(
          new THREE.SphereGeometry(0.18, 10, 8),
          new THREE.MeshStandardMaterial({
            color: 0xe83a3a, roughness: 0.4,
            emissive: 0x330000, emissiveIntensity: 0.3
          })
        );
        fruit.position.set(
          Math.cos(i * 1.6) * 0.3,
          0.7 + Math.sin(i * 1.3) * 0.25,
          Math.sin(i * 1.6) * 0.3
        );
        fruit.castShadow = true;
        g.add(fruit);
      }
    }
  }
  g.userData = { growth, baseY: 0.16, sway: Math.random() * Math.PI * 2 };
  return g;
}

function updateCropMesh(cell) {
  if (cell.mesh) {
    plotsGroup.remove(cell.mesh);
    cell.mesh.traverse(o => { if (o.material) o.material.dispose(); if (o.geometry) o.geometry.dispose(); });
  }
  if (cell.state === 'planted' || cell.state === 'harvestable') {
    cell.mesh = createCropMesh(cell, cell.growTime);
    plotsGroup.add(cell.mesh);
  } else {
    cell.mesh = null;
  }
}

  if (k === 'a') state.movement.a = false;

let pointerLocked = false;
renderer.domElement.addEventListener('click', () => {
  if (state.currentTool === 4) return;
  if (!pointerLocked) {
    renderer.domElement.requestPointerLock();
    return;
  }
  doAction();
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove', e => {
  if (pointerLocked) {
    state.cameraYaw -= e.movementX * 0.0035;
    state.cameraPitch = Math.max(-0.2, Math.min(1.2, state.cameraPitch + e.movementY * 0.0025));
  } else {
    state.mouseX = e.clientX / innerWidth - 0.5;
    state.mouseY = e.clientY / innerHeight - 0.5;
  }
});

addEventListener('wheel', e => {
  state.cameraDist = Math.max(6, Math.min(24, state.cameraDist + e.deltaY * 0.01));
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

  document.getElementById('crops').textContent = state.cropsHarvested;
  document.getElementById('water').textContent = state.water;
  const sc = document.getElementById('seed-count');
  if (sc) sc.textContent = state.inventory.seed;
}
function updateQuests() {
  const list = document.getElementById('quest-list');
  list.innerHTML = state.quests.map(q => {
    const done = q.current >= q.target;
    return `<div class="quest ${done ? 'done' : ''}"><span>${q.text}</span><span>${Math.min(q.current, q.target)}/${q.target}</span></div>`;
  }).join('');
}
function bumpQuest(id, amount = 1) {
  const q = state.quests.find(q => q.id === id);
  if (q && !q.done) {
    q.current += amount;
    if (q.current >= q.target) {
      q.done = true;
      state.coins += 15;
      toast(`✧ Quest complete: ${q.text} (+15 coins)`);
      updateCounts();
    }
    updateQuests();
  }
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function toggleShop(force) {
  const el = document.getElementById('shop');
  if (force === true) el.classList.add('open');
  else if (force === false) el.classList.remove('open');
  else el.classList.toggle('open');
}

document.querySelectorAll('.shop-item').forEach(item => {
  item.onclick = () => {
    const buy = item.dataset.buy;
    if (buy === 'seed' && state.coins >= 5) {
      state.coins -= 5;
      state.inventory.seed++;
      toast('+1 Tomato Seed');
    } else if (buy === 'water' && state.coins >= 3) {
      state.coins -= 3;
      state.water = state.maxWater;
      toast('Watering can refilled');
    } else if (buy === 'scarecrow' && state.coins >= 40) {
      state.coins -= 40;
      spawnScarecrow();
      toast('A scarecrow appears...');
    } else {
      toast('Not enough coins');
    }
    updateCounts();
  };
});

// ─────────────────────────────────────────────────────────────
// 16. ACTION LOGIC — plow, water, plant, harvest
// ─────────────────────────────────────────────────────────────
function cellAt(x, z) {
  const gx = Math.floor((x + HALF_GRID) / CELL);
  const gz = Math.floor((z + HALF_GRID) / CELL);
  if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return null;
  return farmCells[gz * GRID_SIZE + gx];
}

function doAction() {
  const now = performance.now() / 1000;
  if (now - state.lastActionTime < 0.25) return;
  state.lastActionTime = now;
  triggerTool();

  // Target cell: in front of player
  const forward = new THREE.Vector3();
  player.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  const targetX = player.position.x + forward.x * 1.6;
  const targetZ = player.position.z + forward.z * 1.6;
  const cell = cellAt(targetX, targetZ);
  if (!cell) return;

  const t = state.currentTool;

  if (t === 0) { // Hoe
    if (cell.state === 'grass') {
      cell.state = 'tilled';
      cell.base.material = plotTilledMat;
      cell.base.position.y = 0.06;
      spawnParticles(new THREE.Vector3(cell.x, 0.3, cell.z), {
        color: 0x8b5a2a, count: 14, spread: 1.8, up: 2.5, life: 0.9, gravity: -6
      });
      bumpQuest('till');
      toast('Soil tilled');
    }
  } else if (t === 1) { // Water
    if (state.water > 0 && (cell.state === 'tilled' || cell.state === 'planted' || cell.state === 'harvestable')) {
      state.water--;
      updateCounts();
      cell.base.material = plotWetMat;
      cell.waterTime = 30;
      if (cell.state === 'tilled') cell.state = 'watered';
      spawnParticles(new THREE.Vector3(cell.x, 1.0, cell.z), {
        color: 0x88ccff, count: 16, spread: 0.8, up: 0.5, life: 1.0, gravity: -8
      });
      toast('Watered');
    } else if (state.water <= 0) {
      toast('Out of water!');
    }
  } else if (t === 2) { // Seed
    if (state.inventory.seed > 0 && (cell.state === 'tilled' || cell.state === 'watered')) {
      state.inventory.seed--;
      cell.state = 'planted';
      cell.growTime = 0;
      cell.base.material = cell.state === 'watered' ? plotWetMat : plotTilledMat;
      updateCropMesh(cell);
      updateCounts();
      bumpQuest('plant');
      spawnParticles(new THREE.Vector3(cell.x, 0.4, cell.z), {
        color: 0xffdd66, count: 10, spread: 0.8, up: 1.2, life: 0.8
      });
      toast('Seed planted');
    } else if (state.inventory.seed <= 0) {
      toast('No seeds — visit the shop!');
    }
  } else if (t === 3) { // Harvest
    if (cell.state === 'harvestable') {
      state.cropsHarvested++;
      state.inventory.harvest++;
      state.coins += 12;
      cell.state = 'tilled';
      cell.growTime = 0;
      cell.base.material = plotTilledMat;
      updateCropMesh(cell);
      updateCounts();
      bumpQuest('harvest');
      bumpQuest('earn', 12);
      spawnParticles(new THREE.Vector3(cell.x, 0.9, cell.z), {
        color: 0xff6a3a, count: 18, spread: 1.4, up: 2.8, life: 1.2, gravity: -8
      });
      spawnParticles(new THREE.Vector3(cell.x, 0.9, cell.z), {
        color: 0xffe27a, count: 8, spread: 1.0, up: 2.5, life: 1.4, gravity: -4
      });
      toast('+12 coins · 🍅 harvested');
      updateCounts();
    } else {
      toast('Nothing to harvest here');
    }
  }

  // Save
  saveGame();
}

// ─────────────────────────────────────────────────────────────
// 17. PLAYER MOVEMENT & ANIMATION
// ─────────────────────────────────────────────────────────────
const velocity = new THREE.Vector3();
const forwardDir = new THREE.Vector3();
const rightDir = new THREE.Vector3();

function updatePlayer(dt) {
  const mv = state.movement;
  const speed = mv.shift ? 8 : 4.5;

  forwardDir.set(-Math.sin(state.cameraYaw), 0, -Math.cos(state.cameraYaw));
  rightDir.set(Math.cos(state.cameraYaw), 0, -Math.sin(state.cameraYaw));

  const wish = new THREE.Vector3();
  if (mv.w) wish.add(forwardDir);
  if (mv.s) wish.sub(forwardDir);
  if (mv.d) wish.add(rightDir);
  if (mv.a) wish.sub(rightDir);
  if (wish.lengthSq() > 0) wish.normalize();

  velocity.lerp(wish.multiplyScalar(speed), Math.min(1, dt * 12));
  const moveAmount = velocity.length();

  if (moveAmount > 0.05) {
    player.position.addScaledVector(velocity, dt);
    // face movement
    const targetRot = Math.atan2(velocity.x, velocity.z);
    player.rotation.y = lerpAngle(player.rotation.y, targetRot, Math.min(1, dt * 10));
  }

  // Clamp to world
  player.position.x = Math.max(-HALF_WORLD + 2, Math.min(HALF_WORLD - 2, player.position.x));
  player.position.z = Math.max(-HALF_WORLD + 2, Math.min(HALF_WORLD - 2, player.position.z));
  player.position.y = terrainHeight(player.position.x, player.position.z);

  // ── ANIMATION ──
  const walking = moveAmount > 0.3;
  anim.walkAmpSpring.target = walking ? Math.min(1, moveAmount / 5) : 0;
  updateSpring(anim.walkAmpSpring, dt);
  anim.walkAmp = anim.walkAmpSpring.value;

  anim.walkCycle += dt * (walking ? 8 + moveAmount * 0.6 : 0);

  const s = anim.walkAmp;
  const phase = anim.walkCycle;
  const sinP = Math.sin(phase);
  const cosP = Math.cos(phase);

  // Leg swing
  anim.leftLegSwing.target = sinP * 0.7 * s;
  anim.rightLegSwing.target = -sinP * 0.7 * s;
  updateSpring(anim.leftLegSwing, dt);
  updateSpring(anim.rightLegSwing, dt);
  playerRig.leftLeg.rotation.x = anim.leftLegSwing.value;
  playerRig.rightLeg.rotation.x = anim.rightLegSwing.value;

  // Arm swing (opposite)
  anim.leftArmSwing.target = -sinP * 0.5 * s;
  anim.rightArmSwing.target = sinP * 0.5 * s - anim.toolSwing.value * 0.9;
  updateSpring(anim.leftArmSwing, dt);
  updateSpring(anim.rightArmSwing, dt);
  playerRig.leftArm.rotation.x = anim.leftArmSwing.value;
  playerRig.rightArm.rotation.x = anim.rightArmSwing.value;
  playerRig.rightArm.rotation.z = -anim.toolSwing.value * 0.3;

  // Tool swing spring
  updateSpring(anim.toolSwing, dt);

  // Body bob (walk)
  anim.headBob.target = Math.abs(sinP) * 0.06 * s;
  updateSpring(anim.headBob, dt);
  playerRig.body.position.y = anim.headBob.value;

  // Body lean while walking
  anim.bodyLean.target = s * 0.08;
  updateSpring(anim.bodyLean, dt);
  playerRig.body.rotation.x = anim.bodyLean.value;

  // Hat bob
  anim.hatBob.target = Math.sin(phase * 2) * 0.02 * s;
  updateSpring(anim.hatBob, dt);
  playerRig.hat.rotation.x = anim.hatBob.value;

  // Idle breathing
  anim.idleTime += dt;
  const breath = Math.sin(anim.idleTime * 1.8) * 0.015 * (1 - s);
  torso.scale.set(1 + breath, 1 - breath * 0.5, 1 + breath);
  playerRig.head.position.y = Math.sin(anim.idleTime * 1.3) * 0.015 * (1 - s);
  playerRig.head.rotation.z = Math.sin(anim.idleTime * 0.7) * 0.03 * (1 - s);
}

function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

// ─────────────────────────────────────────────────────────────
// 18. CAMERA
// ─────────────────────────────────────────────────────────────
const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();

function updateCamera(dt) {
  camTarget.copy(player.position);
  camTarget.y += 1.4;
  state.cameraTarget.lerp(camTarget, Math.min(1, dt * 8));

  const x = Math.sin(state.cameraYaw) * Math.cos(state.cameraPitch) * state.cameraDist;
  const y = Math.sin(state.cameraPitch) * state.cameraDist + 0.6;
  const z = Math.cos(state.cameraYaw) * Math.cos(state.cameraPitch) * state.cameraDist;

  camDesired.set(state.cameraTarget.x + x, state.cameraTarget.y + y, state.cameraTarget.z + z);
  camDesired.y = Math.max(camDesired.y, terrainHeight(camDesired.x, camDesired.z) + 1.5);

  camera.position.lerp(camDesired, Math.min(1, dt * 10));

  const shake = state.shakeTime > 0 ? state.shakeTime * 0.1 : 0;
  camera.lookAt(state.cameraTarget);
  if (shake > 0) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
    state.shakeTime = Math.max(0, state.shakeTime - dt * 3);
  }
}

// ─────────────────────────────────────────────────────────────
// 19. TIME OF DAY
// ─────────────────────────────────────────────────────────────
function updateTimeOfDay(dt) {
  state.timeOfDay = (state.timeOfDay + dt / state.dayLength * state.timeSpeed) % 1;
  const t = state.timeOfDay;
  const sunAngle = (t - 0.25) * Math.PI * 2;

  const sunX = Math.cos(sunAngle) * 80;
  const sunY = Math.sin(sunAngle) * 60;
  const sunZ = -Math.cos(sunAngle) * 20;
  sunMesh.position.set(sunX, sunY, sunZ);
  sunLight.position.set(sunX * 0.5, Math.max(5, sunY), sunZ * 0.5);
  sunLight.target.position.copy(player.position);
  sunLight.target.updateMatrixWorld();

  skyMat.uniforms.sunPos.value.copy(sunMesh.position).normalize();

  // color palette by time
  const dayWarm = new THREE.Color(0xfff2d0);
  const dayCool = new THREE.Color(0xa8d8f0);
  const dawn = new THREE.Color(0xffb070);
  const dusk = new THREE.Color(0xff8850);
  const night = new THREE.Color(0x1a2a4a);

  let skyTop, skyBot, sunCol, sunInt, hemiInt, fogCol;

  if (t < 0.2) { // night
    skyTop = new THREE.Color(0x0a1530); skyBot = new THREE.Color(0x1a2a50);
    sunCol = new THREE.Color(0x4a6a9a); sunInt = 0.2;
    hemiInt = 0.3; fogCol = new THREE.Color(0x0a1530);
  } else if (t < 0.28) { // dawn
    const k = (t - 0.2) / 0.08;
    skyTop = night.clone().lerp(dawn, k);
    skyBot = new THREE.Color(0x1a2a50).lerp(dawn, k);
    sunCol = new THREE.Color(0x4a6a9a).lerp(dawn, k);
    sunInt = 0.2 + k * 1.2;
    hemiInt = 0.3 + k * 0.7;
    fogCol = new THREE.Color(0x0a1530).lerp(dawn, k);
  } else if (t < 0.72) { // day
    const mid = 0.5;
    const k = Math.abs(t - mid) / 0.22;
    skyTop = dayCool.clone().lerp(new THREE.Color(0x5a9bd8), 1 - k * 0.3);
    skyBot = new THREE.Color(0xd8e8f0);
    sunCol = dayWarm;
    sunInt = 1.5 - k * 0.3;
    hemiInt = 1.1;
    fogCol = new THREE.Color(0xa8d8e8);
  } else if (t < 0.82) { // dusk
    const k = (t - 0.72) / 0.10;
    skyTop = new THREE.Color(0x5a9bd8).lerp(dusk, k);
    skyBot = new THREE.Color(0xd8e8f0).lerp(dusk, k);
    sunCol = dayWarm.clone().lerp(dusk, k);
    sunInt = 1.2 - k * 0.9;
    hemiInt = 1.1 - k * 0.6;
    fogCol = new THREE.Color(0xa8d8e8).lerp(dusk, k);
  } else { // night again
    const k = (t - 0.82) / 0.18;
    skyTop = dusk.clone().lerp(new THREE.Color(0x0a1530), k);
    skyBot = dusk.clone().lerp(new THREE.Color(0x1a2a50), k);
    sunCol = dusk.clone().lerp(new THREE.Color(0x4a6a9a), k);
    sunInt = 0.3 + (1 - k) * 0.9;
    hemiInt = 0.5 - k * 0.2;
    fogCol = dusk.clone().lerp(new THREE.Color(0x0a1530), k);
  }

  skyMat.uniforms.topColor.value.copy(skyTop);
  skyMat.uniforms.bottomColor.value.copy(skyBot);
  skyMat.uniforms.sunColor.value.copy(sunCol);
  skyMat.uniforms.t.value = t;

  sunLight.color.copy(sunCol);
  sunLight.intensity = sunInt;
  hemiLight.intensity = hemiInt;
  scene.fog.color.copy(fogCol);
  scene.background.copy(fogCol);

  // Sun/Moon color
  sunMesh.material.color.copy(t < 0.25 || t > 0.75 ? new THREE.Color(0xdde8ff) : new THREE.Color(0xffe8a0));

  // Stars & fireflies
  const nightness = Math.max(0, 1 - Math.abs(t - 0.5) * 3);
  starMat.opacity = Math.max(0, 1 - nightness * 1.3);
  fireflyMat.opacity = Math.max(0, 1 - nightness * 1.2) * 0.9;

  // Bloom scaling
  bloom.strength = 0.35 + (1 - nightness) * 0.35;
}

// ─────────────────────────────────────────────────────────────
// 20. WORLD ANIMATIONS
// ─────────────────────────────────────────────────────────────
function updateWorldAnimations(dt, time) {
  // Tree sway
  treeGroup.children.forEach((tree, i) => {
    const d = tree.userData;
    const sway = Math.sin(time * d.swaySpeed + d.sway) * 0.02;
    tree.rotation.z = sway;
    tree.rotation.x = sway * 0.5;
  });

  // Grass sway
  for (let i = 0; i < grassCount; i++) {
    const d = grassAnimData[i];
    const s = d.s;
    const sway = Math.sin(time * 1.8 + d.phase + d.x * 0.3) * 0.15;
    grassDummy.position.set(d.x, terrainHeight(d.x, d.z), d.z);
    grassDummy.rotation.set(sway, d.baseRot, sway * 0.7);
    grassDummy.scale.set(s, s, s);
    grassDummy.updateMatrix();
    grass.setMatrixAt(i, grassDummy.matrix);
  }
  grass.instanceMatrix.needsUpdate = true;

  // Flowers bob
  flowerGroup.children.forEach(c => {
    if (c.userData.phase !== undefined) {
      const bob = Math.sin(time * 2 + c.userData.phase) * 0.05;
      c.position.y = c.userData.baseY + bob;
      c.rotation.z = Math.sin(time * 1.4 + c.userData.phase) * 0.1;
    }
  });

  // Clouds drift
  clouds.forEach(c => {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 100) c.position.x = -100;
    c.position.y += Math.sin(time * 0.3 + c.userData.bob) * 0.01;
  });

  // Water ripples
  ripples.forEach((r, i) => {
    const phase = (time * 0.4 + r.userData.phase) % 1;
    r.scale.setScalar(0.3 + phase * 3);
    r.material.opacity = (1 - phase) * 0.35;
  });

  // Pond shader shimmer
  pondMat.color.setHSL(0.55, 0.4, 0.42 + Math.sin(time) * 0.03);

  // Pollen drift
  const pPos = pollen.geometry.attributes.position;
  for (let i = 0; i < pollenCount; i++) {
    const v = pollenVel[i];
    pPos.array[i*3]   += v.x * dt + Math.sin(time + v.phase) * 0.005;
    pPos.array[i*3+1] += v.y * dt + Math.cos(time * 0.7 + v.phase) * 0.003;
    pPos.array[i*3+2] += v.z * dt;
    if (pPos.array[i*3+1] > 14) pPos.array[i*3+1] = 1;
    if (pPos.array[i*3+1] < 0.5) pPos.array[i*3+1] = 1;
  }
  pPos.needsUpdate = true;

  // Fireflies
  const fPos = fireflies.geometry.attributes.position;
  for (let i = 0; i < fireflyCount; i++) {
    const d = fireflyData[i];
    fPos.array[i*3]   += Math.sin(time * d.speed + d.phase) * 0.01;
    fPos.array[i*3+1] += Math.cos(time * d.speed * 1.3 + d.phase) * 0.008;
    fPos.array[i*3+2] += Math.cos(time * d.speed * 0.8 + d.phase) * 0.01;
  }
  fPos.needsUpdate = true;

  // Birds
  birds.forEach(b => {
    const d = b.userData;
    d.angle += dt * 0.15;
    b.position.set(
      Math.cos(d.angle) * d.radius,
      d.height + Math.sin(time * 0.8 + d.phase) * 2,
      Math.sin(d.angle) * d.radius
    );
    b.rotation.y = -d.angle + Math.PI / 2;
    const flap = Math.sin(time * 8 + d.phase) * 0.5;
    d.wings[0].rotation.z = -flap;
    d.wings[1].rotation.z = flap;
  });

  // Crop sway & growth
  farmCells.forEach(cell => {
    if (cell.mesh && cell.state === 'planted') {
      const sway = Math.sin(time * 1.5 + cell.gx * 0.3 + cell.gz * 0.4) * 0.05;
      cell.mesh.rotation.z = sway;
      cell.mesh.rotation.x = sway * 0.5;
    } else if (cell.mesh && cell.state === 'harvestable') {
      const sway = Math.sin(time * 2.2 + cell.gx) * 0.04;
      cell.mesh.rotation.z = sway;
    }
  });
}

// ─────────────────────────────────────────────────────────────
// 21. FARM LOGIC — growth over time
// ─────────────────────────────────────────────────────────────
let growthTick = 0;
function updateFarmLogic(dt) {
  growthTick += dt;
  if (growthTick < 0.25) return;
  const step = growthTick;
  growthTick = 0;

  farmCells.forEach(cell => {
    if (cell.state === 'planted') {
      let rate = 0.006;
      if (cell.base.material === plotWetMat) rate *= 2.5;
      cell.growTime += step * rate;
      if (cell.growTime >= 1) {
        cell.growTime = 1;
        cell.state = 'harvestable';
        updateCropMesh(cell);
        // subtle glow sparkle
        spawnParticles(new THREE.Vector3(cell.x, 1.0, cell.z), {
          color: 0xffe27a, count: 6, spread: 0.8, up: 1.2, life: 1.0, gravity: -2
        });
      } else {
        // re-render at growth thresholds
        const thresholds = [0.3, 0.7, 0.95];
        const old = cell.mesh && cell.mesh.userData ? cell.mesh.userData.growth || 0 : 0;
        for (const th of thresholds) {
          if (old < th && cell.growTime >= th) {
            updateCropMesh(cell);
            break;
          }
        }
      }
    }

    // Dry out wet soil
    if (cell.waterTime > 0) {
      cell.waterTime -= step;
      if (cell.waterTime <= 0) {
        if (cell.base.material === plotWetMat) {
          cell.base.material = cell.state === 'grass' ? plotBaseMat : plotTilledMat;
        }
        if (cell.state === 'watered') cell.state = 'tilled';
      }
    }
  });
}

// ─────────────────────────────────────────────────────────────
// 22. SAVE / LOAD
// ─────────────────────────────────────────────────────────────
function saveGame() {
  try {
    localStorage.setItem('verdant-vale-save', JSON.stringify({
      coins: state.coins,
      cropsHarvested: state.cropsHarvested,
      water: state.water,
      inventory: state.inventory,
      timeOfDay: state.timeOfDay,
      quests: state.quests,
      cells: farmCells.map(c => ({
        state: c.state, growTime: c.growTime, waterTime: c.waterTime
      }))
    }));
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem('verdant-vale-save');
    if (!raw) return;
    const data = JSON.parse(raw);
    state.coins = data.coins ?? state.coins;
    state.cropsHarvested = data.cropsHarvested ?? 0;
    state.water = data.water ?? state.water;
    state.inventory = data.inventory ?? state.inventory;
    state.timeOfDay = data.timeOfDay ?? state.timeOfDay;
    if (data.quests) state.quests = data.quests;
    if (data.cells) {
      data.cells.forEach((saved, i) => {
        const cell = farmCells[i];
        if (!cell) return;
        cell.state = saved.state;
        cell.growTime = saved.growTime;
        cell.waterTime = saved.waterTime;
        if (cell.state === 'tilled') cell.base.material = plotTilledMat;
        else if (cell.state === 'watered') cell.base.material = plotWetMat;
        else if (cell.state === 'planted' || cell.state === 'harvestable') {
          cell.base.material = saved.waterTime > 0 ? plotWetMat : plotTilledMat;
          updateCropMesh(cell);
        }
      });
    }
  } catch (e) {}
}
setInterval(saveGame, 8000);

// ─────────────────────────────────────────────────────────────
// 23. AUDIO — procedural ambient & sfx
// ─────────────────────────────────────────────────────────────
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {}
}
addEventListener('click', initAudio, { once: true });

function playChime(freq = 440, dur = 0.4, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

// override toast for chime
const _toast = toast;
function toast(msg) {
  _toast(msg);
  playChime(880, 0.25, 'sine', 0.05);
}

// ambient birdsong (periodic)
setInterval(() => {
  if (!audioCtx || Math.random() > 0.3) return;
  const base = 1200 + Math.random() * 800;
  playChime(base, 0.08, 'sine', 0.015);
  setTimeout(() => playChime(base * 1.2, 0.06, 'sine', 0.012), 100);
}, 4000);

// ─────────────────────────────────────────────────────────────
// 24. INIT & MAIN LOOP
// ─────────────────────────────────────────────────────────────
player.position.set(0, 0, HALF_GRID + 4);
state.cameraTarget.copy(player.position);
updateHeldTool();
buildHotbar();
updateCounts();
updateQuests();
loadGame();
updateCounts();

// Welcome particles
setTimeout(() => {
  document.getElementById('loading').classList.add('hide');
  toast('Welcome to Verdant Vale 🌿');
}, 600);

// Fireflies also appear near player
let clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1 / 30);
  elapsed += dt;

  if (state.hitStop > 0) {
    state.hitStop -= dt;
    // still render effects
    updateParticles(dt);
    composer.render();
    return;
  }

  updateTimeOfDay(dt);
  updatePlayer(dt);
  updateCamera(dt);
  updateWorldAnimations(dt, elapsed);
  updateFarmLogic(dt);
  updateParticles(dt);

  // sunMesh looks at camera
  sunMesh.lookAt(camera.position);

  composer.render();
}
animate();
</script>
