<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Forest Man of India — Jadav Payeng</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      background: #000;
      color: #fff;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 14px;
      letter-spacing: 2px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #ffd966;
      text-transform: uppercase;
      pointer-events: none;
    }
    #start-overlay {
      position: absolute;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 40%, #0a1f0a, #000000);
      transition: opacity 1.5s ease;
      pointer-events: all;
    }
    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 300;
      letter-spacing: 6px;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 30px rgba(0, 255, 100, 0.4);
      color: #e0f0e0;
      text-align: center;
      line-height: 1.2;
    }
    .sub {
      font-size: 1.2rem;
      letter-spacing: 12px;
      margin-bottom: 2.5rem;
      color: #9fbf9f;
      text-transform: uppercase;
      text-align: center;
    }
    .watch-btn {
      padding: 18px 60px;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 8px;
      background: transparent;
      color: #fff;
      border: 2px solid #6f9e6f;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 30px rgba(80, 200, 80, 0.2);
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      backdrop-filter: blur(5px);
      margin-top: 1rem;
    }
    .watch-btn:hover {
      background: #2a5a2a;
      border-color: #b5e6b5;
      box-shadow: 0 0 60px rgba(100, 255, 100, 0.5);
      transform: scale(1.03);
    }
    .watch-btn:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #7f9f7f;
      letter-spacing: 4px;
      text-align: center;
    }
    #fullscreen-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      color: #9fbf9f;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.6;
      pointer-events: none;
    }
    #loading {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <div id="info">THE FOREST MAN OF INDIA</div>
  <div id="start-overlay">
    <h1>JADAV PAYENG</h1>
    <div class="sub">THE FOREST MAN OF INDIA</div>
    <button class="watch-btn" id="watchBtn">WATCH</button>
    <div class="hint">3-MINUTE CINEMATIC ANIMATED DOCUMENTARY</div>
  </div>
  <div id="fullscreen-hint">⛶ CLICK WATCH FOR FULLSCREEN LANDSCAPE</div>
  <div id="loading">Preparing engine...</div>

  <!-- Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- GLOBAL VARIABLES ---
    let scene, camera, renderer, clock;
    let animFrame;
    let isPlaying = false;
    let timelineTime = 0;
    const duration = 180; // 3 minutes

    // Environment objects
    let riverMesh, sandbarGroup, forestGroup, saplingGroup, snakeGroup;
    let sunLight, ambientLight, hemiLight;

    // Camera Keyframes
    const keyframes = [
      { time: 0, pos: [0, 120, 200], target: [0, 0, 20] },
      { time: 10, pos: [0, 60, 150], target: [0, 0, 20] },
      { time: 20, pos: [0, 20, 90], target: [0, 2, 20] },
      { time: 30, pos: [10, 6, 50], target: [5, 1, 25] },
      { time: 40, pos: [15, 5, 35], target: [10, 1, 30] },
      { time: 50, pos: [5, 3, 25], target: [8, 1, 28] },
      { time: 60, pos: [8, 2.5, 22], target: [10, 1, 26] },
      { time: 70, pos: [20, 8, 40], target: [10, 2, 30] },
      { time: 80, pos: [30, 12, 50], target: [5, 3, 25] },
      { time: 90, pos: [40, 15, 60], target: [0, 5, 20] },
      { time: 95, pos: [35, 12, 50], target: [0, 6, 20] },
      { time: 105, pos: [40, 25, 80], target: [0, 8, 15] },
      { time: 115, pos: [30, 20, 60], target: [0, 6, 20] },
      { time: 125, pos: [25, 15, 50], target: [0, 5, 20] },
      { time: 130, pos: [20, 12, 40], target: [0, 4, 20] },
      { time: 140, pos: [15, 8, 30], target: [5, 3, 25] },
      { time: 150, pos: [12, 6, 28], target: [8, 3, 24] },
      { time: 160, pos: [18, 10, 35], target: [5, 3, 25] },
      { time: 170, pos: [25, 18, 50], target: [0, 5, 20] },
      { time: 180, pos: [30, 25, 70], target: [0, 8, 20] }
    ];

    // --- INITIALIZATION ---
    function initScene() {
      document.getElementById('loading').style.opacity = '1';
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.FogExp2(0x0a1a0a, 0.002);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 120, 200);
      camera.lookAt(0, 0, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      // Lights
      ambientLight = new THREE.AmbientLight(0x404060);
      scene.add(ambientLight);

      hemiLight = new THREE.HemisphereLight(0xbfd8ff, 0x5a4a3a, 0.8);
      scene.add(hemiLight);

      sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
      sunLight.position.set(60, 80, 40);
      sunLight.castShadow = true;
      sunLight.receiveShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      const d = 120;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = 300;
      scene.add(sunLight);

      const fillLight = new THREE.PointLight(0xccddff, 0.4);
      fillLight.position.set(-30, 40, 60);
      scene.add(fillLight);

      // Build Environment
      createRiver();
      createSandbar();
      createForest();
      createSaplings();
      createDeadSnakes();

      document.getElementById('loading').style.opacity = '0';
      
      // Initial render
      renderer.render(scene, camera);
    }

    // --- ENVIRONMENT BUILDERS ---

    function createRiver() {
      const waterGeometry = new THREE.PlaneGeometry(600, 400, 64, 64);
      const waterMaterial = new THREE.MeshStandardMaterial({
        color: 0x3a6a8a,
        emissive: 0x0a1a2a,
        roughness: 0.2,
        metalness: 0.4,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
      });
      riverMesh = new THREE.Mesh(waterGeometry, waterMaterial);
      riverMesh.rotation.x = -Math.PI / 2;
      riverMesh.position.y = -1.5;
      riverMesh.position.z = -20;
      riverMesh.receiveShadow = true;
      scene.add(riverMesh);
    }

    function createSandbar() {
      sandbarGroup = new THREE.Group();
      
      const sandGeo = new THREE.CircleGeometry(120, 32);
      const sandMat = new THREE.MeshStandardMaterial({
        color: 0xc2b280,
        roughness: 0.9,
        emissive: 0x221100,
        side: THREE.DoubleSide
      });
      const sandMesh = new THREE.Mesh(sandGeo, sandMat);
      sandMesh.rotation.x = -Math.PI / 2;
      sandMesh.position.y = -0.9;
      sandMesh.position.z = 20;
      sandMesh.receiveShadow = true;
      sandbarGroup.add(sandMesh);

      for (let i = 0; i < 40; i++) {
        const crackGeo = new THREE.CircleGeometry(1.5 + Math.random() * 3, 6);
        const crackMat = new THREE.MeshStandardMaterial({ color: 0x8a7a5a, roughness: 1.0 });
        const crack = new THREE.Mesh(crackGeo, crackMat);
        crack.rotation.x = -Math.PI / 2;
        crack.position.set(
          (Math.random() - 0.5) * 180,
          -0.85,
          20 + (Math.random() - 0.5) * 120
        );
        crack.scale.set(1, 0.6 + Math.random() * 1.2, 1);
        crack.receiveShadow = true;
        sandbarGroup.add(crack);
      }
      scene.add(sandbarGroup);
    }

    function createForest() {
      forestGroup = new THREE.Group();
      
      for (let i = 0; i < 220; i++) {
        const tree = createTree();
        const angle = Math.random() * Math.PI * 2;
        const radius = 20 + Math.random() * 80;
        const x = Math.cos(angle) * radius;
        const z = 20 + Math.sin(angle) * radius * 0.7;
        tree.position.set(x, 0, z);
        tree.rotation.y = Math.random() * Math.PI * 2;
        const s = 0.6 + Math.random() * 1.0;
        tree.scale.set(s, s, s);
        tree.visible = false;
        tree.userData.originalScale = s;
        forestGroup.add(tree);
      }
      
      for (let i = 0; i < 80; i++) {
        const bamboo = createBambooCluster();
        const angle = Math.random() * Math.PI * 2;
        const radius = 10 + Math.random() * 90;
        const x = Math.cos(angle) * radius;
        const z = 20 + Math.sin(angle) * radius * 0.8;
        bamboo.position.set(x, 0, z);
        bamboo.scale.setScalar(0.8 + Math.random() * 0.8);
        bamboo.visible = false;
        forestGroup.add(bamboo);
      }
      scene.add(forestGroup);
    }

    function createTree() {
      const group = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(0.4, 0.8, 4 + Math.random() * 4, 6);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4e3a, roughness: 0.9 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 2 + Math.random() * 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);
      
      const greenShades = [0x2d5a27, 0x3e6b3e, 0x4a7a4a, 0x2f5e2f];
      for (let j = 0; j < 3 + Math.floor(Math.random() * 3); j++) {
        const foliageGeo = new THREE.SphereGeometry(1.2 + Math.random() * 1.8, 7);
        const foliageMat = new THREE.MeshStandardMaterial({ 
          color: greenShades[Math.floor(Math.random() * greenShades.length)],
          roughness: 0.8,
          emissive: 0x112211
        });
        const foliage = new THREE.Mesh(foliageGeo, foliageMat);
        foliage.position.set((Math.random() - 0.5) * 2.5, 5 + Math.random() * 3, (Math.random() - 0.5) * 2.5);
        foliage.castShadow = true;
        foliage.receiveShadow = true;
        group.add(foliage);
      }
      return group;
    }

    function createBambooCluster() {
      const group = new THREE.Group();
      const count = 3 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        const bambooGeo = new THREE.CylinderGeometry(0.1, 0.15, 3 + Math.random() * 4, 5);
        const bambooMat = new THREE.MeshStandardMaterial({ color: 0x7a9a5a, roughness: 0.8 });
        const bamboo = new THREE.Mesh(bambooGeo, bambooMat);
        bamboo.position.set((Math.random() - 0.5) * 1.2, 1.5 + Math.random() * 2, (Math.random() - 0.5) * 1.2);
        bamboo.rotation.z = (Math.random() - 0.5) * 0.2;
        bamboo.rotation.x = (Math.random() - 0.5) * 0.2;
        bamboo.castShadow = true;
        bamboo.receiveShadow = true;
        group.add(bamboo);
        
        for (let l = 0; l < 3; l++) {
          const leafGeo = new THREE.SphereGeometry(0.25, 4);
          const leafMat = new THREE.MeshStandardMaterial({ color: 0x5a8a3a, emissive: 0x112211 });
          const leaf = new THREE.Mesh(leafGeo, leafMat);
          leaf.position.set((Math.random() - 0.5) * 0.8, 3.5 + Math.random() * 2, (Math.random() - 0.5) * 0.8);
          leaf.scale.set(1, 0.3, 0.8);
          leaf.castShadow = true;
          group.add(leaf);
        }
      }
      return group;
    }

    function createSaplings() {
      saplingGroup = new THREE.Group();
      for (let i = 0; i < 30; i++) {
        const sapling = createSmallSapling();
        const angle = Math.random() * Math.PI * 2;
        const radius = 5 + Math.random() * 30;
        const x = Math.cos(angle) * radius;
        const z = 20 + Math.sin(angle) * radius * 0.7;
        sapling.position.set(x, 0, z);
        sapling.visible = false;
        saplingGroup.add(sapling);
      }
      scene.add(saplingGroup);
    }

    function createSmallSapling() {
      const group = new THREE.Group();
      const stemGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.8 + Math.random() * 0.6, 4);
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x6a8a4a });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.5;
      stem.castShadow = true;
      group.add(stem);
      
      const leafGeo = new THREE.SphereGeometry(0.2, 4);
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x4a8a3a, emissive: 0x112211 });
      for (let i = 0; i < 3; i++) {
        const leaf = new THREE.Mesh(leafGeo, leafMat);
        leaf.position.set((Math.random() - 0.5) * 0.3, 0.8 + Math.random() * 0.4, (Math.random() - 0.5) * 0.3);
        leaf.scale.set(1, 0.5, 1);
        leaf.castShadow = true;
        group.add(leaf);
      }
      return group;
    }

    function createDeadSnakes() {
      snakeGroup = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const snakeGeo = new THREE.TorusKnotGeometry(0.2, 0.06, 20, 4);
        const snakeMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.9 });
        const snake = new THREE.Mesh(snakeGeo, snakeMat);
        snake.rotation.x = Math.PI / 2;
        snake.rotation.z = Math.random() * Math.PI;
        snake.position.set((Math.random() - 0.5) * 8, -0.7, 20 + (Math.random() - 0.5) * 8);
        snake.scale.set(1, 0.3, 1);
        snake.castShadow = true;
        snakeGroup.add(snake);
      }
      scene.add(snakeGroup);
    }

    // --- ANIMATION & LOOPS ---
    function animate() {
      if (!isPlaying) return;
      
      const delta = clock.getDelta();
      timelineTime += delta;
      
      if (timelineTime > duration) timelineTime = duration;
      
      updateCamera(timelineTime);
      updateEnvironment(timelineTime);
      animateRiver(delta);
      
      renderer.render(scene, camera);
      
      if (timelineTime < duration) {
        animFrame = requestAnimationFrame(animate);
      } else {
        // End scene render loop
        animFrame = requestAnimationFrame(() => {
          renderer.render(scene, camera);
        });
      }
    }

    function updateCamera(t) {
      let prev = keyframes[0];
      let next = keyframes[keyframes.length - 1];
      for (let i = 0; i < keyframes.length - 1; i++) {
        if (t >= keyframes[i].time && t <= keyframes[i+1].time) {
          prev = keyframes[i];
          next = keyframes[i+1];
          break;
        }
      }
      
      const range = next.time - prev.time;
      const factor = range > 0 ? (t - prev.time) / range : 0;
      const smoothFactor = factor * factor * (3 - 2 * factor);
      
      const px = prev.pos[0] + (next.pos[0] - prev.pos[0]) * smoothFactor;
      const py = prev.pos[1] + (next.pos[1] - prev.pos[1]) * smoothFactor;
      const pz = prev.pos[2] + (next.pos[2] - prev.pos[2]) * smoothFactor;
      
      const tx = prev.target[0] + (next.target[0] - prev.target[0]) * smoothFactor;
      const ty = prev.target[1] + (next.target[1] - prev.target[1]) * smoothFactor;
      const tz = prev.target[2] + (next.target[2] - prev.target[2]) * smoothFactor;
      
      camera.position.set(px, py, pz);
      camera.lookAt(tx, ty, tz);
    }

    function updateEnvironment(t) {
      if (t < 10) {
        scene.background.setHSL(0, 0, 0);
        scene.fog.color.setHSL(0, 0, 0);
      } else if (t < 30) {
        const f = (t - 10) / 20;
        scene.background.setHSL(0.6, 0.4, 0.02 + f * 0.1);
        scene.fog.color.setHSL(0.6, 0.4, 0.02 + f * 0.1);
      } else if (t < 60) {
        const f = Math.min(1, (t - 30) / 30);
        scene.background.setHSL(0.55, 0.3, 0.12 + f * 0.05);
        scene.fog.color.setHSL(0.55, 0.3, 0.12 + f * 0.05);
      } else {
        const f = Math.min(1, (t - 60) / 40);
        scene.background.setHSL(0.3, 0.4, 0.08 + f * 0.04);
        scene.fog.color.setHSL(0.3, 0.4, 0.08 + f * 0.04);
      }
      
      sunLight.intensity = Math.max(0.3, 0.8 + Math.sin(t * 0.02) * 0.2);
      sunLight.color.setHSL(0.1, 0.6, 0.7 + Math.sin(t * 0.05) * 0.1);
      
      const sandFade = Math.max(0, 1 - (t - 50) / 60);
      sandbarGroup.traverse(child => {
        if (child.isMesh && child.material) {
          if (!child.userData.originalOpacity) child.userData.originalOpacity = child.material.opacity;
          child.material.transparent = true;
          child.material.opacity = child.userData.originalOpacity * Math.max(0.1, sandFade);
        }
      });
      
      const snakeFade = Math.max(0, 1 - (t - 30) / 30);
      snakeGroup.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.transparent = true;
          child.material.opacity = snakeFade;
        }
      });
      snakeGroup.visible = t < 60;
      
      saplingGroup.children.forEach((sapling, idx) => {
        const individualProgress = Math.min(1, Math.max(0, (t - 30 - idx * 0.5) / 20));
        sapling.visible = individualProgress > 0;
        sapling.scale.setScalar(individualProgress * (0.8 + idx % 3 * 0.2));
      });
      
      forestGroup.children.forEach((tree, idx) => {
        const individualProgress = Math.min(1, Math.max(0, (t - 60 - idx * 0.1) / 40));
        tree.visible = individualProgress > 0.05;
        const s = tree.userData.originalScale || 1;
        tree.scale.setScalar(individualProgress * s * 1.2);
      });
      
      hemiLight.intensity = 0.3 + Math.min(1, Math.max(0, (t - 40) / 60)) * 0.6;
    }

    function animateRiver(delta) {
      if (!riverMesh) return;
      const positions = riverMesh.geometry.attributes.position.array;
      const time = performance.now() * 0.001;
      for (let i = 0; i < positions.length; i += 3) {
        const x = positions[i];
        const y = positions[i+1];
        positions[i+2] = Math.sin(x * 0.05 + time) * 0.3 + Math.cos(y * 0.03 + time * 0.7) * 0.2;
      }
      riverMesh.geometry.attributes.position.needsUpdate = true;
    }

    // --- START EXPERIENCE ---
    function startExperience() {
      if (isPlaying) return;
      
      // Fullscreen & Landscape Lock
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(e => console.log('Orientation lock not supported:', e));
          }
        }).catch(e => console.log('Fullscreen failed:', e));
      }
      
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('fullscreen-hint').style.opacity = '0';
      
      timelineTime = 0;
      isPlaying = true;
      
      clock.start();
      
      if (animFrame) cancelAnimationFrame(animFrame);
      animate();
    }

    // --- EVENT LISTENERS ---
    window.addEventListener('load', () => {
      initScene();
      
      document.getElementById('watchBtn').addEventListener('click', startExperience);
      
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });

  </script>
</body>
</html>
