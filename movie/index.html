<style>

<script type="module">
// ============================================================================
// PART 1: CORE ENGINE, UTILITIES, SHADERS, TERRAIN & VEGETATION
// ============================================================================
import * as THREE from 'three';

// ============================================================================
// 1. UTILITIES & MATH HELPERS
// ============================================================================
const $ = s => document.querySelector(s);
const canvas = $('#c');
const stage = $('#stage');
const touch = matchMedia('(pointer:coarse)').matches;
const Q = touch ? 0.6 : 1; 
const TOTAL_DURATION = 195; 

const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const E = u => u * u * (3 - 2 * u);
const mod = (a, n) => ((a % n) + n) % n;

let _s = 1337;
const rnd = () => ((_s = (_s * 16807) % 2147483647) - 1) / 2147483646;
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vn(x, y) { 
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); 
  return hash(xi, yi) * (1 - u) * (1 - v) + hash(xi + 1, yi) * u * (1 - v) + hash(xi, yi + 1) * (1 - u) * v + hash(xi + 1, yi + 1) * u * v; 
}
function fbm(x, y) { 
  let a = 0.5, f = 1, s = 0; 
  for (let i = 0; i < 4; i++) { 
    s += a * vn(x * f, y * f); f *= 2; a *= 0.5; 
  } 
  return s; 
}
const C = h => new THREE.Color(h);

// Terrain heightmap function
const cz = x => -12 + 3 * Math.sin(x * 0.05);
function groundY(x, z) {
  const d = Math.hypot(x / 260, z / 90), m = 1 - sstep(0.55, 1, d);
  const n = fbm(x * 0.02 + 10, z * 0.02 + 5) - 0.5;
  return m * 2.4 - 0.7 + n * 1.6 * m + Math.sin(x * 0.9 + n * 9) * 0.03 * m;
}

// ============================================================================
// 2. RENDERER & SCENE INITIALIZATION
// ============================================================================
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !touch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, touch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd8c9a0, 0.0011);
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 4000);

let started = false, rot = false;
function layout() {
  const W = innerWidth, H = innerHeight;
  rot = started && touch && H > W;
  const w = rot ? H : W, h = rot ? W : H;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.transform = rot ? `translate(${W}px,0) rotate(90deg)` : 'none';
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 300));

// ============================================================================
// 3. TOON MATERIAL HELPER (For Anime Aesthetic)
// ============================================================================
const toonGrad = (() => { 
  const t = new THREE.DataTexture(new Uint8Array([70, 140, 210, 255]), 4, 1, THREE.RedFormat); 
  t.minFilter = t.magFilter = THREE.NearestFilter; 
  t.needsUpdate = true; 
  return t; 
})();
const toon = (c, o={}) => new THREE.MeshToonMaterial({ color: c, gradientMap: toonGrad, ...o });

// ============================================================================
// 4. SKY SHADER (Dynamic Volumetric Sky)
// ============================================================================
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: C(0x3d84c8) }, hor: { value: C(0xf2dfb4) },
    sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: C(0xffffff) },
    cloudCol: { value: C(0xffffff) }, time: { value: 0 }, cloud: { value: 0.3 }
  },
  vertexShader: `
    varying vec3 vD; 
    void main() { 
      vD = position; 
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); 
    }
  `,
  fragmentShader: `
    varying vec3 vD; 
    uniform vec3 top, hor, sunDir, sunCol, cloudCol; 
    uniform float time, cloud;
    
    float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p) { 
      vec2 i = floor(p), f = fract(p); 
      f = f * f * (3.0 - 2.0 * f); 
      return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); 
    }
    float fb(vec2 p) { 
      float a = 0.5, s = 0.0; 
      for(int i = 0; i < 5; i++) { 
        s += a * n(p); p *= 2.02; a *= 0.5; 
      } 
      return s; 
    }
    
    void main() {
      vec3 d = normalize(vD); 
      float y = max(d.y, 0.0); 
      vec3 col = mix(hor, top, pow(y, 0.55));
      
      float sd = max(dot(d, sunDir), 0.0); 
      col += sunCol * (pow(sd, 600.0) * 4.0 + pow(sd, 14.0) * 0.4 + pow(sd, 3.0) * 0.12);
      
      if (d.y > 0.0) { 
        vec2 uv = d.xz / (d.y + 0.12) * 1.2 + vec2(time * 0.01, time * 0.004); 
        float c = fb(uv * 1.3); 
        float cov = smoothstep(1.0 - cloud, 1.0 - cloud + 0.28, c) * smoothstep(0.0, 0.12, d.y); 
        vec3 cc = cloudCol * (0.75 + 0.5 * pow(sd, 2.0)); 
        col = mix(col, cc, cov * 0.9); 
      } else {
        col = mix(hor, hor * 0.7, clamp(-d.y * 3.0, 0.0, 1.0));
      }
      
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat);
sky.frustumCulled = false; 
sky.renderOrder = -10; 
scene.add(sky);

// ============================================================================
// 5. WATER SHADER (Dynamic River)
// ============================================================================
function makeWater(alpha) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { 
      time: { value: 0 }, rain: { value: 0 }, alpha: { value: alpha }, fogD: { value: 0.001 }, 
      sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() }, 
      hor: { value: new THREE.Color() }, top: { value: new THREE.Color() }, 
      fogCol: { value: new THREE.Color() }, deepCol: { value: C(0x3a4a36) } 
    },
    vertexShader: `
      varying vec3 wp; 
      void main() { 
        vec4 w = modelMatrix * vec4(position, 1.0); 
        wp = w.xyz; 
        gl_Position = projectionMatrix * viewMatrix * w; 
      }
    `,
    fragmentShader: `
      uniform float time, rain, alpha, fogD; 
      uniform vec3 sunDir, sunCol, hor, top, fogCol, deepCol; 
      varying vec3 wp;
      
      void main() {
        vec2 p = wp.xz; 
        float dx = 0.0, dz = 0.0; 
        float amp = 1.0 + rain * 1.6;
        
        for(int i = 0; i < 5; i++) { 
          float fi = float(i); 
          vec2 d = vec2(cos(fi * 1.9 + 0.4), sin(fi * 1.3 + 0.9)); 
          float f = 0.16 + fi * 0.31; 
          float ph = dot(d, p) * f + time * (0.7 + fi * 0.45); 
          float a = 0.06 * amp / (1.0 + fi * 0.7); 
          dx += d.x * cos(ph) * a * f; 
          dz += d.y * cos(ph) * a * f; 
        }
        
        vec3 n = normalize(vec3(-dx, 1.0, -dz)); 
        vec3 V = normalize(cameraPosition - wp); 
        float fr = pow(1.0 - max(dot(n, V), 0.0), 3.0);
        
        vec3 skyc = mix(hor, top, clamp(reflect(-V, n).y, 0.0, 1.0) * 0.8); 
        vec3 col = mix(deepCol, skyc, clamp(0.12 + fr * 0.85, 0.0, 1.0));
        
        vec3 R = reflect(-sunDir, n); 
        col += sunCol * pow(max(dot(R, V), 0.0), 150.0) * 2.2;
        
        float dist = length(cameraPosition - wp); 
        float f = 1.0 - exp(-fogD * fogD * dist * dist); 
        col = mix(col, fogCol, clamp(f, 0.0, 1.0));
        
        gl_FragColor = vec4(col, mix(0.9, 1.0, fr) * alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  });
}
const waterMat = makeWater(1);
const waterGeo = new THREE.PlaneGeometry(4000, 4000); 
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, waterMat); 
water.renderOrder = 1; 
scene.add(water);

// ============================================================================
// 6. TERRAIN & MORPHING SANDBAR
// ============================================================================
const tg = new THREE.PlaneGeometry(560, 240, touch ? 128 : 224, touch ? 64 : 96); 
tg.rotateX(-Math.PI / 2);
const tp = tg.attributes.position;
const colSand = new Float32Array(tp.count * 3);
const colGrass = new Float32Array(tp.count * 3);

for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i), h = groundY(x, z);
  tp.setY(i, h);
  
  const n = vn(x * 0.15, z * 0.15), r = vn(x * 1.3, z * 0.25), wet = 1 - sstep(0.2, 0.9, h);
  const sa = [0.84 + n * 0.1 + r * 0.04, 0.72 + n * 0.08 + r * 0.03, 0.5 + n * 0.06];
  const c = [lerp(sa[0], 0.5, wet), lerp(sa[1], 0.43, wet), lerp(sa[2], 0.31, wet)];
  colSand.set(c, i * 3);
  
  const w = sstep(0.5, 1.1, h), gr = [0.26 + n * 0.1, 0.48 + n * 0.12, 0.15 + n * 0.04];
  colGrass.set([lerp(c[0], gr[0], w), lerp(c[1], gr[1], w), lerp(c[2], gr[2], w)], i * 3);
}

tg.setAttribute('color', new THREE.BufferAttribute(colSand, 3));
tg.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, transparent: true });
const terrain = new THREE.Mesh(tg, terrainMat); 
terrain.receiveShadow = true; 
scene.add(terrain);

const gg = tg.clone(); 
gg.setAttribute('color', new THREE.BufferAttribute(colGrass, 3));
const grassMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, transparent: true, opacity: 0, polygonOffset: true, polygonOffsetFactor: -1 });
const grass = new THREE.Mesh(gg, grassMat); 
grass.position.y = 0.04; 
grass.receiveShadow = true; 
grass.visible = false; 
scene.add(grass);

// ============================================================================
// 7. LIGHTING SYSTEM
// ============================================================================
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x8a7550, 0.8); 
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(touch ? 1024 : 2048, touch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 600 });
sun.shadow.bias = -0.0004; 
sun.shadow.normalBias = 0.3;
scene.add(sun, sun.target);

// ============================================================================
// 8. ADVANCED VEGETATION SYSTEM
// ============================================================================
const foliageGeo = new THREE.IcosahedronGeometry(1, 1);
{ 
  const p = foliageGeo.attributes.position; 
  for (let i = 0; i < p.count; i++) { 
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + 0.45 * (hash(x * 7.3 + y * 3.1, z * 5.7) - 0.5); 
    p.setXYZ(i, x * k, y * k * 0.85, z * k); 
  } 
  foliageGeo.computeVertexNormals(); 
}

const folMat = toon(0xffffff, { emissive: 0x1b3a10, emissiveIntensity: 0.35 });
const trunkGeo = new THREE.CylinderGeometry(0.18, 0.3, 1, 7); 
trunkGeo.translate(0, 0.5, 0);
const trunkMat = toon(0x6b4a30);

function inst(geo, mat, n) { 
  const m = new THREE.InstancedMesh(geo, mat, n); 
  m.castShadow = true; 
  m.receiveShadow = true; 
  m.frustumCulled = false; 
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); 
  scene.add(m); 
  return m; 
}

const TN = Math.floor(1500 * Q), BN = Math.floor(900 * Q);
const treeTrunk = inst(trunkGeo, trunkMat, TN);
const treeFolA = inst(foliageGeo, folMat, TN);
const treeFolB = inst(foliageGeo, folMat, TN);
const bamStalk = inst(new THREE.CylinderGeometry(0.04, 0.06, 1, 5).translate(0, 0.5, 0), toon(0x9bb83e), BN * 4);
const bamFol = inst(foliageGeo, folMat, BN);

const ok = (x, z, mg) => { 
  if (groundY(x, z) < mg) return false; 
  if (Math.abs(z - cz(x)) < 10 && x > -135 && x < 85) return false; 
  if (x > -48 && x < 17 && z > -5 && z < 10) return false; 
  if (Math.hypot(x - 32, z - 6) < 16) return false; 
  return true; 
};

function spot(mg) { 
  for (let t = 0; t < 60; t++) { 
    const x = (rnd() * 2 - 1) * 235, z = (rnd() * 2 - 1) * 82; 
    if (ok(x, z, mg)) return [x, z]; 
  } 
  return [200, 0]; 
}

const greens = [0x2f7d32, 0x3b8f3a, 0x4b9a3c, 0x5aa63a, 0x6aa62f].map(C);
const trees = [], bambs = [];

for (let i = 0; i < TN; i++) { 
  const [x, z] = spot(0.9), d = Math.hypot(x, z * 1.6); 
  trees.push({ x, z, y: groundY(x, z), H: 9 + rnd() * 7, R: 3.2 + rnd() * 2.2, pa: 2.5 + d * 0.055 + rnd() * 2.5, gd: 6 + rnd() * 4, rot: rnd() * 6.28, ph: rnd() * 6.28 }); 
  treeFolA.setColorAt(i, greens[i % 5]); 
  treeFolB.setColorAt(i, greens[(i + 2) % 5]); 
}

const heroes = [[1.65, 0, 0], [3.1, 0.6, 0.25], [2.3, -1.4, 0.4], [4.2, -0.5, 0.55], [5.3, 1.2, 1.2], [6.6, -0.9, 5.45], [7.3, 0.4, 6.45]];

for (let i = 0; i < BN; i++) { 
  let x, z, pa; 
  const h = heroes[i]; 
  if (h) { x = h[0]; z = h[1]; pa = h[2]; } 
  else { [x, z] = spot(0.9); pa = 0.8 + Math.hypot(x, z * 1.6) * 0.045 + rnd() * 1.5; } 
  bambs.push({ x, z, y: groundY(x, z), H: h ? 8.5 : 7 + rnd() * 3.5, pa, gd: 3 + rnd(), rot: rnd() * 6.28, ph: rnd() * 6.28, l: [0, 1, 2, 3].map(() => 0.06 + rnd() * 0.14), hf: [0, 1, 2, 3].map(() => 0.8 + rnd() * 0.25) }); 
  bamFol.setColorAt(i, greens[i % 5]); 
}

const dummy = new THREE.Object3D();
const grow = (age, pa, gd) => age < pa ? 0 : (0.03 + 0.97 * E(clamp((age - pa) / gd))) * Math.min(1, (age - pa) / 0.04 + 0.001);

function updateVeg(age, T) {
  const vis = age > -0.5;
  for (const m of [treeTrunk, treeFolA, treeFolB, bamStalk, bamFol]) m.visible = vis;
  if (!vis) return;
  
  for (let i = 0; i < TN; i++) {
    const t = trees[i], s = grow(age, t.pa, t.gd), sw = Math.sin(T * 0.9 + t.ph) * 0.012 * s, th = 0.45 + 0.55 * s, S = Math.max(s, 0.0001);
    dummy.position.set(t.x, t.y - 0.05, t.z); 
    dummy.rotation.set(sw, t.rot, sw * 0.7); 
    dummy.scale.set(th, Math.max(0.0001, t.H * s), th); 
    dummy.updateMatrix(); 
    treeTrunk.setMatrixAt(i, dummy.matrix);
    
    dummy.position.set(t.x + sw * t.H * s, t.y + t.H * s * 0.94, t.z); 
    dummy.rotation.set(0, t.rot, 0); 
    dummy.scale.set(t.R * S, t.R * S * 0.82, t.R * S); 
    dummy.updateMatrix(); 
    treeFolA.setMatrixAt(i, dummy.matrix);
    
    dummy.position.set(t.x + Math.cos(t.rot) * t.R * S * 0.5, t.y + t.H * s * 0.76, t.z + Math.sin(t.rot) * t.R * S * 0.4); 
    dummy.scale.set(t.R * S * 0.72, t.R * S * 0.6, t.R * S * 0.72); 
    dummy.updateMatrix(); 
    treeFolB.setMatrixAt(i, dummy.matrix);
  }
  
  for (let i = 0; i < BN; i++) {
    const b = bambs[i], s = grow(age, b.pa, b.gd), sw = Math.sin(T * 1.3 + b.ph) * 0.03 * s, S = Math.max(s, 0.0001);
    for (let j = 0; j < 4; j++) {
      const phi = b.rot + j * 1.57, o = 0.35 * (0.3 + 0.7 * s);
      dummy.position.set(b.x + Math.cos(phi) * o, b.y - 0.05, b.z + Math.sin(phi) * o); 
      dummy.rotation.set(b.l[j] * Math.sin(phi) + sw, 0, -b.l[j] * Math.cos(phi) + sw * 0.7);
      dummy.scale.set(0.5 + 0.5 * s, Math.max(0.0001, b.H * b.hf[j] * s), 0.5 + 0.5 * s); 
      dummy.updateMatrix(); 
      bamStalk.setMatrixAt(i * 4 + j, dummy.matrix);
    }
    dummy.position.set(b.x + sw * b.H * s, b.y + b.H * s * 0.9, b.z); 
    dummy.rotation.set(0, b.rot, 0); 
    dummy.scale.set(2.2 * S, 1.4 * S, 2.2 * S); 
    dummy.updateMatrix(); 
    bamFol.setMatrixAt(i, dummy.matrix);
  }
  
  for (const m of [treeTrunk, treeFolA, treeFolB, bamStalk, bamFol]) m.instanceMatrix.needsUpdate = true;
}

const mood = { sc: new THREE.Color(), top: new THREE.Color(), hor: new THREE.Color(), fog: new THREE.Color(), cc: new THREE.Color() };
const sunDir = new THREE.Vector3();

function applyMood(T) {
  let i = 0; 
  while (i < MK.length - 2 && T >= MK[i + 1].t) i++;
  const a = MK[i], b = MK[i + 1], u = sstep(a.t, b.t, T);
  
  for (const k of ['el', 'az', 'si', 'fd', 'hi', 'ex', 'cl', 'rain']) mood[k] = lerp(a[k], b[k], u);
  for (const k of ['sc', 'top', 'hor', 'fog', 'cc']) mood[k].copy(a[k]).lerp(b[k], u);

  const el = mood.el * Math.PI / 180, az = mood.az * Math.PI / 180;
  sunDir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  
  sun.color.copy(mood.sc); 
  sun.intensity = mood.si;
  hemi.color.copy(mood.top).lerp(new THREE.Color(1, 1, 1), 0.35); 
  hemi.intensity = mood.hi;
  scene.fog.color.copy(mood.fog); 
  scene.fog.density = mood.fd;
  renderer.toneMappingExposure = mood.ex;

  const su = skyMat.uniforms;
  su.top.value.copy(mood.top); 
  su.hor.value.copy(mood.hor); 
  su.sunDir.value.copy(sunDir); 
  su.sunCol.value.copy(mood.sc); 
  su.cloudCol.value.copy(mood.cc); 
  su.cloud.value = mood.cl; 
  su.time.value = T;

  const w = waterMat.uniforms;
  w.time.value = T; 
  w.rain.value = mood.rain; 
  w.fogD.value = mood.fd; 
  w.sunDir.value.copy(sunDir); 
  w.sunCol.value.copy(mood.sc); 
  w.hor.value.copy(mood.hor); 
  w.top.value.copy(mood.top); 
  w.fogCol.value.copy(mood.fog);

  const age = ageOf(T);
  grassMat.opacity = sstep(0, 10, age);
  grass.visible = grassMat.opacity > 0.01;
  const sandDarken = 1 - sstep(0, 15, age) * 0.6;
  terrainMat.color.setRGB(sandDarken, sandDarken, sandDarken);
}

function ageOf(T) {
  if (T < 52.4) return -1;
  if (T < 60) return (T - 52.4) / 7.6 * 0.6;
  if (T < 95) return 0.6 + (T - 60) / 35 * 11.4;
  if (T < 130) return 12 + (T - 95) / 35 * 26;
  return 38 + (T - 130) * 0.1;
}

const eyeMat = toon(0x0b0806);

function makePerson(o) {
  const P = { seed: rnd() * 6, o }; 
  const g = new THREE.Group(); 
  P.g = g;
  
  const root = new THREE.Group(); 
  g.add(root); 
  P.root = root;
  
  const upper = new THREE.Group(); 
  upper.position.y = 0.78; 
  root.add(upper); 
  P.upper = upper;
  
  const skin = toon(o.skin), shirt = toon(o.shirt), pants = toon(o.pants), hair = toon(o.hair);
  const add = (geo, mat, par, x = 0, y = 0, z = 0) => { 
    const m = new THREE.Mesh(geo, mat); 
    m.position.set(x, y, z); 
    m.castShadow = true; 
    par.add(m); 
    return m; 
  };
  
  // Torso
  const torso = add(new THREE.CapsuleGeometry(0.19, 0.36, 4, 12), shirt, upper, 0, 0.34, 0); 
  torso.scale.set(1.12, 1, 0.78);
  add(new THREE.CylinderGeometry(0.055, 0.065, 0.14, 8), skin, upper, 0, 0.76, 0);
  
  // Head
  const head = new THREE.Group(); 
  head.position.y = 0.9; 
  upper.add(head); 
  P.head = head;
  
  const hm = add(new THREE.SphereGeometry(0.135, 20, 16), skin, head); 
  hm.scale.set(0.92, 1.1, 1);
  const hr = add(new THREE.SphereGeometry(0.142, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.58), hair, head, 0, 0.018, -0.01); 
  hr.rotation.x = -0.28;
  
  for (const sx of [-1, 1]) add(new THREE.SphereGeometry(0.016, 8, 6), eyeMat, head, sx * 0.048, 0.02, 0.125);
  add(new THREE.SphereGeometry(0.02, 8, 6), skin, head, 0, -0.01, 0.135);
  
  // Mustache
  if (o.must) { 
    P.must = add(new THREE.CapsuleGeometry(0.011, 0.075, 3, 6), toon(o.must), head, 0, -0.04, 0.13); 
    P.must.rotation.z = Math.PI / 2; 
  }
  
  // Scarf / Traditional clothing
  if (o.scarf) { 
    const t = add(new THREE.TorusGeometry(0.115, 0.035, 6, 14), toon(0xc8261e), upper, 0, 0.7, 0); 
    t.rotation.x = Math.PI / 2; 
    add(new THREE.BoxGeometry(0.08, 0.3, 0.03), toon(0xeeeeee), upper, 0.08, 0.55, 0.14); 
  }
  
  // Limbs
  const limb = (par, x, y, len, r, mat) => { 
    const pv = new THREE.Group(); 
    pv.position.set(x, y, 0); 
    par.add(pv); 
    add(new THREE.CapsuleGeometry(r, len, 4, 8), mat, pv, 0, -(len / 2 + r * 0.8), 0); 
    return pv; 
  };
  
  P.legL = limb(root, -0.1, 0.78, 0.62, 0.085, pants); 
  P.legR = limb(root, 0.1, 0.78, 0.62, 0.085, pants);
  P.armL = limb(upper, -0.27, 0.62, 0.44, 0.055, shirt); 
  P.armR = limb(upper, 0.27, 0.62, 0.44, 0.055, shirt);
  
  for (const a of [P.armL, P.armR]) add(new THREE.SphereGeometry(0.05, 10, 8), skin, a, 0, -0.55, 0);
  for (const l of [P.legL, P.legR]) add(new THREE.BoxGeometry(0.1, 0.05, 0.22), skin, l, 0, -0.75, 0.05);
  
  g.scale.setScalar(o.scale || 1); 
  P.stoop = o.stoop || 0; 
  scene.add(g); 
  return P;
}

// Pose / Animation function
function pose(P, s, T) {
  P.g.visible = !!s.vis; 
  if (!s.vis) return;
  
  const w = s.walk || 0, k = s.kneel || 0, sit = s.sit || 0, ph = (s.dist || 0) * 3.6, sw = Math.sin(ph) * 0.75 * w;
  P.g.position.set(s.x, s.y, s.z); 
  P.g.rotation.y = s.ry;
  
  let l1 = lerp(sw, -1.35, k), l2 = lerp(-sw, 1, k); 
  l1 = lerp(l1, -1.45, sit); 
  l2 = lerp(l2, -1.45, sit);
  
  P.legL.rotation.x = l1; 
  P.legR.rotation.x = l2;
  P.root.position.y = Math.abs(Math.cos(ph)) * 0.025 * w - 0.55 * k - 0.66 * sit;
  P.upper.rotation.x = k * 0.55 + P.stoop; 
  P.upper.position.y = 0.78 + Math.sin(T * 1.8 + P.seed) * 0.004;
  
  P.armL.rotation.x = s.aL !== undefined ? s.aL : -sw * 0.8; 
  P.armR.rotation.x = s.aR !== undefined ? s.aR : sw * 0.8;
  P.armL.rotation.z = -0.08; 
  P.armR.rotation.z = 0.08;
  P.head.rotation.x = s.hx || 0; 
  P.head.rotation.y = s.hy || 0;
}

function updateCamera(T) {
  let prev = keyframes[0], next = keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length - 1; i++) {
    if (T >= keyframes[i].t && T <= keyframes[i + 1].t) { 
      prev = keyframes[i]; 
      next = keyframes[i + 1]; 
      break; 
    }
  }
  const u = E(clamp((T - prev.t) / (next.t - prev.t)));
  camera.position.set(
    lerp(prev.p[0], next.p[0], u),
    lerp(prev.p[1], next.p[1], u),
    lerp(prev.p[2], next.p[2], u)
  );
  const target = new THREE.Vector3(
    lerp(prev.tg[0], next.tg[0], u),
    lerp(prev.tg[1], next.tg[1], u),
    lerp(prev.tg[2], next.tg[2], u)
  );
  camera.lookAt(target);
  sun.target.position.copy(target);
}

  }
  if (active) {
    if (sub.textContent !== active.text) {
      sub.style.opacity = 0;
      setTimeout(() => { 
        sub.textContent = active.text; 
        sub.style.opacity = 1; 
      }, 300);
    } else {
      sub.style.opacity = 1;
    }
  } else {
    sub.style.opacity = 0;
  }
}

// ============================================================================
// 14. CHARACTER CHOREOGRAPHY (The Play)
// ============================================================================
function updateCharacters(T) {
  YJ.g.visible = false; 
  OJ.g.visible = false; 
  OFF.g.visible = false; 
  PRS.g.visible = false;
  students.forEach(s => s.g.visible = false);

  // Scene 1: Young Jadav walking
  if (T > 10 && T < 32) {
    const p = clamp((T - 10) / 18);
    pose(YJ, { vis: true, x: lerp(20, 8, p), y: groundY(lerp(20, 8, p), 25), z: 25, ry: PI, walk: 1, dist: p * 15 }, T);
    YJ.head.rotation.x = -0.2;
  }

  // Scene 2: Official meeting
  if (T > 32 && T < 52) {
    const p = clamp((T - 32) / 10);
    pose(YJ, { vis: true, x: 8, y: groundY(8, 20), z: 20, ry: 0.5, walk: 0 }, T);
    pose(OFF, { vis: true, x: 10, y: groundY(10, 18), z: 18, ry: -0.5, walk: 0 }, T);
  }

  // Scene 2b: Planting
  if (T > 48 && T < 60) {
    const p = clamp((T - 48) / 12);
    pose(YJ, { vis: true, x: 8, y: groundY(8, 26), z: 26, ry: -0.2, kneel: p > 0.5 ? 1 : 0, aR: p > 0.5 ? -1.2 : 0 }, T);
  }

  // Scene 3: Montage (Growing up)
  if (T > 60 && T < 95) {
    const p = clamp((T - 60) / 35);
    YJ.g.scale.setScalar(lerp(0.9, 0.95, p));
    if (p < 0.5) {
      pose(YJ, { vis: true, x: 8, y: groundY(8, 26), z: 26, ry: -0.2, walk: 0, aR: -1.2, aL: -0.5 }, T);
    } else {
      pose(YJ, { vis: true, x: 10, y: groundY(10, 28), z: 28, ry: 0.8, walk: 1, dist: p * 20 }, T);
    }
  }

  // Scene 4: Birth of Forest (Older Jadav walking)
  if (T > 95 && T < 130) {
    const p = clamp((T - 95) / 35);
    pose(OJ, { vis: true, x: lerp(15, 5, p), y: groundY(lerp(15, 5, p), 26), z: 26, ry: PI, walk: 1, dist: p * 15 }, T);
  }

  // Scene 5: Padma Shri (President & Jadav)
  if (T > 130 && T < 150) {
    const p = clamp((T - 130) / 20);
    pose(OJ, { vis: true, x: 12, y: groundY(12, 24), z: 24, ry: 0.2, walk: 0 }, T);
    pose(PRS, { vis: true, x: 15, y: groundY(15, 24), z: 24, ry: -0.2, walk: 0 }, T);
    
    if (p > 0.5 && p < 0.8) {
      OJ.armR.rotation.x = -1.2; 
      PRS.armR.rotation.x = -1.0;
    }
  }

  // Scene 6: Students (Ending)
  if (T > 150 && T < TOTAL_DURATION) {
    pose(OJ, { vis: true, x: 15, y: groundY(15, 30), z: 30, ry: -0.5, walk: 0 }, T);
    
    for (let i = 0; i < students.length; i++) {
      const s = students[i];
      const angle = (i / students.length) * PI * 2;
      const r = 4 + (i % 3) * 1.5;
      const px = 25 + Math.cos(angle) * r;
      const pz = 15 + Math.sin(angle) * r;
      pose(s, { vis: true, x: px, y: groundY(px, pz), z: pz, ry: angle + PI, walk: 0 }, T);
    }
  }

  // Screen fade in/out
  if (T < 5) { 
    $('#fade-overlay').style.opacity = 1 - (T / 5); 
  } else { 
    $('#fade-overlay').style.opacity = 0; 
  }
}

// ============================================================================
// 15. ANIMATION LOOP & TIMELINE CONTROL
// ============================================================================
let clock = new THREE.Clock();
let timelineTime = 0;
let isPlaying = false;
let animFrame;

function animate() {
  if (!isPlaying) return;
  
  const delta = clock.getDelta();
  timelineTime += delta;
  
  if (timelineTime > TOTAL_DURATION) timelineTime = TOTAL_DURATION;

  // Update all systems based on timeline
  updateCamera(timelineTime);
  applyMood(timelineTime);
  updateVeg(ageOf(timelineTime), timelineTime);
  updateSubtitles(timelineTime);
  updateCharacters(timelineTime);
  updateAnimals(timelineTime);

  // Water animation is tied directly to global time
  waterMat.uniforms.time.value = timelineTime;
  
  renderer.render(scene, camera);

  if (timelineTime < TOTAL_DURATION) {
    animFrame = requestAnimationFrame(animate);
  } else {
    showEndSequence();
  }
}

// ============================================================================
// 16. END SEQUENCE TRIGGER
// ============================================================================
function showEndSequence() {
  $('#fade-overlay').style.opacity = 1;
  
  setTimeout(() => { 
    $('#end-sequence').style.opacity = 1; 
    $('#end-line-1').classList.add('active'); 
  }, 1500);
  
  setTimeout(() => { 
    $('#end-line-2').classList.add('active'); 
  }, 3500);
  
  setTimeout(() => { 
    $('#end-line-3').classList.add('active'); 
  }, 5500);
  
  setTimeout(() => {
    $('#end-line-1').classList.remove('active'); 
    $('#end-line-2').classList.remove('active'); 
    $('#end-line-3').classList.remove('active');
    $('#end-question').classList.add('active');
  }, 8000);
  
  setTimeout(() => {
    $('#end-question').classList.remove('active');
    $('#end-title').classList.add('active');
  }, 11000);
}

// ============================================================================
// 17. EXPERIENCE BOOTSTRAP & EVENT LISTENERS
// ============================================================================
function startExperience() {
  if (isPlaying) return;
  started = true;

  // Trigger Fullscreen & Landscape orientation lock
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen().then(() => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(e => {
          console.log('Orientation lock unsupported or denied.');
        });
      }
    }).catch(e => {
      console.log('Fullscreen request failed.');
    });
  }

  // Hide Menu and Show Stage
  $('#menu').style.opacity = 0;
  setTimeout(() => { 
    $('#menu').style.display = 'none'; 
  }, 1500);
  
  stage.style.visibility = 'visible';
  
  layout();
  clock.start();
  isPlaying = true;
  timelineTime = 0;
  
  // Start Loop
  animate();
}

window.addEventListener('load', () => {
  layout();
  
  // Bind Start Button
  $('#watch-btn').addEventListener('click', startExperience);
  
  // Pre-render initial black frame so there's no flash
  applyMood(0);
  renderer.render(scene, camera);
});
</script>
