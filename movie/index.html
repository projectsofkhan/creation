<script type="module">
import * as THREE from 'three';

// --- Setup & Utilities ---
const $ = s => document.querySelector(s);
const canvas = $('#c'), stage = $('#stage');
const touch = matchMedia('(pointer:coarse)').matches;
const Q = touch ? 0.6 : 1; // Quality multiplier for mobile
const TOTAL = 180; // 3 Minutes

const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const E = u => u * u * (3 - 2 * u);
const mod = (a, n) => ((a % n) + n) % n;

let _s = 1337;
const rnd = () => ((_s = (_s * 16807) % 2147483647) - 1) / 2147483646;
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return hash(xi, yi) * (1 - u) * (1 - v) + hash(xi + 1, yi) * u * (1 - v) + hash(xi, yi + 1) * (1 - u) * v + hash(xi + 1, yi + 1) * u * v; }
function fbm(x, y) { let a = .5, f = 1, s = 0; for (let i = 0; i < 4; i++) { s += a * vn(x * f, y * f); f *= 2; a *= .5; } return s; }
const C = h => new THREE.Color(h);
const white = new THREE.Color(1, 1, 1);

// Heightmap for terrain (creates the sandbar)
const cz = x => -12 + 3 * Math.sin(x * .05);
function groundY(x, z) {
  const d = Math.hypot(x / 260, z / 90), m = 1 - sstep(.55, 1, d);
  const n = fbm(x * .02 + 10, z * .02 + 5) - .5;
  return m * 2.4 - .7 + n * 1.6 * m + Math.sin(x * .9 + n * 9) * .03 * m;
}

// --- Renderer & Scene ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !touch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, touch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd8c9a0, .0011);
const camera = new THREE.PerspectiveCamera(48, 16 / 9, .05, 4000);

let started = false, rot = false;
function layout() {
  const W = innerWidth, H = innerHeight;
  rot = started && touch && H > W;
  const w = rot ? H : W, h = rot ? W : H;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.transform = rot ? `translate(${W}px,0) rotate(90deg)` : 'none';
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 300));

// --- Materials & Textures ---
const toonGrad = (() => {
  const t = new THREE.DataTexture(new Uint8Array([70, 140, 210, 255]), 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const toon = (c, o={}) => new THREE.MeshToonMaterial({ color: c, gradientMap: toonGrad, ...o });

// --- Sky Shader ---
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: C(0x3d84c8) }, hor: { value: C(0xf2dfb4) },
    sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: C(0xffffff) },
    cloudCol: { value: C(0xffffff) }, time: { value: 0 }, cloud: { value: .3 }
  },
  vertexShader: `varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    varying vec3 vD; uniform vec3 top, hor, sunDir, sunCol, cloudCol; uniform float time, cloud;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
    float fb(vec2 p){ float a = .5, s = 0.; for(int i=0; i<5; i++){ s += a * n(p); p *= 2.02; a *= .5; } return s; }
    void main() {
      vec3 d = normalize(vD); float y = max(d.y, 0.); vec3 col = mix(hor, top, pow(y, .55));
      float sd = max(dot(d, sunDir), 0.); col += sunCol * (pow(sd, 600.) * 4. + pow(sd, 14.) * .4 + pow(sd, 3.) * .12);
      if(d.y > 0.) { vec2 uv = d.xz / (d.y + .12) * 1.2 + vec2(time * .01, time * .004); float c = fb(uv * 1.3); float cov = smoothstep(1. - cloud, 1. - cloud + .28, c) * smoothstep(0., .12, d.y); vec3 cc = cloudCol * (.75 + .5 * pow(sd, 2.)); col = mix(col, cc, cov * .9); }
      else col = mix(hor, hor * .7, clamp(-d.y * 3., 0., 1.));
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

// --- Water Shader ---
function makeWater(alpha) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { time: { value: 0 }, rain: { value: 0 }, alpha: { value: alpha }, fogD: { value: .001 }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, top: { value: new THREE.Color() }, fogCol: { value: new THREE.Color() }, deepCol: { value: C(0x3a4a36) } },
    vertexShader: `varying vec3 wp; void main() { vec4 w = modelMatrix * vec4(position, 1.); wp = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform float time, rain, alpha, fogD; uniform vec3 sunDir, sunCol, hor, top, fogCol, deepCol; varying vec3 wp;
      void main() {
        vec2 p = wp.xz; float dx = 0., dz = 0.; float amp = 1. + rain * 1.6;
        for(int i=0; i<5; i++) { float fi = float(i); vec2 d = vec2(cos(fi * 1.9 + .4), sin(fi * 1.3 + .9)); float f = .16 + fi * .31; float ph = dot(d, p) * f + time * (.7 + fi * .45); float a = .06 * amp / (1. + fi * .7); dx += d.x * cos(ph) * a * f; dz += d.y * cos(ph) * a * f; }
        vec3 n = normalize(vec3(-dx, 1., -dz)); vec3 V = normalize(cameraPosition - wp); float fr = pow(1. - max(dot(n, V), 0.), 3.);
        vec3 skyc = mix(hor, top, clamp(reflect(-V, n).y, 0., 1.) * .8); vec3 col = mix(deepCol, skyc, clamp(.12 + fr * .85, 0., 1.));
        vec3 R = reflect(-sunDir, n); col += sunCol * pow(max(dot(R, V), 0.), 150.) * 2.2;
        float dist = length(cameraPosition - wp); float f = 1. - exp(-fogD * fogD * dist * dist); col = mix(col, fogCol, clamp(f, 0., 1.));
        gl_FragColor = vec4(col, mix(.9, 1., fr) * alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
}
const waterMat = makeWater(1);
const waterGeo = new THREE.PlaneGeometry(4000, 4000); waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, waterMat); water.renderOrder = 1; scene.add(water);

// --- Terrain & Morphing Sandbar ---
const tg = new THREE.PlaneGeometry(560, 240, touch ? 128 : 224, touch ? 64 : 96); tg.rotateX(-Math.PI / 2);
const tp = tg.attributes.position;
const colSand = new Float32Array(tp.count * 3);
const colGrass = new Float32Array(tp.count * 3);

for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i), h = groundY(x, z);
  tp.setY(i, h);
  const n = vn(x * .15, z * .15), r = vn(x * 1.3, z * .25), wet = 1 - sstep(.2, .9, h);
  const sa = [.84 + n * .1 + r * .04, .72 + n * .08 + r * .03, .5 + n * .06];
  const c = [lerp(sa[0], .5, wet), lerp(sa[1], .43, wet), lerp(sa[2], .31, wet)];
  colSand.set(c, i * 3);
  
  const w = sstep(.5, 1.1, h), gr = [.26 + n * .1, .48 + n * .12, .15 + n * .04];
  colGrass.set([lerp(c[0], gr[0], w), lerp(c[1], gr[1], w), lerp(c[2], gr[2], w)], i * 3);
}
tg.setAttribute('color', new THREE.BufferAttribute(colSand, 3));
tg.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, transparent: true });
const terrain = new THREE.Mesh(tg, terrainMat); terrain.receiveShadow = true; scene.add(terrain);

// Secondary grass mesh that fades in
const gg = tg.clone(); gg.setAttribute('color', new THREE.BufferAttribute(colGrass, 3));
const grassMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, transparent: true, opacity: 0, polygonOffset: true, polygonOffsetFactor: -1 });
const grass = new THREE.Mesh(gg, grassMat); grass.position.y = .04; grass.receiveShadow = true; grass.visible = false; scene.add(grass);

// --- Lights ---
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x8a7550, .8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(touch ? 1024 : 2048, touch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 600 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .3;
scene.add(sun, sun.target);

// --- Vegetation System (Grows over time) ---
const foliageGeo = new THREE.IcosahedronGeometry(1, 1);
{ const p = foliageGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = 1 + .45 * (hash(x * 7.3 + y * 3.1, z * 5.7) - .5); p.setXYZ(i, x * k, y * k * .85, z * k); } foliageGeo.computeVertexNormals(); }
const folMat = toon(0xffffff, { emissive: 0x1b3a10, emissiveIntensity: .35 });
const trunkGeo = new THREE.CylinderGeometry(.18, .3, 1, 6); trunkGeo.translate(0, .5, 0);
const trunkMat = toon(0x6b4a30);

function inst(geo, mat, n) { const m = new THREE.InstancedMesh(geo, mat, n); m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); return m; }

const TN = Math.floor(1300 * Q), BN = Math.floor(800 * Q);
const treeTrunk = inst(trunkGeo, trunkMat, TN);
const treeFolA = inst(foliageGeo, folMat, TN);
const treeFolB = inst(foliageGeo, folMat, TN);
const bamStalk = inst(new THREE.CylinderGeometry(.04, .06, 1, 5).translate(0, .5, 0), toon(0x9bb83e), BN * 4);
const bamFol = inst(foliageGeo, folMat, BN);

const ok = (x, z, mg) => { if (groundY(x, z) < mg) return false; if (Math.abs(z - cz(x)) < 10 && x > -135 && x < 85) return false; if (x > -48 && x < 17 && z > -5 && z < 10) return false; if (Math.hypot(x - 32, z - 6) < 16) return false; return true; };
function spot(mg) { for (let t = 0; t < 60; t++) { const x = (rnd() * 2 - 1) * 235, z = (rnd() * 2 - 1) * 82; if (ok(x, z, mg)) return [x, z]; } return [200, 0]; }

const greens = [0x2f7d32, 0x3b8f3a, 0x4b9a3c, 0x5aa63a, 0x6aa62f].map(C);
const trees = [], bambs = [];
for (let i = 0; i < TN; i++) { const [x, z] = spot(.9), d = Math.hypot(x, z * 1.6); trees.push({ x, z, y: groundY(x, z), H: 9 + rnd() * 7, R: 3.2 + rnd() * 2.2, pa: 2.5 + d * .055 + rnd() * 2.5, gd: 6 + rnd() * 4, rot: rnd() * 6.28, ph: rnd() * 6.28 }); treeFolA.setColorAt(i, greens[i % 5]); treeFolB.setColorAt(i, greens[(i + 2) % 5]); }
const heroes = [[1.65, 0, 0], [3.1, .6, .25], [2.3, -1.4, .4], [4.2, -.5, .55], [5.3, 1.2, 1.2], [6.6, -.9, 5.45], [7.3, .4, 6.45]];
for (let i = 0; i < BN; i++) { let x, z, pa; const h = heroes[i]; if (h) { x = h[0]; z = h[1]; pa = h[2]; } else { [x, z] = spot(.9); pa = .8 + Math.hypot(x, z * 1.6) * .045 + rnd() * 1.5; } bambs.push({ x, z, y: groundY(x, z), H: h ? 8.5 : 7 + rnd() * 3.5, pa, gd: 3 + rnd(), rot: rnd() * 6.28, ph: rnd() * 6.28, l: [0, 1, 2, 3].map(() => .06 + rnd() * .14), hf: [0, 1, 2, 3].map(() => .8 + rnd() * .25) }); bamFol.setColorAt(i, greens[i % 5]); }
for (const m of [treeFolA, treeFolB, bamFol]) m.instanceColor.needsUpdate = true;

const dummy = new THREE.Object3D();
const grow = (age, pa, gd) => age < pa ? 0 : (.03 + .97 * E(clamp((age - pa) / gd))) * Math.min(1, (age - pa) / .04 + .001);

function updateVeg(age, T) {
  const vis = age > -.5;
  for (const m of [treeTrunk, treeFolA, treeFolB, bamStalk, bamFol]) m.visible = vis;
  if (!vis) return;
  for (let i = 0; i < TN; i++) {
    const t = trees[i], s = grow(age, t.pa, t.gd), sw = Math.sin(T * .9 + t.ph) * .012 * s, th = .45 + .55 * s, S = Math.max(s, .0001);
    dummy.position.set(t.x, t.y - .05, t.z); dummy.rotation.set(sw, t.rot, sw * .7); dummy.scale.set(th, Math.max(.0001, t.H * s), th); dummy.updateMatrix(); treeTrunk.setMatrixAt(i, dummy.matrix);
    dummy.position.set(t.x + sw * t.H * s, t.y + t.H * s * .94, t.z); dummy.rotation.set(0, t.rot, 0); dummy.scale.set(t.R * S, t.R * S * .82, t.R * S); dummy.updateMatrix(); treeFolA.setMatrixAt(i, dummy.matrix);
    dummy.position.set(t.x + Math.cos(t.rot) * t.R * S * .5, t.y + t.H * s * .76, t.z + Math.sin(t.rot) * t.R * S * .4); dummy.scale.set(t.R * S * .72, t.R * S * .6, t.R * S * .72); dummy.updateMatrix(); treeFolB.setMatrixAt(i, dummy.matrix);
  }
  for (let i = 0; i < BN; i++) {
    const b = bambs[i], s = grow(age, b.pa, b.gd), sw = Math.sin(T * 1.3 + b.ph) * .03 * s, S = Math.max(s, .0001);
    for (let j = 0; j < 4; j++) {
      const phi = b.rot + j * 1.57, o = .35 * (.3 + .7 * s);
      dummy.position.set(b.x + Math.cos(phi) * o, b.y - .05, b.z + Math.sin(phi) * o); dummy.rotation.set(b.l[j] * Math.sin(phi) + sw, 0, -b.l[j] * Math.cos(phi) + sw * .7);
      dummy.scale.set(.5 + .5 * s, Math.max(.0001, b.H * b.hf[j] * s), .5 + .5 * s); dummy.updateMatrix(); bamStalk.setMatrixAt(i * 4 + j, dummy.matrix);
    }
    dummy.position.set(b.x + sw * b.H * s, b.y + b.H * s * .9, b.z); dummy.rotation.set(0, b.rot, 0); dummy.scale.set(2.2 * S, 1.4 * S, 2.2 * S); dummy.updateMatrix(); bamFol.setMatrixAt(i, dummy.matrix);
  }
  for (const m of [treeTrunk, treeFolA, treeFolB, bamStalk, bamFol]) m.instanceMatrix.needsUpdate = true;
}

// --- Character Rigging ---
const eyeMat = toon(0x0b0806);
function makePerson(o) {
  const P = { seed: rnd() * 6, o }; const g = new THREE.Group(); P.g = g;
  const root = new THREE.Group(); g.add(root); P.root = root;
  const upper = new THREE.Group(); upper.position.y = .78; root.add(upper); P.upper = upper;
  const skin = toon(o.skin), shirt = toon(o.shirt), pants = toon(o.pants), hair = toon(o.hair);
  const add = (geo, mat, par, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; par.add(m); return m; };
  
  const torso = add(new THREE.CapsuleGeometry(.19, .36, 4, 12), shirt, upper, 0, .34, 0); torso.scale.set(1.12, 1, .78);
  add(new THREE.CylinderGeometry(.055, .065, .14, 8), skin, upper, 0, .76, 0);
  const head = new THREE.Group(); head.position.y = .9; upper.add(head); P.head = head;
  const hm = add(new THREE.SphereGeometry(.135, 20, 16), skin, head); hm.scale.set(.92, 1.1, 1);
  const hr = add(new THREE.SphereGeometry(.142, 20, 12, 0, Math.PI * 2, 0, Math.PI * .58), hair, head, 0, .018, -.01); hr.rotation.x = -.28;
  for (const sx of [-1, 1]) add(new THREE.SphereGeometry(.016, 8, 6), eyeMat, head, sx * .048, .02, .125);
  add(new THREE.SphereGeometry(.02, 8, 6), skin, head, 0, -.01, .135);
  
  if (o.must) { P.must = add(new THREE.CapsuleGeometry(.011, .075, 3, 6), toon(o.must), head, 0, -.04, .13); P.must.rotation.z = Math.PI / 2; }
  if (o.scarf) { const t = add(new THREE.TorusGeometry(.115, .035, 6, 14), toon(0xc8261e), upper, 0, .7, 0); t.rotation.x = Math.PI / 2; add(new THREE.BoxGeometry(.08, .3, .03), toon(0xeeeeee), upper, .08, .55, .14); }
  
  const limb = (par, x, y, len, r, mat) => { const pv = new THREE.Group(); pv.position.set(x, y, 0); par.add(pv); add(new THREE.CapsuleGeometry(r, len, 4, 8), mat, pv, 0, -(len / 2 + r * .8), 0); return pv; };
  P.legL = limb(root, -.1, .78, .62, .085, pants); P.legR = limb(root, .1, .78, .62, .085, pants);
  P.armL = limb(upper, -.27, .62, .44, .055, shirt); P.armR = limb(upper, .27, .62, .44, .055, shirt);
  for (const a of [P.armL, P.armR]) add(new THREE.SphereGeometry(.05, 10, 8), skin, a, 0, -.55, 0);
  for (const l of [P.legL, P.legR]) add(new THREE.BoxGeometry(.1, .05, .22), skin, l, 0, -.75, .05);
  
  g.scale.setScalar(o.scale || 1); P.stoop = o.stoop || 0; scene.add(g); return P;
}

// Characters
const PI = Math.PI;
const YJ = makePerson({ skin: 0x8c5a3a, shirt: 0x8a7a5a, pants: 0xb8aa8c, hair: 0x120d0b, must: 0x1a1210, scale: .9 }); // Young Jadav
const OJ = makePerson({ skin: 0x7a4c30, shirt: 0xe8dcc0, pants: 0xf0ece0, hair: 0xe6e6e6, must: 0xf2f2f2, scarf: true, scale: .97, stoop: .1 }); // Older Jadav
const OFF = makePerson({ skin: 0x9a6a46, shirt: 0x6f7a4e, pants: 0x3f4a35, hair: 0x151010, scale: 1.03 }); // Official

const listeners = []; for (let i = 0; i < 6; i++) listeners.push(makePerson({ skin: [0x8c5a3a, 0x9a6a46, 0x7a4c30, 0xa4734d][i % 4], shirt: [0x9a4a3a, 0x3f6a8a, 0x6a8a4a, 0xc9a24a][i % 4], pants: 0x3a3a4a, hair: 0x151010, scale: .95 }));
const students = []; for (let i = 0; i < 11; i++) students.push(makePerson({ skin: [0x8c5a3a, 0x9a6a46, 0x7a4c30, 0xa4734d][i % 4], shirt: 0xf2f2f2, pants: 0x24407a, hair: 0x120d0b, scale: .74 }));

// Poses Logic
function pose(P, s, T) {
  P.g.visible = !!s.vis; if (!s.vis) return;
  const w = s.walk || 0, k = s.kneel || 0, sit = s.sit || 0, ph = (s.dist || 0) * 3.6, sw = Math.sin(ph) * .75 * w;
  P.g.position.set(s.x, s.y, s.z); P.g.rotation.y = s.ry;
  let l1 = lerp(sw, -1.35, k), l2 = lerp(-sw, 1, k); l1 = lerp(l1, -1.45, sit); l2 = lerp(l2, -1.45, sit);
  P.legL.rotation.x = l1; P.legR.rotation.x = l2;
  P.root.position.y = Math.abs(Math.cos(ph)) * .025 * w - .55 * k - .66 * sit;
  P.upper.rotation.x = k * .55 + P.stoop; P.upper.position.y = .78 + Math.sin(T * 1.8 + P.seed) * .004;
  P.armL.rotation.x = s.aL !== undefined ? s.aL : -sw * .8; P.armR.rotation.x = s.aR !== undefined ? s.aR : sw * .8;
  P.armL.rotation.z = -.08; P.armR.rotation.z = .08;
  P.head.rotation.x = s.hx || 0; P.head.rotation.y = s.hy || 0;
}

// --- Mood & Lighting Engine ---
const M = (t, el, az, si, sc, top, hor, fog, fd, hi, ex, cl, cc, rain) => ({ t, el, az, si, sc: C(sc), top: C(top), hor: C(hor), fog: C(fog), fd, hi, ex, cl, cc: C(cc), rain });
const MK = [
  M(0, 60, 215, 3.4, 0xfff0d2, 0x3d84c8, 0xf2dfb4, 0xebdcb4, .0011, .8, 1.05, .12, 0xffffff, 0), // Start
  M(30, 50, 215, 3.2, 0xfff0d2, 0x3d84c8, 0xf2dfb4, 0xebdcb4, .0011, .8, 1.05, .15, 0xffffff, 0),
  M(62, 46, 200, 3.2, 0xfff0d2, 0x3d84c8, 0xf2dfb4, 0xebdcb4, .0012, .8, 1.05, .25, 0xffffff, 0),
  M(67.8, 40, 200, 1.2, 0xdfe6f0, 0x5d6a76, 0xa3abae, 0xa4abad, .0035, 1, 1.1, .9, 0x9aa2a8, .7), // Storm
  M(73.4, 38, 200, 2.6, 0xfff1d6, 0x4a8fd0, 0xe8e2c4, 0xe2dcc0, .0016, .85, 1.05, .4, 0xffffff, 0),
  M(79.2, 40, 200, .8, 0xdfe6f0, 0x4d5762, 0x8f989b, 0x8d9699, .006, 1.1, 1.15, 1, 0x7d858b, 0), // Mist
  M(84.8, 38, 220, 3.1, 0xfff4d8, 0x3a90d8, 0xd9ecdb, 0xd6e8d6, .0018, .9, 1, .3, 0xffffff, 0),
  M(87.6, 12, 100, 1.7, 0xffd9a8, 0x7fa3c8, 0xf5e3cc, 0xe8e4dc, .012, .75, 1.05, .3, 0xffffff, 0), // Golden Hour
  M(130, 20, 250, 3.2, 0xffcf94, 0x5a8fd0, 0xfbd9aa, 0xefdcb2, .0028, .9, 1, .35, 0xffffff, 0),
  M(180, 36, 140, 3.4, 0xfff0d0, 0x3f8fe0, 0xe8f3e6, 0xe0eedd, .0022, .95, 1, .3, 0xffffff, 0)
];

const mood = { sc: new THREE.Color(), top: new THREE.Color(), hor: new THREE.Color(), fog: new THREE.Color(), cc: new THREE.Color() };
const sunDir = new THREE.Vector3();

function applyMood(T) {
  let i = 0; while (i < MK.length - 2 && T >= MK[i + 1].t) i++;
  const a = MK[i], b = MK[i + 1], u = sstep(a.t, b.t, T);
  for (const k of ['el', 'az', 'si', 'fd', 'hi', 'ex', 'cl', 'rain']) mood[k] = lerp(a[k], b[k], u);
  for (const k of ['sc', 'top', 'hor', 'fog', 'cc']) mood[k].copy(a[k]).lerp(b[k], u);

  const el = mood.el * Math.PI / 180, az = mood.az * Math.PI / 180;
  sunDir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  
  sun.color.copy(mood.sc); sun.intensity = mood.si;
  hemi.color.copy(mood.top).lerp(white, .35); hemi.intensity = mood.hi;
  scene.fog.color.copy(mood.fog); scene.fog.density = mood.fd;
  renderer.toneMappingExposure = mood.ex;

  const su = skyMat.uniforms;
  su.top.value.copy(mood.top); su.hor.value.copy(mood.hor); su.sunDir.value.copy(sunDir); su.sunCol.value.copy(mood.sc); su.cloudCol.value.copy(mood.cc); su.cloud.value = mood.cl; su.time.value = T;

  for (const m of [waterMat]) {
    const w = m.uniforms;
    w.time.value = T; w.rain.value = mood.rain; w.fogD.value = mood.fd; w.sunDir.value.copy(sunDir); w.sunCol.value.copy(mood.sc); w.hor.value.copy(mood.hor); w.top.value.copy(mood.top); w.fogCol.value.copy(mood.fog);
  }

  // Morph terrain based on age
  const age = ageOf(T);
  const grassOpacity = sstep(0, 10, age); // Fades grass in over time
  grassMat.opacity = grassOpacity;
  grass.visible = grassOpacity > 0.01;
  
  // Fade sand to green
  const sandDarken = 1 - sstep(0, 15, age) * 0.6;
  terrainMat.color.setRGB(sandDarken, sandDarken, sandDarken);
}

function ageOf(T) {
  if (T < 52.4) return -1; // Barren
  if (T < 60) return (T - 52.4) / 7.6 * .6; // First plantings
  if (T < 95) return .6 + (T - 60) / 35 * 11.4; // Growing
  if (T < 130) return 12 + (T - 95) / 35 * 26; // Forest
  return 38 + (T - 130) * .1; // Final
}

// --- Camera Cinematography ---
const keyframes = [
  { t: 0, p: [0, 150, 250], tg: [0, 0, 20] },      // Aerial
  { t: 10, p: [0, 50, 120], tg: [0, 0, 20] },      // Descend
  { t: 22, p: [10, 5, 40], tg: [5, 1, 25] },       // Close on young Jadav
  { t: 35, p: [15, 4, 35], tg: [10, 1, 28] },      // The decision
  { t: 50, p: [10, 3, 25], tg: [8, 1, 26] },       // Planting
  { t: 60, p: [20, 6, 40], tg: [5, 2, 25] },       // Montage start
  { t: 75, p: [35, 15, 60], tg: [0, 5, 20] },      // Growth pullback
  { t: 90, p: [40, 20, 80], tg: [0, 8, 15] },      // Forest reveal
  { t: 110, p: [25, 15, 50], tg: [0, 6, 20] },     // Forest beauty
  { t: 130, p: [15, 8, 30], tg: [5, 3, 25] },      // Older Jadav
  { t: 150, p: [12, 5, 25], tg: [8, 3, 24] },      // Recognition
  { t: 165, p: [20, 10, 40], tg: [0, 4, 20] },     // Students
  { t: 180, p: [40, 30, 80], tg: [0, 8, 15] }      // Final pullback
];

function updateCamera(T) {
  let prev = keyframes[0], next = keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length - 1; i++) {
    if (T >= keyframes[i].t && T <= keyframes[i + 1].t) { prev = keyframes[i]; next = keyframes[i + 1]; break; }
  }
  const u = E(clamp((T - prev.t) / (next.t - prev.t)));
  camera.position.set(
    lerp(prev.p[0], next.p[0], u),
    lerp(prev.p[1], next.p[1], u),
    lerp(prev.p[2], next.p[2], u)
  );
  const target = new THREE.Vector3(
    lerp(prev.tg[0], next.tg[0], u),
    lerp(prev.tg[1], next.tg[1], u),
    lerp(prev.tg[2], next.tg[2], u)
  );
  camera.lookAt(target);
  sun.target.position.copy(target);
}

// --- Subtitles & Timeline Script ---
const subtitles = [
  { t: 2, d: 6, text: "In 1979, on the banks of the mighty Brahmaputra River in Assam..." },
  { t: 9, d: 8, text: "...a young boy witnessed something that would change his life forever." },
  { t: 18, d: 6, text: "The land was barren. No trees, no shade, no shelter." },
  { t: 31, d: 8, text: "Jadav approached the forest authorities, hoping for help." },
  { t: 40, d: 8, text: "But there was no simple solution. He was advised to plant bamboo." },
  { t: 49, d: 8, text: "Instead of waiting for someone else... Jadav decided to begin himself." },
  { t: 62, d: 10, text: "Days turned into months. Months turned into years." },
  { t: 74, d: 10, text: "There were no grand celebrations. Just years of patience and hard work." },
  { t: 86, d: 8, text: "And slowly, the land began to change." },
  { t: 98, d: 10, text: "Decades passed. The growing vegetation developed into a large forest ecosystem." },
  { t: 110, d: 10, text: "Covering 550 hectares, it became known as Molai Forest." },
  { t: 122, d: 8, text: "Animals, birds, and countless forms of life found shelter among the trees." },
  { t: 135, d: 10, text: "Eventually, the world began to notice his extraordinary contribution." },
  { t: 147, d: 8, text: "In 2015, the Government of India honoured him with the Padma Shri." },
  { t: 158, d: 8, text: "But for Jadav, the greatest achievement was seeing life return." },
  { t: 168, d: 6, text: "You don't need millions of rupees to make a difference." },
  { t: 174, d: 6, text: "Sometimes, all it takes is one person, one decision, and the determination to continue." }
];

function updateSubtitles(T) {
  const sub = $('#sub');
  let active = null;
  for (let s of subtitles) {
    if (T >= s.t && T < s.t + s.d) { active = s; break; }
  }
  if (active) {
    if (sub.textContent !== active.text) {
      sub.style.opacity = 0;
      setTimeout(() => { sub.textContent = active.text; sub.style.opacity = 1; }, 300);
    } else {
      sub.style.opacity = 1;
    }
  } else {
    sub.style.opacity = 0;
  }
}

// --- Animation Loop ---
let clock = new THREE.Clock();
let timelineTime = 0;
let isPlaying = false;
let animFrame;

function animate() {
  if (!isPlaying) return;
  const delta = clock.getDelta();
  timelineTime += delta;

  if (timelineTime > TOTAL) timelineTime = TOTAL;

  updateCamera(timelineTime);
  applyMood(timelineTime);
  updateVeg(ageOf(timelineTime), timelineTime);
  updateSubtitles(timelineTime);
  updateCharacters(timelineTime);

  // Animate water
  waterMat.uniforms.time.value = timelineTime;

  renderer.render(scene, camera);

  if (timelineTime < TOTAL) {
    animFrame = requestAnimationFrame(animate);
  } else {
    showEndSequence();
  }
}

// --- Character Animation Choreography ---
function updateCharacters(T) {
  // Reset
  YJ.g.visible = false; OJ.g.visible = false; OFF.g.visible = false;
  listeners.forEach(l => l.g.visible = false);
  students.forEach(s => s.g.visible = false);

  // Scene 1: Young Jadav walking
  if (T > 10 && T < 32) {
    const p = clamp((T - 12) / 18);
    pose(YJ, { vis: true, x: lerp(20, 5, p), y: groundY(lerp(20, 5, p), 25), z: 25, ry: PI, walk: p > 0 && p < 1 ? 1 : 0, dist: p * 15 }, T);
    YJ.head.rotation.x = -0.2; // Looking down
  }

  // Scene 2: Talking to Official
  if (T > 32 && T < 52) {
    pose(YJ, { vis: true, x: 8, y: groundY(8, 20), z: 20, ry: 0.5, walk: 0 }, T);
    pose(OFF, { vis: true, x: 10, y: groundY(10, 18), z: 18, ry: -0.5, walk: 0 }, T);
    YJ.armR.rotation.x = Math.sin(T * 3) * 0.2 + 0.5; // Gesturing
  }

  // Scene 2b: Planting
  if (T > 48 && T < 60) {
    const p = clamp((T - 48) / 12);
    pose(YJ, { vis: true, x: 8, y: groundY(8, 26), z: 26, ry: -0.2, kneel: p > 0.5 ? 1 : 0, aR: p > 0.5 ? -1.2 : 0 }, T);
  }

  // Scene 3: Montage - Watering, then growing up
  if (T > 60 && T < 95) {
    const p = clamp((T - 60) / 35);
    const age = p; // 0 to 1
    // Transition from young to older teen
    YJ.g.scale.setScalar(lerp(0.9, 0.95, p));
    if (p < 0.5) {
      pose(YJ, { vis: true, x: 8, y: groundY(8, 26), z: 26, ry: -0.2, walk: 0, aR: -1.2, aL: -0.5 }, T);
    } else {
      pose(YJ, { vis: true, x: 10, y: groundY(10, 28), z: 28, ry: 0.8, walk: 1, dist: p * 20 }, T);
    }
  }

  // Scene 4: Older Jadav walking in forest (Birth of Molai)
  if (T > 95 && T < 130) {
    const p = clamp((T - 95) / 35);
    OJ.g.scale.setScalar(0.97);
    pose(OJ, { vis: true, x: lerp(15, 5, p), y: groundY(lerp(15, 5, p), 26), z: 26, ry: PI, walk: 1, dist: p * 15 }, T);
  }

  // Scene 5: Recognition (Older Jadav stationary)
  if (T > 130 && T < 150) {
    pose(OJ, { vis: true, x: 8, y: groundY(8, 24), z: 24, ry: 0.2, walk: 0 }, T);
    OJ.armL.rotation.x = -0.5; // Touching tree
  }

  // Scene 6: Students (Ending)
  if (T > 150 && T < TOTAL) {
    pose(OJ, { vis: true, x: 15, y: groundY(15, 30), z: 30, ry: -0.5, walk: 0 }, T);
    
    // Students group
    for (let i = 0; i < students.length; i++) {
      const s = students[i];
      const angle = (i / students.length) * PI * 2;
      const r = 4 + (i % 3) * 1.5;
      const px = 25 + Math.cos(angle) * r;
      const pz = 15 + Math.sin(angle) * r;
      const isWatering = (i === 5);
      pose(s, { vis: true, x: px, y: groundY(px, pz), z: pz, ry: angle + PI, walk: 0, aR: isWatering ? -1.5 : 0, aL: isWatering ? -0.8 : 0 }, T);
    }
  }

  // Fade out black overlay
  if (T < 5) {
    $('#fade').style.opacity = 1 - (T / 5);
  } else {
    $('#fade').style.opacity = 0;
  }
}

// --- End Sequence ---
function showEndSequence() {
  $('#fade').style.opacity = 1;
  
  setTimeout(() => {
    $('#end').style.opacity = 1;
    $('#l1').classList.add('on');
  }, 1500);
  setTimeout(() => { $('#l2').classList.add('on'); }, 3500);
  setTimeout(() => { $('#l3').classList.add('on'); }, 5500);
  
  setTimeout(() => {
    $('#l1').classList.remove('on'); $('#l2').classList.remove('on'); $('#l3').classList.remove('on');
    $('#ask').classList.add('on');
  }, 8000);
  
  setTimeout(() => {
    $('#ask').classList.remove('on');
    $('#fin').classList.add('on');
  }, 11000);
}

// --- Start & Init ---
function startExperience() {
  if (isPlaying) return;
  started = true;

  // Fullscreen & Landscape Lock
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen().then(() => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(e => console.log('Orientation lock not supported'));
      }
    }).catch(e => console.log('Fullscreen failed'));
  }

  $('#menu').style.opacity = 0;
  setTimeout(() => $('#menu').style.display = 'none', 1500);
  stage.style.visibility = 'visible';
  
  layout();
  clock.start();
  isPlaying = true;
  timelineTime = 0;
  
  animate();
}

window.addEventListener('load', () => {
  layout();
  $('#watch').addEventListener('click', startExperience);
  
  // Pre-render one frame to initialize textures
  applyMood(0);
  renderer.render(scene, camera);
});
</script>
